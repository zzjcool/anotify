<!doctype html>
<html lang="{{.Lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anotify · {{block "title" .}}{{end}}</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#08080e" />
    <!-- 防 FOUC：主题必须在首帧前落到 <html> 上；这段必须同步执行（不能 defer/async），
         也不能挪到 </body>，否则暗/亮主题会先闪一帧默认色。 -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("anotify-theme") || "auto";
          var dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var theme = dark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#08080e" : "#f7f8fc");
          /* 防外壳横跳（P1）：partials.js 装配 #app-shell 之前 #page-main 就静态躺在
             body 里，慢 JS 时会先按 x=0 全宽画一帧、再横跳到 .app-main（x=296/108, y=96）。
             这里首帧前就把侧栏宽度预算写好，下面的内联 <style> 用它预排 #page-main。
             key 与 web/partials.js 的 SIDEBAR_KEY 是**同一个字面量**，改一处必须改两处。 */
          var collapsed = localStorage.getItem("anotify-sidebar") === "collapsed";
          document.documentElement.style.setProperty(
            "--pre-sidebar-w",
            collapsed ? "76px" : "264px",
          );
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <!-- 生产/嵌入页用构建期 Tailwind（/tailwind.css）。
         design/ 设计稿才用 Tailwind Play CDN，仅本地对照，不进 embed。 -->
    <link rel="stylesheet" href="/tailwind.css" />
    <!-- 字体自托管：web/fonts/*.woff2 + fonts.css（见 web/fonts/README.md）。
         不再有任何外部字体 CDN 链接，离线/私有化部署字体照常生效。 -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/tokens.css" />
    <!-- 跨文档 View Transitions 的 opt-in 必须**内联在 head**（见 web/ui.css 顶部说明）：
         放在外部 ui.css 里时，Chrome 在首帧决定过渡时还没应用它，于是每次导航都
         中断过渡并在旧文档抛未捕获的 InvalidStateError（e2e 的 pageerror 门禁会红）。
         放在 ui.css 之前的内联 <style>：无 reduce 时 auto；ui.css 里的
         prefers-reduced-motion 覆盖（navigation: none）仍然后来居上。 -->
    <style>
      @view-transition {
        navigation: auto;
      }
    </style>
    <link rel="stylesheet" href="/ui.css" />
    <!-- P1：外壳未挂载窗口的预排版（仅 base 布局；login/focus 没有 #page-main）。
         数值与挂载后的真实盒模型一致：#page-main 在 .app-main 里的内距是
         32px（sm:px-8，≥640）/ 20px（px-5，<640）、上边 64px 顶栏 + 32px = 96px；
         左边是侧栏宽（--pre-sidebar-w，由上面内联脚本从 localStorage 读出 264/76）。
         mountLayout 在 document.body.prepend(#app-shell) 之后立刻写 <html data-shell-ready>，
         这条规则随即失效，所以正常加载不会双倍内距。
         不新增组件类：这里只是给一个已存在的 id 补上挂载前的盒模型。 -->
    <style>
      html:not([data-shell-ready]) #page-main {
        margin-left: var(--pre-sidebar-w, 264px);
        padding: 96px 32px 32px;
      }
      @media (max-width: 1023px) {
        html:not([data-shell-ready]) #page-main {
          margin-left: 0;
        }
      }
      /* 断点必须跟 Tailwind 的 `sm:`（640）对齐，不是跟侧栏抽屉的 1024 对齐：
         真实 .app-main 是 `px-5 py-8 sm:px-8` —— ≥640 就是 32px。如果这里到 1023
         才给 20px，平板（640–1023）在 shell-ready 那一刻内容会从 20 横跳到 32。 */
      @media (max-width: 639px) {
        html:not([data-shell-ready]) #page-main {
          padding: 96px 20px 32px;
        }
      }
    </style>
    {{block "style" .}}{{end}}
    {{if gt (len .Langs) 1}}
    {{range .Langs}}<link rel="alternate" hreflang="{{.Code}}" href="{{.Prefix}}/{{$.Page}}" />
    {{end}}<link rel="alternate" hreflang="x-default" href="/{{$.Page}}" />
    {{end}}
  </head>
  <body class="min-h-screen antialiased overflow-x-hidden" data-page="{{.Page}}">
    <!-- F21：键盘跳过导航。必须是 body 的第一个可聚焦元素；目标是 #page-main
         （base 布局里它由页面 content block 渲染，mountLayout 会把它搬进主区）。 -->
    <a class="skip-link" href="#page-main">{{t "common.skip_to_content"}}</a>
    <!-- 主内容（partials.js 会把它装进「侧栏 + 顶栏」布局） -->
    <!-- 页面 content block 含 <div id="page-main"> 及页级弹层等外部内容 -->
{{block "content" .}}{{end}}
    {{if gt (len .Langs) 1}}
    <!-- Language switcher data (sidebar): build-time flat link list.
         mountLayout() reads this to build the sidebar dropdown.
         Single source of truth: sitegen .Langs (no hardcoded list in JS).
         Removed from DOM after mountLayout consumes it. -->
    <div id="lang-switcher-data" hidden aria-hidden="true">
      {{range .Langs}}<a href="{{.Prefix}}/{{$.Page}}" hreflang="{{.Code}}" lang="{{.Code}}"{{if eq .Code $.Lang}} aria-current="true"{{end}}>{{.NativeName}}</a>
      {{end}}
    </div>
    {{end}}
    <!-- 这两个必须**同步**加载（既不能 defer，也不能 async）：每个页面的内联脚本
         一被解析就调 t()（来自 i18n.<lang>.js 的 window.AnotifyI18n）和 Anotify
         （来自 partials.js，例如 mountLayout()）。defer 脚本要等文档解析完才执行，
         等到那时内联脚本早就跑过了 —— 会拿到 undefined。 -->
    <script src="/i18n.{{.Lang}}.js"></script>
    <script src="/partials.js"></script>
    <!-- 图渲染库的**页面级槽位**（默认空）：dagre 只算布局坐标，节点用 HTML/SVG 画。
         槽位放在 layout 里是因为整个产品只有一套图渲染实现，页面不该各自复制引入逻辑；
         但只有真正画图的页面才往里面填。

         关于 defer 的执行时机（这是被旧注释写错过的地方，按 HTML 规范）：defer 脚本在
         文档解析完成后、DOMContentLoaded 事件触发**之前**，按文档顺序依次执行；而非
         defer 的内联脚本是在解析到它时立即执行的。所以「defer 库 + 后面的内联脚本」
         并不冲突：内联脚本先跑，defer 库随后、在 DOMContentLoaded 之前跑完。

         **但「库在 DCL 之前跑完」不等于「页面拿到数据时库已经在了」。** 页面在 fetch
         的续体里画图时 DCL 可能还没到——Trace 真实现场：响应 132ms 回、138ms 读
         taskChain 抛 TypeError、DCL 152ms 才到；source 页同构（API 命中缓存或弱网时
         稳定复现「图组件未加载」）。反过来，等到 readyState 已是 interactive 时再挂
         DCL 监听还可能永远等不到。唯一安全的点是在**解析期**挂监听，所以这件事收了
         一份到 partials.js（与 partials 的加载位置绑定）：

           页面解析期：A.expectGraphics();      ← 声明「本页会画图」，挂门闩
           画图处：    const G = await A.graphLib(文案);   ← 等到 DCL 再读库

         页面**不得**直接读 window.AnotifyGraphs（scripts/check-graph-access.mjs 会拦）：
         漏写等待在结构上就画不出图，库真缺时是可见错误 + 重试，不画假图、不静默删图。

         本产品只有 trace.html、source.html、index.html 画图（顺序仍不能乱：
         vendor/dagre 全局 → FlowGraph → AnotifyGraphs；trace 页现在不再加载
         traceview.js，source 页仍按 dagre → FlowGraph → AnotifyGraphs → TraceView 排）。

         为什么其余页面不加载它们：这四个文件合计约 232KB（dagre 48 + flograph 118 +
         graphs 50 + traceview 16）+ 4 个请求，对根本不画图的页面的首屏是纯成本。
         一个只有 trace/source/index 用得上的库，不该让全站每个页面为它付首屏预算。 -->
    {{block "graph-libs" .}}{{end}}
    {{block "script" .}}{{end}}
  </body>
</html>
