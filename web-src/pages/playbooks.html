{{define "title"}}{{t "pb.title"}}{{end}}

{{define "content"}}
<div id="page-main">
  <div class="mx-auto max-w-6xl space-y-8">
    <div class="reveal visible">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h2 class="font-display text-3xl text-white">{{t "pb.title"}}</h2>
          <p class="mt-1.5 max-w-2xl text-sm leading-relaxed text-zinc-400">
            {{t "pb.subtitle"}}
          </p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <button id="btn-refresh" class="btn-ghost flex items-center gap-2 rounded-xl px-4 py-2 text-sm">
            {{t "pb.rescan"}}
          </button>
        </div>
      </div>
    </div>

    <div id="pb-grid" class="pb-grid"></div>

    <div id="pb-empty" class="card rounded-2xl p-6 text-center text-sm text-zinc-500 hidden"></div>
  </div>

  <div id="toast" class="toast"></div>
</div>
{{end}}

{{define "script"}}
    <script>
      const t = (k, d) => (window.AnotifyI18n && window.AnotifyI18n[k]) || d || k;
      const API = "/v1";

      Anotify.mountLayout({
        active: "playbooks",
        title: t("pb.title", "预案"),
        subtitle: t("pb.subtitle", "把能力、出口、触发器组成一份能体检、能补齐的预案"),
      });

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function toast(msg) {
        const box = document.getElementById("toast");
        box.textContent = msg;
        box.classList.add("show");
        clearTimeout(box._timer);
        box._timer = setTimeout(() => box.classList.remove("show"), 2600);
      }

      // 四种总体状态：文案 + 徽标色类。颜色靠 CSS（.pb-badge.is-*），
      // 这里只决定语义，不写死颜色。
      const STATUS_KEY = {
        ready: "pb.status.ready",
        "needs-node": "pb.status.needs_node",
        blocked: "pb.status.blocked",
        partial: "pb.status.partial",
      };
      const STATUS_FALLBACK = {
        ready: "就绪",
        "needs-node": "缺节点",
        blocked: "缺定义",
        partial: "不完整",
      };

      // 「最该先做的一件事」：体检结论里第一个没过的项。
      // 这是全页最有价值的一行 —— 它把"哪里不对"变成"下一步做什么"。
      function nextLine(pb) {
        const n = pb.next;
        if (!n) return t("pb.next.ready", "全部就绪，可以开始跑了");
        const key = "pb.next." + n.kind + "." + n.status;
        const fb = {
          "pb.next.capability.missing": "缺能力定义：{ref}",
          "pb.next.capability.no-node": "「{ref}」没有节点实现",
          "pb.next.capability.offline": "「{ref}」的节点都离线",
          "pb.next.edge.missing": "缺出口：{label}",
          "pb.next.trigger.missing": "缺触发器：{label}",
        }[key] || "{label}";
        return t(key, fb).replace("{ref}", n.ref || n.label || "").replace("{label}", n.label || "");
      }

      function card(pb) {
        const c = el("div", "pb-card");
        c.tabIndex = 0;
        c.setAttribute("role", "link");
        c.addEventListener("click", () => {
          location.href = "playbook.html?id=" + encodeURIComponent(pb.slug);
        });
        c.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            location.href = "playbook.html?id=" + encodeURIComponent(pb.slug);
          }
        });

        const top = el("div", "pb-card-top");
        const left = el("div", "");
        left.appendChild(el("div", "pb-name", pb.name));
        left.appendChild(el("div", "pb-slug", pb.slug));
        top.appendChild(left);
        top.appendChild(
          el("span", "pb-badge is-" + pb.status, t(STATUS_KEY[pb.status], STATUS_FALLBACK[pb.status])),
        );
        c.appendChild(top);

        if (pb.description) c.appendChild(el("div", "pb-desc", pb.description));

        c.appendChild(
          el(
            "div",
            "pb-meta",
            t("pb.meta", "能力 {c} · 出口 {e} · 触发器 {tr}")
              .replace("{c}", pb.counts.capabilities)
              .replace("{e}", pb.counts.edges)
              .replace("{tr}", pb.counts.triggers),
          ),
        );

        const bar = el("div", "pb-bar");
        const fill = el("i", "is-" + pb.status);
        // 0/0 的预案（只有出口的）不要让进度条看起来像 100% 坏掉
        fill.style.width = (pb.total ? Math.round((pb.ready / pb.total) * 100) : 100) + "%";
        bar.appendChild(fill);
        c.appendChild(bar);
        c.appendChild(
          el("div", "pb-meta", t("pb.ready_n", "{n}/{m} 项就绪").replace("{n}", pb.ready).replace("{m}", pb.total)),
        );

        const next = el("div", "pb-next");
        next.appendChild(el("span", "", "→"));
        next.appendChild(el("span", "", nextLine(pb)));
        c.appendChild(next);
        return c;
      }

      let PKGS = [];

      async function load() {
        const grid = document.getElementById("pb-grid");
        const empty = document.getElementById("pb-empty");
        grid.textContent = "";
        try {
          // Anotify.api 直接返回解析好的 JSON，非 2xx 会 throw（不是 Response）
          const j = await Anotify.api(API + "/playbooks");
          PKGS = j.playbooks || [];
        } catch (e) {
          empty.textContent = t("pb.load_failed", "载入失败，请刷新重试。");
          empty.classList.remove("hidden");
          return;
        }
        if (!PKGS.length) {
          empty.textContent = t("pb.empty", "这个命名空间里还没有预案。");
          empty.classList.remove("hidden");
          return;
        }
        empty.classList.add("hidden");
        for (const p of PKGS) grid.appendChild(card(p));
      }

      document.getElementById("btn-refresh").addEventListener("click", () => {
        load().then(() => toast(t("pb.rescanned", "已重新体检")));
      });
      document.addEventListener("DOMContentLoaded", load);
    </script>
{{end}}
