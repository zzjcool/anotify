{{define "title"}}{{t "pb.title"}}{{end}}

{{define "style"}}
<style>
  .pb-grid { grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); }
  .pb-card { min-width: 0; overflow-wrap: anywhere; }
  .pb-upload { display: grid; gap: 16px; }
  .pb-wrap { overflow-wrap: anywhere; min-width: 0; }
  .pb-card-head { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
  .pb-card-facts { display: grid; gap: 8px; margin-top: 12px; }
  .pb-result { margin-top: 12px; }
  .pb-result pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
</style>
{{end}}

{{define "content"}}
<div id="page-main">
  <div class="page">
    <div class="page-head">
      <div class="min-w-0">
        <h2 class="page-title">{{t "pb.title"}}</h2>
        <p class="page-sub">{{t "pb.v4.subtitle"}}</p>
      </div>
      <div class="page-actions">
        <button id="btn-refresh" type="button" class="btn btn-ghost">{{t "pb.rescan"}}</button>
        <a href="#pb-import" class="btn btn-primary">{{t "pb.v4.import"}}</a>
      </div>
    </div>
    <p id="pb-scope" class="field-hint"></p>
    <div id="pb-state" aria-live="polite"></div>
    <div id="pb-grid" class="pb-grid"></div>
    <div id="pb-empty" class="hidden"></div>

    <section id="pb-import" class="card card-pad">
      <h3 class="card-title">{{t "pb.v4.import"}}</h3>
      <p class="card-sub">{{t "pb.v4.package_hint"}}</p>
      <form id="pb-import-form" class="pb-upload">
        <div class="field">
          <label for="pb-input-kind" class="field-label">{{t "pb.v4.input_kind"}}</label>
          <select id="pb-input-kind" class="select">
            <option value="files">{{t "pb.v4.files"}}</option>
            <option value="source">{{t "pb.v4.oci"}}</option>
          </select>
        </div>
        <div class="field">
          <label for="pb-input-name" class="field-label">{{t "pb.v4.slug"}}</label>
          <input id="pb-input-name" class="input mono" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="64" autocomplete="off" />
        </div>
        <div id="pb-files-input" class="pb-upload">
          <div class="field">
            <label for="pb-upload-files" class="field-label">{{t "pb.v4.upload_files"}}</label>
            <input id="pb-upload-files" type="file" multiple class="input" />
            <label for="pb-upload-directory" class="field-label">{{t "pb.v4.upload_directory"}}</label>
            <input id="pb-upload-directory" type="file" multiple webkitdirectory class="input" />
            <p class="field-hint">{{t "pb.v4.upload_hint"}}</p>
          </div>
          <div class="field">
            <label for="pb-input-files" class="field-label">{{t "pb.v4.file_map"}}</label>
            <textarea id="pb-input-files" class="textarea mono" rows="10" spellcheck="false">{}</textarea>
          </div>
        </div>
        <div id="pb-source-input" class="field" hidden>
          <label for="pb-input-source" class="field-label">{{t "pb.v4.oci"}}</label>
          <input id="pb-input-source" class="input mono" placeholder="oci://registry/repository:tag" />
          <p class="field-hint">{{t "pb.v4.oci_hint"}}</p>
        </div>
        <div class="page-actions">
          <button id="pb-create" type="submit" class="btn btn-primary">{{t "pb.v4.store"}}</button>
        </div>
      </form>
      <div id="pb-import-result" class="pb-result pb-wrap" aria-live="polite"></div>
    </section>
  </div>
</div>
{{end}}

{{define "script"}}
<script>
  (() => {
    const { api, apiList, ready, nsPath, readScope: getScope, model, el: dom, loadErrorNode } = Anotify;
    const t = (key, vars = {}) => {
      let value = window.AnotifyI18n[key] || key;
      for (const [name, text] of Object.entries(vars)) value = value.replaceAll("{" + name + "}", text);
      return value;
    };
    const $ = id => document.getElementById(id);
    const el = (tag, cls, text) => dom(tag, { class: cls }, text);
    const link = name => "playbook.html?namespace=" + encodeURIComponent(getScope().namespace) + "&id=" + encodeURIComponent(name);
    Anotify.mountLayout({ active: "playbooks", title: t("pb.title"), subtitle: t("pb.v4.subtitle") });
    let loading = false;

    function card(resource) {
      const pb = model.playbook(resource);
      const section = el("article", "card card-pad pb-card");
      section.dataset.slug = pb.slug;
      const head = el("div", "pb-card-head");
      const name = el("a", "card-title", pb.displayName || pb.slug);
      name.href = link(pb.slug);
      head.append(name, el("span", "badge " + (pb.status.ready ? "badge-success" : "badge-warn"), t(pb.status.ready ? "pb.status.ready" : "pb.v4.not_ready")));
      section.append(head, el("p", "mono field-hint", pb.slug));
      const facts = el("div", "pb-card-facts");
      for (const condition of pb.status.conditions) {
        facts.append(el("p", "field-hint", condition.type + " · " + condition.status + (condition.reason ? " · " + condition.reason : "")));
      }
      for (const item of pb.status.items) {
        facts.append(el("p", "field-hint", item.kind + " · " + item.name + (item.version ? "@" + item.version : "") + " · " + item.state));
      }
      if (!pb.status.items.length) facts.append(el("p", "field-hint", t("pb.v4.not_installed")));
      if (pb.status.unapplied.length) facts.append(el("p", "badge badge-warn", t("pb.v4.unapplied_count", { n: pb.status.unapplied.length })));
      if (pb.status.blocker) facts.append(el("p", "field-hint", t("pb.v4.blocker") + ": " + pb.status.blocker.type + " · " + (pb.status.blocker.capability || "") + " · " + pb.status.blocker.action));
      if (pb.status.lastInstallId) facts.append(el("p", "mono field-hint", t("pb.v4.last_install") + ": " + pb.status.lastInstallId));
      section.append(facts);
      return section;
    }
    async function load() {
      if (loading) return;
      loading = true; $("btn-refresh").disabled = true;
      $("pb-state").textContent = t("pb.v4.loading"); $("pb-state").setAttribute("aria-busy", "true");
      $("pb-grid").replaceChildren(); $("pb-empty").classList.add("hidden");
      try {
        await ready();
        $("pb-scope").textContent = t("pb.v4.namespace") + ": " + getScope().namespace;
        const { items: rows } = await apiList(nsPath("playbooks"));
        for (const row of rows) $("pb-grid").append(card(row));
        if (!rows.length) {
          $("pb-empty").replaceChildren(el("div", "empty", t("pb.empty")));
          $("pb-empty").classList.remove("hidden");
        }
        $("pb-state").replaceChildren();
      } catch (error) {
        $("pb-state").replaceChildren(loadErrorNode(error, load));
      } finally {
        loading = false; $("btn-refresh").disabled = false; $("pb-state").removeAttribute("aria-busy");
      }
    }
    async function upload(input, directory) {
      try {
        const entries = [];
        for (const file of input.files) {
          let path = directory ? file.webkitRelativePath.split("/").slice(1).join("/") : file.name;
          // A whole exported map is also a self-contained import, not a second manifest.
          if (!directory && input.files.length === 1 && file.name.endsWith(".json")) {
            $("pb-input-files").value = JSON.stringify(JSON.parse(await file.text()), null, 2);
            const files = JSON.parse($("pb-input-files").value);
            $("pb-input-name").value = model.playbook.parseDocument(files["playbook.yaml"]).metadata.name;
            return;
          }
          entries.push([path, await file.text()]);
        }
        if (new Set(entries.map(([p]) => p)).size !== entries.length) throw new Error(t("pb.v4.duplicate_files"));
        const files = Object.fromEntries(entries);
        $("pb-input-files").value = JSON.stringify(files, null, 2);
        if (files["playbook.yaml"]) $("pb-input-name").value = model.playbook.parseDocument(files["playbook.yaml"]).metadata.name;
      } catch (error) { $("pb-import-result").replaceChildren(loadErrorNode(error)); }
    }
    $("pb-upload-files").addEventListener("change", () => upload($("pb-upload-files"), false));
    $("pb-upload-directory").addEventListener("change", () => upload($("pb-upload-directory"), true));
    $("pb-input-kind").addEventListener("change", () => {
      const files = $("pb-input-kind").value === "files";
      $("pb-files-input").hidden = !files; $("pb-source-input").hidden = files;
    });
    $("pb-import-form").addEventListener("submit", async event => {
      event.preventDefault(); $("pb-create").disabled = true;
      $("pb-import-result").textContent = t("pb.v4.saving");
      try {
        await ready();
        const name = $("pb-input-name").value.trim();
        const spec = $("pb-input-kind").value === "files" ? { files: JSON.parse($("pb-input-files").value) } : { source: $("pb-input-source").value.trim() };
        const response = await api(nsPath("playbooks"), { method: "POST", body: JSON.stringify({ apiVersion: "anotify/v1", kind: "Playbook", metadata: { name, namespace: getScope().namespace }, spec }) });
        const open = el("a", "btn btn-primary btn-sm", t("pb.v4.open")); open.href = link(response.metadata.name);
        $("pb-import-result").replaceChildren(el("p", "field-hint", t("pb.v4.stored")), open);
        await load();
      } catch (error) {
        $("pb-import-result").replaceChildren(loadErrorNode(error));
        if (error.status === 409 && error.reason === "slug_taken") {
          const guidance = el("a", "btn btn-ghost btn-sm", t("pb.v4.slug_taken"));
          guidance.href = link($("pb-input-name").value.trim());
          $("pb-import-result").append(guidance);
        }
      } finally { $("pb-create").disabled = false; }
    });
    $("btn-refresh").addEventListener("click", load);
    document.addEventListener("DOMContentLoaded", load);
  })();
</script>
{{end}}
