{{define "title"}}{{t "edges.title"}}{{end}}

{{define "style"}}
    <style>
      /* 本页专有样式（页头 / 卡片 / 按钮 / 弹层 / 列表行 / 空态 / 骨架
         全部来自 ui.css，本页不再重复定义）。
         颜色一律走 token：亮主题下这些类也必须读得清。 */

      /* 出口（边）流：一行一条边，左边 from —port→ to，右边删除。
         行本身用 .list-row（行高 / 分隔线 / hover 由共享样式给）。 */
      .edge-flow {
        display: flex;
        flex: 1 1 auto;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        min-width: 0;
        font-size: 0.78rem;
      }
      .edge-cap {
        color: var(--text);
        white-space: nowrap;
      }
      /* 入口边的左端是"来源"，不是能力 —— 用不同颜色提示这个区别 */
      .edge-cap-src {
        color: var(--accent);
      }
      /* 出口名是这条边的身份：它是封闭集合里的一个值（不变量 I2），
         必须比两端的能力名更醒目。
         颜色只来自 --accent / --accent-soft：旧实现写的是 rgba(139,139,253,…)
         的字面量，换主题时不跟着变。 */
      .edge-port {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-radius: var(--r-xs);
        padding: 0.05rem 0.4rem;
        white-space: nowrap;
      }
      .edge-arrow {
        color: var(--faint);
        font-size: 0.7rem;
      }
      /* 按 from 能力分组：同一能力的多个出口聚在一起 */
      .edge-group {
        margin-bottom: 1.25rem;
      }
      .edge-group:last-child {
        margin-bottom: 0;
      }
      .edge-group-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0 0.15rem 0.4rem;
        margin-bottom: 0.5rem;
        border-bottom: 1px solid var(--line);
      }
      /* 扇出标记：一个出口对应多个下游时显式标出来。
         这是模型的核心形状之一（wiki 02「一个出口可以有多条边」），
         在 UI 上必须能一眼看出来，否则用户会以为这个出口只连了一个目标。 */
      .edge-port-fan {
        font-size: 0.68rem;
        padding: 0.1rem 0.4rem;
        border-radius: var(--r-full);
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      }
      /* 该能力声明了但没接边的出口：配置遗漏，要显眼。
         旧实现把 "#fbbf24" 与 rgba(251,191,36,…) 写死三处 —— 亮主题下
         浅黄字画在浅底上几乎看不见，改成 --warn / --warn-soft。 */
      .edge-missing {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem;
        margin-top: 0.5rem;
        padding: 0.4rem 0.5rem;
        border-radius: var(--r-sm);
        background: var(--warn-soft);
        border: 1px dashed color-mix(in srgb, var(--warn) 32%, transparent);
        font-size: 0.7rem;
        color: var(--warn);
      }
      /* 首帧骨架（render() 会整体替换 #edges-list） */
      .edge-skel {
        display: grid;
        gap: 8px;
        padding: 16px 14px;
        border-bottom: 1px solid var(--line);
      }
      .edge-skel:last-child {
        border-bottom: 0;
      }
      .edge-skel .skeleton {
        width: 70%;
        height: 14px;
      }
      .edge-skel .skeleton + .skeleton {
        width: 42%;
        height: 11px;
      }
    </style>
{{end}}

{{define "content"}}
<div id="page-main">
  <div class="page">
    <!-- 页头：页面大标题是 h2（全站唯一 h1 在外壳顶栏，partials.js） -->
    <div class="page-head">
      <div>
        <h2 class="page-title">{{t "edges.title"}}</h2>
        <p class="page-sub">{{t "edges.subtitle"}}</p>
      </div>
      <div class="page-actions">
        <button id="btn-refresh" type="button" class="btn btn-ghost">
          {{t "edges.refresh"}}
        </button>
        <button id="btn-new" type="button" class="btn btn-primary">
          {{t "edges.new"}}
        </button>
      </div>
    </div>

    <!-- 说明：为什么边和能力是两件事 -->
    <div class="card card-pad">
      <p class="card-sub">{{t "edges.intro"}}</p>
    </div>

    <!-- 筛选 -->
    <div class="card card-pad">
      <div class="toolbar">
        <div class="field">
          <label class="field-label" for="edge-search">{{t "edges.search"}}</label>
          <input id="edge-search" class="input w-56" placeholder='{{t "edges.search_hint"}}' />
        </div>
        <div class="field">
          <label class="field-label" for="edge-filter-cap">{{t "edges.filter_cap"}}</label>
          <select id="edge-filter-cap" class="select">
            <option value="">{{t "edges.all_caps"}}</option>
          </select>
        </div>
        <span id="edges-summary" class="list-meta ml-auto"></span>
      </div>
    </div>

    <!-- 边列表（按 from 能力分组）。首帧给骨架，render() 整体替换 -->
    <div id="edges-list" class="reveal visible">
      <div class="card">
        <div class="list">
          <div class="edge-skel">
            <span class="skeleton"></span>
            <span class="skeleton"></span>
          </div>
          <div class="edge-skel">
            <span class="skeleton"></span>
            <span class="skeleton"></span>
          </div>
          <div class="edge-skel">
            <span class="skeleton"></span>
            <span class="skeleton"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 新建边弹层。
     挂在 #page-main 之外（body 级）：#page-main 里的 .reveal 带 transform，
     会给 position:fixed 造出包含块，弹层就变成相对那个元素定位（还会被裁）。
     显隐靠 hidden ↔ flex 两个类互换（ui.css 的 .hidden 是 !important），
     遮罩颜色来自 .modal-backdrop 的 --scrim（不再内联 rgba(0,0,0,.62)）。 -->
<div id="edge-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="edge-modal-title">
  <div class="modal-panel">
    <div class="modal-head">
      <h3 id="edge-modal-title">{{t "edges.new"}}</h3>
      <button id="modal-close" type="button" class="btn btn-ghost btn-icon" aria-label="{{t "common.close"}}">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="space-y-4">
        <div class="field">
          <label class="field-label" for="f-from">{{t "edges.from"}}</label>
          <select id="f-from" class="select"></select>
        </div>
        <div class="field">
          <label class="field-label" for="f-port">{{t "edges.port"}}</label>
          <select id="f-port" class="select"></select>
          <!-- 起点能力没有预置出口（出口就是"任意事件类型"），改为自由输入 -->
          <input id="f-port-input" class="input hidden" type="text" placeholder="pull_request.opened" />
          <p class="field-hint" id="f-port-hint">{{t "edges.port_hint"}}</p>
        </div>
        <div class="field">
          <label class="field-label" for="f-to">{{t "edges.to"}}</label>
          <select id="f-to" class="select"></select>
        </div>
      </div>
    </div>

    <div class="modal-foot">
      <button id="modal-cancel" type="button" class="btn btn-ghost">
        {{t "edges.cancel"}}
      </button>
      <button id="modal-save" type="button" class="btn btn-primary">
        {{t "edges.save"}}
      </button>
    </div>
  </div>
</div>
{{end}}

{{define "script"}}
    <script>
      const t = (k, d) => (window.AnotifyI18n && window.AnotifyI18n[k]) || d || k;

      // 各页面各自声明，无全局常量（与 sources.html / keys.html 一致）
      const API = "/v1";

      Anotify.mountLayout({
        active: "edges",
        title: t("edges.title", "出口"),
        subtitle: t("edges.subtitle", "什么出口接到哪里"),
      });

      let EDGES = [];
      let CAPS = [];
      // 边的请求成功与否：失败要显示原因 + 重试，而不是留一张白纸
      let EDGES_OK = true;
      let EDGES_ERR = null;

      // SOURCE_NAMES 是"从"下拉里能选的来源名。
      //
      // 它**不是**固定列表：来源名是自由的（POST /v1/events?source=任意字符串），
      // 所以派生自两处，取并集：
      //   ① 已有入口边里出现过的来源（用户建过的）
      //   ② 已配置的源（sources 表）的名字 —— 这些是用户真实在用的入口
      //
      // 硬编码 github/cron/http/manual 会漏掉用户自定义的来源（比如 jira），
      // 而且那四个"内置起点"已经不是能力了（#110）。
      let SOURCE_NAMES = ["github", "cron", "http", "manual"];

      // toast 统一走 Anotify.toast（partials.js 的 #anotify-toast-host）。
      // 旧实现往 <div class="toast"> 里写文字，但本页从来没定义过 .toast ——
      // 用户看到的是一个没有背景的裸文本浮层（REVIEW #5 P0）。
      function toast(msg, kind) {
        Anotify.toast(msg, kind);
      }

      function el(tag, className, text) {
        const n = document.createElement(tag);
        if (className) n.className = className;
        if (text != null) n.textContent = String(text);
        return n;
      }

      function code(text, className) {
        const n = el("code", "mono " + (className || ""));
        n.textContent = String(text == null ? "" : text);
        return n;
      }

      function capByID(id) {
        return CAPS.find((c) => c.id === id) || null;
      }

      // capName 决定"能力在这行里怎么显示"：有显示名用显示名。
      // 唯一裁决点还是 Anotify.capLabel，这里只是补一个"找不到时的回落"。
      function capName(id) {
        const c = capByID(id);
        if (!c) return id;
        return Anotify.capLabel(c);
      }

      // rawCapName 是技术身份（name@version），用在 title 里。
      // 显示名可以让界面干净，但排查问题、对日志、写节点配置时
      // 用户需要看到真名 —— 所以它不能从界面上彻底消失。
      function rawCapName(id) {
        const c = capByID(id);
        if (!c) return id;
        const dn = (c.displayName || "").trim();
        const raw = c.name + (c.version != null ? "@" + c.version : "");
        return dn ? raw + "（显示名：" + dn + "）" : raw;
      }

      // ---------- 加载 ----------
      async function loadAll() {
        // 两个请求各自保留错误对象：三者失败态必须分开表达，
        // 只 catch 成 null 的话页面只能写一句「载入失败」，没有重试入口。
        const wrap = (p) =>
          p.then(
            (data) => ({ ok: true, data, err: null }),
            (err) => ({ ok: false, data: null, err }),
          );
        const [edgesRes, capsRes] = await Promise.all([
          wrap(Anotify.api(API + "/edges", { demo: null })),
          wrap(Anotify.api(API + "/capabilities", { demo: null })),
        ]);
        EDGES_OK = edgesRes.ok;
        EDGES_ERR = edgesRes.err;
        EDGES = (edgesRes.data && edgesRes.data.edges) || [];
        // 手机推送暂未开放：不提供「新建边指向它」的入口（已存在的边照常显示）。
        CAPS = window.Anotify.filterCaps(
          (capsRes.data && capsRes.data.capabilities) || [],
        );
        refreshSourceNames();
        fillCapFilter();
        render();
      }

      // refreshSourceNames 汇总"可以当来源的名字"。
      //
      // 顺序：先用边里出现过的（最多），再补内置四个（首次使用时的引导），
      // 去重排序后填进下面 openModal 用的那份列表。
      function refreshSourceNames() {
        const seen = new Set(["github", "cron", "http", "manual"]);
        for (const e of EDGES) {
          if (e.fromIsSource && e.fromCapability) seen.add(e.fromCapability);
        }
        SOURCE_NAMES = [...seen].sort();
      }

      function fillCapFilter() {
        const sel = document.getElementById("edge-filter-cap");
        const cur = sel.value;
        sel.replaceChildren(new Option(t("edges.all_caps", "全部能力"), ""));
        for (const c of CAPS) {
          sel.appendChild(new Option(c.name + "@" + c.version, c.id));
        }
        if (cur) sel.value = cur;
      }

      // ---------- 渲染 ----------
      function render() {
        const list = document.getElementById("edges-list");
        const q = document.getElementById("edge-search").value.trim().toLowerCase();
        const capFilter = document.getElementById("edge-filter-cap").value;

        list.replaceChildren();

        // 故障 ≠ 没有：接口挂了不能显示「出口表为空」，那会让人以为建一条边就好了
        if (!EDGES_OK) {
          document.getElementById("edges-summary").textContent = "";
          list.appendChild(Anotify.loadErrorNode(EDGES_ERR, () => loadAll()));
          return;
        }

        // 按「左端」分组。左端可能是能力，也可能是来源（入口边，#110），
        // 两者的 key 空间不同（能力用 id，来源用名字），所以加前缀区分。
        const groupKey = (e) => (e.fromIsSource ? "src:" + e.fromCapability : e.fromCapability);
        const groups = new Map();
        for (const e of EDGES) {
          const k = groupKey(e);
          if (!groups.has(k)) groups.set(k, []);
          groups.get(k).push(e);
        }

        // 过滤
        let shown = 0;
        const visibleGroups = [...groups.entries()].filter(([fromId, evs]) => {
          if (capFilter && fromId !== capFilter && fromId !== "src:" + capFilter) return false;
          if (!q) return true;
          return evs.some(
            (e) =>
              (e.fromIsSource ? e.fromCapability : capName(e.fromCapability)).toLowerCase().includes(q) ||
              capName(e.toCapability).toLowerCase().includes(q) ||
              String(e.fromPort).toLowerCase().includes(q),
          );
        });

        for (const [fromId, evs] of visibleGroups) {
          const filtered = !q
            ? evs
            : evs.filter(
                (e) =>
                  (e.fromIsSource ? e.fromCapability : capName(e.fromCapability)).toLowerCase().includes(q) ||
                  capName(e.toCapability).toLowerCase().includes(q) ||
                  String(e.fromPort).toLowerCase().includes(q),
              );
          shown += filtered.length;

          const group = el("div", "edge-group");

          // 组头：左端 + 出口数。左端是来源时显示「来源: github」，
          // 不要拿 "src:github" 去能力表里查（永远查不到，会显示成原始 key）。
          const head = el("div", "edge-group-head");
          const title = el("div", "flex flex-wrap items-center gap-2 min-w-0");
          const isSrcGroup = fromId.startsWith("src:");
          const groupLabel = isSrcGroup
            ? t("edges.src_prefix", "来源") + ": " + fromId.slice(4)
            : capName(fromId);
          const groupEl = el(
            "span",
            isSrcGroup ? "card-title edge-cap-src" : "card-title",
            groupLabel,
          );
          title.appendChild(groupEl);
          const ports = new Set(filtered.map((e) => e.fromPort));
          title.appendChild(
            el("span", "list-meta",
              t("edges.port_count", "{n} 个出口").replace("{n}", ports.size)),
          );
          head.appendChild(title);
          group.appendChild(head);
          // 组内所有边装进同一张卡片的列表里（不再一条边一张卡片）
          const cardBox = el("div", "card");
          const listBox = el("div", "list");

          // 按 (from, port) 再分一层：**同一个出口的多条边 = 扇出**，
          // 必须聚在一起显示，否则会被别的出口的边插在中间，看不出
          // "一次查表返回 N 行、派 N 个任务"这件事。
          //
          // 顺序按出口名排（而不是边在库里的顺序），让同一出口必然相邻。
          const byPort = new Map();
          for (const e of filtered) {
            if (!byPort.has(e.fromPort)) byPort.set(e.fromPort, []);
            byPort.get(e.fromPort).push(e);
          }

          for (const [port, portEdges] of byPort) {
            const fanout = portEdges.length > 1;

            // 每条边一行，保持 from —port→ to 的完整读法；
            // 行高 / 分隔线 / hover 由 .list-row 提供
            for (const e of portEdges) {
            const row = el("div", "list-row");

            const flow = el("div", "edge-flow");
            // 左端有两种：来源（入口边）或能力。
            // 来源显示成「来源: github」，避免界面出现一个并不存在的"能力"。
            const fromCapEl = e.fromIsSource
              ? el("span", "edge-cap edge-cap-src", t("edges.src_prefix", "来源") + ": " + e.fromCapability)
              : el("span", "edge-cap", capName(e.fromCapability));
            fromCapEl.title = e.fromIsSource
              ? e.fromCapability
              : rawCapName(e.fromCapability);
            flow.appendChild(fromCapEl);
            flow.appendChild(el("span", "edge-arrow", "—"));
            // 出口名保持**原样**：它是路由键，用户建边时要一字不差地填它，
            // 改成别的显示名会让人对不上（出口名 == 下游能力名，这是模型
            // 的核心约定）。可读性由右边的能力显示名提供 ——
            // 读作「—needs-fix→ 应用修复」，出口的含义自然就出来了。
            flow.appendChild(el("span", "edge-port", e.fromPort));
            // 扇出角标：同一个出口 >1 条边时标出来。
            // 文案只说事实（这个出口连了几个下游），不加术语。
            if (fanout) {
              flow.appendChild(
                el("span", "edge-port-fan",
                  t("edges.fanout", "扇出 ×{n}").replace("{n}", portEdges.length)),
              );
            }
            flow.appendChild(el("span", "edge-arrow", "→"));
            const toCapEl = el("span", "edge-cap", capName(e.toCapability));
            toCapEl.title = rawCapName(e.toCapability);
            flow.appendChild(toCapEl);
            row.appendChild(flow);

            const del = el("button", "btn btn-danger btn-sm",
              t("edges.remove", "删除"));
            del.type = "button";
            del.addEventListener("click", () => removeEdge(e, del));
            row.appendChild(del);

            listBox.appendChild(row);
          }
          } // ← 闭合 for (const [port, portEdges] of byPort)

          // 列表建完再挂上卡片；空组（全被过滤掉）不产生空卡
          if (listBox.childElementCount) {
            cardBox.appendChild(listBox);
            group.appendChild(cardBox);
          }

          // 该能力声明了但一条边都没接的出口 —— 配置遗漏。
          //
          // 只对**能力**成立：来源没有 outputs 概念（它的"出口"是事件类型，
          // 由外部系统决定，不可能预先枚举），所以来源组不检查这项。
          const cap = isSrcGroup ? null : capByID(fromId);
          const connected = new Set(evs.map((e) => e.fromPort));
          const missing = ((cap && cap.outputs) || []).filter(
            (p) => p && !connected.has(p),
          );
          if (missing.length && !q && !capFilter) {
            const warn = el("div", "edge-missing");
            warn.appendChild(el("span", "", t("edges.missing", "未接下游的出口")));
            for (const p of missing) warn.appendChild(el("span", "edge-port", p));
            group.appendChild(warn);
          }

          list.appendChild(group);
        }

        const summary = document.getElementById("edges-summary");
        summary.textContent = t("edges.count", "{n} 条边").replace("{n}", shown);

        if (!shown) {
          // 空态必须给下一步动作：只说「空」而不给入口，等于把人留在原地
          const box = el("div", "empty");
          box.appendChild(
            el(
              "p",
              "",
              EDGES.length
                ? t("edges.nomatch", "没有匹配的边。")
                : t("edges.empty", "出口表为空：事件进来后没有任何出口可走。"),
            ),
          );
          const cta = el("button", "btn btn-primary btn-sm mt-3", "+ " + t("edges.new", "新建边"));
          cta.type = "button";
          cta.addEventListener("click", () => openModal(cta));
          box.appendChild(cta);
          list.appendChild(box);
        }
      }

      // ---------- 新建 ----------
      // 显隐只用 hidden ↔ flex（ui.css 的 .hidden 是 !important，
      // 所以组件类不能自己声明 display）。关闭后焦点回到触发按钮 ——
      // 否则键盘用户关掉弹层就掉回页面顶端，不知道自己在哪。
      function openModal(trigger) {
        const modal = document.getElementById("edge-modal");
        modal._trigger = trigger || document.activeElement || null;
        modal.classList.replace("hidden", "flex");

        const fromSel = document.getElementById("f-from");
        const toSel = document.getElementById("f-to");
        fromSel.replaceChildren();
        toSel.replaceChildren();

        // 「从」有两种：能力，或**来源**（入口边）。
        //
        // 来源用 "src:" 前缀区分。用户看到的就是"GitHub 事件 → 分析 PR"，
        // 不再需要理解"github@1 这个能力"——那个空壳已经不存在了（#110）。
        for (const name of SOURCE_NAMES) {
          const opt = new Option(
            t("edges.from_source", "来源") + ": " + name,
            "src:" + name,
          );
          fromSel.appendChild(opt);
        }
        for (const c of CAPS) {
          const label = Anotify.capLabel(c);
          fromSel.appendChild(new Option(label, c.id));
          toSel.appendChild(new Option(label, c.id));
        }
        syncPorts();
      }

      function closeModal() {
        const modal = document.getElementById("edge-modal");
        if (modal.classList.contains("hidden")) return;
        modal.classList.replace("flex", "hidden");
        const back = modal._trigger;
        modal._trigger = null;
        if (back && typeof back.focus === "function") back.focus();
      }

      // syncPorts 根据 from 能力刷新出口下拉。
      // 起点能力（builtin）没有预置出口 —— 它的出口就是"任意事件类型"，
      // 所以改成自由输入（不变量 I2 的唯一例外）。
      function syncPorts() {
        const fromId = document.getElementById("f-from").value;
        const cap = capByID(fromId);
        const sel = document.getElementById("f-port");
        const input = document.getElementById("f-port-input");
        const hint = document.getElementById("f-port-hint");

        // 来源 → 出口就是任意事件类型（外部系统决定，不可能枚举）
        const isSource = fromId.startsWith("src:");
        const outputs = (cap && cap.outputs) || [];
        const isOrigin = isSource;

        if (isOrigin || !outputs.length) {
          sel.classList.add("hidden");
          input.classList.remove("hidden");
          if (isOrigin) {
            hint.textContent = t("edges.port_hint_origin",
              "事件类型由来源决定（如 pull_request.opened），直接填写即可");
          } else {
            hint.textContent = t("edges.port_hint_end",
              "这个能力没有声明出口（终端能力）。填一个事件类型也能建边，但派发时不会被走到。");
          }
        } else {
          input.classList.add("hidden");
          sel.classList.remove("hidden");
          sel.replaceChildren();
          for (const p of outputs) sel.appendChild(new Option(p, p));
          hint.textContent = t("edges.port_hint", "出口必须是该能力声明的 outputs 之一");
        }
      }

      async function createEdge() {
        const fromId = document.getElementById("f-from").value;
        const toId = document.getElementById("f-to").value;
        const cap = capByID(fromId);
        // 来源（入口边）：左端是来源名，出口是事件类型
        const isSource = fromId.startsWith("src:");
        const fromKey = isSource ? fromId.slice(4) : fromId;
        const isOrigin = isSource;
        const outputs = (cap && cap.outputs) || [];
        const port =
          isOrigin || !outputs.length
            ? document.getElementById("f-port-input").value.trim()
            : document.getElementById("f-port").value;

        if (!port) {
          toast(t("edges.err_port", "请填写出口名"));
          return;
        }
        if (fromId === toId) {
          toast(t("edges.err_self", "不能让能力连到自己"));
          return;
        }

        const btn = document.getElementById("modal-save");
        btn.disabled = true;
        try {
          // body 必须自己 JSON.stringify 并显式声明 Content-Type。
          // Anotify.api() 只负责 withScope + fetch，**不做任何序列化**：
          // 直接传对象会被浏览器按 String(obj) 发成字面量 "[object Object]"，
          // 后端 json.Decode 必然 400 —— 也就是说这个页面以前**根本建不了边**。
          await Anotify.api(API + "/edges", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              fromIsSource: isSource,
              fromCapability: fromKey,
              fromPort: port,
              toCapability: toId,
            }),
          });
          closeModal();
          toast(t("edges.created", "边已创建"));
          await loadAll();
        } catch (e) {
          toast(t("edges.err_create", "创建失败") + ": " + (e.detail || e.message || e));
        } finally {
          btn.disabled = false;
        }
      }

      async function removeEdge(e, btn) {
        btn.disabled = true;
        try {
          const qs =
            "?fromIsSource=" + (e.fromIsSource ? "1" : "0") +
            "&fromCapability=" + encodeURIComponent(e.fromCapability) +
            "&fromPort=" + encodeURIComponent(e.fromPort) +
            "&toCapability=" + encodeURIComponent(e.toCapability);
          await Anotify.api(API + "/edges" + qs, { method: "DELETE", demo: null });
          toast(t("edges.removed", "边已删除"));
          await loadAll();
        } catch (err) {
          toast(t("edges.err_remove", "删除失败") + ": " + (err.detail || err.message || err));
          btn.disabled = false;
        }
      }

      // ---------- 事件绑定 ----------
      document
        .getElementById("btn-new")
        .addEventListener("click", () => openModal(document.getElementById("btn-new")));
      document.getElementById("btn-refresh").addEventListener("click", loadAll);
      document.getElementById("modal-close").addEventListener("click", closeModal);
      document.getElementById("modal-cancel").addEventListener("click", closeModal);
      document.getElementById("modal-save").addEventListener("click", createEdge);
      document.getElementById("f-from").addEventListener("change", syncPorts);
      document.getElementById("edge-search").addEventListener("input", render);
      document.getElementById("edge-filter-cap").addEventListener("change", render);
      // 点遮罩关：点在面板内部时 target 不是遮罩本身，不会误关
      document.getElementById("edge-modal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        const modal = document.getElementById("edge-modal");
        if (modal && !modal.classList.contains("hidden")) {
          e.preventDefault();
          closeModal();
        }
      });

      loadAll();
    </script>
{{end}}
