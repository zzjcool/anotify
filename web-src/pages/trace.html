{{define "title"}}{{t "trace.title"}}{{end}}
{{define "graph-libs"}}
<script defer src="/flograph.js"></script>
<script defer src="/graphs.js"></script>
{{end}}
{{define "content"}}
<div id="page-main">
  <div class="page">
    <div class="page-head">
      <div>
        <h2 class="page-title font-display">{{t "trace.title"}}</h2>
        <p id="trace-sub" class="page-sub b2-wrap"></p>
      </div>
      <button id="trace-refresh" class="btn btn-ghost" type="button">{{t "events.v4.refresh"}}</button>
    </div>
    <div id="trace-error" role="status"></div>
    <div id="trace-content" class="grid gap-4" aria-busy="true">
      <div class="empty">{{t "events.v4.loading"}}</div>
    </div>
  </div>
</div>
{{end}}
{{define "script"}}
<script>
  (function () {
    "use strict";
    const A = window.Anotify;
    const { el, api, ready, nsPath, readScope, saveScope, model, t, loadErrorNode } = A;
    const query = new URLSearchParams(location.search);
    const uid = query.get("traceUID") || "";
    if (query.get("namespace")) saveScope({ namespace: query.get("namespace") });
    A.mountLayout({ active: "events", title: t("trace.title") });
    const content = document.getElementById("trace-content");
    const errorBox = document.getElementById("trace-error");
    let graph = null;
    /* 启动依赖屏障（TRACE-STARTUP）：图库是 defer 引入的（base.html 的 graph-libs
       槽位）——defer 脚本在文档解析完成后、DOMContentLoaded **之前**按文档顺序执行；
       而本内联脚本在解析期就跑。Trace GET 可能比解析完成更快（真实现场
       final-28bbef29：响应 132ms 解析返回、138ms 抛 TypeError reading 'taskChain'、
       DOMContentLoaded 152ms 才到），那时 window.AnotifyGraphs 还不存在。

       屏障必须**在这里**（解析期）就挂上：此刻 document.readyState 一定是 "loading"，
       这个一次性 DOMContentLoaded 监听碰不上“事件已经发过”的情况，也不会错过。
       不能等到 load() 里才看 readyState：解析完成到 defer 脚本执行之间 readyState
       已经是 "interactive"（HTML 规范顺序就是 interactive → defer → DOMContentLoaded），
       那时再等事件可能挂死，而不等就是本 bug。若本脚本被动态注入、进来时已不是
       loading（事件可能已发过），不注册监听，直接按实际能力判断（缺库→可见错误+原重试）。
       不轮询、不用 setTimeout、不新增全局 ready 协议。 */
    const deferredGraphics = document.readyState === "loading"
      ? new Promise(resolve => document.addEventListener("DOMContentLoaded", () => resolve(), { once: true }))
      : Promise.resolve();
    /* 图库能力必须真检查：脚本加载失败/缺库要变成可见错误（loadErrorNode 带原重试），
       不静默删图、不画假图。 */
    function graphLib() {
      const lib = window.AnotifyGraphs;
      if (!lib || typeof lib.taskChain !== "function") throw new Error(t("trace.nolib"));
      return lib;
    }
    function taskLink(name) {
      return "message.html?namespace=" + encodeURIComponent(readScope().namespace) + "&id=" + encodeURIComponent(name);
    }
    function section(title, id) {
      const body = el("div", { id, class: "grid gap-4" });
      const card = el("section", { class: "card card-pad grid gap-4" },
        el("h3", { class: "card-title", text: title }), body);
      return { card, body };
    }
    function taskRow(resource) {
      const task = model.task(resource);
      const row = el("div", { class: "grid gap-2", "data-task": task.name, "data-parent": task.parentTaskId || "" });
      row.append(el("a", { class: "mono b2-wrap", href: taskLink(task.name),
        text: task.capability.name + "@" + task.capability.version + " · " + task.name }),
        el("p", { class: "card-sub", text: t("message.v4.phase." + task.phase) +
          " · " + t("message.v4.attempt") + " " + task.attempt + "/" + task.maxAttempts +
          (task.waitingReason ? " · " + task.waitingReason : "") }),
        el("p", { class: "card-sub b2-wrap", text: "parentTaskId: " + (task.parentTaskId || "—") +
          " · nextAttemptAt: " + (task.nextAttemptAt || "—") }),
        el("p", { class: "card-sub b2-wrap" },
          el("span", { "data-raw-content": "", text: task.result.summary || task.result.error?.message || "—" })));
      return row;
    }
    function render(doc, graphs) {
      if (graph?.destroy) graph.destroy();
      graph = null;
      content.replaceChildren();
      const flow = section(t("trace.v4.graph"), "trace-graph");
      flow.body.classList.add("overflow-x-auto");
      const tasks = section(t("trace.v4.tasks"), "trace-tasks");
      const events = section(t("trace.v4.events"), "trace-events");
      const pruned = section(t("trace.v4.pruned"), "trace-pruned");
      content.append(flow.card, tasks.card, events.card, pruned.card);
      if (doc.tasks.length) {
        const result = graphs.taskChain(flow.body, {
          tasks: doc.tasks, sourceLabel: doc.events[0]?.spec.involvedObject?.name || "",
          animate: false, t,
          onNodeClick(task) { location.href = taskLink(task.name); },
        });
        graph = result?.graph;
        tasks.body.append(...doc.tasks.map(taskRow));
      } else {
        flow.body.append(el("div", { class: "empty", text: t("trace.v4.empty") }));
        tasks.body.append(el("div", { class: "empty", text: t("trace.v4.empty") }));
      }
      for (const resource of doc.events) {
        const event = model.event(resource);
        events.body.append(el("div", { class: "grid gap-2", "data-uid": event.uid },
          el("code", { class: "mono b2-wrap", text: event.eventType + " · " + event.type + " · " + event.reason }),
          el("p", { class: "card-sub b2-wrap", text: event.uid + " · deliveryId: " + (event.deliveryId || "—") }),
          el("pre", { class: "code-body overflow-x-auto" },
            el("span", { "data-raw-content": "", text: JSON.stringify({ dispatched: event.dispatched, pruned: event.pruned }, null, 2) }))));
      }
      if (!doc.events.length) events.body.append(el("div", { class: "empty", text: t("events.v4.empty") }));
      /* pruned[] 的每个条目是**事件信封**（events.yaml·TraceView：「原样给事件信封」）：
       * 原因码是 spec.eventType（= 封闭剪枝码），诊断在 status.pruned.detail。
       * 读 fact.to / fact.reason 是 mock 时代的形状，真实现场只会渲染出 undefined。 */
      doc.pruned.forEach(fact => {
        const prune = fact.status?.pruned || {};
        const code = fact.spec?.eventType || prune.reason || fact.reason || t("trace.v4.no_pruned");
        pruned.body.append(el("div", { class: "grid gap-2" },
          el("code", { class: "mono b2-wrap", text: fact.spec?.involvedObject?.name || fact.to || "—" }),
          el("p", { class: "card-sub b2-wrap", text: code + ": " },
            el("span", { "data-raw-content": "", text: prune.detail || fact.detail || "" }))));
      });
      if (!doc.pruned.length) pruned.body.append(el("p", { class: "card-sub", text: t("trace.v4.no_pruned") }));
    }
    async function load() {
      const button = document.getElementById("trace-refresh");
      button.disabled = true;
      errorBox.replaceChildren();
      content.setAttribute("aria-busy", "true");
      try {
        await ready();
        document.getElementById("trace-sub").textContent = readScope().namespace + " · " + uid;
        if (!uid) throw new Error(t("trace.v4.missing"));
        const doc = await api(nsPath("traces", uid));
        if (!Array.isArray(doc.events) || !Array.isArray(doc.tasks) || !Array.isArray(doc.pruned)) throw new Error("malformed Trace");
        // 解析期挂上的 defer 图库屏障：首次 render 必须等它（重试用同一入口，已 resolved）。
        await deferredGraphics;
        render(doc, graphLib());
      } catch (error) {
        if (graph?.destroy) graph.destroy();
        content.replaceChildren();
        errorBox.replaceChildren(loadErrorNode(error, load));
      } finally {
        content.removeAttribute("aria-busy");
        button.disabled = false;
      }
    }
    document.getElementById("trace-refresh").addEventListener("click", load);
    A.mountPullRefresh(load);
    load();
  })();
</script>
{{end}}
