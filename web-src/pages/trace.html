{{define "title"}}{{t "trace.title"}}{{end}}
{{define "graph-libs"}}
<script defer src="/flograph.js"></script>
<script defer src="/graphs.js"></script>
{{end}}
{{define "style"}}
<style>
  /* ===== 链路页（页面内样式；类名 tr- 前缀，共享组件一律用 ui.css）=====
     只做三件事：① 任务行的信息层级（能力 / 版本 chip / 任务 id / 状态 badge）、
     ② 事件事实的 .code-block 外壳、③ 空态与错误态的统一骨架。
     颜色只取 tokens，不出现硬编码色值。 */

  /* ---------- 任务行 ---------- */
  .tr-task {
    display: grid;
    gap: 6px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-1);
    transition:
      border-color var(--dur) var(--ease),
      background var(--dur) var(--ease);
  }
  .tr-task:hover {
    border-color: var(--line-strong);
    background: var(--surface-2);
  }
  .tr-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .tr-cap {
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    overflow-wrap: anywhere;
  }
  /* @序号单独做成 chip：它是「第几版能力」，不是任务 id 的一部分 */
  .tr-ver {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    padding: 0 6px;
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    background: var(--surface-3);
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1;
    color: var(--muted);
  }
  .tr-id {
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--accent-strong);
    overflow-wrap: anywhere;
    transition: color var(--dur-fast) var(--ease);
  }
  .tr-id:hover {
    color: var(--text);
  }
  .tr-meta {
    font-size: 12px;
    line-height: 1.55;
    color: var(--muted);
  }
  .tr-mono {
    font-family: var(--font-mono);
  }

  /* ---------- 空态 / 错误态（图标 + 标题 + 说明 + 动作）----------
     .empty 提供居中堆叠与内距；这里补图标底、标题档位与动作行。
     e2e（f3-trace-startup）读 #trace-error 的纯文本与 `#trace-error button`，
     所以标题/说明必须是文本叶子、重试必须是 <button>。 */
  .tr-state-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    flex: none;
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    background: var(--surface-2);
    color: var(--muted);
  }
  .tr-state-mark svg {
    width: 20px;
    height: 20px;
  }
  .tr-state-icon {
    display: block;
  }
  /* 错误态的颜色在 ui.css 的「状态语义修饰 is-*」一节（#372：页面不再写一份）。 */
  .tr-state-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
  }
  .tr-state-desc {
    max-width: 52ch;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .tr-state-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
  }

  /* ---------- 事件事实 / 剪枝：代码块外壳内的行距 ---------- */
  .tr-fact {
    display: grid;
    gap: 8px;
  }
  .tr-fact-id {
    font-size: 12px;
    line-height: 1.55;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  /* ---------- #375：事件块结构化（哪一步失败 / 剪枝原因）+ 原始 JSON 折叠 ---------- */
  .tr-facts {
    display: grid;
    gap: 6px;
  }
  .tr-fact-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .tr-fact-row .tr-id {
    min-width: 0;
  }
  .tr-prune {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px;
    margin: 0;
    padding: 8px 10px;
    border: 1px solid color-mix(in srgb, var(--warn) 38%, transparent);
    border-radius: var(--r-sm);
    background: var(--warn-soft);
    font-size: 12px;
    line-height: 1.55;
    color: var(--warn);
    overflow-wrap: anywhere;
  }
  .tr-prune b {
    font-family: var(--font-mono);
    font-weight: 600;
  }
  .devf {
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface-1);
    margin-top: 4px;
    min-width: 0;
  }
  .devf > summary {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
  }
  .devf > summary::-webkit-details-marker {
    display: none;
  }
  .devf > summary::before {
    content: "▸";
    color: var(--faint);
    font-size: 11px;
  }
  .devf[open] > summary::before {
    content: "▾";
  }
  .devf > summary:hover {
    color: var(--text);
  }
  .devf-hint {
    margin-left: auto;
    font-size: 11px;
    font-weight: 400;
    color: var(--faint);
  }
  .devf-body {
    display: grid;
    gap: 10px;
    padding: 0 12px 12px;
    min-width: 0;
  }
</style>
{{end}}
{{define "content"}}
<div id="page-main">
  <div class="page">
    <div class="page-head">
      <div>
        <h2 class="page-title font-display">{{t "trace.title"}}</h2>
        <p id="trace-sub" class="page-sub b2-wrap"></p>
      </div>
      <button id="trace-refresh" class="btn btn-ghost" type="button">{{t "events.v4.refresh"}}</button>
    </div>
    <div id="trace-error" role="status"></div>
    <div id="trace-content" class="grid gap-4" aria-busy="true">
      <div class="empty">
        <span class="tr-state-mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" />
          </svg>
        </span>
        <b class="tr-state-title">{{t "trace.title"}}</b>
        <p class="tr-state-desc">{{t "trace.loading"}}</p>
      </div>
    </div>
  </div>
</div>
{{end}}
{{define "script"}}
<script>
  (function () {
    "use strict";
    const A = window.Anotify;
    const { el, api, ready, nsPath, readScope, saveScope, model, t, icon, copyText } = A;
    /* 本页会画图：解析期声明，等 defer 图库的门闩在 partials.js 里（TRACE-STARTUP）。
       取库只走 A.graphLib()，页面不再自己读库全局 —— 页面脚本在解析期就跑，
       而 Trace GET 可能比 defer 库更快返回（真实现场：响应 132ms、DCL 152ms）。 */
    A.expectGraphics();
    const query = new URLSearchParams(location.search);
    const uid = query.get("traceUID") || "";
    if (query.get("namespace")) saveScope({ namespace: query.get("namespace") });
    A.mountLayout({ active: "events", title: t("trace.title") });
    const content = document.getElementById("trace-content");
    const errorBox = document.getElementById("trace-error");
    let graph = null;
    function taskLink(name) {
      return "message.html?namespace=" + encodeURIComponent(readScope().namespace) + "&id=" + encodeURIComponent(name);
    }

    /* ---------- 空态 / 错误态（TR-4 / CP-4）----------
       图标 + 标题 + 说明 + 动作，与 message.html 同一套骨架（各自页内定义）。
       e2e（f3-trace-startup）从 #trace-error 的纯文本里读图库错误原文，并要求
       `#trace-error button` 存在且点击重试 —— 所以标题/说明是文本叶子，
       重试必须是 <button>（不能改成链接）。 */
    const ICON_ALERT = [
      "M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z",
      "M12 9v4",
      "M12 17h.01",
    ];
    const ICON_UNLINK = [
      "M9 17H7A5 5 0 0 1 7 7h2",
      "M15 7h2a5 5 0 0 1 0 10h-2",
      "M8 12h8",
    ];
    const ICON_SEARCH = ["M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z", "M21 21l-4.35-4.35"];
    function stateNode(opts) {
      const box = el("div", { class: "empty tr-state" + (opts.kind === "error" ? " is-error" : ""), role: opts.kind === "error" ? "alert" : "status" });
      box.append(el("span", { class: "tr-state-mark", "aria-hidden": "true" }, icon(opts.icon || ICON_ALERT, "tr-state-icon")));
      if (opts.title) box.append(el("b", { class: "tr-state-title", text: opts.title }));
      if (opts.desc) box.append(el("p", { class: "tr-state-desc", text: opts.desc }));
      const actions = el("div", { class: "tr-state-actions" });
      if (typeof opts.retry === "function") {
        const btn = el("button", { type: "button", class: "btn btn-primary btn-sm", text: t("common.retry", "重试") });
        btn.addEventListener("click", opts.retry);
        actions.append(btn);
      }
      if (opts.back) actions.append(el("a", { class: "btn btn-ghost btn-sm", href: opts.back.href, text: opts.back.text }));
      if (actions.children.length) box.append(actions);
      return box;
    }
    /* 失败原因是**分级**（#378）：分级只留一处（A.errorFacts），本页只负责把它排成
       自己的空态骨架。以前这里拄了一份「HTTP 档位 → 文案」的映射，两份映射——
       loadErrorNode 一份、本页一份——就是页面上裸 HTTP 码的来源。 */
    function failureState(error, retry) {
      const facts = A.errorFacts(error);
      return stateNode({
        kind: "error",
        title: t("common.load_failed_prefix", "载入失败：") + facts.title,
        desc: facts.hint + (facts.message ? "\n" + facts.message : ""),
        retry: facts.retry ? retry : undefined,
        back: { href: "events.html", text: t("trace.back", "返回事件流") },
      });
    }
    /* 事件事实 / 剪枝诊断里的 JSON：一律走 .code-block 外壳（头 + 复制按钮），
       不再用裸 <pre class="code-body">（CP-5）。 */
    function codeBlock(label, text) {
      const body = el("pre", { class: "code-body" }, el("span", { "data-raw-content": "", text: text }));
      const button = el("button", { type: "button", class: "copy-btn", text: t("docs.copy", "复制") });
      button.addEventListener("click", () => copyText(button, () => text));
      return el("div", { class: "code-block" },
        el("div", { class: "code-head" }, el("span", { text: label }), button), body);
    }
    function section(title, id) {
      const body = el("div", { id, class: "grid gap-4" });
      const card = el("section", { class: "card card-pad grid gap-4" },
        el("h3", { class: "card-title", text: title }), body);
      return { card, body };
    }
    /* 任务行的状态是 .badge（TR-2）：成功=success / 失败=error / 等待=warn /
       执行中=accent / 终止型（取消·放弃）=neutral。能力@版本拆成 name + @序号 chip，
       任务 id 单独成链接 —— 三者不再拼成一串 'fixer@1 · tsk_mock_1'。 */
    const PHASE_BADGE = {
      succeeded: "badge-success",
      failed: "badge-error",
      running: "badge-accent",
      pending: "badge-warn",
      assigned: "badge-warn",
      acked: "badge-warn",
      cancelled: "badge-neutral",
      abandoned: "badge-neutral",
      lease_expired: "badge-neutral",
    };
    function taskRow(resource) {
      const task = model.task(resource);
      const row = el("div", { class: "tr-task", "data-task": task.name, "data-parent": task.parentTaskId || "" });
      row.append(el("div", { class: "tr-head" },
        el("span", { class: "tr-cap", text: task.capability.name }),
        el("span", { class: "tr-ver", text: "@" + task.capability.version }),
        el("a", { class: "tr-id", href: taskLink(task.name), text: task.name }),
        el("span", { class: "badge " + (PHASE_BADGE[task.phase] || "badge-neutral"), "data-phase": task.phase,
          text: t("message.v4.phase." + task.phase, task.phase) })));
      row.append(el("p", { class: "tr-meta", text: t("message.v4.attempt", "尝试 / 上限") + " " +
        task.attempt + "/" + task.maxAttempts + (task.waitingReason ? " · " + task.waitingReason : "") }));
      /* 空值字段不占位（同 MSG-1）：只列真正有值的那几个，不留一屏 '—' */
      const extras = [];
      if (task.parentTaskId) extras.push("parentTaskId: " + task.parentTaskId);
      if (task.nextAttemptAt) extras.push("nextAttemptAt: " + task.nextAttemptAt);
      if (extras.length) row.append(el("p", { class: "tr-meta tr-mono", text: extras.join(" · ") }));
      const note = task.result.summary || task.result.error?.message || "";
      if (note) row.append(el("p", { class: "tr-meta" }, el("span", { "data-raw-content": "", text: note })));
      return row;
    }
    function render(doc, graphs, baseGraph) {
      if (graph?.destroy) graph.destroy();
      graph = null;
      content.replaceChildren();
      // 图**自带**标题栏（源 · 任务数 · 回放）与外框：外面再裹一层 card + 卡片标题
      // 就是两层框套在一起（"真实业务任务链"那层纯装饰）。直接把图放进内容区。
      // 容器仍叫 #trace-graph：renderFlow 会把 flograph--silk 之类的类挂在它身上，
      // e2e 也按这个 id 找节点。
      // 容器**不再**带 overflow-x-auto：flograph 已经在 .flograph-scroll 里自己做横向
      // 滚动 + 细滚动条，外面再套一层滚动容器就是二次裁剪（滚两下才到边，移动端
      // 还会吃掉一档可用宽度）。图的裁剪/图例/对比度归 flograph（A 集群）。
      const flow = el("div", { id: "trace-graph" });
      const tasks = section(t("trace.v4.tasks"), "trace-tasks");
      const events = section(t("trace.v4.events"), "trace-events");
      const pruned = section(t("trace.v4.pruned"), "trace-pruned");
      // #375：剪枝/失败原因上移到事件事实之前（它回答的是「哪一步没走 / 为什么」），
      // 事件原始的 JSON 事实放后面并默认收起。
      content.append(flow, tasks.card, pruned.card, events.card);
      if (doc.tasks.length) {
        const triggeredBy = sourceEventOf(doc);
        const result = graphs.taskChain(flow, {
          tasks: doc.tasks,
          // 底图 = 这个源在「源」页配置的静态拓扑。**没有它就没有触发器节点**，
          // 也没有"被剪枝的分支"——图上只剩执行过的那一条直线，而这页要回答的
          // 恰恰是"为什么另一条没走"（taskChain 的源码把 root 节点建在 base 分支里）。
          baseGraph: baseGraph,
          sourceLabel: triggeredBy?.spec.involvedObject?.name || "",
          sourceSub: triggeredBy?.spec.eventType || "",
          // 入场动画**要播**：不传 animate 时 graphs.js 走 `!enterAnimated`（首次渲染播一遍）。
          // 传 false 会直接落到最终态 —— 打开这页看到的永远是"已经播完"的图，
          // 而偏偏这页最该看懂的就是"先谁后谁"。
          t,
          // 这一页没有卡片标题上的「全屏」入口（源详情页有），所以必须保留工具栏版本 ——
          // 否则链路图根本没法全屏看（flograph 的默认是「不放进工具栏」）。
          showFullscreen: true,
          onNodeClick(task) { location.href = taskLink(task.name); },
        });
        graph = result?.graph;
        tasks.body.append(...doc.tasks.map(taskRow));
      } else {
        flow.append(stateNode({
          icon: ICON_SEARCH,
          title: t("trace.empty_title", "没有任务"),
          desc: t("trace.v4.empty"),
          back: { href: "events.html", text: t("trace.back", "返回事件流") },
        }));
        tasks.body.append(el("p", { class: "tr-meta", text: t("trace.v4.empty") }));
      }
      for (const resource of doc.events) {
        const event = model.event(resource);
        const row = el("div", { class: "tr-fact", "data-uid": event.uid });
        /* #375：首屏 = 结构化事实（事件类型/严重度/原因 + 派发到哪些任务 + 剪枝原因），
           原始 JSON（deliveryId / dispatched / pruned）收进「查看原始 JSON」。 */
        row.append(el("div", { class: "tr-head" },
          el("span", { class: "tr-cap", text: event.eventType || "—" }),
          el("span", { class: "tr-ver", text: event.type || "—" }),
          event.reason ? el("span", { class: "tr-meta", text: event.reason }) : null));
        const facts = el("div", { class: "tr-facts" });
        const prune = event.pruned && typeof event.pruned === "object" ? event.pruned : null;
        /* #375 rework：事件行不再重复渲染剪枝整句（B2）——原因码在这里点到为止，
           完整诊断只留在上方 #trace-pruned「剪枝留痕」卡片（同屏一份）。
           另外：真实 /v1/console/traces 从不发 status.dispatched，结构化 dispatched 块
           恒为空（应修 2），普通事件也不该挂「无剪枝原因」空态（应修 1）；
           原始事实仍可在下面的「查看原始 JSON」里看到。 */
        if (prune) {
          const line = el("p", { class: "tr-prune" }, el("b", { text: prune.reason || "—" }));
          if (doc.pruned.length) line.append(" ", el("a", { class: "tr-id", href: "#trace-pruned", text: t("trace.v4.pruned_link") }));
          else line.append(el("span", { "data-raw-content": "", text: ": " + (prune.detail || "") }));
          facts.append(line);
        }
        row.append(facts, el("details", { class: "devf" },
          el("summary", {},
            el("span", { text: t("uxaudit.dev.raw") }),
            el("span", { class: "devf-hint", text: event.uid || "—" })),
          el("div", { class: "devf-body" },
            codeBlock("JSON", JSON.stringify({ deliveryId: event.deliveryId, dispatched: event.dispatched, pruned: event.pruned }, null, 2)))));
        events.body.append(row);
      }
      if (!doc.events.length) events.body.append(el("p", { class: "tr-meta", text: t("events.v4.empty") }));
      /* pruned[] 的每个条目是**事件信封**（events.yaml·TraceView：「原样给事件信封」）：
       * 原因码是 spec.eventType（= 封闭剪枝码），诊断在 status.pruned.detail。
       * 读 fact.to / fact.reason 是 mock 时代的形状，真实现场只会渲染出 undefined。 */
      doc.pruned.forEach(fact => {
        const prune = fact.status?.pruned || {};
        const code = fact.spec?.eventType || prune.reason || fact.reason || t("trace.v4.no_pruned");
        pruned.body.append(el("div", { class: "tr-fact" },
          el("code", { class: "mono b2-wrap", text: fact.spec?.involvedObject?.name || fact.to || "—" }),
          el("p", { class: "tr-fact-id", text: code + ": " },
            el("span", { "data-raw-content": "", text: prune.detail || fact.detail || "" }))));
      });
      if (!doc.pruned.length) pruned.body.append(el("p", { class: "tr-meta", text: t("trace.v4.no_pruned") }));
    }
    /** 这条 trace 的触发事件（spec.involvedObject.kind=Source）。
     *
     * 不能假设 events[0]：剪枝/路由留痕也是事件行，排在前面的可能不是入口事件。
     */
    function sourceEventOf(doc) {
      return (doc.events || []).find(e => e.spec?.involvedObject?.kind === "Source") || null;
    }
    /** 拉这个 trace 所属源的配置拓扑。
     *
     * 取数 + 降级规则在 `Anotify.loadSourceTopology`（三个页面共用一份）：
     * 拿不到源（已删 / 未知源）就返回 null，调用方退回只画执行链。
     */
    function loadBaseGraph(doc) {
      const name = sourceEventOf(doc)?.spec?.involvedObject?.name || "";
      return name ? A.loadSourceTopology(name) : Promise.resolve(null);
    }
    async function load() {
      const button = document.getElementById("trace-refresh");
      button.disabled = true;
      errorBox.replaceChildren();
      content.setAttribute("aria-busy", "true");
      try {
        await ready();
        /* 副标题 = 命名空间 · traceUID，两边都只拼真实值：
           空参时只显示命名空间，不留 `default ·` 这种悬挂分隔符（TR-4）。 */
        document.getElementById("trace-sub").textContent = [readScope().namespace, uid].filter(Boolean).join(" · ");
        if (!uid) {
          /* 缺参不是「载入失败」：它没有可重试的东西，给的是「怎么进这一页」的说明 + 返回事件流。 */
          throw Object.assign(new Error(t("trace.no_id", "URL 里没有 traceId。")), { traceMissingId: true });
        }
        const doc = await api(nsPath("traces", uid));
        if (!Array.isArray(doc.events) || !Array.isArray(doc.tasks) || !Array.isArray(doc.pruned)) throw new Error("malformed Trace");
        // 图库是 defer 加载的：走 partials.js 的统一门闩（重试用同一入口，已 resolved）。
        const graphs = await A.graphLib(t("trace.nolib"));
        render(doc, graphs, await loadBaseGraph(doc));
      } catch (error) {
        if (graph?.destroy) graph.destroy();
        content.replaceChildren();
        errorBox.replaceChildren(error && error.traceMissingId
          ? stateNode({
            icon: ICON_UNLINK,
            title: t("trace.no_id_title", "缺少 traceId"),
            desc: t("trace.no_id", "URL 里没有 traceId。"),
            back: { href: "events.html", text: t("trace.back", "返回事件流") },
          })
          : failureState(error, load));
      } finally {
        content.removeAttribute("aria-busy");
        button.disabled = false;
      }
    }
    document.getElementById("trace-refresh").addEventListener("click", load);
    A.mountPullRefresh(load);
    load();
  })();
</script>
{{end}}
