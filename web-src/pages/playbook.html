{{define "title"}}{{t "pb.detail_title"}}{{end}}

{{define "style"}}
    <style>
      /* 预案详情页（UI v2）
         ------------------------------------------------------------
         体检四件事：定义 → 节点 → 出口 → 触发器。
         每节是一张 .card：标题行（.card-head：标题 + 状态徽章 + 缺失时的动作）
         → 一行结论（.card-sub：第一件该动手的事）→ .chk 行清单。
         组件一律用 web/ui.css 的共享类，这里只补页头标题行 / 节内节奏 /
         首帧骨架；颜色只走 tokens.css 的 token，本页不出现任何硬编码色值。 */

      /* 标题行：页标题 + 状态徽章同行，窄屏自动换行 */
      .pb-title-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .pb-title-row .page-title {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      /* 首帧：标题与状态徽章也先给骨架，别让用户读到两个「—」 */
      .pb-sk-title {
        display: block;
        width: 180px;
        max-width: 100%;
        height: 24px;
      }
      .pb-sk-badge {
        display: block;
        width: 40px;
        height: 10px;
      }
      .pb-slug {
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      /* 体检结论：整页最要紧的一句话 */
      .pb-sum {
        font-size: 14px;
        line-height: 1.6;
        color: var(--text);
      }
      /* 节内节奏：标题行 → 结论 6px → 清单 10px（卡内 20px 由 .card-pad 给） */
      .pb-sec-sum {
        margin-top: 6px;
        min-height: 18px;
      }
      .pb-sec-list {
        margin-top: 10px;
      }
      /* 首帧骨架：形状对齐一行检查项（点 + 标题 + 说明）。
         **必须是四个 *-list 容器之外的独立块** —— `#cap-list` 等有子元素是
         e2e 的「数据已就绪」信号，骨架混进去会让信号提前成立。 */
      .pb-sk {
        display: grid;
        gap: 8px;
      }
      .pb-sk-line {
        width: 72%;
        height: 11px;
      }
      .pb-sk-line-wide {
        width: 100%;
        height: 11px;
      }
      /* 复制按钮压在代码块右上角（.yaml-copy 是 position:absolute）：
         给代码留出右上角的呼吸位，窄屏下首行才不会滑到按钮下面。 */
      .yaml-box {
        padding-right: 76px;
      }
      /* node.yaml 的复制按钮：.yaml-copy 在 ui.css 里有两个定义（旧段落 + 组件层），
         叠上 .btn.btn-ghost 的透明底后会和代码文字糊在一起。ui.css 本轮冻结，
         所以在页级按语义改回实底。 */
      .yaml-copy.btn {
        background: var(--panel-overlay);
        border-color: var(--line);
      }
      .yaml-copy.btn:hover {
        background: var(--surface-3);
      }
    </style>
{{end}}

{{define "content"}}
<div id="page-main">
  <div class="page">
    <!-- 页头：标题 + 状态徽章 + 动作。
         页面内容里不出现 h1 —— 顶栏那个才是全站唯一的 h1（契约 §10-C1/C2）。
         #pb-desc 走 .page-sub（mountLayout 见到 .page-sub 就不再画顶栏副标题）。
         移动端也保留完整动作区：#btn-install 是这一页唯一的"提交"入口。 -->
    <div class="page-head">
      <div class="min-w-0">
        <div class="pb-title-row">
          <h2 id="pb-name" class="page-title">
            <span class="skeleton pb-sk-title" aria-hidden="true"></span>
          </h2>
          <span id="pb-badge" class="pb-badge">
            <span class="skeleton pb-sk-badge" aria-hidden="true"></span>
          </span>
        </div>
        <p id="pb-desc" class="page-sub"></p>
        <p id="pb-slug" class="pb-slug"></p>
      </div>
      <div class="page-actions">
        <a href="playbooks.html" class="btn btn-ghost">{{t "pb.back"}}</a>
        <button id="btn-rescan" type="button" class="btn btn-ghost">{{t "pb.rescan"}}</button>
        <button id="btn-install" type="button" class="btn btn-primary">{{t "pb.install"}}</button>
      </div>
    </div>

    <!-- 汇总：一句"最该先做的一件事"。数据没回来之前是骨架，不是一张空卡。 -->
    <div id="pb-summary" class="card card-pad">
      <div class="pb-sk" aria-hidden="true">
        <div class="skeleton pb-sk-line-wide"></div>
      </div>
    </div>

    <!-- ① 能力定义 -->
    <div class="card card-pad pb-sec">
      <div class="card-head">
        <h3 class="card-title">{{t "pb.sec.capabilities"}}</h3>
        <div class="card-actions">
          <span id="cap-count" class="badge badge-neutral">—</span>
          <button id="cap-act" type="button" class="btn btn-ghost btn-sm" style="display: none"></button>
        </div>
      </div>
      <p id="cap-sum" class="card-sub pb-sec-sum"></p>
      <div id="cap-skel" class="pb-sk" aria-hidden="true">
        <div class="skeleton pb-sk-line-wide"></div>
        <div class="skeleton pb-sk-line"></div>
      </div>
      <div id="cap-list" class="pb-sec-list"></div>
    </div>

    <!-- ② 节点实现（最常见的「跑不起来」） -->
    <div class="card card-pad pb-sec">
      <div class="card-head">
        <h3 class="card-title">{{t "pb.sec.nodes"}}</h3>
        <div class="card-actions">
          <span id="node-count" class="badge badge-neutral">—</span>
          <button id="node-act" type="button" class="btn btn-ghost btn-sm" style="display: none"></button>
        </div>
      </div>
      <p id="node-sum" class="card-sub pb-sec-sum"></p>
      <div id="node-skel" class="pb-sk" aria-hidden="true">
        <div class="skeleton pb-sk-line-wide"></div>
        <div class="skeleton pb-sk-line"></div>
      </div>
      <div id="node-list" class="pb-sec-list"></div>
      <div id="yaml-wrap" class="hidden">
        <p class="card-sub mt-2">{{t "pb.yaml.hint"}}</p>
        <!-- 代码块是 white-space:pre：`<span id="yaml-text">` 必须紧跟开标签，
             否则标签之间的缩进会被当成 YAML 首行的一部分（首行白挪两个字符）。 -->
        <div class="yaml-box"><span id="yaml-text"></span>
          <button id="btn-copy-yaml" type="button" class="yaml-copy btn btn-ghost btn-sm">
            {{t "pb.copy"}}
          </button>
        </div>
      </div>
    </div>

    <!-- ③ 出口 -->
    <div class="card card-pad pb-sec">
      <div class="card-head">
        <h3 class="card-title">{{t "pb.sec.edges"}}</h3>
        <div class="card-actions">
          <span id="edge-count" class="badge badge-neutral">—</span>
          <button id="edge-act" type="button" class="btn btn-ghost btn-sm" style="display: none"></button>
        </div>
      </div>
      <p id="edge-sum" class="card-sub pb-sec-sum"></p>
      <div id="edge-skel" class="pb-sk" aria-hidden="true">
        <div class="skeleton pb-sk-line-wide"></div>
        <div class="skeleton pb-sk-line"></div>
      </div>
      <div id="edge-list" class="pb-sec-list"></div>
    </div>

    <!-- ④ 触发器 -->
    <div class="card card-pad pb-sec">
      <div class="card-head">
        <h3 class="card-title">{{t "pb.sec.triggers"}}</h3>
        <div class="card-actions">
          <span id="trg-count" class="badge badge-neutral">—</span>
          <button id="trg-act" type="button" class="btn btn-ghost btn-sm" style="display: none"></button>
        </div>
      </div>
      <p id="trg-sum" class="card-sub pb-sec-sum"></p>
      <div id="trg-skel" class="pb-sk" aria-hidden="true">
        <div class="skeleton pb-sk-line-wide"></div>
        <div class="skeleton pb-sk-line"></div>
      </div>
      <div id="trg-list" class="pb-sec-list"></div>
    </div>
  </div>
</div>
{{end}}

{{define "script"}}
    <script>
      const t = (k, d) => (window.AnotifyI18n && window.AnotifyI18n[k]) || d || k;
      const API = "/v1";
      const pbKey = new URLSearchParams(location.search).get("id") || "";

      Anotify.mountLayout({
        active: "playbooks",
        title: t("pb.title", "预案"),
        subtitle: t("pb.detail_subtitle", "体检：定义 → 节点 → 出口 → 触发器"),
      });

      // toast 统一走 partials.js 的 Anotify.toast（全站一个实现、一个 host）。
      const toast = (msg, kind) => Anotify.toast(msg, kind);

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function drop(id) {
        const n = document.getElementById(id);
        if (n && n.parentNode) n.parentNode.removeChild(n);
      }

      const STATUS_KEY = {
        ready: "pb.status.ready",
        "needs-node": "pb.status.needs_node",
        blocked: "pb.status.blocked",
        partial: "pb.status.partial",
      };
      const STATUS_FALLBACK = {
        ready: "就绪",
        "needs-node": "缺节点",
        blocked: "缺定义",
        partial: "不完整",
      };
      // 每种状态一个点：ok 绿 / 需要动手 黄 / 阻塞 红。
      // 字形用字体里一定有的符号：U+2715「✕」在 Inter / 常见回退字体里缺失，
      // 会渲染成一个空豆腐块（实测 Chrome + Inter 即如此）—— 用 U+00D7「×」。
      const DOT_TEXT = { "is-ok": "●", "is-bad": "×", "is-warn": "!" };

      let PB = null;

      // 一行检查项：点 + 标题 + 说明 + 右侧动作
      function row(dotCls, title, sub, action) {
        const r = el("div", "chk");
        r.appendChild(el("span", "chk-dot " + dotCls, DOT_TEXT[dotCls] || "·"));
        const main = el("div", "chk-main");
        main.appendChild(el("div", "chk-title", title));
        if (sub) main.appendChild(el("div", "chk-sub", sub));
        r.appendChild(main);
        if (action) {
          const box = el("div", "chk-act");
          box.appendChild(action);
          r.appendChild(box);
        }
        return r;
      }

      // 行内动作（只有「由谁执行」这一节需要：按能力给复制 YAML / 打开节点页）
      function actBtn(label, fn) {
        const b = el("button", "btn btn-ghost btn-sm", label);
        b.type = "button";
        b.addEventListener("click", fn);
        return b;
      }

      // 只把**缺的那个能力**写成 YAML，不是把整份文件吐出来让人自己删。
      // 生成的 node.yaml 必须能**直接**被 cmd/agent 解析（严格 YAML 解码：
      // 多一个未知字段就报 "field xxx not found"）。形状以 cmd/agent/config.go 为准：
      //   顶层 name/server/token/instances
      //   capabilities[].capability（不是 name）+ run 是**映射**（runner/command/timeoutSec/concurrency）
      // 以前这里生成的是 `node:` 包一层、`run: bash` 标量、`timeout_sec`，
      // 贴进 agent 立刻解析失败 —— 命令一条都跑不起来。
      function yamlFor(items) {
        const lines = [
          "# node.yaml —— 填好 server / token 后：agent -f node.yaml",
          "# token 来自「节点」页注册节点时返回的一次性令牌",
          "name: " + (items[0] && items[0].ref
            ? String(items[0].ref).split("@")[0] + "-node"
            : "my-node"),
          "server: https://anotify.example.com",
          "token: n_请替换为节点令牌",
          "instances: 1",
          "capabilities:",
        ];
        for (const it of items) {
          const name = String(it.ref || "").split("@")[0];
          const ver = String(it.ref || "").split("@")[1] || "1";
          const r = it.runner || {};
          lines.push("  - capability: " + name);
          lines.push("    version: " + ver);
          lines.push("    run:");
          lines.push("      runner: " + (r.runner || "bash"));
          // command 用块标量：带引号/换行的命令按缩进原样保留
          lines.push("      command: |");
          const cmd = String(r.command || "echo hello");
          for (const l of cmd.split("\n")) lines.push("        " + l);
          if (r.timeoutSec) lines.push("      timeoutSec: " + r.timeoutSec);
          if (r.concurrency) lines.push("      concurrency: " + r.concurrency);
        }
        return lines.join("\n");
      }

      function count(n, m) {
        return t("pb.n_of_m", "{n}/{m} 就绪").replace("{n}", n).replace("{m}", m);
      }

      // 节标题右侧的状态徽章：全绿 / 部分 / 全红（颜色只表示"要不要动手"）
      function setBadge(id, ok, total) {
        const b = document.getElementById(id);
        if (!b) return;
        b.textContent = count(ok, total);
        b.className =
          "badge " +
          (total === 0
            ? "badge-neutral"
            : ok === total
              ? "badge-success"
              : ok === 0
                ? "badge-error"
                : "badge-warn");
      }

      function setSum(id, text) {
        const n = document.getElementById(id);
        if (n) n.textContent = text || "";
      }

      // 节的动作按钮：没有动作就整个收起来（不留一个点了没反应的死按钮）。
      // 不能用 .hidden —— .btn 的 display:inline-flex 与 .hidden{display:none}
      // 同优先级且 ui.css 后加载，会把 hidden 盖掉。
      function setAct(id, label, fn) {
        const b = document.getElementById(id);
        if (!b) return;
        b.textContent = label || "";
        b.onclick =
          label && fn
            ? (ev) => {
                ev.stopPropagation();
                fn();
              }
            : null;
        b.style.display = label ? "" : "none";
      }

      // 失败态：四张检查卡整体收起，只留 #pb-summary 里的错误说明 + 重试按钮。
      // .card 没有 display 规则，所以 .hidden 在这一层有效。
      function setSectionsHidden(hidden) {
        for (const n of document.querySelectorAll(".pb-sec")) n.classList.toggle("hidden", hidden);
      }

      // ---- 每节的一行结论：全部就绪说"全好了"，否则说第一件该动手的事 ----
      // 全部复用已有 key（pb.fix.* / pb.node.* / pb.edge.* / pb.trg.* / pb.next.ready）
      // —— 结论行不引入新文案，四种语言就不会出现"某一种语言还是中文兜底"。
      const CAP_MISSING = ["pb.fix.capability.missing", "还缺能力定义，先把它补进当前命名空间"];
      const ALL_READY = ["pb.next.ready", "全部就绪，可以开始跑了"];
      function capLead(caps) {
        if (caps.length && !caps.some((c) => c.status === "missing")) return t(...ALL_READY);
        return t(...CAP_MISSING);
      }
      function nodeLead(caps) {
        if (caps.some((c) => c.status === "no-node"))
          return t("pb.fix.capability.no-node", "定义齐了，但没有节点声明它能执行 —— 去写 node.yaml");
        if (caps.some((c) => c.status === "offline"))
          return t("pb.fix.capability.offline", "有节点声明了，但机器离线 —— 把它连上就行");
        if (caps.some((c) => c.status === "missing")) return t("pb.node.blocked", "先补能力定义");
        if (!caps.length) return t(...CAP_MISSING);
        return t(...ALL_READY);
      }
      function edgeLead(edges) {
        if (!edges.length) return t("pb.edges.none", "这份预案不声明出口");
        const bad = edges.find((e) => e.status !== "ok");
        if (!bad) return t(...ALL_READY);
        if (bad.blockedByCap)
          return t("pb.edge.blocked", "端点「{c}」还没有定义，先补定义再补边").replace(
            "{c}",
            bad.blockedByCap,
          );
        return t("pb.edge.missing", "这条边还不在路由表里");
      }
      function trgLead(trgs) {
        // 一条触发器都没声明时，"还差触发器"这句本身就是结论 —— 不需要新 key。
        if (!trgs.length) return t("pb.fix.trigger.missing", "预案齐了，但还没有事件把它叫起来");
        const bad = trgs.find((g) => g.status !== "ok");
        if (!bad) return t(...ALL_READY);
        return t("pb.trg.missing", "没有把事件送进入口能力 {c} 的源").replace(
          "{c}",
          (bad.entryCaps || []).join(", "),
        );
      }

      function render() {
        const p = PB;
        document.getElementById("pb-name").textContent = p.name;
        document.getElementById("pb-desc").textContent = p.description || "";
        document.getElementById("pb-slug").textContent = p.slug;
        const badge = document.getElementById("pb-badge");
        badge.className = "pb-badge is-" + p.status;
        badge.textContent = t(STATUS_KEY[p.status], STATUS_FALLBACK[p.status]);

        // 数据到了：撤掉骨架、把可能因失败态收起的卡片放回来。
        for (const id of ["cap-skel", "node-skel", "edge-skel", "trg-skel"]) drop(id);
        setSectionsHidden(false);

        const items = p.items || [];
        const caps = items.filter((i) => i.kind === "capability");
        const edges = items.filter((i) => i.kind === "edge");
        const trgs = items.filter((i) => i.kind === "trigger");

        // ---- 汇总：先说要紧的一句 ----
        const sum = document.getElementById("pb-summary");
        sum.replaceChildren();
        const bad = items.filter((i) => i.status !== "ok");
        if (p.status === "ready" || !bad.length) {
          sum.appendChild(el("div", "pb-sum", t("pb.next.ready", "全部就绪，可以开始跑了")));
        } else {
          const first = bad[0];
          const map = {
            "capability.missing": ["pb.fix.capability.missing", "还缺能力定义，先把它补进当前命名空间"],
            "capability.no-node": ["pb.fix.capability.no-node", "定义齐了，但没有节点声明这个能力 —— 去写 node.yaml"],
            "capability.offline": ["pb.fix.capability.offline", "有节点声明了，但机器离线 —— 把它连上就行"],
            "edge.missing": ["pb.fix.edge.missing", "能力齐了，出口还没连上"],
            "trigger.missing": ["pb.fix.trigger.missing", "图能跑了，但还没有事件把它叫起来"],
          };
          const k = first.kind + "." + first.status;
          const pair = map[k] || ["pb.remaining", "还差 {n} 项"];
          sum.appendChild(el("div", "pb-sum", t(pair[0], pair[1])));
          sum.appendChild(
            el("div", "card-sub", t("pb.remaining", "还差 {n} 项").replace("{n}", bad.length)),
          );
        }

        // ---- ① 能力定义 ----
        const capList = document.getElementById("cap-list");
        capList.textContent = "";
        // 行内不再放动作按钮：install() 是**整份预案**幂等的补齐，不认单项，
        // 行内按钮会假装它是「只补这一条」。动作统一放节标题右侧（见 setAct）。
        for (const c of caps) {
          const ok = c.status !== "missing";
          capList.appendChild(
            row(
              ok ? "is-ok" : "is-bad",
              c.ref,
              ok
                ? t("pb.cap.outputs", "出口：{o}").replace("{o}", (c.outputs || []).join(", ") || "—")
                : t("pb.cap.missing", "当前命名空间里还没有这个定义"),
              null,
            ),
          );
        }
        const capOk = caps.filter((c) => c.status !== "missing").length;
        setBadge("cap-count", capOk, caps.length);
        setSum("cap-sum", capLead(caps));
        setAct(
          "cap-act",
          caps.some((c) => c.status === "missing") ? t("pb.act.install_cap", "安装定义") : "",
          install,
        );

        // ---- ② 节点实现 ----
        const nodeList = document.getElementById("node-list");
        nodeList.textContent = "";
        const needYaml = caps.filter((c) => c.status === "no-node");
        for (const c of caps) {
          let dot = "is-ok";
          let sub = "";
          if (c.status === "missing") {
            dot = "is-warn";
            sub = t("pb.node.blocked", "先补能力定义");
          } else if (c.status === "no-node") {
            dot = "is-bad";
            sub = t("pb.node.none", "没有任何节点声明它 —— 这是最常见的「跑不起来」");
          } else if (c.status === "offline") {
            dot = "is-warn";
            sub =
              t("pb.node.offline", "有节点，但离线：") +
              (c.nodes || []).map((n) => n.name).join(", ");
          } else {
            sub = (c.nodes || []).map((n) => n.name).join(", ");
          }
          const action =
            c.status === "offline"
              ? actBtn(t("pb.act.open_nodes", "打开节点页"), () => (location.href = "nodes.html"))
              : c.status === "no-node"
                ? actBtn(t("pb.act.copy_yaml", "复制 YAML"), () => copyText(yamlFor([c])))
                : null;
          nodeList.appendChild(row(dot, c.ref, sub, action));
        }
        setBadge("node-count", caps.filter((c) => c.status === "ok").length, caps.length);
        setSum("node-sum", nodeLead(caps));

        const yamlWrap = document.getElementById("yaml-wrap");
        if (needYaml.length) {
          document.getElementById("yaml-text").textContent = yamlFor(needYaml);
          yamlWrap.classList.remove("hidden");
        } else {
          yamlWrap.classList.add("hidden");
        }
        // 节点这一节的动作只给一件事：去节点页（令牌在那里发、agent 在那里连）。
        // 「补齐」补不了节点，复制 YAML 的入口已经在行内和代码块上 —— 节标题
        // 再放一个就是第三个副本文案按钮。
        if (needYaml.length || caps.some((c) => c.status === "offline")) {
          setAct("node-act", t("pb.act.open_nodes", "打开节点页"), () => {
            location.href = "nodes.html";
          });
        } else {
          setAct("node-act", "", null);
        }

        // ---- ③ 出口 ----
        const edgeList = document.getElementById("edge-list");
        edgeList.textContent = "";
        if (!edges.length) {
          edgeList.appendChild(row("is-ok", t("pb.edges.none", "这份预案不声明出口"), "", null));
        }
        for (const e of edges) {
          const ok = e.status === "ok";
          edgeList.appendChild(
            row(
              ok ? "is-ok" : "is-bad",
              e.label,
              ok
                ? ""
                : e.blockedByCap
                  ? t("pb.edge.blocked", "端点「{c}」还没有定义，先补定义再补边").replace("{c}", e.blockedByCap)
                  : t("pb.edge.missing", "这条边还不在路由表里"),
              null,
            ),
          );
        }
        setBadge("edge-count", edges.filter((e) => e.status === "ok").length, edges.length);
        setSum("edge-sum", edgeLead(edges));
        setAct(
          "edge-act",
          edges.some((e) => e.status !== "ok") ? t("pb.act.install_edge", "补齐这条边") : "",
          install,
        );

        // ---- ④ 触发器 ----
        const trgList = document.getElementById("trg-list");
        trgList.textContent = "";
        for (const g of trgs) {
          const ok = g.status === "ok";
          trgList.appendChild(
            row(
              ok ? "is-ok" : "is-bad",
              g.label,
              ok
                ? ""
                : t("pb.trg.missing", "没有把事件送进入口能力 {c} 的源").replace(
                    "{c}",
                    (g.entryCaps || []).join(", "),
                  ),
              null,
            ),
          );
        }
        setBadge("trg-count", trgs.filter((g) => g.status === "ok").length, trgs.length);
        setSum("trg-sum", trgLead(trgs));
        setAct(
          "trg-act",
          trgs.some((g) => g.status !== "ok") ? t("pb.act.create_source", "创建源") : "",
          install,
        );

        document.getElementById("btn-install").style.display = p.status === "ready" ? "none" : "";
      }

      async function copyText(txt) {
        try {
          await navigator.clipboard.writeText(txt);
          toast(t("pb.copied", "已复制，贴进 node.yaml 后重启 agent"));
        } catch (e) {
          toast(t("pb.copy_failed", "复制失败，请手动选中复制"));
        }
      }

      // 返回 true 表示这一轮真的拿到了数据（重新体检按钮据此决定要不要报"已重新体检"）。
      async function load() {
        try {
          const j = await Anotify.api(API + "/playbooks/" + encodeURIComponent(pbKey));
          PB = j.playbook;
        } catch (e) {
          // 失败态：错误说明 + 重试按钮就地渲染在内容容器里，不伪造一份"空预案"。
          const sum = document.getElementById("pb-summary");
          sum.replaceChildren(Anotify.loadErrorNode(e, () => load()));
          setSectionsHidden(true);
          toast(t("pb.load_failed", "载入失败，请刷新重试。"));
          return false;
        }
        render();
        return true;
      }

      // 补齐 = 幂等：能补的定义/边/源都补，补不了的（节点）留给 YAML。
      async function install() {
        try {
          const j = await Anotify.api(API + "/playbooks/" + encodeURIComponent(pbKey) + "/install", {
            method: "POST",
          });
          PB = j.playbook;
          render();
          const c = j.created || {};
          const n =
            (c.capabilities || []).length + (c.edges || []).length + (c.sources || []).length;
          toast(
            n
              ? t("pb.installed_n", "补齐了 {n} 项").replace("{n}", n)
              : t("pb.installed_none", "没有可自动补齐的项了"),
          );
        } catch (e) {
          toast(t("pb.install_failed", "补齐失败：" ) + e.message);
        }
      }

      document.getElementById("btn-rescan").addEventListener("click", async () => {
        const ok = await load();
        if (ok) toast(t("pb.rescanned", "已重新体检"));
      });
      document.getElementById("btn-install").addEventListener("click", install);
      document.getElementById("btn-copy-yaml").addEventListener("click", () => {
        copyText(document.getElementById("yaml-text").textContent);
      });
      document.addEventListener("DOMContentLoaded", load);
    </script>
{{end}}
