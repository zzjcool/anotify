{{define "title"}}{{t "message.title"}}{{end}} {{define "content"}}
<div id="page-main">
  <div class="mx-auto max-w-3xl space-y-6">
    <!-- ===== 头部：状态点 + 标题 + 时间 ===== -->
    <div class="reveal visible">
      <div class="flex items-start gap-3">
        <span id="msg-dot" class="dot dot-success mt-2"></span>
        <div class="min-w-0 flex-1">
          <h2
            class="font-display text-2xl text-white break-words"
            id="msg-title"
          >
            {{t "message.loading"}}
          </h2>
          <p class="mt-1 text-sm text-zinc-500" id="msg-subtitle">—</p>
        </div>
        <span id="msg-status-badge" class="status-badge status-success shrink-0"
          >—</span
        >
      </div>
    </div>

    <!-- ===== 正文 ===== -->
    <section class="card reveal visible p-5">
      <div class="text-xs font-medium text-zinc-500">
        {{t "message.body_label"}}
      </div>
      <p
        class="mt-2 whitespace-pre-wrap break-words text-sm leading-relaxed text-zinc-200"
        id="msg-body"
      >
        —
      </p>
      <a
        id="msg-link-btn"
        href="#"
        class="btn-primary mt-4 hidden items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium"
        >{{t "message.open_link"}}</a
      >
    </section>

    <!-- ===== 全部字段 ===== -->
    <section class="card reveal visible p-5">
      <div class="text-sm font-medium text-white">
        {{t "message.fields_title"}}
      </div>
      <div
        class="mt-4 grid grid-cols-2 gap-3 md:grid-cols-3"
        id="msg-fields"
      ></div>
    </section>

    <!-- ===== 投递记录 ===== -->
    <section class="card reveal visible p-5">
      <div class="flex items-center justify-between">
        <div class="text-sm font-medium text-white">
          {{t "message.deliveries_title"}}
        </div>
        <span class="text-xs text-zinc-500" id="delivery-count">—</span>
      </div>
      <div id="delivery-list" class="mt-3 divide-y divide-white/[0.04]"></div>
    </section>
  </div>
</div>

{{end}} {{define "script"}}
<script>
  (function () {
    "use strict";
    const { el, api, mountLayout, timeAgo } = window.Anotify;
    const qs = new URLSearchParams(location.search);
    const msgId = qs.get("id") || "";

    mountLayout({ active: "overview", title: "通知详情" });

    const STATUS_META = {
      success: { dot: "dot-success", badge: "status-success", label: "成功" },
      error: { dot: "dot-error", badge: "status-error", label: "失败" },
      interrupted: { dot: "dot-warn", badge: "status-warn", label: "中断" },
      info: { dot: "dot-success", badge: "status-success", label: "信息" },
      warning: { dot: "dot-warn", badge: "status-warn", label: "警告" },
    };
    const PRIORITY_LABEL = { high: "高", normal: "普通", low: "低" };
    const CHANNEL_LABEL = { webpush: "Web Push", websocket: "WebSocket" };
    const DSTATUS_META = {
      pending: { cls: "status-warn", label: "待投递" },
      sent: { cls: "status-success", label: "已发送" },
      delivered: { cls: "status-success", label: "已送达" },
      acked: { cls: "status-success", label: "已确认" },
      failed: { cls: "status-error", label: "失败" },
    };

    function safeParse(s) {
      try {
        return typeof s === "string" ? JSON.parse(s) : s;
      } catch {
        return {};
      }
    }
    // 完整时间（秒级，本地时区）
    function fmtTime(iso) {
      const t = Date.parse(iso);
      if (Number.isNaN(t)) return "—";
      const d = new Date(t);
      const p = (x) => String(x).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    function fmtTTL(sec) {
      if (!sec || sec <= 0) return "—";
      if (sec % 86400 === 0) return sec / 86400 + " 天";
      if (sec % 3600 === 0) return sec / 3600 + " 小时";
      if (sec % 60 === 0) return sec / 60 + " 分钟";
      return sec + " 秒";
    }

    function field(k, v, mono) {
      return el(
        "div",
        {
          class:
            "rounded-lg bg-white/[0.03] px-3 py-2.5 ring-1 ring-white/[0.06]",
        },
        el("div", {
          class: "text-[10px] uppercase tracking-wide text-zinc-500",
          text: k,
        }),
        el("div", {
          class:
            (mono === false ? "" : "mono ") +
            " mt-0.5 break-all text-[12px] text-zinc-200",
          text: v == null || v === "" ? "—" : String(v),
        }),
      );
    }

    function renderError(text) {
      document.getElementById("msg-title").textContent = text;
      document.getElementById("msg-subtitle").textContent = msgId || "";
      document.getElementById("msg-body").textContent = "—";
      document.getElementById("delivery-count").textContent = "";
    }

    function render(m) {
      const payload = safeParse(m.payload);
      const meta = STATUS_META[m.status] || STATUS_META.info;

      document.getElementById("msg-dot").className =
        "dot " + meta.dot + " mt-2";
      document.getElementById("msg-title").textContent =
        m.title || "（无标题）";
      document.getElementById("msg-subtitle").textContent =
        (payload.cwd || payload.project || "—") +
        " · " +
        timeAgo(m.createdAt) +
        " · " +
        m.id;
      const badge = document.getElementById("msg-status-badge");
      badge.className = "status-badge shrink-0 " + meta.badge;
      badge.textContent = meta.label;

      document.getElementById("msg-body").textContent = m.body || "（无正文）";
      const linkBtn = document.getElementById("msg-link-btn");
      if (m.link) {
        linkBtn.href = m.link;
        linkBtn.classList.replace("hidden", "flex");
      }

      const duration = payload.durationMs
        ? Math.round(payload.durationMs / 1000) + "s"
        : payload.duration != null
          ? payload.duration + "s"
          : "—";
      const tags = Array.isArray(m.deviceTags) ? m.deviceTags : [];
      document
        .getElementById("msg-fields")
        .replaceChildren(
          field("消息 ID", m.id),
          field("序号 Seq", m.seq),
          field("状态", `${meta.label}（${m.status}）`, false),
          field("Agent", payload.agentId || payload.agent),
          field("会话 Session", payload.sessionId),
          field("项目 CWD", payload.cwd || payload.project),
          field("模型 Model", payload.model),
          field("耗时", duration),
          field("优先级", PRIORITY_LABEL[m.priority] || m.priority, false),
          field("路由标签", tags.length ? tags.join("、") : "（广播）", false),
          field("TTL", fmtTTL(m.ttlSeconds)),
          field("创建时间", fmtTime(m.createdAt)),
          field("过期时间", fmtTime(m.expiresAt)),
          field("外部链接", m.link || "—"),
        );
    }

    function renderDeliveries(list) {
      const okCount = list.filter((d) =>
        ["sent", "delivered", "acked"].includes(d.status),
      ).length;
      document.getElementById("delivery-count").textContent =
        `${okCount}/${list.length} 已送达`;
      const box = document.getElementById("delivery-list");
      if (list.length === 0) {
        box.replaceChildren(
          el("div", {
            class: "py-6 text-center text-sm text-zinc-500",
            text: "暂无投递记录（未匹配到启用设备）",
          }),
        );
        return;
      }
      box.replaceChildren(
        ...list.map((d) => {
          const dm = DSTATUS_META[d.status] || DSTATUS_META.pending;
          return el(
            "div",
            { class: "flex items-center gap-3 py-3" },
            el(
              "div",
              { class: "min-w-0 flex-1" },
              el(
                "div",
                { class: "flex flex-wrap items-center gap-2" },
                el("span", {
                  class: "mono truncate text-[12px] text-zinc-200",
                  text: d.deviceId,
                }),
                el("span", {
                  class: `status-badge ${dm.cls}`,
                  text: dm.label,
                }),
              ),
              el(
                "div",
                { class: "mt-0.5 text-[11px] text-zinc-500" },
                (CHANNEL_LABEL[d.channel] || d.channel) +
                  " · 尝试 " +
                  d.attempts +
                  " 次 · " +
                  timeAgo(d.updatedAt) +
                  (d.error ? " · " + d.error : ""),
              ),
            ),
          );
        }),
      );
    }

    /* ================= 加载 ================= */
    async function load() {
      if (!msgId) {
        renderError("缺少消息 ID（URL 应有 ?id=ntf_…）");
        return;
      }
      let m;
      try {
        m = await api("/v1/notifications/" + encodeURIComponent(msgId));
      } catch (e) {
        renderError("消息不存在或已被清理");
        return;
      }
      if (!m || !m.id) {
        renderError("消息不存在或已被清理");
        return;
      }
      render(m);
      renderDeliveries(Array.isArray(m.deliveries) ? m.deliveries : []);
    }
    load();
  })();
</script>
{{end}}
