{{define "title"}}{{t "message.title"}}{{end}} {{define "content"}}
<div id="page-main">
  <div class="mx-auto max-w-3xl space-y-6">
    <!-- ===== 头部：状态点 + 标题 + 时间 ===== -->
    <div class="reveal visible">
      <div class="flex items-start gap-3">
        <span id="msg-dot" class="dot dot-success mt-2"></span>
        <div class="min-w-0 flex-1">
          <h2
            class="font-display text-2xl text-white break-words"
            id="msg-title"
          >
            {{t "message.loading"}}
          </h2>
          <p class="mt-1 text-sm text-zinc-500" id="msg-subtitle">—</p>
        </div>
        <span id="msg-status-badge" class="status-badge status-success shrink-0"
          >—</span
        >
      </div>
    </div>

    <!-- ===== 正文 ===== -->
    <section class="card reveal visible p-5">
      <div class="text-xs font-medium text-zinc-500">
        {{t "message.body_label"}}
      </div>
      <div
        class="mt-2 break-words text-sm leading-relaxed text-zinc-200 md-body"
        id="msg-body"
      >
        —
      </div>
      <a
        id="msg-link-btn"
        href="#"
        class="btn-primary mt-4 hidden items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium"
        >{{t "message.open_link"}}</a
      >
    </section>

    <!-- ===== 全部字段 ===== -->
    <section class="card reveal visible p-5">
      <div class="text-sm font-medium text-white">
        {{t "message.fields_title"}}
      </div>
      <div
        class="mt-4 grid grid-cols-2 gap-3 md:grid-cols-3"
        id="msg-fields"
      ></div>
    </section>

    <!-- ===== 投递记录 ===== -->
    <section class="card reveal visible p-5">
      <div class="flex items-center justify-between">
        <div class="text-sm font-medium text-white">
          {{t "message.chain_title"}}
        </div>
        <span class="text-xs text-zinc-500" id="delivery-count">—</span>
      </div>
      <div id="delivery-list" class="mt-3 divide-y divide-white/[0.04]"></div>
    </section>
  </div>
</div>

{{end}} {{define "script"}}
<script src="/vendor/marked.min.js" defer></script>
<script>
  (function () {
    "use strict";
    const { el, api, mountLayout, mountPullRefresh, timeAgo, t } =
      window.Anotify;
    const qs = new URLSearchParams(location.search);
    const msgId = qs.get("id") || "";

    mountLayout({
      active: "overview",
      title: t("message.task_title", "任务详情"),
    });

    const AGENT_STATE_META = {
      working: { dot: "dot-info", badge: "status-info", labelKey: "common.agentState.working", fb: "运行中" },
      blocked: { dot: "dot-warn", badge: "status-warn", labelKey: "common.agentState.blocked", fb: "等待中" },
      done: { dot: "dot-success", badge: "status-success", labelKey: "common.agentState.done", fb: "完成" },
      interrupted: { dot: "dot-warn", badge: "status-warn", labelKey: "common.agentState.interrupted", fb: "中断" },
      error: { dot: "dot-error", badge: "status-error", labelKey: "common.agentState.error", fb: "失败" },
    };
    function priorityLabel(p) {
      const map = {
        high: { key: "common.priority.high", fb: "高" },
        normal: { key: "common.priority.normal", fb: "普通" },
        low: { key: "common.priority.low", fb: "低" },
      };
      const m = map[p];
      return m ? t(m.key, m.fb) : p || "—";
    }
    const CHANNEL_LABEL = { webpush: "Web Push", websocket: "WebSocket" };
    const DSTATUS_META = {
      pending: { cls: "status-warn", labelKey: "common.delivery.pending", fb: "待投递" },
      sent: { cls: "status-success", labelKey: "common.delivery.sent", fb: "已发送" },
      delivered: { cls: "status-success", labelKey: "common.delivery.delivered", fb: "已送达" },
      acked: { cls: "status-success", labelKey: "common.delivery.acked", fb: "已确认" },
      failed: { cls: "status-error", labelKey: "common.delivery.failed", fb: "失败" },
    };

    function safeParse(s) {
      try {
        return typeof s === "string" ? JSON.parse(s) : s;
      } catch {
        return {};
      }
    }
    // 完整时间（秒级，本地时区）
    function fmtTime(iso) {
      const t = Date.parse(iso);
      if (Number.isNaN(t)) return "—";
      const d = new Date(t);
      const p = (x) => String(x).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    function fmtTTL(sec) {
      if (!sec || sec <= 0) return "—";
      if (sec % 86400 === 0)
        return t("common.ttl.day", "{n} 天").replace("{n}", sec / 86400);
      if (sec % 3600 === 0)
        return t("common.ttl.hour", "{n} 小时").replace("{n}", sec / 3600);
      if (sec % 60 === 0)
        return t("common.ttl.minute", "{n} 分钟").replace("{n}", sec / 60);
      return t("common.ttl.second", "{n} 秒").replace("{n}", sec);
    }

    function field(k, v, mono) {
      return el(
        "div",
        {
          class:
            "rounded-lg bg-white/[0.03] px-3 py-2.5 ring-1 ring-white/[0.06]",
        },
        el("div", {
          class: "text-[10px] uppercase tracking-wide text-zinc-500",
          text: k,
        }),
        el("div", {
          class:
            (mono === false ? "" : "mono ") +
            " mt-0.5 break-all text-[12px] text-zinc-200",
          text: v == null || v === "" ? "—" : String(v),
        }),
      );
    }

    function renderError(text) {
      document.getElementById("msg-title").textContent = text;
      document.getElementById("msg-subtitle").textContent = msgId || "";
      document.getElementById("msg-body").textContent = "—";
      document.getElementById("delivery-count").textContent = "";
    }

    // Markdown → HTML 渲染（marked@12 全局是 object，解析函数在 marked.parse；
    // 默认转义 HTML 防注入；关闭 mangle/headerIds 避免 id 污染）
    function renderBody(el, body) {
      const raw = body || t("common.placeholder.no_body", "（无正文）");
      const marked = window.marked;
      if (marked && typeof marked.parse === "function") {
        try {
          if (typeof marked.setOptions === "function") {
            marked.setOptions({ mangle: false, headerIds: false });
          }
          el.innerHTML = marked.parse(raw);
          return;
        } catch (e) {
          /* fallthrough 到纯文本 */
        }
      }
      el.textContent = raw;
    }

    // 任务状态 → 视觉（复用既有 dot/status 样式，九态收敛到五类）
    const TASK_STATE_META = {
      pending: { dot: "dot-warn", badge: "status-warn", fb: "排队中" },
      assigned: { dot: "dot-info", badge: "status-info", fb: "已派发" },
      acked: { dot: "dot-info", badge: "status-info", fb: "已接单" },
      running: { dot: "dot-info", badge: "status-info", fb: "执行中" },
      succeeded: { dot: "dot-success", badge: "status-success", fb: "成功" },
      failed: { dot: "dot-error", badge: "status-error", fb: "失败" },
      canceled: { dot: "dot-warn", badge: "status-warn", fb: "已取消" },
      abandoned: { dot: "dot-warn", badge: "status-warn", fb: "已放弃" },
      lease_expired: { dot: "dot-warn", badge: "status-warn", fb: "租约过期" },
    };

    // render 渲染任务详情。
    //
    // 参数（params）就是任务的全部输入——事件中心里没有"消息正文"，
    // 任务带什么就展示什么（不变量 I6：中枢不做模板替换）。
    function render(task, chain) {
      const params = safeParse(task.params);
      const status = task.status || "pending";
      const meta = TASK_STATE_META[status] || TASK_STATE_META.pending;

      document.getElementById("msg-dot").className =
        "dot " + meta.dot + " mt-2";
      document.getElementById("msg-title").textContent =
        (task.capability || "?") +
        "@" +
        (task.version != null ? task.version : "?");
      document.getElementById("msg-subtitle").textContent =
        (params.cwd || params.project || "—") +
        " · " +
        timeAgo(task.createdAt) +
        " · " +
        task.id;

      const badge = document.getElementById("msg-status-badge");
      badge.className = "status-badge shrink-0 " + meta.badge;
      badge.textContent = t("message.task_state." + status, meta.fb);

      // 正文：优先 params.body；没有就展示整个 params（JSON，便于排查）
      const bodyText =
        params.body ||
        params.title ||
        (Object.keys(params).length
          ? "```json\n" + JSON.stringify(params, null, 2) + "\n```"
          : t("common.placeholder.no_body", "（无正文）"));
      renderBody(document.getElementById("msg-body"), bodyText);

      // 外部链接：params.link（有才显示）
      const linkBtn = document.getElementById("msg-link-btn");
      if (params.link) {
        linkBtn.href = params.link;
        linkBtn.classList.replace("hidden", "flex");
      }

      const duration =
        task.startedAt && task.finishedAt
          ? task.finishedAt - task.startedAt + "s"
          : "—";

      // out 三态（不变量 I5）：没回报 / 到头了 / 走某个出口
      const outText = !task.reported
        ? t("message.out.none", "未回报")
        : task.out == null
          ? t("message.out.end", "到头了（无出口）")
          : task.out;

      document
        .getElementById("msg-fields")
        .replaceChildren(
          field(t("common.field.task_id", "任务 ID"), task.id),
          field(t("common.field.trace", "Trace"), task.traceId),
          field(
            t("common.field.capability", "能力"),
            (task.capability || "?") + "@" + (task.version != null ? task.version : "?"),
          ),
          field(
            t("common.field.agent_state", "运行状态"),
            t("message.task_state." + status, meta.fb) + "（" + status + "）",
            false,
          ),
          field(t("common.field.out", "出口 out"), outText, false),
          field(t("common.field.node", "执行节点"), task.nodeId || t("message.node.central", "中枢执行"), true),
          field(t("common.field.attempts", "尝试次数"), task.attempts != null ? task.attempts : 0, false),
          field(t("common.field.duration", "耗时"), duration),
          field(t("common.field.parent_task", "父任务"), task.parentTaskId || "—"),
          field(t("common.field.created_at", "创建时间"), fmtTime(task.createdAt)),
          field(t("common.field.started_at", "开始时间"), task.startedAt ? fmtTime(task.startedAt) : "—"),
          field(t("common.field.finished_at", "结束时间"), task.finishedAt ? fmtTime(task.finishedAt) : "—"),
          field(t("common.field.error", "错误"), task.error || "—", false),
          field(t("common.field.summary", "结果摘要"), task.summary || "—", false),
        );

      renderChain(chain, task.id);
    }

    // renderChain 渲染整条 trace 上的任务链（替代旧的"投递记录"）。
    //
    // 投递记录回答"推给了哪几台设备"，任务链回答"这条链一共办了几步、
    // 哪一步断了"——后者才是事件中心要回答的问题。
    function renderChain(chain, currentId) {
      const box = document.getElementById("delivery-list");
      const count = document.getElementById("delivery-count");
      const list = Array.isArray(chain) ? chain : [];

      count.textContent = t("message.chain.count", "共 {n} 步").replace(
        "{n}",
        list.length,
      );

      if (list.length === 0) {
        box.replaceChildren(
          el("div", {
            class: "py-6 text-center text-sm text-zinc-500",
            text: t("message.chain.empty", "这条 trace 上没有其它任务"),
          }),
        );
        return;
      }

      // 按 parentTaskId 组装树，缩进表示派生关系
      const byParent = {};
      list.forEach((x) => {
        const p = x.parentTaskId || "__root__";
        (byParent[p] = byParent[p] || []).push(x);
      });

      function node(task_, depth) {
        const kids = byParent[task_.id] || [];
        const st = task_.status || "pending";
        const meta = TASK_STATE_META[st] || TASK_STATE_META.pending;
        const isCurrent = task_.id === currentId;

        const row = el("div", {
          class:
            "py-3" +
            (isCurrent ? " bg-white/[0.03] -mx-2 px-2 rounded-lg" : ""),
          style: "margin-left:" + depth * 16 + "px",
        });

        const line = el("div", { class: "flex flex-wrap items-center gap-2" });
        line.appendChild(
          el("span", {
            class: "dot " + meta.dot,
            style: "width:6px;height:6px;border-radius:9999px",
          }),
        );
        line.appendChild(
          el("code", {
            class: "mono text-[12px] text-zinc-200",
            text:
              (task_.capability || "?") +
              "@" +
              (task_.version != null ? task_.version : "?"),
          }),
        );
        line.appendChild(
          el("span", {
            class: "text-[11px] text-zinc-500",
            text: t("message.task_state." + st, meta.fb),
          }),
        );
        if (isCurrent) {
          line.appendChild(
            el("span", {
              class: "text-[10px] text-indigo-400",
              text: t("message.chain.current", "当前"),
            }),
          );
        }
        row.appendChild(line);

        if (kids.length) {
          const box2 = el("div", {});
          kids.forEach((k) => box2.appendChild(node(k, depth + 1)));
          row.appendChild(box2);
        }
        return row;
      }

      const roots = byParent["__root__"] || list;
      box.replaceChildren();
      roots.forEach((r) => box.appendChild(node(r, 0)));
    }


    /* ================= 加载 ================= */
    async function load() {
      if (!msgId) {
        renderError(t("message.error.missing_id", "缺少消息 ID（URL 应有 ?id=ntf_…）"));
        return;
      }
      // #80：旧 /v1/notifications/:id 已随消息模型下线。
      // 深链现在指向**任务**详情：?id=tsk_xxx。
      //
      // 用 GET /v1/tasks/{id}（按 ID 取单任务 + 整条链）：
      // 不能拿 id 当 traceId 去查——那是两个不同的标识，永远查不到。
      let task = null;
      let chain = [];
      try {
        const res = await api("/v1/tasks/" + encodeURIComponent(msgId));
        task = (res && res.task) || null;
        chain = (res && res.chain) || [];
      } catch (e) {
        task = null;
      }
      if (!task) {
        renderError(t("message.error.not_found", "任务不存在或已被清理"));
        return;
      }
      render(task, chain);
      // marked（defer 加载，本地打包）通常已就绪；极端情况下晚于 render 时
      // 走了纯文本 fallback，这里轻轮询等其就绪后重渲染一次 body 为 Markdown。
      //
      // 注意用 task 而不是旧的 m：m 是消息时代的变量，#80 之后已不存在。
      if (!(window.marked && window.marked.parse)) {
        const params = safeParse(task.params);
        const bodyText =
          params.body || params.title || "```json\n" + JSON.stringify(params, null, 2) + "\n```";
        const tryRerender = () => {
          if (window.marked && window.marked.parse) {
            renderBody(document.getElementById("msg-body"), bodyText);
          } else {
            setTimeout(tryRerender, 50);
          }
        };
        setTimeout(tryRerender, 50);
      }
    }
    load();
    /* 下拉刷新：消息详情页下拉重新拉取该消息（投递状态可能变化） */
    mountPullRefresh(load);
  })();
</script>
{{end}}
