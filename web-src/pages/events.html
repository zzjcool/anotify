{{define "title"}}{{t "events.title"}}{{end}}

{{define "style"}}
    <style>
      /* 本页特有样式（共享样式见 ui.css / tokens.css） */
      .ev-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1rem;
        align-items: start;
      }
      /* 剪枝记录：不是错误，是"这条分支在这里断了"，所以用中性色而不是红 */
      .prune-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.15rem 0.5rem;
        border-radius: 9999px;
        font-size: 0.7rem;
        font-family: var(--mono, monospace);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line-strong);
        color: var(--text-muted, #a1a1aa);
      }
      .prune-chip.no_edge {
        color: #a1a1aa;
      }
      .prune-chip.param_schema {
        color: #fbbf24;
      }
      .prune-chip.no_node {
        color: #60a5fa;
      }
      .prune-chip.foreign_user {
        color: #f472b6;
      }
      .prune-chip.path {
        color: #a78bfa;
      }
      /* 状态点：九态 */
      /* 事件按源分组：组头是源名 + 类型 + 计数，组内是事件卡 */
      .ev-group {
        margin-bottom: 1.25rem;
      }
      .ev-group:last-child {
        margin-bottom: 0;
      }
      .ev-group-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0 0.15rem 0.4rem;
        margin-bottom: 0.5rem;
        border-bottom: 1px solid var(--line);
      }

      .toast {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--panel-overlay);
        border: 1px solid var(--line-strong);
        color: var(--text);
        font-size: 0.82rem;
        padding: 0.6rem 1rem;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s ease;
        z-index: 100;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
{{end}}

{{define "content"}}
<div id="page-main">
      <div class="mx-auto max-w-6xl space-y-8">
        <div class="reveal visible">
          <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
              <h2 class="font-display text-3xl text-white">{{t "events.title"}}</h2>
              <p class="mt-1.5 max-w-2xl text-sm leading-relaxed text-zinc-400">
                {{t "events.subtitle"}}
              </p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <button
                onclick="loadAll()"
                class="btn-ghost flex items-center gap-2 rounded-xl px-4 py-2 text-sm"
              >
                {{t "events.refresh"}}
              </button>
            </div>
          </div>
        </div>

        <!-- 筛选 -->
        <div class="card rounded-2xl p-4">
          <div class="flex flex-wrap items-end gap-3">
            <!-- 每个 label+控件包一层：否则 label 和 select 是各自的 flex 项，
                 窄屏时会被拆到两行，看起来像标签和控件没关系 -->
            <div class="flex flex-col gap-1">
              <label class="text-[11px] text-zinc-400" for="ev-kind">{{t "events.filter.kind"}}</label>
              <select id="ev-kind" class="input w-48 text-xs" onchange="loadAll()">
                <option value="">{{t "events.filter.all_kinds"}}</option>
              </select>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-[11px] text-zinc-400" for="ev-source">{{t "events.filter.source"}}</label>
              <select id="ev-source" class="input w-48 text-xs" onchange="loadAll()">
                <option value="">{{t "events.filter.all_sources"}}</option>
              </select>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-[11px] text-zinc-400" for="ev-node">{{t "events.filter.node"}}</label>
              <select id="ev-node" class="input w-48 text-xs" onchange="loadAll()">
                <option value="">{{t "events.filter.all_nodes"}}</option>
              </select>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-[11px] text-zinc-400" for="ev-trace">{{t "events.filter.trace"}}</label>
              <input
                id="ev-trace"
                class="input mono w-48 text-xs"
                placeholder="trace_..."
                onkeydown="if(event.key==='Enter')loadAll()"
              />
            </div>

            <button
              onclick="loadAll()"
              class="btn-primary rounded-lg px-3 py-2 text-xs"
            >
              {{t "events.filter.apply"}}
            </button>
            <span id="ev-summary" class="ml-auto text-xs text-zinc-500"></span>
          </div>
          <!-- 生效中的过滤条件（来自 URL 参数时尤其需要提示，否则用户不知道
               自己为什么只看到一部分事件） -->
          <div id="ev-active" class="mt-2 hidden flex-wrap items-center gap-2 text-[11px]"></div>
        </div>

        <!-- 事件列表 -->
        <div class="reveal visible">
          <h3 class="mb-3 text-sm font-medium text-zinc-300">{{t "events.recent"}}</h3>
          <div id="ev-list" class="space-y-3">
            <div class="card rounded-2xl p-6 text-center text-sm text-zinc-500">
              {{t "events.loading"}}
            </div>
          </div>
          <!-- 分页导航：按钮由 renderNav() 按状态生成。
               放在 #ev-list **之外**——列表容器会被 replaceChildren() 整体重建，
               而且 e2e 用 #ev-list .card 数事件条数，导航混进去会被算成事件。 -->
          <div id="ev-nav" class="mt-3 flex flex-wrap items-center gap-2"></div>
        </div>

      </div>
      <div id="toast" class="toast"></div>
</div>
{{end}}

{{define "script"}}
    <script>
      const t = (k, d) => (window.AnotifyI18n && window.AnotifyI18n[k]) || d || k;

      const API = "/v1"; // 各页面各自声明（与 keys.html 一致，无全局常量）

      // 挂载「侧栏 + 顶栏」布局。
      //
      // 这一步不是可选的：不调 mountLayout 的话 #page-main 不会被装进布局，
      // 页面能渲染内容但没有侧边栏，用户点不到别的页。active 要和 NAV 里的
      // item.id 对齐（"events"），侧栏才会高亮当前项。
      Anotify.mountLayout({
        active: "events",
        title: t("events.title", "事件流"),
        subtitle: t("events.subtitle", "外部世界的变化 → 任务链 → 结果"),
      });
      let EVENTS = [];

      // ==================== 分页状态 ====================
      //
      // 服务端一次只回一页，而本页历史上一律只请求首页 → 1000 条事件里
      // 最多 100 条可达（#235）。现在按游标翻页，四份状态必须分清：
      //   PAGE_SIZE  —— 页大小，必须显式当 limit 发给服务端
      //   pageCursor —— 本页锚点（= URL 里的 ?before=），请求用它
      //   nextCursor —— 服务端回的「更旧」游标（"" ⇔ 没有更旧的行）
      //   cursorStack—— 本会话内的回退栈，「← 较新」弹它（刷新后必然为空）
      const PAGE_SIZE = 100;
      let pageCursor = "";
      let nextCursor = "";
      let cursorStack = [];

      let demoMode = false;

      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove("show"), 2400);
      }

      function fmtTime(ts) {
        if (!ts) return "—";
        const d = new Date(ts * 1000);
        if (isNaN(d.getTime())) return String(ts);
        const diff = Date.now() - d.getTime();
        if (diff < 60e3) return t("common.time.just_now", "刚刚");
        if (diff < 3600e3)
          return t("common.time.minutes_ago", "{n} 分钟前").replace("{n}", Math.floor(diff / 60e3));
        if (diff < 86400e3)
          return t("common.time.hours_ago", "{n} 小时前").replace("{n}", Math.floor(diff / 3600e3));
        return d.toISOString().slice(0, 16).replace("T", " ");
      }

      // fetchApi：全部走 Anotify.api —— 它内置了 401 → 跳登录的守卫。
      // 直接裸 fetch 会绕过守卫：401 时页面只是空白，用户不知道自己被登出了。
      // 传入 demo 值让"后端未就绪"降级成演示数据而不是抛错。
      async function fetchApi(path) {
        try {
          return await Anotify.api(path, { demo: null });
        } catch (e) {
          return null;
        }
      }

      // fetchApiResult：同 fetchApi，但把 HTTP 状态码一起带回来。
      //
      // 为什么需要：游标失效时服务端回 400（契约 §3.3「不静默降级」），
      // 页面要提示并回到最新；而网络错误 / 后端未连接只需要降级成 demoMode。
      // fetchApi 把两者都吞成 null 就分不出来了（Anotify.api 抛的 err 上带 status）。
      async function fetchApiResult(path) {
        try {
          return { data: await Anotify.api(path, { demo: null }), status: 200 };
        } catch (e) {
          return { data: null, status: (e && e.status) || 0 };
        }
      }

      // ==================== DOM 构建工具 ====================
      //
      // 全程用 createElement + textContent，**不用 innerHTML**。
      //
      // 为什么：本页的数据全部来自服务端（source/type/traceId/capability/out/summary…），
      // 而 payload 是外部 webhook 的原始 JSON，可能含任意字符串。
      // esc()+innerHTML 只要漏一处就是 XSS；createElement 结构上不可能注入，
      // 因为 textContent 永远只当文本，不会被解析成标签。
      function el(tag, className, text) {
        const n = document.createElement(tag);
        if (className) n.className = className;
        if (text != null) n.textContent = String(text);
        return n;
      }

      function code(text, className) {
        const n = el("code", "mono " + (className || ""));
        n.textContent = String(text == null ? "" : text);
        return n;
      }

      // init 先拉源和节点（用于筛选下拉和分组），再拉事件。
      //
      // 顺序有依赖：分组要知道"哪些 source 是已知的源"，
      // 否则所有事件都会落到「未归类」。
      async function init() {
        const f = readUrlFilters();

        // URL 带 ?before= 时**直接**按该游标加载：刷新 / 分享必须落在同一窗口。
        // 不能先加载首页再跳过去 —— 那会多打一次请求，还会闪一下最新的事件。
        pageCursor = f.before;

        const [srcData, nodeData] = await Promise.all([
          fetchApi(API + "/sources").catch(() => null),
          fetchApi(API + "/nodes").catch(() => null),
        ]);
        SOURCES = (srcData && srcData.sources) || [];
        NODES = (nodeData && nodeData.nodes) || [];

        fillSelects();
        if (f.source) document.getElementById("ev-source").value = f.source;
        if (f.node) document.getElementById("ev-node").value = f.node;
        if (f.trace) document.getElementById("ev-trace").value = f.trace;
        // URL 里指定的源可能已不存在（被删了），此时 select.value 设不上，
        // 会回落成"全部源"——不报错，但记住这一点免得以后困惑。

        await loadAll();
      }

      // ==================== 渲染 ====================

      // ==================== 源 / 节点 筛选 ====================
      //
      // 事件本身只有 `source`（字符串）和 `traceId`，**没有** sourceId / nodeId：
      //
      //   event ──派发──▶ task ──分配给──▶ node
      //
      // 所以按源筛选 = 用源的名字匹配 event.source
      //   （Trigger.Fire 写的是源名，见 internal/source/source.go:99；
      //     源名在 org 内 UNIQUE，够用）
      // 按节点筛选 = 先查该节点的任务拿 traceId 集合，再用集合过滤事件。
      //   后端已支持 /v1/tasks?nodeId=（console_handlers.go:96）。

      let SOURCES = [];
      let NODES = [];
      let nodeTraceIds = null; // null = 未按节点筛选；Set = 该节点相关的 trace

      // readUrlFilters 从 URL 读初始筛选条件。
      //
      // 从「源」页 / 「节点」页跳过来时带 ?source= / ?node=，
      // 用 URL 承载的好处是可分享、刷新不丢。
      function readUrlFilters() {
        const q = new URLSearchParams(location.search);
        return {
          source: q.get("source") || "",
          node: q.get("node") || "",
          trace: q.get("traceId") || "",
          // before = 当前窗口的锚点。首页不带它（刷新 / 分享靠它落回同一页）。
          before: q.get("before") || "",
        };
      }

      // fillSelects 填两个下拉：源（按名字）和节点（按名字）
      // kindLabel 把 kind 翻成用户能读的标签。
      // 类型名本身（cron/webhook/manual）是协议的词汇，展示时给个中文，
      // 但在筛选值里仍然用原名（URL 可读、和 API 一致）。
      function kindLabel(k) {
        const map = {
          cron: t("sources.kind.cron", "定时器"),
          webhook: t("sources.kind.webhook", "Webhook"),
          manual: t("sources.kind.manual", "手动"),
        };
        return map[k] || k;
      }

      // sourceKind 取某个源名对应的类型（cron / webhook / manual）。
      //
      // 事件行自己不存 kind —— 它只记 source 名字。kind 属于源的定义，
      // 所以要回查 SOURCES。源被删掉后事件还在（事件是事实），
      // 这时回查不到，返回空串（归到"未归类"）。
      function sourceKind(name) {
        const s = SOURCES.find((x) => x.name === name);
        return (s && s.kind) || "";
      }

      function fillSelects() {
        const kindSel = document.getElementById("ev-kind");
        const srcSel = document.getElementById("ev-source");

        // 源类型下拉：只列实际存在的类型，不写死三种
        const curKind = kindSel.value;
        kindSel.replaceChildren(new Option(t("events.filter.all_kinds", "全部类型"), ""));
        const kinds = [...new Set(SOURCES.map((x) => x.kind).filter(Boolean))].sort();
        for (const k of kinds) {
          kindSel.appendChild(new Option(kindLabel(k), k));
        }
        if (curKind) kindSel.value = curKind;

        const nodeSel = document.getElementById("ev-node");

        const curSrc = srcSel.value;
        srcSel.replaceChildren(new Option(t("events.filter.all_sources", "全部源"), ""));
        // 选了源类型时，"源"下拉只列该类型下的源 ——
        // 否则用户可以选出"类型=cron + 源=GitHub PR"这种必然为空的组合。
        const kindNow = kindSel.value;
        const srcPool = kindNow ? SOURCES.filter((x) => x.kind === kindNow) : SOURCES;
        for (const s of srcPool) {
          srcSel.appendChild(new Option(s.name, s.name));
        }
        if (curSrc && srcPool.some((x) => x.name === curSrc)) srcSel.value = curSrc;

        const curNode = nodeSel.value;
        nodeSel.replaceChildren(new Option(t("events.filter.all_nodes", "全部节点"), ""));
        for (const n of NODES) {
          nodeSel.appendChild(new Option(n.name, n.id));
        }
        if (curNode) nodeSel.value = curNode;
      }

      // renderActiveFilters 显示当前生效的过滤条件 + 一键清除。
      //
      // 为什么需要：从别处带参数跳进来时，用户看到"只有 3 条事件"会以为
      // 数据丢了。把过滤条件显式摆出来，并提供清除按钮。
      function renderActiveFilters() {
        const box = document.getElementById("ev-active");
        const src = document.getElementById("ev-source").value;
        const nodeSel = document.getElementById("ev-node");
        const nodeId = nodeSel.value;
        const trace = document.getElementById("ev-trace").value.trim();

        const chips = [];
        if (src) chips.push([t("events.filter.source", "源") + ": " + src, "source"]);
        if (nodeId) {
          const n = NODES.find((x) => x.id === nodeId);
          chips.push([t("events.filter.node", "节点") + ": " + (n ? n.name : nodeId), "node"]);
        }
        if (trace) chips.push(["trace: " + trace, "trace"]);

        box.replaceChildren();
        if (!chips.length) {
          box.classList.add("hidden");
          box.classList.remove("flex");
          return;
        }
        box.classList.remove("hidden");
        box.classList.add("flex");
        box.appendChild(el("span", "text-zinc-500", t("events.filter.active", "生效中") + ":"));

        for (const [label] of chips) {
          box.appendChild(el("span", "prune-chip", label));
        }
        const clear = el(
          "button",
          "btn-ghost rounded px-2 py-0.5 text-[11px]",
          t("events.filter.clear", "清除筛选"),
        );
        clear.addEventListener("click", () => {
          document.getElementById("ev-source").value = "";
          nodeSel.value = "";
          document.getElementById("ev-trace").value = "";
          nodeTraceIds = null;
          // 清掉 URL 参数，否则刷新又回来了。before 也要一起清：
          // 筛选全清了就该回到最新一页，否则会停在一个不再有筛选语义的旧窗口上。
          pageCursor = "";
          cursorStack = [];
          history.replaceState(null, "", location.pathname);
          // 只刷新事件列表：源/节点列表没变，没必要重拉
          loadAll();
        });
        box.appendChild(clear);
      }

      // ensureNodeTraces 按节点查任务，拿到该节点处理过的 trace 集合。
      //
      // 一次点击要打两个请求（tasks 再 events），所以结果缓存到 nodeTraceIds，
      // 同一个节点连续操作不重复拉。
      async function ensureNodeTraces(nodeId) {
        if (!nodeId) {
          nodeTraceIds = null;
          return;
        }
        const data = await fetchApi(
          API + "/tasks?nodeId=" + encodeURIComponent(nodeId) + "&limit=200",
        );
        const tasks = (data && data.tasks) || [];
        nodeTraceIds = new Set(tasks.map((x) => x.traceId).filter(Boolean));
      }

      // ==================== 分页导航 ====================
      //
      // 请求形态（契约 §3.4）：
      //   GET /v1/console/events?limit=100[&before=<opaque>][&traceId=<...>]
      // 游标虽然是不透明的 base64url（不含 + / =），拼 URL 前仍然 encodeURIComponent。

      // writeUrlBefore 把本页锚点写回 URL。
      //
      // 用 replaceState 而不是 pushState：翻页不应该产生浏览器历史 ——
      // 否则后退键会被页码吃掉，用户得按十几次才退得出去。
      // 只动 before 一个参数：source / node / traceId / group 语义必须保持不变。
      function writeUrlBefore(cursor) {
        const q = new URLSearchParams(location.search);
        if (cursor) q.set("before", cursor);
        else q.delete("before");
        const qs = q.toString();
        history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
      }

      // 「更旧 →」：把当前锚点压栈（首页压空串，代表“回首页”），再以
      // nextCursor 为新锚点写 URL 并加载。nextCursor == "" 时按钮本来就不渲染。
      function goOlder() {
        if (!nextCursor) return;
        cursorStack.push(pageCursor);
        pageCursor = nextCursor;
        writeUrlBefore(pageCursor);
        loadAll();
      }

      // 「← 较新」：弹栈回退。栈空时按钮不渲染，这里再兜一层防意外调用。
      // 刷新后栈必然为空 → 按钮隐藏，不报错（契约 §3.4）。
      function goNewer() {
        if (!cursorStack.length) return;
        pageCursor = cursorStack.pop();
        writeUrlBefore(pageCursor);
        loadAll();
      }

      // 「回到最新」：清掉 before 回首页，同时清空回退栈
      //（栈里全是“更旧”方向的锚点，留着会让「← 较新」指向不存在的历史）。
      function goLatest() {
        pageCursor = "";
        cursorStack = [];
        writeUrlBefore("");
        loadAll();
      }

      // renderNav 重建分页导航行：三个按钮各自按状态显隐。
      function renderNav() {
        const nav = document.getElementById("ev-nav");
        nav.replaceChildren();
        // 没有任何按钮时整块隐藏，不留一条空白的 12px 间距。
        nav.classList.toggle("hidden", true);
        if (demoMode) return; // 演示态没有真实分页，不显示任何翻页按钮

        const btns = [];
        // 有回退栈才能往回走（刷新后为空 → 隐藏）
        if (cursorStack.length) btns.push(["ev-newer", t("events.page.newer", "← 较新"), goNewer]);
        // 服务端说还有更旧的行
        if (nextCursor) btns.push(["ev-older", t("events.page.older", "更旧 →"), goOlder]);
        // URL 里有 before 才有“不在最新一页”这回事
        if (pageCursor) btns.push(["ev-latest", t("events.page.latest", "回到最新"), goLatest]);

        if (!btns.length) return;
        nav.classList.remove("hidden");
        for (const [id, label, fn] of btns) {
          const b = el("button", "btn-ghost rounded px-3 py-2 text-xs", label);
          b.id = id;
          b.addEventListener("click", fn);
          nav.appendChild(b);
        }
      }

      async function loadAll() {
        // 每次加载前重填下拉：「源类型」变了以后，「源」下拉必须跟着只列
        // 该类型下的源。只调一次 init 的话，用户切类型后源下拉还是旧的
        // 全集，能选出「类型=cron + 源=GitHub PR」这种必然为空的组合。
        fillSelects();

        const trace = document.getElementById("ev-trace").value.trim();
        const nodeId = document.getElementById("ev-node").value;
        try {
          await ensureNodeTraces(nodeId);
        } catch (e) {
          nodeTraceIds = null;
        }
        // limit 必须显式带上：不传时页大小由服务端默认值决定，页面就不可控。
        let qs = "?limit=" + PAGE_SIZE;
        if (pageCursor) qs += "&before=" + encodeURIComponent(pageCursor);
        if (trace) qs += "&traceId=" + encodeURIComponent(trace);
        // 走**控制台**端点（会话 Cookie 鉴权）。
        // 机器入口的 GET /v1/events 要 Bearer API Key + notify:send scope，
        // 浏览器页面拿不到也拿不对这个凭据。
        const r = await fetchApiResult(API + "/console/events" + qs);

        // 游标失效（400 “invalid before cursor”）：提示 + 清掉 before 回最新。
        // 不会死循环：goLatest() 会把 pageCursor 清空，而本分支要求
        // pageCursor 非空才会进，所以重载后的那次请求不可能再走到这里。
        if (r.status === 400 && pageCursor) {
          toast(t("events.page.invalid_cursor", "游标已失效，已回到最新"));
          goLatest();
          return;
        }

        if (r.data) {
          // 一页一次：**替换** EVENTS 而不是累加 —— 累加会让每页条数失控，
          // 也会让「本页 N 条」的语义变成“已加载 N 条”。
          EVENTS = r.data.events || [];
          nextCursor = r.data.nextCursor || "";
          demoMode = false;
        } else {
          // 后端未连接 / 其它 HTTP 失败：降级成演示态，不白屏、不抛未捕获异常。
          EVENTS = [];
          nextCursor = "";
          demoMode = true;
        }
        renderList();
        renderNav();
      }

      // renderSummary 写摘要行：本页条数 + 是否已到最旧 + 演示徽章。
      //
      // 用「本页 N 条」而不是原来的「N 条事件」：翻页后 EVENTS 只是一页，
      // 说“共 N 条”会误导（1000 条事件的第 3 页也只会显示 100 条）。
      function renderSummary() {
        const summary = document.getElementById("ev-summary");
        if (demoMode) {
          // 演示态保持原有徽章语义（后端未连接 ≠ 零条事件）
          summary.textContent = t("events.demo_badge", "演示模式：后端未连接");
          return;
        }
        let text = t("events.page.window", "本页 {n} 条").replace("{n}", EVENTS.length);
        // nextCursor == "" ⇔ 服务端说没有更旧的行了
        if (!nextCursor) text += " · " + t("events.page.end", "已到最旧");
        summary.textContent = text;
      }

      // renderList 用纯 DOM 重建事件列表。
      function renderList() {
        const list = document.getElementById("ev-list");
        renderSummary();

        list.replaceChildren();

        if (!EVENTS.length) {
          const empty = el(
            "div",
            "card rounded-2xl p-6 text-center text-sm text-zinc-500",
            demoMode
              ? t("events.demo_hint", "后端未连接，暂无真实事件。")
              : t("events.empty", "还没有事件。用 POST /v1/events 提交第一个。"),
          );
          list.appendChild(empty);
          return;
        }

        // 过滤：源类型 → 源 → 节点
        const kindFilter = document.getElementById("ev-kind").value;
        const srcFilter = document.getElementById("ev-source").value;

        let visible = EVENTS;
        if (nodeTraceIds) {
          visible = visible.filter((e) => nodeTraceIds.has(e.traceId));
        }
        if (kindFilter) {
          visible = visible.filter((e) => sourceKind(e.source) === kindFilter);
        }
        if (srcFilter) {
          visible = visible.filter((e) => e.source === srcFilter);
        }

        if (!visible.length) {
          // 已翻页窗外 + 有客户端筛选 → 提示还能继续向更旧翻页或回最新；
          // 首页（无 before）时保持原文案不变。
          const pagedAway = !!pageCursor;
          const filtered = !!(nodeTraceIds || kindFilter || srcFilter);
          list.appendChild(
            el(
              "div",
              "card rounded-2xl p-6 text-center text-sm text-zinc-500",
              pagedAway && filtered
                ? t("events.page.no_match", "当前页没有匹配项，可继续向更旧翻页或回到最新")
                : t("events.filter.empty", "当前筛选条件下没有事件。"),
            ),
          );
          renderActiveFilters();
          return;
        }

        // ===== 默认视图：按时间倒序平铺 =====
        //
        // 事件流的第一性问题是"刚刚发生了什么"，所以默认必须是最新的在最上面。
        // 之前默认按源分组，代价是：一个刚触发的事件可能被压在某组第 6 条后面
        // （展开才看得见），用户以为没收到。
        //
        // 分组仍然有用（"今晚定时任务跑了吗"），所以留成可选项，
        // 通过 URL ?group=1 切过来。
        const grouped = new URLSearchParams(location.search).get("group") === "1";

        // 统一按 createdAt 倒序。**必须显式排序**：后端按 id/插入顺序返回，
        // 和事件时间不一定同序（补录、幂等重投都会打乱）。
        const ordered = [...visible].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        if (!grouped) {
          for (const e of ordered) list.appendChild(eventCard(e));
          renderActiveFilters();
          return;
        }

        // ===== 可选视图：按源分组 =====
        const bySource = new Map();
        const knownNames = new Set(SOURCES.map((x) => x.name));
        for (const e of ordered) {
          const key = knownNames.has(e.source) ? e.source : "__other__";
          if (!bySource.has(key)) bySource.set(key, []);
          bySource.get(key).push(e);
        }

        // 已知源按"最近一次触发"倒序，未归类永远排最后
        const groups = [...bySource.keys()]
          .filter((k) => k !== "__other__")
          .sort((a, b) => {
            const ta = Math.max(...bySource.get(a).map((e) => e.createdAt || 0));
            const tb = Math.max(...bySource.get(b).map((e) => e.createdAt || 0));
            return tb - ta;
          });
        if (bySource.has("__other__")) groups.push("__other__");

        for (const key of groups) {
          const evs = bySource.get(key);
          const isOther = key === "__other__";
          const srcObj = isOther ? null : SOURCES.find((x) => x.name === key);

          const group = el("div", "ev-group");

          // 组头
          const head = el("div", "ev-group-head");
          const title = el("div", "flex flex-wrap items-center gap-2 min-w-0");
          title.appendChild(
            el("span", "text-[13px] text-zinc-200", isOther ? t("events.group.other", "未归类") : key),
          );
          if (srcObj) {
            title.appendChild(el("span", "out-chip", srcObj.kind));
            if (srcObj.enabled === false) {
              title.appendChild(el("span", "prune-chip", t("sources.disabled", "已停用")));
            }
          }
          head.appendChild(title);

          const meta = el("div", "text-[11px] text-zinc-500 whitespace-nowrap");
          const latest = Math.max(...evs.map((e) => e.createdAt || 0));
          meta.textContent =
            t("events.group.count", "{n} 条").replace("{n}", evs.length) +
            " · " +
            fmtTime(latest);
          head.appendChild(meta);
          group.appendChild(head);

          // 组内事件（默认最多 5 条，多的折叠）
          const PAGE = 5;
          const shown = evs.slice(0, PAGE);
          for (const e of shown) group.appendChild(eventCard(e));

          if (evs.length > PAGE) {
            const more = el(
              "button",
              "btn-ghost mt-1 rounded px-2 py-1 text-[11px]",
              t("events.group.more", "展开其余 {n} 条").replace("{n}", evs.length - PAGE),
            );
            more.addEventListener("click", () => {
              // 插在 more 按钮**之前**（也就是 group 内的末尾），
              // 不能插到 group 后面——那会让这些卡片跑到分组外面去，
              // 视觉上脱离所属的源。
              for (let i = PAGE; i < evs.length; i++) {
                group.insertBefore(eventCard(evs[i]), more);
              }
              more.remove();
            });
            group.appendChild(more);
          }

          list.appendChild(group);
        }

        renderActiveFilters();
      }

      // eventCard 渲染一条事件。
      function eventCard(e) {
        const card = el(
          "div",
          "card rounded-2xl p-4 hover:border-white/20 transition cursor-pointer",
        );
        // 点卡片 → 独立 trace 页。
        //
        // 原来是"在同一页下面展开链路"，问题有三个：
        //   ① 链路很长时，展开后要滚很远，事件列表就看不到了
        //   ② URL 不变，没法把"这条链路"发给别人
        //   ③ 刷新就丢了
        // 拆成独立页后 traceId 在 URL 里，可以收藏、分享、后退。
        card.addEventListener("click", () => {
          location.href = "trace.html?traceId=" + encodeURIComponent(e.traceId);
        });

        const row = el("div", "ev-row");
        const left = el("div", "min-w-0");

        const head = el("div", "flex flex-wrap items-center gap-2");
        head.appendChild(
          code(e.source, "rounded bg-white/5 px-1.5 py-0.5 text-[11px] text-indigo-300"),
        );
        head.appendChild(el("span", "text-zinc-500", "→"));
        head.appendChild(code(e.type, "text-[12px] text-zinc-200"));
        left.appendChild(head);

        left.appendChild(el("div", "mt-1.5 mono truncate text-[11px] text-zinc-500", e.traceId));

        const right = el("div", "text-right text-[11px] text-zinc-500 whitespace-nowrap");
        right.appendChild(el("div", "", fmtTime(e.createdAt)));
        right.appendChild(
          el("div", "mt-1 text-indigo-400", t("events.view_chain", "查看链路") + " →"),
        );

        row.appendChild(left);
        row.appendChild(right);
        card.appendChild(row);
        return card;
      }

      // 演示数据：后端未连接时给一个可看的样例，避免空白页。
      function demoEvents() {
        return [
          {
            id: "evt_demo",
            source: "github",
            type: "pull_request.opened",
            traceId: "trace_demo_0001",
            createdAt: Math.floor(Date.now() / 1000) - 120,
          },
        ];
      }

      // 不需要显式 requireAuth：fetchApi 走 Anotify.api，
      // 未登录时它自己会把用户送到 login.html?next=events.html。
      document.addEventListener("DOMContentLoaded", init);
    </script>
{{end}}
