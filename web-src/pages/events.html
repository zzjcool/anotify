{{define "title"}}{{t "events.title"}}{{end}}
{{define "style"}}
<style>
  /* ---------- 事件流（EV-1/EV-2/EV-3）----------
     旧实现每条事件一张 .card：5 张卡 4 条事件，卡内 2 列字段 + 右侧一个孤立数字，
     页面又长又稀。现在是一个 .card 容器 + 紧凑行（每行 = 头部 chips + 字段网格 +
     可折叠明细），字段一律同权重。
     注意：行元素必须保留 .card 类与 data-uid —— scripts/e2e/suites/events_paging.mjs
     用 `#ev-list .card[data-uid]` 数行、f3-observability 用 `#ev-list article` 等分页；
     所以 .card 只作锚点，视觉外壳由下面这条规则显式清零。 */
  .ev-list {
    display: block;
    overflow: hidden;
  }
  .ev-row {
    display: block;
    padding: 12px 16px;
    background: transparent;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .ev-row + .ev-row {
    border-top: 1px solid var(--line);
  }
  /* 头部是两列网格而不是 flex-wrap：不管 chips 多长，「查看链路」永远在同一条
     头部的右上角（flex + margin-left:auto 时它会按剩余空间时左时右，逐行不齐）。 */
  .ev-row-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .ev-chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  /* 类型 chip 与 severity chip 同一枚 chip：同高/同圆角/同字号，只有强调色不同。 */
  .ev-chip {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: var(--r-full);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11px;
    line-height: 1;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 变体是独立类（见 index.html 同名注释：复合选择器会被死类守卫误判）。 */
  .ev-mono {
    font-family: var(--font-mono);
  }
  .ev-warn {
    border-color: color-mix(in srgb, var(--warn) 32%, transparent);
    background: var(--warn-soft);
    color: var(--warn);
  }
  .ev-reason {
    min-width: 0;
    font-size: 11px;
    color: var(--faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ev-row-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  /* 字段网格：6 个字段同权重（label 11px faint / value 12.5px text）。
     列宽按容器断点走，不用 auto-fit —— uid 这类 20+ 字的 mono 值必须整行放得下，
     否则「事件 UID」列会被拉成两行。窄屏 1 列 / 中屏 2 列 / 宽屏 3 列两行。 */
  .ev-facts {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 8px 16px;
    margin: 10px 0 0;
  }
  @media (min-width: 640px) {
    .ev-facts {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (min-width: 900px) {
    .ev-facts {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
  }
  .ev-fact {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .ev-fact-key {
    font-size: 11px;
    line-height: 1.3;
    color: var(--faint);
  }
  .ev-fact-val {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .ev-details {
    margin-top: 8px;
  }
  .ev-details > summary {
    font-size: 12px;
    color: var(--faint);
    cursor: pointer;
  }
  .ev-details > summary:hover {
    color: var(--muted);
  }
  .ev-details-body {
    display: grid;
    gap: 8px;
    margin-top: 8px;
  }
  .ev-raw {
    margin: 0;
    max-height: 18rem;
    font-size: 11px;
  }

  /* ---------- 筛选栏（EV-3）：不再固定 w-48 ---------- */
  .ev-filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(10.5rem, 100%), 1fr));
    align-items: end;
    gap: 12px;
  }
  .ev-filters-actions {
    display: flex;
    align-items: end;
  }
  .ev-filters-actions > .btn {
    width: 100%;
  }
  @media (min-width: 900px) {
    /* 宽屏一行排满：4 个控件等分 + 按钮吃自身宽度，右侧不留大片空白 */
    .ev-filters {
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
    }
    .ev-filters-actions > .btn {
      width: auto;
    }
  }

  /* ---------- 首屏骨架（AN-3 / ST-8）----------
     加载中不再复用 .empty（那是「真的没有数据」的语义）：骨架条直接画成
     数据行的盒子形状，高度一致，数据到达时不跳。 */
  .ev-skel-row {
    display: grid;
    grid-template-columns: 7rem minmax(0, 1fr) minmax(0, 1fr);
    align-items: center;
    gap: 8px 16px;
    padding: 12px 16px;
  }
  .ev-skel-row + .ev-skel-row {
    border-top: 1px solid var(--line);
  }
  .ev-skel-row > .skeleton:nth-child(1) {
    height: 20px;
  }
  .ev-skel-row > .skeleton:nth-child(2),
  .ev-skel-row > .skeleton:nth-child(3) {
    height: 12px;
  }
  .ev-skel-row > .skeleton:nth-child(3) {
    width: 62%;
  }
  @media (max-width: 639px) {
    .ev-skel-row {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .ev-pager {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
</style>
{{end}}
{{define "content"}}
<div id="page-main">
  <div class="page">
    <div class="page-head">
      <div>
        <h2 class="page-title font-display">{{t "events.title"}}</h2>
        <p class="page-sub">{{t "events.v4.dedup"}}</p>
      </div>
      <button id="ev-refresh" class="btn btn-ghost" type="button">{{t "events.v4.refresh"}}</button>
    </div>
    <form id="ev-filters" class="card card-pad ev-filters">
      <div class="field">
        <label class="field-label" for="ev-namespace">{{t "events.v4.namespace"}}</label>
        <select id="ev-namespace" class="select"></select>
      </div>
      <div class="field">
        <label class="field-label" for="ev-source">{{t "events.v4.source"}}</label>
        <input id="ev-source" class="input" autocomplete="off" />
      </div>
      <div class="field">
        <label class="field-label" for="ev-trace">Trace UID</label>
        <input id="ev-trace" class="input" autocomplete="off" />
      </div>
      <div class="field">
        <label class="field-label" for="ev-limit">{{t "events.v4.limit"}}</label>
        <select id="ev-limit" class="select">
          <option value="2">2</option>
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
        </select>
      </div>
      <div class="ev-filters-actions">
        <button id="ev-filter" class="btn btn-primary" type="submit">{{t "events.v4.filter"}}</button>
      </div>
    </form>
    <div id="ev-error" role="status"></div>
    <div id="ev-list" class="card ev-list" aria-live="polite" aria-busy="true">
      <!-- 首屏骨架：data 到达前就画出「行」的形状（ST-8：加载中不再复用 .empty） -->
      <div class="ev-skel-row" aria-hidden="true">
        <span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span>
      </div>
      <div class="ev-skel-row" aria-hidden="true">
        <span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span>
      </div>
      <div class="ev-skel-row" aria-hidden="true">
        <span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span>
      </div>
      <div class="ev-skel-row" aria-hidden="true">
        <span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span>
      </div>
    </div>
    <div class="ev-pager">
      <span id="ev-count" class="card-sub"></span>
      <button id="ev-more" class="btn btn-ghost" type="button" disabled>{{t "events.v4.more"}}</button>
    </div>
  </div>
</div>
{{end}}
{{define "script"}}
<script>
  (function () {
    "use strict";
    const A = window.Anotify;
    const { el, api, ready, readScope, saveScope, model, t, copyText, loadErrorNode } = A;
    const query = new URLSearchParams(location.search);
    if (query.get("namespace")) saveScope({ namespace: query.get("namespace") });
    A.mountLayout({ active: "events", title: t("events.title") });
    const node = id => document.getElementById(id);
    const list = node("ev-list");
    let rows = new Map();
    let continuation = "";
    let generation = 0;
    let filters = { source: "", traceId: "", limit: "20" };
    let busy = false;

    function requestPath(token) {
      const params = new URLSearchParams({ namespace: readScope().namespace, limit: filters.limit });
      if (filters.source) params.set("source", filters.source);
      if (filters.traceId) params.set("traceId", filters.traceId);
      if (token) params.set("continue", token);
      return "/v1/console/events?" + params;
    }

    /* 一个字段 = label + value，两者同一种盒模型；所有字段（含「已派发任务数」）
     * 走同一个函数，权重天然一致。 */
    function fact(label, value, opts) {
      const box = el("div", { class: "ev-fact" });
      const dd = el("dd", { class: "ev-fact-val mono", text: value == null ? "—" : String(value) });
      /* #374 验收 ②：内部标识也能一键取走（与 trace / message 的原始 JSON 复制按钮同一语言）。 */
      if (opts && opts.copyable) {
        const copy = el("button", { type: "button", class: "copy-btn", text: t("uxaudit.dev.copy") });
        copy.addEventListener("click", () => copyText(copy, () => (value == null ? "" : String(value))));
        dd.append(" ", copy);
      }
      box.append(el("dt", { class: "ev-fact-key", text: label }), dd);
      return box;
    }

    /* 首屏/刷新期的骨架行（与静态首帧同一套盒子：3 条占位，62px 内）。 */
    function skeletonRows(count) {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const row = el("div", { class: "ev-skel-row", "aria-hidden": "true" });
        row.append(el("span", { class: "skeleton" }), el("span", { class: "skeleton" }), el("span", { class: "skeleton" }));
        frag.append(row);
      }
      return frag;
    }

    function eventRow(resource) {
      const event = model.event(resource);
      const row = el("article", { class: "card ev-row", "data-uid": event.uid });
      const chips = el("div", { class: "ev-chips" },
        el("span", { class: "ev-chip ev-mono", text: event.eventType || "—" }),
        el("span", { class: event.type === "Warning" ? "ev-chip ev-warn" : "ev-chip", text: event.type }),
        event.reason ? el("span", { class: "ev-reason", text: event.reason }) : null,
      );
      const head = el("div", { class: "ev-row-head" }, chips);
      if (event.traceUID) {
        const actions = el("div", { class: "ev-row-actions" });
        actions.append(el("a", { class: "btn btn-ghost btn-sm",
          href: "trace.html?namespace=" + encodeURIComponent(event.namespace) + "&traceUID=" + encodeURIComponent(event.traceUID),
          text: t("events.v4.trace") }));
        head.append(actions);
      }
      /* #374：首屏只留一个对外「事件 ID」（= metadata.uid，页面与链路/任务的链接锚点）；
         deliveryId 是投递层内部标识，进「明细」折叠（与 signature/payload 同一处）。
         注：v4 的 `/v1/console/events` 信封里没有 dispatched（只有 status.pruned），
         所以不再把「已派发任务数 0」当成首屏事实（那是永远为 0 的假事实）。 */
      const facts = el("dl", { class: "ev-facts" },
        fact(t("uxaudit.dev.event_id"), event.uid),
        fact("Trace UID", event.traceUID), fact(t("events.v4.source"), event.involvedObject?.name),
        fact(t("events.v4.received"), event.creationTimestamp));
      const details = el("details", { class: "ev-details" },
        el("summary", null, t("events.v4.details")));
      const dispatched = el("div", { class: "ev-details-body" },
        el("dl", { class: "ev-facts" }, fact("deliveryId", event.deliveryId, { copyable: true })));
      event.dispatched.forEach(task => dispatched.append(el("code", { class: "mono ev-fact-val", text: JSON.stringify(task) })));
      details.append(dispatched, el("div", { class: "code-block" },
        el("div", { class: "code-head" }, el("span", { text: "JSON" })),
        el("pre", { class: "code-body mono ev-raw" }, el("span", {
          "data-raw-content": "",
          text: JSON.stringify({ pruned: event.pruned, signature: event.signature, payload: event.payload }, null, 2),
        }))));
      row.append(head, facts, details);
      return row;
    }

    function render() {
      const ordered = [...rows.values()].sort((a, b) => String(b.metadata.creationTimestamp).localeCompare(String(a.metadata.creationTimestamp)));
      list.replaceChildren(...ordered.map(eventRow));
      list.classList.toggle("anim-stagger", ordered.length > 0);
      if (!ordered.length) list.append(el("div", { class: "empty", text: t("events.v4.empty") }));
      node("ev-count").textContent = t("events.v4.count").replace("{n}", ordered.length);
      node("ev-more").disabled = busy || !continuation;
    }

    async function load(mode = "refresh") {
      const current = generation;
      const namespace = readScope().namespace;
      busy = true;
      list.setAttribute("aria-busy", "true");
      node("ev-refresh").disabled = true;
      node("ev-more").disabled = true;
      node("ev-error").replaceChildren();
      try {
        await ready();
        const doc = await api(requestPath(mode === "more" ? continuation : ""));
        if (current !== generation || namespace !== readScope().namespace) return;
        // `metadata.continue` 是**可选**的（api/events.yaml：只在还有更旧一页时出现，
        // 末页直接省略）。缺省 = 没有下一页，不是畸形响应。
        if (doc.kind !== "EventList" || !Array.isArray(doc.items) || !doc.metadata) throw new Error("malformed EventList");
        if (doc.metadata.continue != null && typeof doc.metadata.continue !== "string") throw new Error("malformed EventList continue");
        for (const event of doc.items) {
          if (!event.metadata?.uid || event.metadata.namespace !== namespace) throw new Error("invalid Event identity/scope");
          rows.set(event.metadata.uid, event);
        }
        if (mode !== "refresh" || !continuation) continuation = doc.metadata.continue || "";
        render();
      } catch (error) {
        if (current === generation) {
          node("ev-error").replaceChildren(loadErrorNode(error, () => load(mode)));
          if (!rows.size) list.replaceChildren();
        }
      } finally {
        if (current === generation) {
          busy = false;
          list.removeAttribute("aria-busy");
          node("ev-refresh").disabled = false;
          node("ev-more").disabled = !continuation;
        }
      }
    }

    function reset() {
      generation++;
      rows = new Map();
      continuation = "";
      filters = { source: node("ev-source").value.trim(), traceId: node("ev-trace").value.trim(), limit: node("ev-limit").value };
      // 加载中 = 骨架（不是 .empty：那是「真的一条都没有」的语义，ST-8）
      list.replaceChildren(skeletonRows(4));
      return load("reset");
    }
    node("ev-filters").addEventListener("submit", event => { event.preventDefault(); reset(); });
    node("ev-namespace").addEventListener("change", () => {
      saveScope({ namespace: node("ev-namespace").value });
      reset();
    });
    node("ev-more").addEventListener("click", () => { if (!busy) load("more"); });
    node("ev-refresh").addEventListener("click", () => { if (!busy) load(); });
    A.mountPullRefresh(() => load());
    async function start() {
      try {
        await ready();
        const doc = await api("/v1/namespaces");
        if (!Array.isArray(doc.items)) throw new Error("malformed NamespaceList");
        node("ev-namespace").replaceChildren(...doc.items.map(resource => el("option", {
          value: resource.metadata.name, text: resource.metadata.name,
        })));
        node("ev-namespace").value = readScope().namespace;
        await reset();
      } catch (error) {
        list.removeAttribute("aria-busy");
        node("ev-error").replaceChildren(loadErrorNode(error, start));
      }
    }
    start();
  })();
</script>
{{end}}
