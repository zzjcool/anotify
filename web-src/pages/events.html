{{define "title"}}{{t "events.title"}}{{end}}
{{define "content"}}
<div id="page-main">
  <div class="page">
    <div class="page-head">
      <div>
        <h2 class="page-title font-display">{{t "events.title"}}</h2>
        <p class="page-sub">{{t "events.v4.dedup"}}</p>
      </div>
      <button id="ev-refresh" class="btn btn-ghost" type="button">{{t "events.v4.refresh"}}</button>
    </div>
    <form id="ev-filters" class="card card-pad flex flex-wrap items-end gap-4">
      <label class="field-label">{{t "events.v4.namespace"}}
        <select id="ev-namespace" class="input"></select>
      </label>
      <label class="field-label">{{t "events.v4.source"}}
        <input id="ev-source" class="input" autocomplete="off" />
      </label>
      <label class="field-label">Trace UID
        <input id="ev-trace" class="input" autocomplete="off" />
      </label>
      <label class="field-label">{{t "events.v4.limit"}}
        <select id="ev-limit" class="input">
          <option value="2">2</option>
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
        </select>
      </label>
      <button id="ev-filter" class="btn btn-primary" type="submit">{{t "events.v4.filter"}}</button>
    </form>
    <div id="ev-error" role="status"></div>
    <div id="ev-list" class="grid gap-4" aria-live="polite" aria-busy="true">
      <div class="empty">{{t "events.v4.loading"}}</div>
    </div>
    <div class="flex items-center justify-between gap-4">
      <span id="ev-count" class="card-sub"></span>
      <button id="ev-more" class="btn btn-ghost" type="button" disabled>{{t "events.v4.more"}}</button>
    </div>
  </div>
</div>
{{end}}
{{define "script"}}
<script>
  (function () {
    "use strict";
    const A = window.Anotify;
    const { el, api, ready, readScope, saveScope, model, t, loadErrorNode } = A;
    const query = new URLSearchParams(location.search);
    if (query.get("namespace")) saveScope({ namespace: query.get("namespace") });
    A.mountLayout({ active: "events", title: t("events.title") });
    const node = id => document.getElementById(id);
    const list = node("ev-list");
    let rows = new Map();
    let continuation = "";
    let generation = 0;
    let filters = { source: "", traceId: "", limit: "20" };
    let busy = false;

    function requestPath(token) {
      const params = new URLSearchParams({ namespace: readScope().namespace, limit: filters.limit });
      if (filters.source) params.set("source", filters.source);
      if (filters.traceId) params.set("traceId", filters.traceId);
      if (token) params.set("continue", token);
      return "/v1/console/events?" + params;
    }

    function field(label, value) {
      return el("div", {}, el("dt", { class: "card-sub", text: label }),
        el("dd", { class: "mono b2-wrap", text: value == null ? "—" : String(value) }));
    }

    function eventRow(resource) {
      const event = model.event(resource);
      const card = el("article", { class: "card card-pad grid gap-4", "data-uid": event.uid });
      const head = el("div", { class: "flex flex-wrap items-center gap-2" },
        el("code", { class: "mono", text: event.eventType || "—" }),
        el("span", { class: event.type === "Warning" ? "badge badge-warn" : "badge badge-neutral", text: event.type }),
        el("span", { class: "card-sub", text: event.reason }));
      if (event.traceUID) head.append(el("a", { class: "btn btn-ghost btn-sm",
        href: "trace.html?namespace=" + encodeURIComponent(event.namespace) + "&traceUID=" + encodeURIComponent(event.traceUID),
        text: t("events.v4.trace") }));
      const facts = el("dl", { class: "grid b2-facts gap-4" },
        field(t("events.v4.event_uid"), event.uid), field("deliveryId", event.deliveryId),
        field("Trace UID", event.traceUID), field(t("events.v4.source"), event.involvedObject?.name),
        field(t("events.v4.received"), event.creationTimestamp), field(t("events.v4.dispatched"), event.dispatched.length));
      const details = el("details", {}, el("summary", { class: "card-sub", text: t("events.v4.details") }));
      const dispatched = el("div", { class: "grid gap-2" });
      event.dispatched.forEach(task => dispatched.append(el("code", { class: "mono b2-wrap", text: JSON.stringify(task) })));
      details.append(dispatched, el("pre", {
        class: "code-body overflow-x-auto",
      }, el("span", {
        "data-raw-content": "",
        text: JSON.stringify({ pruned: event.pruned, signature: event.signature, payload: event.payload }, null, 2),
      })));
      card.append(head, facts, details);
      return card;
    }

    function render() {
      const ordered = [...rows.values()].sort((a, b) => String(b.metadata.creationTimestamp).localeCompare(String(a.metadata.creationTimestamp)));
      list.replaceChildren(...ordered.map(eventRow));
      if (!ordered.length) list.append(el("div", { class: "empty", text: t("events.v4.empty") }));
      node("ev-count").textContent = t("events.v4.count").replace("{n}", ordered.length);
      node("ev-more").disabled = busy || !continuation;
    }

    async function load(mode = "refresh") {
      const current = generation;
      const namespace = readScope().namespace;
      busy = true;
      list.setAttribute("aria-busy", "true");
      node("ev-refresh").disabled = true;
      node("ev-more").disabled = true;
      node("ev-error").replaceChildren();
      try {
        await ready();
        const doc = await api(requestPath(mode === "more" ? continuation : ""));
        if (current !== generation || namespace !== readScope().namespace) return;
        // `metadata.continue` 是**可选**的（api/events.yaml：只在还有更旧一页时出现，
        // 末页直接省略）。缺省 = 没有下一页，不是畸形响应。
        if (doc.kind !== "EventList" || !Array.isArray(doc.items) || !doc.metadata) throw new Error("malformed EventList");
        if (doc.metadata.continue != null && typeof doc.metadata.continue !== "string") throw new Error("malformed EventList continue");
        for (const event of doc.items) {
          if (!event.metadata?.uid || event.metadata.namespace !== namespace) throw new Error("invalid Event identity/scope");
          rows.set(event.metadata.uid, event);
        }
        if (mode !== "refresh" || !continuation) continuation = doc.metadata.continue || "";
        render();
      } catch (error) {
        if (current === generation) {
          node("ev-error").replaceChildren(loadErrorNode(error, () => load(mode)));
          if (!rows.size) list.replaceChildren();
        }
      } finally {
        if (current === generation) {
          busy = false;
          list.removeAttribute("aria-busy");
          node("ev-refresh").disabled = false;
          node("ev-more").disabled = !continuation;
        }
      }
    }

    function reset() {
      generation++;
      rows = new Map();
      continuation = "";
      filters = { source: node("ev-source").value.trim(), traceId: node("ev-trace").value.trim(), limit: node("ev-limit").value };
      list.replaceChildren(el("div", { class: "empty", text: t("events.v4.loading") }));
      return load("reset");
    }
    node("ev-filters").addEventListener("submit", event => { event.preventDefault(); reset(); });
    node("ev-namespace").addEventListener("change", () => {
      saveScope({ namespace: node("ev-namespace").value });
      reset();
    });
    node("ev-more").addEventListener("click", () => { if (!busy) load("more"); });
    node("ev-refresh").addEventListener("click", () => { if (!busy) load(); });
    A.mountPullRefresh(() => load());
    async function start() {
      try {
        await ready();
        const doc = await api("/v1/namespaces");
        if (!Array.isArray(doc.items)) throw new Error("malformed NamespaceList");
        node("ev-namespace").replaceChildren(...doc.items.map(resource => el("option", {
          value: resource.metadata.name, text: resource.metadata.name,
        })));
        node("ev-namespace").value = readScope().namespace;
        await reset();
      } catch (error) {
        list.removeAttribute("aria-busy");
        node("ev-error").replaceChildren(loadErrorNode(error, start));
      }
    }
    start();
  })();
</script>
{{end}}
