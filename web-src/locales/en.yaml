  ws:
    title: Long-poll receiving · for plugins and any device
    desc: Any device / plugin with a notify:receive API Key can establish a WebSocket long-poll for real-time push. Great for desktop widgets, CLI daemons, smart-home bridges. Runs alongside browser push.
    connection_method: Connection
    copy: Copy
    active_title: Active connections
    active_subtitle: Currently established WebSocket connections
    online: ' online'
    empty_hint: Once the backend is connected, live connections will appear here (name / Key prefix / uptime / tags / last message).
  tags:
    title: Tag routing · which device gets which notification
    desc: Include deviceTags when reporting. Only devices with overlapping tags (or no tags = catch-all) will receive it. No tags on the notification = broadcast to all enabled devices; no tags on a device
      = receives everything.
  pair:
    title: Add this device
    subtitle: After subscribing, this browser will receive push notifications
    device_name: Device name
    device_placeholder: e.g. Primary phone / Office Mac
    submit: Request permission and subscribe
    hint: The browser will ask for notification permission. iOS requires adding this site to the Home Screen first, then opening it as a standalone app.
