receivers:
  title: "Receivers"
  demo_badge: "Demo data"
  channel:
    push: "Push subscriptions"
    ws: "WebSocket connections"
  push:
    title: "Browser push subscriptions"
    subtitle_prefix: "Delivered via system Push services (APNs / FCM). "
    subtitle_highlight: "Receives even when the browser is closed."
    subtitle_suffix: ""
    add_device: "Add this device"
  ws:
    title: "Long-poll receiving · for plugins and any device"
    desc: >-
      Any device / plugin with a notify:receive API Key can establish
      a WebSocket long-poll for real-time push. Great for desktop
      widgets, CLI daemons, smart-home bridges. Runs alongside browser
      push.
    connection_method: "Connection"
    copy: "Copy"
    active_title: "Active connections"
    active_subtitle: "Currently established WebSocket connections"
    online: " online"
    empty_hint: >-
      Once the backend is connected, live connections will appear here
      (name / Key prefix / uptime / tags / last message).
  tags:
    title: "Tag routing · which device gets which notification"
    desc: >-
      Include deviceTags when reporting. Only devices with overlapping
      tags (or no tags = catch-all) will receive it. No tags on the
      notification = broadcast to all enabled devices; no tags on a
      device = receives everything.
  pair:
    title: "Add this device"
    subtitle: "After subscribing, this browser will receive push notifications"
    device_name: "Device name"
    device_placeholder: "e.g. Primary phone / Office Mac"
    submit: "Request permission and subscribe"
    hint: >-
      The browser will ask for notification permission. iOS requires
      adding this site to the Home Screen first, then opening it as a
      standalone app.

keys:
  title: "API Keys"
  subtitle: "Agents use them to report notifications"
  desc_prefix: "Agents carry a Key to call"
  desc_suffix: >-
    to report notifications. The Key is shown in full only once at
    creation; the server stores only a hash — save it immediately.
  create_button: "New Key"
  api_endpoint: "Reporting endpoint"
  view_docs: "View full API docs"
  header_label: "Header"
  my_keys: "My Keys"
  col:
    name: "Name"
    prefix: "Key prefix"
    scope: "Scopes"
    last_used: "Last used"
    status: "Status"
    actions: "Actions"
  security:
    title: "Key security best practices"
    point1_prefix: "Key plaintext is "
    point1_highlight: "shown only once at creation"
    point1_suffix: "; it cannot be viewed again, only regenerated"
    point2_prefix: "Server stores only "
    point2_highlight: "argon2id hash"
    point2_suffix: "; even a DB leak cannot recover the Key"
    point3_prefix: "Use "
    point3_highlight: "one Key per Agent / environment"
    point3_suffix: "; revoke only the affected one on leak"
    point4: >-
      Never commit Keys to version control; inject via env vars or
      a secrets manager
  create:
    title: "New API Key"
    subtitle: "Give it a name and choose its scopes"
    name_label: "Name"
    name_placeholder: "e.g. Local dev / CI pipeline / Production Agent"
    scope_label: "Scopes (multi-select, least-privilege)"
    scope_send_label: "Send"
    scope_send_desc: "For Agents / CI to POST notifications. Prefix ant_live_"
    scope_receive_label: "Receive"
    scope_receive_desc: >-
      For plugins / devices to establish WebSocket connections.
      Prefix ant_recv_
    scope_read_label: "Device read"
    scope_read_desc: "Read-only device listing for script inspection"
    scope_hint: >-
      Least privilege: send and receive are separate, so a leaked
      Key only affects one side.
    cancel: "Cancel"
    generate: "Generate Key"
  save:
    title: "Save your Key"
    subtitle_prefix: "This is its "
    subtitle_highlight: "only full display"
    copy: "Copy"
    warning: >-
      Once closed, the full Key cannot be viewed again. Save it to a
      password manager or secure location immediately.
    done: "I've saved it"

security:
  title: "Security & Login"
  subtitle: "Passkey · Sessions · Recovery codes"
  intro: >-
    Manage everything about who you are: Passkey credentials,
    login sessions, and recovery codes. These are separate from
    where notifications go (receiving devices).
  add_passkey: "Add Passkey"
  passkey:
    title: "Passkey credentials"
    subtitle: >-
      Your passwordless login credentials. One account can hold
      multiple Passkeys, synced across devices in the same ecosystem.
    count: " credentials"
  session:
    title: "Login sessions"
    subtitle: >-
      Which devices are currently logged into your account. Sessions
      are independent and can be revoked individually.
    count: " active sessions"
  recovery:
    title: "Recovery codes"
    desc_prefix: "The ultimate fallback when you lose all devices and "
    desc_highlight: "cannot sign in with Passkey"
    desc_suffix: >-
      . Sign in with username + recovery code, then add a new Passkey.
      Each code is single-use.
    regenerate: "Regenerate"
    hint: >-
      Feature coming soon · after sign-up, 8 one-time recovery codes
      will be generated. Save them to a password manager.
  concept:
    title: "Two independent axes"
    auth_label: "Auth axis"
    auth_axis: "who you are (this page)"
    auth_p1: "· Passkey credentials: one account can hold multiple"
    auth_p2: "· Login sessions: multi-device, individually revocable"
    auth_p3: "· Recovery codes: fallback when all devices are lost"
    delivery_label: "Delivery axis"
    delivery_axis: "where notifications go"
    delivery_p1: "· Managed on the Receivers page, separate from this page"
    delivery_p2: "· Browser push subscriptions + WebSocket connections"
    delivery_p3: "· Still received after logout, until unsubscribed"

