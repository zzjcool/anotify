    title: Key security best practices
    point1_prefix: 'Key plaintext is '
    point1_highlight: shown only once at creation
    point1_suffix: ; it cannot be viewed again, only regenerated
    point2_prefix: 'Server stores only '
    point2_highlight: argon2id hash
    point2_suffix: ; even a DB leak cannot recover the Key
    point3_prefix: 'Use '
    point3_highlight: one Key per Agent / environment
    point3_suffix: ; revoke only the affected one on leak
    point4: Never commit Keys to version control; inject via env vars or a secrets manager
