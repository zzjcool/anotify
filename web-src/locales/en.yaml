security:
  title: Security & Login
  subtitle: Passkey · Sessions · Recovery codes
  intro: 'Manage everything about who you are: Passkey credentials, login sessions, and recovery codes. These are separate from where notifications go (receiving devices).'
  add_passkey: Add Passkey
  passkey:
    title: Passkey credentials
    subtitle: Your passwordless login credentials. One account can hold multiple Passkeys, synced across devices in the same ecosystem.
    count: ' credentials'
  session:
    title: Login sessions
    subtitle: Which devices are currently logged into your account. Sessions are independent and can be revoked individually.
    count: ' active sessions'
  recovery:
    title: Recovery codes
    desc_prefix: 'The ultimate fallback when you lose all devices and '
    desc_highlight: cannot sign in with Passkey
    desc_suffix: . Sign in with username + recovery code, then add a new Passkey. Each code is single-use.
    regenerate: Regenerate
    hint: Feature coming soon · after sign-up, 8 one-time recovery codes will be generated. Save them to a password manager.
  concept:
    title: Two independent axes
    auth_label: Auth axis
    auth_axis: who you are (this page)
    auth_p1: '· Passkey credentials: one account can hold multiple'
    auth_p2: '· Login sessions: multi-device, individually revocable'
    auth_p3: '· Recovery codes: fallback when all devices are lost'
    delivery_label: Delivery axis
    delivery_axis: where notifications go
    delivery_p1: · Managed on the Receivers page, separate from this page
    delivery_p2: · Browser push subscriptions + WebSocket connections
    delivery_p3: · Still received after logout, until unsubscribed
