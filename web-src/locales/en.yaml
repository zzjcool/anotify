    webpush: Web Push subscription
    stream: WebSocket receiving
    events: POST /v1/events
    node: Node protocol
    endpoints: All endpoints
  endpoints:
    title: All endpoints
    intro: Generated at build time from api/openapi.yaml, so it can't drift from the real routes. Deprecated legacy notification endpoints are not listed.
    empty_desc: api/openapi.yaml was not loaded at build time. Re-run make sitegen to generate this section.
    empty_title: Endpoint list was not generated
  openapi:
    tag:
      events: Events
      tasks: Tasks
      sources: Sources
      namespaces: Namespaces
      stats: Stats
      capabilities: Capabilities
      edges: 'Downstream'
      playbooks: Playbooks
      nodes: Nodes
      node-stream: Node stream
      auth: Auth
      keys: API Keys
      deployments: Deployments
      passkey-enroll: Passkey enrollment
      cli-auth: CLI auth
      admin: Admin
      devices: Web Push
      resource: "Resources"
      agent: "Node protocol"
      ingress: "Ingress"
      traces: "Traces"
      system: "System configuration"

  events:
    core: Core
    intro: 'Events are where everything begins. Every external change enters here; the hub dispatches it into task chains along the downstream table.'
    required: Required
    optional: Optional
    params:
      title: Event fields
      source: Event source. It doubles as the origin capability name (github, cron, http).
      type: Event type, a name meaningful to that source (e.g. pull_request.opened).
      payload: Event payload, passed through verbatim as the downstream task params.
      idem: Idempotency key. The same source + idemKey produces one event only.
      trace: Explicit trace id. A new trace is created when omitted.
    note: A 200 is returned as soon as the event is stored. Dispatch failures still return 200 — events are never lost because a downstream step failed; you can replay later.
    curl:
      title: curl example
  node:
    intro: 'Nodes run code. A node connects to the hub, declares which capabilities it can run, then takes assign frames.'
    connect:
      title: Connect
    up:
      title: Node → hub (uplink)
      comment: '# hello, ack, progress, result'
    down:
      title: Hub → node (downlink)
      comment: '# welcome, assign, cancel, error'
    note: The hub only ever says WHAT to do (capability + params), never HOW — no argv, no shell, no command line.
  copy: Copy
  your_domain: your-domain
  agent:
    title: Connect Agent
    intro: 'Anotify''s core scenario: <b class="doc-em">when an Agent finishes a task, the notification is automatically pushed to all your devices</b>. Setup is two steps — create a reporting Key, then send a POST request when the task ends.'
    step1:
      title: Create a reporting Key
      desc: Go to the <a href="keys.html" class="doc-link">API Keys</a> page and create a Key with <code class="doc-code">notify:send</code> scope (prefix <code class="doc-code">ant_live_</code>). Save it immediately.
    step2:
      title: Report when the task ends
      desc: On an Agent completion event (e.g. pi's <code class="doc-code">agent_settled</code>) or at the end of a script, include the Key and <code class="doc-code">POST /v1/notify</code>.
    curl:
      title: Minimal setup · one curl to push to all devices
    journey:
      title: A notification's journey
  api:
    title: API overview
    base_url: Base URL
    base_url_desc: Your domain when self-hosting, or a Tunnel domain
    version: API version
    version_desc: All dynamic endpoints are version-prefixed; static assets go to /static/*
    map:
      title: Endpoint map
      notify: Agent reports a notification (core)
      tasks: 'Task list (event stream)'
      notifications: Notification history list
      devices_list: Device list
      devices_sub: Subscribe (register) a device
      devices_update: Update device (toggle / filter / tags)
      devices_delete: Unbind device
      node_stream: Node WebSocket protocol
      stream: WebSocket long-poll receiving
      keys_list: API Key list
      keys_create: Create API Key
      passkey: Passkey register / login
      vapid: VAPID public key (for subscription)
  auth:
    title: Authentication
    intro: 'Two credential types, for two kinds of callers. <b class="doc-em">Least privilege</b>: send and receive are separate, so a leaked Key only affects one side.'
    key:
      title: API Key (Bearer)
      li1: · For Agent reporting / receiver long-poll connections
      li2: '· Header: <code class="doc-code">Authorization: Bearer ant_…</code>'
      li3: '· scope: <code class="doc-code">notify:send</code> report · <code class="doc-code">notify:receive</code> receive · <code class="doc-code">devices:read</code> read-only'
      li4: · Server stores only an argon2id hash; plaintext is shown once at creation
    passkey:
      title: Session Cookie
      li1: · For workspace browser access (Overview / Devices / Keys management)
      li2: · WebAuthn passwordless login, biometric or device key
      li3: · httpOnly Cookie; multi-device sessions are independent and individually revocable
      li4: '· Cross-device: platform sync / one-time connection guide / recovery code fallback'
  notify:
    core: Core
    intro: An Agent calls this endpoint to report a notification after a task ends. The server validates the API Key, locates the owner, and pushes the notification <b class="doc-em">end-to-end encrypted</b> to all of that user's "enabled and level/tag-matched" devices.
    params:
      title: Request body parameters
      title_desc: Notification title, e.g. <code>"Deploy done"</code>, shown as the system notification's main title.
      agent_state_desc: 'Agent state: <code>working</code> running · <code>blocked</code> waiting · <code>done</code> completed · <code>interrupted</code> interrupted · <code>error</code> failed. Determines icon color and device filtering.'
      body_desc: Notification body, supplementary detail.
      tags_desc: Routing tags. Empty = broadcast to all enabled devices; non-empty = only delivered to devices with a matching tag or no tags (catch-all). ≤10 tags, each ≤32 chars.
      link_desc: Deep link opened when the notification is tapped, e.g. <code>pi://session/sess_8f3a2c</code>.
      meta_desc: Context metadata for traceability and statistics, stored in notification history.
      ttl_desc: <code>ttl</code> validity in seconds (default 86400); <code>priority</code> (default normal).
    required: Required
    optional: Optional
    curl:
      title: cURL · full request
      title_val: Deploy done
      body_val: Build succeeded, deployed to production
      tag_val: work
    resp200: Accepted and dispatched
    resp200_dev1: Primary phone
    resp200_dev2: Office Mac
    resp400: No matching device / bad request
    resp400_err: No subscribed devices; please subscribe in the workspace first
    resp400_comment: // 401 · Key missing or invalid (403 if scope insufficient)
    rules:
      title: Delivery rules (tag routing + level filtering)
  webpush:
    title: Web Push subscription (browser receiving)
    intro: The browser subscribes via Service Worker + PushManager; the backend pushes with a VAPID signature. <b class="doc-em">Receives even when the page is closed.</b> iOS requires "Add to Home Screen" and standalone mode (iOS 16.4+).
    step1: <b class="doc-em">① Get VAPID public key</b> · <code class="doc-code">GET /v1/vapid-public-key</code>
    step2: <b class="doc-em">② Register Service Worker</b> · <code class="doc-code">navigator.serviceWorker.register('/sw.js')</code>
    step3: <b class="doc-em">③ Request permission and subscribe</b> · <code class="doc-code">pushManager.subscribe(&#123; applicationServerKey &#125;)</code>
    step4: <b class="doc-em">④ Report subscription</b> · send endpoint + keys via <code class="doc-code">POST /v1/devices</code>
    code:
      title: Frontend subscription · core code
      comment1: // 1. Register SW + get VAPID public key
      comment2: // 2. Subscribe (requires notification permission)
      comment3: // 3. Report to backend (session Cookie auth)
      comment_p256dh: // { p256dh, auth }
      comment_platform: // ios|mac|win|android|other
    ios:
      title: ⚠️ iOS prerequisite
      desc: Must "Add to Home Screen" and run in standalone mode, otherwise Safari does not provide Notification / Push API.
    android:
      title: ✅ Android is easier
      desc: Chrome/Edge can subscribe from a normal tab via FCM — no need to add to Home Screen.
    e2e:
      title: 🔒 End-to-end encrypted
      desc: Payload encrypted with the subscription's p256dh/auth keys; the push service cannot read the content.
  ws:
    channel2: Second receive channel
    intro: Besides browser push, any device / plugin can use a <code class="doc-code">notify:receive</code> Key to establish a WebSocket long-poll for real-time receiving. Great for desktop widgets, CLI daemons, smart-home bridges. Runs alongside browser push.
    connect:
      title: Establishing a connection
      comment: '# requires notify:receive scope'
      comment2: '# optional, for resume after reconnect'
    s2c:
      title: Server → Client
      comment1: // first frame after connection
      comment2: // new notification received
      title_val: Deploy done
      body_val: Deployed to prod
      tag_val: work
      comment3: // replay end / heartbeat / error
    c2s:
      title: Client → Server
      comment1: // subscribe / unsubscribe tags (empty = all)
      comment2: // acknowledge processed (at-least-once)
      comment3: // heartbeat (every heartbeat_sec; 2 missed = disconnect)
      comment4: // after reconnect, use resume frame (replaces Last-Event-Id header)
    reconnect:
      title: Reconnect and resume
      desc: On reconnect, send the <code class="doc-code">Last-Event-Id</code> header (or a <code class="doc-code">resume</code> first frame). The server replays unacknowledged notifications from the last 24h (replay window), then enters the live stream. Beyond the retention window it returns a <code class="doc-code">resume_expired</code> error; the client should fetch full history.
  v4:
    five_specs: "Endpoints come from five v4 specs: resource / events / agent / ingress / auth. Until integrated, the list is truly empty, not legacy endpoints."
    missing: "Five v4 specs not loaded yet"
    ingress: "Namespaced event ingress (not resource creation)"
    node: "anode: local execution & configuration"
    node_note: "Register a Node, then issue a long-lived identity token. Declared namespaces intersect central authorization; install never auto-registers. No legacy agent commands, port routing or priority."
    resource: "Namespaced resources & write CAS"
    resource_note: "Read KindList.items. Create with apiVersion/kind/metadata/spec. Edits send writable fields plus metadata.resourceVersion; missing is 400, stale is 409 with draft retained. DELETE uses query resourceVersion."

