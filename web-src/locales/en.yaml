    stream: WebSocket receiving
    events: POST /v1/namespaces/{namespace}/events
    node: Node protocol
    endpoints: All endpoints
    design: "Behavior and limits"
  design:
    title: "Behavior and limits: where things are easy to misread"
    lede: "These are the product behaviors most often misread; use them to check when something looks wrong."
    sources: 'Sources produce events; target capabilities receive params. The downstream graph on a source page mirrors references — it is not proof of execution success: check the event stream for ingestion and the task detail for execution. A deliveryId is de-duplicated for 30 days by default; the same id only means "already received".'
    playbooks: "playbook.yaml is the only root manifest, and every capability/source file it references must be inside the package. The playbooks page only stores that package: installing is a separate POST …/install and deploying is a capability POST …/deploy."
    nodes: 'Node configuration is edited per node. The batch API is atomic per node and permits partial success. Retention is in seconds and 0 means forever; defaults are 604800 s for logs/artifacts and 2592000 s for events and terminal tasks, active tasks and reference protection still apply, and a user workDir is never deleted. Config revision and the revision in effect on the node show the server''s current values; when unreadable they show unknown rather than an assumed default.'
