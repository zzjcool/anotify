docs:
  title: Integration Docs
  subtitle: Agent reporting · Web Push · WebSocket
  toc_heading: On this page
  table:
    method: Method
    path: Path
    desc: Description
  back_top: Back to top
  toc:
    agent: Connect Agent
    api: API overview
