    step1:
      title: 上報用 Key を作成
      desc: <a href="keys.html" class="doc-link">API Keys</a> ページで <code class="doc-code">notify:send</code> 権限の Key を新規作成してください（プレフィックス <code class="doc-code">ant_live_</code>）。作成後すぐに保存してください。
    step2:
      title: タスク終了時に上報
      desc: Agent の終了イベント（例：pi の <code class="doc-code">agent_settled</code>）またはスクリプトの末尾で、Key を添えて <code class="doc-code">POST /v1/notify</code> を送信します。
    curl:
      title: 最小構成 · curl 一行で全デバイスに通知
    journey:
      title: 通知の旅
  api:
    title: API 概要
    base_url: Base URL
    base_url_desc: セルフホスト時はあなたのドメインまたは Tunnel ドメイン
    version: API バージョン
    version_desc: すべての動的 API にバージョンプレフィックス付き。静的アセットは /static/*
    map:
      title: エンドポイントマップ
      notify: Agent による通知上報（中核）
      tasks: 'タスク一覧（イベントストリーム）'
      notifications: 通知履歴一覧
      devices_list: デバイス一覧
      devices_sub: デバイス購読（登録）
      devices_update: デバイス更新（オンオフ / フィルタ / タグ）
      devices_delete: デバイス解除
      node_stream: ノード WebSocket プロトコル
      stream: WebSocket ロングポール受信
      keys_list: API Key 一覧
      keys_create: API Key 新規作成
      passkey: Passkey 登録 / ログイン
      vapid: VAPID 公開鍵（購読用）
  auth:
    title: 認証方法
    intro: 2 種類の認証情報があり、呼び出し元に応じて使い分けます。<b class="doc-em">最小権限</b>：上報と受信は分離されており、Key が漏洩しても片方だけの影響で済みます。
    key:
      title: API Key（Bearer）
      li1: · Agent 上報 / 受信側ロングポール接続に使用
      li2: '· Header：<code class="doc-code">Authorization: Bearer ant_…</code>'
      li3: · scope：<code class="doc-code">notify:send</code> 上報 · <code class="doc-code">notify:receive</code> 受信 · <code class="doc-code">devices:read</code> 読み取り専用
      li4: · サーバーは argon2id ハッシュのみ保存、平文は作成時のみ表示
    passkey:
      title: セッション Cookie
      li1: · ワークスペースのブラウザアクセスに使用（概要 / デバイス / Keys 管理）
      li2: · WebAuthn パスワードレスログイン、生体認証またはデバイスキー
      li3: · httpOnly Cookie、マルチデバイスセッションは独立して個別に取り消し可能
      li4: · クロスデバイス：プラットフォーム同期 / 一時接続ガイド / リカバリーコード
  notify:
    core: 中核
    intro: Agent がタスク終了後にこのエンドポイントを呼び出して通知を上報します。サーバーは API Key を検証し、所有者を特定し、通知を<b class="doc-em">エンドツーエンド暗号化</b>で「有効かつレベル / タグが一致する」すべてのデバイスにプッシュします。
    params:
      title: リクエストボディ パラメータ
      title_desc: 通知タイトル。例：<code>"デプロイ完了"</code>。システム通知のメインタイトルになります。
      agent_state_desc: エージェント状態：<code>working</code> 実行中 · <code>blocked</code> 待機中 · <code>done</code> 完了 · <code>interrupted</code> 中断 · <code>error</code> 失敗。アイコン色とデバイスフィルタを決定します。
      body_desc: 通知本文。補足説明です。
      tags_desc: ルーティングタグ。空 = すべての有効デバイスにブロードキャスト。非空 = 「共通タグがある」または「タグなし（catch-all）」のデバイスのみに配信。≤10 個、各 ≤32 文字。
      link_desc: 通知タップ時に開くディープリンク。例：<code>pi://session/sess_8f3a2c</code>。
      meta_desc: コンテキストメタデータ。追跡と統計に使用され、通知履歴に保存されます。
      ttl_desc: <code>ttl</code> 有効期限（秒）（デフォルト 86400）；<code>priority</code> 優先度（デフォルト normal）。
    required: 必須
    optional: 任意
    curl:
      title: cURL · 完全なリクエスト
      title_val: デプロイ完了
      body_val: ビルド成功、本番環境にデプロイ済み
      tag_val: 仕事
    resp200: 受領・配信完了
    resp200_dev1: メインスマホ
    resp200_dev2: オフィス Mac
    resp400: 一致するデバイスなし / パラメータエラー
    resp400_err: 購読済みデバイスがありません。先にワークスペースで購読してください
    resp400_comment: // 401 · Key がないまたは無効（scope 不足時は 403）
    rules:
      title: 配信ルール（タグルーティング + レベルフィルタ）
  webpush:
    title: Web Push 購読（ブラウザ受信）
    intro: ブラウザは Service Worker + PushManager で購読し、バックエンドは VAPID 署名でプッシュします。<b class="doc-em">ページを閉じていても受信できます</b>。iOS は「ホーム画面に追加」してスタンドアローンモードで実行する必要があります（iOS 16.4+）。
    step1: <b class="doc-em">① VAPID 公開鍵を取得</b> · <code class="doc-code">GET /v1/vapid-public-key</code>
    step2: <b class="doc-em">② Service Worker を登録</b> · <code class="doc-code">navigator.serviceWorker.register('/sw.js')</code>
    step3: <b class="doc-em">③ 権限を要求して購読</b> · <code class="doc-code">pushManager.subscribe(&#123; applicationServerKey &#125;)</code>
    step4: <b class="doc-em">④ 購読を上報</b> · endpoint + keys を <code class="doc-code">POST /v1/devices</code> で送信
    code:
      title: フロントエンド購読 · コアコード
      comment1: // 1. SW 登録 + VAPID 公開鍵を取得
      comment2: // 2. 購読（通知権限の許可が必要）
      comment3: // 3. バックエンドに報告（セッション Cookie 認証）
      comment_p256dh: // { p256dh, auth }
      comment_platform: // ios|mac|win|android|other
    ios:
      title: ⚠️ iOS の前提条件
      desc: 「ホーム画面に追加」してスタンドアローンモードで実行する必要があります。そうしないと Safari は Notification / Push API を提供しません。
    android:
      title: ✅ Android はもっと簡単
      desc: Chrome/Edge は通常のタブから購読でき、FCM 経由です。ホーム画面に追加する必要はありません。
    e2e:
      title: 🔒 エンドツーエンド暗号化
      desc: ペイロードは購読の p256dh/auth 鍵で暗号化され、プッシュサービスは内容を読めません。
  ws:
    channel2: 2 つ目の受信チャネル
    intro: ブラウザプッシュに加え、任意のデバイス / プラグインが <code class="doc-code">notify:receive</code> 権限の Key で WebSocket ロングポールを確立し、リアルタイム受信できます。デスクトップウィジェット、CLI デーモン、スマートホームブリッジに最適。ブラウザプッシュと並行稼働します。
    connect:
      title: 接続の確立
      comment: '# notify:receive 権限が必要'
      comment2: '# 任意、再接続時のレジュム用'
    s2c:
      title: サーバー → クライアント
      comment1: // 接続成功後の最初のフレーム
      comment2: // 新しい通知を受信
      title_val: デプロイ完了
      body_val: 本番にデプロイ済み
      tag_val: 仕事
      comment3: // リプレイ終了 / ハートビート / エラー
    c2s:
      title: クライアント → サーバー
      comment1: // タグの購読 / 購読解除（空 = 全て）
      comment2: // 処理済みを確認（at-least-once）
      comment3: // ハートビート（heartbeat_sec ごと、2 回連続未受信で切断）
      comment4: // 再接続後、resume フレームでレジュム（Last-Event-Id ヘッダの代替）
    reconnect:
      title: 再接続とレジュム
      desc: 再接続時に <code class="doc-code">Last-Event-Id</code> ヘッダ（または最初のフレームで <code class="doc-code">resume</code>）を送信すると、サーバーは直近 24h の未確認通知（リプレイウィンドウ）を再送し、その後リアルタイムストリームに移行します。保持期間を超えると <code class="doc-code">resume_expired</code> エラーを返します。クライアントは全履歴を再取得してください。
  v4:
    five_specs: "エンドポイントは resource / events / agent / ingress / auth の5つの v4 spec 由来です。未連携時は実際の空状態で旧 spec を表示しません。"
    missing: "5つの v4 spec が未読込です"
    ingress: "名前空間イベント入力（リソース作成ではありません）"
    node: "anode: 本機実行と設定"
    node_note: "Node を登録し長期識別トークンを発行します。申告と認可は積集合、install は自動登録しません。旧 agent コマンド、ポートルート、priority はありません。"
    resource: "名前空間リソースと書込 CAS"
    resource_note: "KindList.items を読みます。作成は apiVersion/kind/metadata/spec。編集は書込可能項目と metadata.resourceVersion のみ。欠落400、古い値409では下書きを保持。DELETE は query resourceVersion を使用します。"

