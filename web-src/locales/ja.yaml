  notify:
    core: 中核
    intro: Agent がタスク終了後にこのエンドポイントを呼び出して通知を上報します。サーバーは API Key を検証し、所有者を特定し、通知を<b class="text-zinc-200">エンドツーエンド暗号化</b>で「有効かつレベル / タグが一致する」すべてのデバイスにプッシュします。
    params:
      title: リクエストボディ パラメータ
      title_desc: 通知タイトル。例：<code>"デプロイ完了"</code>。システム通知のメインタイトルになります。
      agent_state_desc: エージェント状態：<code>working</code> 実行中 · <code>blocked</code> 待機中 · <code>done</code> 完了 · <code>interrupted</code> 中断 · <code>error</code> 失敗。アイコン色とデバイスフィルタを決定します。
      body_desc: 通知本文。補足説明です。
      tags_desc: ルーティングタグ。空 = すべての有効デバイスにブロードキャスト。非空 = 「共通タグがある」または「タグなし（catch-all）」のデバイスのみに配信。≤10 個、各 ≤32 文字。
      link_desc: 通知タップ時に開くディープリンク。例：<code>pi://session/sess_8f3a2c</code>。
      meta_desc: コンテキストメタデータ。追跡と統計に使用され、通知履歴に保存されます。
      ttl_desc: <code>ttl</code> 有効期限（秒）（デフォルト 86400）；<code>priority</code> 優先度（デフォルト normal）。
    required: 必須
    optional: 任意
    curl:
      title: cURL · 完全なリクエスト
      title_val: デプロイ完了
      body_val: ビルド成功、本番環境にデプロイ済み
      tag_val: 仕事
    resp200: 受領・配信完了
    resp200_dev1: メインスマホ
    resp200_dev2: オフィス Mac
    resp400: 一致するデバイスなし / パラメータエラー
    resp400_err: 購読済みデバイスがありません。先にワークスペースで購読してください
    resp400_comment: // 401 · Key がないまたは無効（scope 不足時は 403）
    rules:
      title: 配信ルール（タグルーティング + レベルフィルタ）
  webpush:
    title: Web Push 購読（ブラウザ受信）
    intro: ブラウザは Service Worker + PushManager で購読し、バックエンドは VAPID 署名でプッシュします。<b class="text-zinc-200">ページを閉じていても受信できます</b>。iOS は「ホーム画面に追加」してスタンドアローンモードで実行する必要があります（iOS 16.4+）。
    step1: <b class="text-zinc-200">① VAPID 公開鍵を取得</b> · <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">GET /v1/vapid-public-key</code>
    step2: <b class="text-zinc-200">② Service Worker を登録</b> · <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">navigator.serviceWorker.register('/sw.js')</code>
    step3: <b class="text-zinc-200">③ 権限を要求して購読</b> · <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">pushManager.subscribe(&#123; applicationServerKey &#125;)</code>
    step4: <b class="text-zinc-200">④ 購読を上報</b> · endpoint + keys を <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">POST /v1/devices</code> で送信
    code:
      title: フロントエンド購読 · コアコード
      comment1: // 1. SW 登録 + VAPID 公開鍵を取得
      comment2: // 2. 購読（通知権限の許可が必要）
      comment3: // 3. バックエンドに報告（セッション Cookie 認証）
      comment_p256dh: // { p256dh, auth }
      comment_platform: // ios|mac|win|android|other
    ios:
      title: ⚠️ iOS の前提条件
      desc: 「ホーム画面に追加」してスタンドアローンモードで実行する必要があります。そうしないと Safari は Notification / Push API を提供しません。
    android:
      title: ✅ Android はもっと簡単
      desc: Chrome/Edge は通常のタブから購読でき、FCM 経由です。ホーム画面に追加する必要はありません。
    e2e:
      title: 🔒 エンドツーエンド暗号化
      desc: ペイロードは購読の p256dh/auth 鍵で暗号化され、プッシュサービスは内容を読めません。
  ws:
    channel2: 2 つ目の受信チャネル
    intro: ブラウザプッシュに加え、任意のデバイス / プラグインが <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">notify:receive</code> 権限の Key で WebSocket ロングポールを確立し、リアルタイム受信できます。デスクトップウィジェット、CLI デーモン、スマートホームブリッジに最適。ブラウザプッシュと並行稼働します。
    connect:
      title: 接続の確立
      comment: '# notify:receive 権限が必要'
      comment2: '# 任意、再接続時のレジュム用'
    s2c:
      title: サーバー → クライアント
      comment1: // 接続成功後の最初のフレーム
      comment2: // 新しい通知を受信
      title_val: デプロイ完了
      body_val: 本番にデプロイ済み
      tag_val: 仕事
      comment3: // リプレイ終了 / ハートビート / エラー
    c2s:
      title: クライアント → サーバー
      comment1: // タグの購読 / 購読解除（空 = 全て）
      comment2: // 処理済みを確認（at-least-once）
      comment3: // ハートビート（heartbeat_sec ごと、2 回連続未受信で切断）
      comment4: // 再接続後、resume フレームでレジュム（Last-Event-Id ヘッダの代替）
    reconnect:
      title: 再接続とレジュム
      desc: 再接続時に <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">Last-Event-Id</code> ヘッダ（または最初のフレームで <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">resume</code>）を送信すると、サーバーは直近 24h の未確認通知（リプレイウィンドウ）を再送し、その後リアルタイムストリームに移行します。保持期間を超えると <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">resume_expired</code> エラーを返します。クライアントは全履歴を再取得してください。
