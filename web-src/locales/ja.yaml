    add_device: "このデバイスを追加"
  ws:
    title: "長接続受信 · プラグインと任意デバイスのために"
    desc: >-
      notify:receive 権限の API Key を持つ任意のデバイス / プラグインが
      WebSocket 長接続を確立し、サーバーからリアルタイムに通知を受信。
      デスクトップウィジェット、CLI デーモン、スマートホームブリッジなどに最適。
      ブラウザプッシュと並行して動作します。
    connection_method: "接続方法"
    copy: "コピー"
    active_title: "アクティブな接続"
    active_subtitle: "現在確立している WebSocket 接続"
    online: " 件オンライン"
