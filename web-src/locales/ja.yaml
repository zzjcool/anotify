receivers:
  title: "通知先"
  demo_badge: "デモデータ"
  channel:
    push: "プッシュ購読"
    ws: "WebSocket 接続"
  push:
    title: "ブラウザプッシュ購読"
    subtitle_prefix: "システム Push サービス（APNs / FCM）で配信。"
