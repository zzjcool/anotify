    desc_suffix: 場合の最終手段。ユーザー名 + リカバリーコードでログイン後、 新しい Passkey を追加できます。各コードは1回限り有効。
    regenerate: 再生成
    hint: 機能は近日公開 · 登録成功後、8個のワンタイムリカバリーコードが生成されます。パスワードマネージャーに保存してください
