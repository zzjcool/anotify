      バックエンド接続後、ここにリアルタイム接続が表示されます
      （接続名 / Key プレフィックス / 稼働時間 / タグ / 最新メッセージ）。
  tags:
    title: "タグルーティング · どのデバイスがどの通知を受け取るか"
    desc: >-
      通知報告時に deviceTags を付与します。「タグの積集合がある」または
      「タグなし（全受信）」のデバイスのみが受信します。通知にタグなし =
      すべての有効なデバイスへブロードキャスト、デバイスにタグなし =
      すべてを受信。
