  ws:
    title: "长连接接收 · 为插件与任意设备而生"
    desc: >-
      任何设备 / 插件用 notify:receive 权限的 API Key
      建立 WebSocket 长连接，服务端实时推送通知。适合做桌面插件、
      CLI 守护进程、智能家居桥接等。与浏览器推送并行存在。
    connection_method: "连接方式"
    copy: "复制"
    active_title: "活跃连接"
    active_subtitle: "当前建立的 WebSocket 长连接"
