  tags:
    title: "标签路由 · 决定「哪台设备收哪类通知」"
    desc: >-
      上报通知时带上 deviceTags，只有「标签有交集」或
      「无标签（全收）」的设备会收到。通知不带标签 = 广播到所有
      已启用设备；设备不带标签 = 接收一切。
