    off_note: "手机推送（Web Push）暂未开放：服务端未启用 VAPID，本版不提供设备订阅页。事件仍会正常产生，可在「事件流」页查看。"
    title: Web Push 订阅（浏览器接收）
    intro: 浏览器端通过 Service Worker + PushManager 订阅，后端用 VAPID 签名推送。<b class="doc-em">即使页面关闭也能收到</b>。iOS 需先「添加到主屏幕」以 standalone 运行（iOS 16.4+）。
    step1: <b class="doc-em">① 取 VAPID 公钥</b> · <code class="doc-code">GET /v1/vapid-public-key</code>
    step2: <b class="doc-em">② 注册 Service Worker</b> · <code class="doc-code">navigator.serviceWorker.register('/sw.js')</code>
    step3: <b class="doc-em">③ 请求权限并订阅</b> · <code class="doc-code">pushManager.subscribe(&#123; applicationServerKey &#125;)</code>
    step4: <b class="doc-em">④ 上报订阅</b> · 把 endpoint + keys <code class="doc-code">POST /v1/devices</code>
    code:
      title: 前端订阅 · 核心代码
      comment1: // 1. 注册 SW + 取 VAPID 公钥
      comment2: // 2. 订阅（需用户已授权通知权限）
      comment3: // 3. 上报后端（会话 Cookie 鉴权）
      comment_p256dh: // { p256dh, auth }
      comment_platform: // ios|mac|win|android|other
    ios:
      title: ⚠️ iOS 前提
      desc: 必须先「添加到主屏幕」standalone 运行，否则 Safari 不提供 Notification / Push API。
    android:
      title: ✅ Android 更省事
      desc: Chrome/Edge 普通标签页即可订阅，走 FCM，无需添加到主屏幕。
    e2e:
      title: 🔒 端到端加密
      desc: 载荷用订阅的 p256dh/auth 密钥加密，推送服务无法读取内容。
  ws:
    channel2: 第二条接收通道
    intro: 除浏览器推送外，任意设备 / 插件可用 <code class="doc-code">notify:receive</code> 权限的 Key 建立 WebSocket 长连接实时接收。适合做桌面插件、CLI 守护进程、智能家居桥接，与浏览器推送并行。
    connect:
      title: 建立连接
      comment: '# 需 notify:receive 权限'
      comment2: '# 可选，断线续传'
    s2c:
      title: 服务端 → 客户端
      comment1: // 连接成功后第一条
      comment2: // 收到新通知
      title_val: 部署完成
      body_val: 已发布到 prod
      tag_val: 工作
      comment3: // 断线补漏结束 / 心跳 / 错误
    c2s:
      title: 客户端 → 服务端
      comment1: // 订阅 / 退订标签（空 = 全订阅）
      comment2: // 确认已处理（at-least-once）
      comment3: // 心跳（每 heartbeat_sec 一次，2 次未收则断连）
      comment4: // 断线重连后用 resume 帧续传（替代 Last-Event-Id 头）
    reconnect:
      title: 重连与续传
      desc: 断线后重连时携带 <code class="doc-code">Last-Event-Id</code> 头（或首帧发 <code class="doc-code">resume</code>），服务端会重放该位置之后 24h 内未确认的通知（回放窗口），随后进入实时流。超出保留窗口则返回 <code class="doc-code">resume_expired</code> 错误，客户端应拉取全量历史。
  v4:
    five_specs: "端点来自 resource / events / agent / ingress / auth 五份 v4 spec；未接入时真实空态，不展示旧 spec 端点。"
    missing: "尚未加载五份 v4 spec"
    ingress: "命名空间事件入口（不是资源创建）"
    node: "anode：本机执行与配置"
    node_note: "先登记 Node，再签发长期身份令牌。本机申报与授权取交集；install 不自动注册。没有旧 agent 命令、端口路由或 priority。"
