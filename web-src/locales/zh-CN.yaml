      desc: 到 <a href="keys.html" class="doc-link">API Keys</a> 页新建一个 <code class="doc-code">notify:send</code> 权限的 Key（前缀 <code class="doc-code">ant_live_</code>），立即保存。
    step2:
      title: 任务结束时上报
      desc: 在 Agent 结束事件（如 pi 的 <code class="doc-code">agent_settled</code>）或脚本末尾，携带 Key <code class="doc-code">POST /v1/notify</code>。
