  auth:
    title: 认证方式
    intro: 两种凭证，对应两类调用方。<b class="doc-em">权限最小化</b>：上报与接收分开，泄露一个 Key 不会波及另一头。
    key:
      title: API Key（Bearer）
      li1: · 用于 Agent 上报 / 接收端长连接
      li2: '· Header：<code class="doc-code">Authorization: Bearer ant_…</code>'
      li3: · scope：<code class="doc-code">notify:send</code> 上报 · <code class="doc-code">notify:receive</code> 接收 · <code class="doc-code">devices:read</code> 只读
      li4: · 服务端只存 argon2id 哈希，明文仅创建时展示一次
    passkey:
      title: 会话 Cookie
      li1: · 用于工作台浏览器访问（总览 / 设备 / Keys 管理）
      li2: · WebAuthn 无密码登录，生物识别或设备密钥
      li3: · httpOnly Cookie，多端会话独立、可单独吊销
      li4: · 跨设备：平台同步 / 一次性连接引导 / 恢复码兜底
  notify:
    core: 核心
    intro: Agent 在任务结束后调用本接口上报一条通知。服务端校验 API Key，定位所属用户，把通知<b class="doc-em">端到端加密</b>推送到该用户所有「已启用且级别/标签匹配」的设备。
    params:
