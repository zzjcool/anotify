security:
  title: 安全与登录
  subtitle: Passkey · 会话 · 恢复码
  intro: 这里管理「你是谁」的一切：Passkey 凭证、登录会话、恢复码。它们与「通知发到哪」（接收设备）是两条独立的轴。
  add_passkey: 添加 Passkey
  passkey:
    title: Passkey 凭证
    subtitle: 你的免密登录凭证。一个账号可挂多个 Passkey，可经系统同步到同生态设备
    count: 个凭证
  session:
    title: 登录会话
    subtitle: 你的账号当前在哪些设备上处于登录态。会话各自独立、可单独吊销
    count: 个活跃会话
  recovery:
    title: 恢复码
    desc_prefix: 当你丢失所有设备、无法用 Passkey 登录时的
    desc_highlight: 终极兜底
    desc_suffix: 。用「用户名 + 恢复码」登录后可为新设备补建 Passkey。每个码只能用一次。
    regenerate: 重新生成
    hint: 功能即将上线 · 注册成功后将生成 8 个一次性恢复码，请保存到密码管理器
  concept:
    title: 两条独立的轴
    auth_label: 认证轴
    auth_axis: 决定「你是谁」（本页）
    auth_p1: · Passkey 凭证：一个账号可挂多个
    auth_p2: · 登录会话：多端并存、可单独吊销
    auth_p3: · 恢复码：所有设备丢失时的兜底
    delivery_label: 投递轴
    delivery_axis: 决定「发到哪」
    delivery_p1: · 在「通知接收」页管理，与本页无关
    delivery_p2: · 浏览器推送订阅 + WebSocket 长连接
    delivery_p3: · 退出登录后仍会收到，直到取消订阅
