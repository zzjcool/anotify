    ios_2: Ajustes de iOS → Notificaciones → Safari/PWA → Permitir notificaciones
    ios_3: 'No recibe tras suscribirse: desactiva el modo No Molestar, confirma que el permiso del sitio sea «Permitir»'
    mac_1: Ajustes del sistema macOS → Notificaciones → busca tu navegador (ej. Google Chrome) → Permitir
    mac_2: Icono de candado en la barra del navegador → Notificaciones → «Permitir» (no por defecto/bloquear)
    mac_3: Push requiere el proceso del navegador activo con la pestaña de este sitio abierta; cerrar el navegador detiene el push en tiempo real
    mac_4: Las pestañas en primer plano pueden procesar push silenciosamente — cambia a segundo plano o minimiza para probar
    win_1: Ajustes de Windows → Sistema → Notificaciones → confirma que el navegador tiene notificaciones activadas
    win_2: Icono de candado en la barra del navegador → Notificaciones → «Permitir»
    win_3: El Asistente de concentración (No Molestar) silencia las notificaciones cuando está activo
    android_1: Ajustes de Android → Aplicaciones → Navegador → Notificaciones → Permitir
    android_2: El navegador integrado de WeChat y algunos navegadores chinos no soportan Web Push — usa Chrome
    other_1: Confirma que el permiso de notificaciones del navegador sea «Permitir» (icono de candado en la barra)
    other_2: Confirma que el proceso del navegador está activo
