      type: Evento tipo, un nombre significativo para ese origen (p. ej. pull_request.opened).
      payload: Carga del evento, se pasa tal cual a los params de las tareas siguientes.
      idem: Clave de idempotencia. El mismo source + idemKey produce un solo evento.
      trace: Trace explícito. Si se omite, se crea uno nuevo.
