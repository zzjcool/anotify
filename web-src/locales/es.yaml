  desc_prefix: Los agentes llevan una Key para llamar a
  desc_suffix: y reportar notificaciones. La Key se muestra completa una sola vez al crearla; el servidor solo guarda un hash — guárdala de inmediato.
  create_button: Nueva Key
  api_endpoint: Endpoint de reporte
  view_docs: Ver docs completas de la API
  header_label: Header
  my_keys: Mis Keys
