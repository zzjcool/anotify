  security:
    title: Buenas prácticas de seguridad de la Key
    point1_prefix: 'El texto plano de la Key '
    point1_highlight: se muestra una sola vez al crearla
    point1_suffix: ; no puede volver a verse, solo regenerarse
    point2_prefix: 'El servidor solo guarda el '
    point2_highlight: hash argon2id
    point2_suffix: ; ni una fuga de DB puede recuperar la Key
    point3_prefix: 'Usa '
    point3_highlight: una Key por Agent / entorno
    point3_suffix: ; revoca solo la afectada si hay fuga
    point4: Nunca subas Keys al control de versiones; inyéctalas con vars de entorno o un gestor de secretos
  create:
    title: Nueva API Key
    subtitle: Ponle un nombre y elige sus permisos
    name_label: Nombre
    name_placeholder: ej. Dev local / pipeline CI / Agent producción
    scope_label: Permisos (selección múltiple, mínimo privilegio)
    scope_send_label: Enviar
    scope_send_desc: Para que Agents / CI hagan POST de notificaciones. Prefijo ant_live_
    scope_receive_label: Recibir
    scope_receive_desc: Para que plugins / dispositivos abran conexiones WebSocket. Prefijo ant_recv_
    scope_read_label: Leer dispositivos
    scope_read_desc: Listado de solo lectura para inspección con scripts
    scope_hint: 'Mínimo privilegio: enviar y recibir van separados, así una Key filtrada solo compromete un lado.'
    cancel: Cancelar
    generate: Generar Key
  save:
    title: Guarda tu Key
    subtitle_prefix: 'Esta es su '
    subtitle_highlight: única muestra completa
    copy: Copiar
    warning: Al cerrar, la Key completa no podrá volver a verse. Guárdala en un gestor de contraseñas o lugar seguro de inmediato.
    done: La he guardado
security:
  title: Seguridad y acceso
  subtitle: Passkey · Sesiones · Códigos de recuperación
  intro: 'Gestiona todo sobre quién eres: credenciales Passkey, sesiones de acceso y códigos de recuperación. Son independientes de a dónde van las notificaciones (dispositivos receptores).'
  add_passkey: Añadir Passkey
  passkey:
    title: Credenciales Passkey
    subtitle: Tus credenciales de acceso sin contraseña. Una cuenta puede tener varios Passkeys, sincronizados entre dispositivos del mismo ecosistema.
    count: ' credenciales'
  session:
    title: Sesiones de acceso
    subtitle: En qué dispositivos está tu cuenta iniciada ahora. Las sesiones son independientes y se pueden revocar individualmente.
    count: ' sesiones activas'
  recovery:
    title: Códigos de recuperación
    desc_prefix: 'El respaldo final cuando pierdes todos los dispositivos y '
    desc_highlight: no puedes entrar con Passkey
    desc_suffix: . Entra con usuario + código de recuperación y luego añade un nuevo Passkey. Cada código sirve una sola vez.
    regenerate: Regenerar
    hint: Función próximamente · tras registrarse se generarán 8 códigos de recuperación de un solo uso. Guárdalos en un gestor de contraseñas.
  concept:
    title: Dos ejes independientes
    auth_label: Eje de autenticación
    auth_axis: quién eres (esta página)
    auth_p1: '· Credenciales Passkey: una cuenta puede tener varias'
    auth_p2: '· Sesiones de acceso: multidispositivo, revocables individualmente'
    auth_p3: '· Códigos de recuperación: respaldo si se pierden todos los dispositivos'
    delivery_label: Eje de entrega
    delivery_axis: a dónde van las notificaciones
    delivery_p1: · Se gestiona en la página Destinatarios, aparte de esta
    delivery_p2: · Suscripciones push del navegador + conexiones WebSocket
    delivery_p3: · Se siguen recibiendo tras cerrar sesión, hasta cancelar la suscripción
