    parameters:
      - $ref: '#/components/parameters/NamespacePath'
    get:
      operationId: listTasks
      tags: [tasks]
      security: [{session: []}]
      summary: "列出命名空间内的任务（最新在前）"
      description: |
        查询参数是**封闭集合**（`limit`/`status`/`traceId`/`nodeId`），未知参数 →
        400 `unknown_field`（不静默忽略）。`limit` 缺省 50、>500 折回 50。
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, default: 50}
        - name: status
          in: query
          required: false
          description: "按相位过滤"
          schema: {type: string}
        - name: traceId
          in: query
          required: false
          schema: {type: string}
        - name: nodeId
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: "TaskList"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskList'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/TaskIDPath'
    get:
      operationId: getTask
      tags: [tasks]
      security: [{session: []}]
      summary: "读取单个任务（Task 无 CAS、无 resourceVersion）"
      responses:
        '200':
          description: "Task"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/tasks/{taskId}/cancel:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/TaskIDPath'
    post:
      operationId: cancelTask
      tags: [tasks]
      security: [{session: []}]
      summary: "请求取消（写 cancel_requested 事实；不 pretending 立刻终止）"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskActionRequest'}
      responses:
        '200':
          description: "更新后的 Task"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/tasks/{taskId}/decision:
    parameters:
      - $ref: '#/components/parameters/TaskIDPath'
    post:
      operationId: submitTaskDecision
      tags: [tasks]
      security: [{taskToken: []}]
      summary: "提交 router 的判决（能力 → 中枢的唯一判断回传通道）"
      description: |
        **不是会话端点**：调用方是节点上运行的 router 能力，凭据是 lease.grant 下发的
        一次性决策凭据（`ANOTIFY_DECISION_TOKEN`，绑定 taskId、短 TTL、成功提交即消费）。

        权限边界只有一句：**凭据只能给自己这个 task 选一个已声明的结局**，不能点名别的
        能力。所以：结局名不在该任务的 `outcomes` 表里 → 403（+ trace 里一条
        `outcome_not_declared` 审计行）；同一 task 第二次提交 → 409
        `decision_already_taken`（幂等拒绝，不覆盖）；任务已结束 → 409 `task_not_running`；
        凭据不可用（不存在/不匹配/过期/已消费）→ 401 `token_invalid`。

        判决**允许在任务成功之前提交**（先写判决再退出是推荐姿势）；平台在任务成功终态
        之后才按表执行动作。空动作结局（`drop: []`）返回 `actions: 0`。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskDecisionRequest'}
      responses:
        '200':
          description: "判决已落库"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskDecisionResponse'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/Status401'}
        '403': {$ref: '#/components/responses/Status403'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/tasks/{taskId}/abandon:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/TaskIDPath'
    post:
      operationId: abandonTask
      tags: [tasks]
      security: [{session: []}]
      summary: "放弃任务（终态 abandoned_by_user）"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskActionRequest'}
      responses:
        '200':
          description: "更新后的 Task"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/tasks/{taskId}/logs:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/TaskIDPath'
    get:
      operationId: getTaskLogs
      tags: [tasks]
      security: [{session: []}]
      summary: "向节点要一次日志（有界等待，非流式）"
      description: |
        错误语义是**闭集**：`404` 任务不存在；`410 no_local_archive` 节点上没有该
        attempt 的档案；`503 node_offline` 节点离线；`504 timeout` 节点超时未回；
        `502` 其它节点侧错误（透传节点错误码）。唯一的空成功是 `previous=true` 且
        确实没有上一次 attempt → `200` + `attempt:0` + `lines:[]`。
      parameters:
        - name: previous
          in: query
          required: false
          description: |
            读上一次 attempt 的日志。只有 `true`/`1` 算真值；其它任何值按 `false`
            处理（**不报 400**，`taskQueryBool` 的既有口径）。
          schema: {type: boolean, default: false}
        - name: tailLines
          in: query
          required: false
          description: "只取尾部 N 行（0..5000）"
          schema: {type: integer, minimum: 0, maximum: 5000}
        - name: sinceSeconds
          in: query
          required: false
          description: "只取最近 N 秒"
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: "日志文档（lines 恒为数组）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskLogs'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '410': {$ref: '#/components/responses/Status410'}
        '500': {$ref: '#/components/responses/Status500'}
        '502': {$ref: '#/components/responses/Status502'}
        '503': {$ref: '#/components/responses/Status503'}
        '504': {$ref: '#/components/responses/Status504'}

  /v1/namespaces/{namespace}/tasks/{taskId}/emissions:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/TaskIDPath'
    get:
      operationId: listTaskEmissions
      tags: [tasks]
      security: [{session: []}]
      summary: "列出该任务的 emit 事实（游标分页，最新在前）"
      description: |
        `metadata.continue` 是不透明游标，绑定 `(namespace, taskId)`；拿别的查询的
        游标来用 → 400。剪枝回执的 `taskId` 是**真 null**（已接收、没派发）。
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/ContinueQuery'
      responses:
        '200':
          description: "emissions 文档（没有 apiVersion/kind）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskEmissions'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/tasks/{taskId}/artifacts/{sha256}:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/TaskIDPath'
      - name: sha256
        in: path
        required: true
        description: "产物字节的 sha256（64 位小写 hex，不带 `sha256:` 前缀）"
        schema: {type: string, pattern: '^[a-f0-9]{64}$'}
    get:
      operationId: downloadTaskArtifact
      tags: [tasks]
      security: [{session: []}]
      summary: "下载用户任务运行产物（原始字节，不套信封）"
      description: |
        授权 = 命名空间 + 该 Task **当前** reported result manifest 的实际引用（G3-D4）：
        未在该 manifest 引用、跨 ns/task、未知 hash → `404`；副本已过期 → `410
        artifact_expired`；同一 sha 多个逻辑路径时只要有任一 live 条目就 `200`。
        中枢没配置托管目录 → `503 artifact_download_unavailable`。
        响应头恒为 `application/octet-stream` + `X-Content-Type-Options: nosniff` +
        以登记路径安全 basename 生成的 `Content-Disposition`；支持 Range/HEAD。
      responses:
        '200':
          description: "产物字节流"
          headers:
            Content-Disposition:
              description: |
                附件名由登记路径的安全 basename 生成（禁 CRLF / 路径逃逸）。ASCII 名走
                `attachment; filename="…"`，含非 ASCII 才走 `filename*=UTF-8''…`
                （`mime.FormatMediaType` 的选择，两种都合法）。
              schema: {type: string}
            X-Content-Type-Options:
              description: "恒为 `nosniff`（产物可能是 HTML/SVG，禁止在中枢域渲染）"
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '410': {$ref: '#/components/responses/Status410'}
        '503': {$ref: '#/components/responses/Status503'}
        '500': {$ref: '#/components/responses/Status500'}

  # ----------------------------------------------------------------- deployments
  /v1/namespaces/{namespace}/deployments:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
    get:
      operationId: listDeployments
      tags: [deployments]
      security: [{session: []}]
      summary: "只读部署投影（某节点持有某 digest + 节点回报状态）"
      description: |
        写/删随 v3 部署入口一起退役（api-conventions §9）：部署事实只由
        `POST …/capabilities/{name}/deploy` 产生。没有其他方法 → 405。
      parameters:
        - name: nodeId
          in: query
          required: false
          schema: {type: string}
        - name: capabilityId
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: "部署投影"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentList'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '405': {$ref: '#/components/responses/Status405'}
        '500': {$ref: '#/components/responses/Status500'}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: anotify_session
      description: "控制台登录会话 Cookie（7 天 TTL；`HttpOnly`+`SameSite`）"
    consoleKey:
      type: http
      scheme: bearer
      description: "控制台 API key（`Authorization: Bearer <key>`；scope 在后端判定）"
    nodeToken:
      type: http
      scheme: bearer
      description: "节点身份令牌（`Authorization: Bearer <node token>`；库里只存 sha256）"
    adminSession:
      type: apiKey
      in: cookie
      name: anotify_session
      description: "登录会话 + 超管权限（两层中间件：先 401 再 403）"
    taskToken:
      type: http
      scheme: bearer
      description: |
        任务级**决策凭据**（`Authorization: Bearer <decision token>`）：由 lease.grant 随任务
        下发，一次性、绑定 taskId、短 TTL。它只能为**这一个任务**选一个已声明的结局（#522）。

  parameters:
    NamespacePath:
      name: namespace
      in: path
      required: true
      description: "命名空间 slug（也接受 `ns_…` 内部 id；slug 优先）"
      schema: {type: string}
    CapabilityNamePath:
      name: name
      in: path
      required: true
      description: "能力名（`metadata.name`；跨版本不变）"
      schema: {type: string}
    NodeNamePath:
      name: name
      in: path
      required: true
      description: "节点名"
      schema: {type: string}
    TaskIDPath:
      name: taskId
      in: path
      required: true
      description: "任务 id（`tsk_…`）"
      schema: {type: string}
    ResourceVersionQuery:
      name: resourceVersion
      in: query
      required: true
      description: |
        DELETE 的 CAS 令牌（唯一承载：**不带请求体**）。缺失 → 400
        `resource_version_required`；不是当前值 → 409 `resource_version_conflict`
        （`details.current.resourceVersion` 给当前值）。不透明字符串，禁止 parseInt。
      schema: {type: string}
    LimitQuery:
      name: limit
      in: query
      required: false
      description: |
        每页条数。缺省 50；**非整数会 400**（解码失败）；数值越界不报错：
        `<=0` 按 50 处理，`>500` 钳到 500（tasks 列表钳到 50）。
      schema: {type: integer, default: 50}
    ContinueQuery:
      name: continue
      in: query
      required: false
      description: "不透明游标（上一次响应的 `metadata.continue`；绑定查询作用域）"
      schema: {type: string}

  schemas:
    ObjectMeta:
      type: object
      description: |
        资源 metadata（api-conventions §3.2 的封闭集合）：没有 labels/annotations/
        generation/finalizers/deletionTimestamp。
      required: [name]
      properties:
        name: {type: string}
        namespace:
          type: string
          description: "命名空间 slug（Cluster 级资源没有这个键）"
        uid:
          type: string
          description: "资源身份（删后同名重建会换一个新的）"
        version:
          type: integer
          minimum: 1
          description: "只有 Capability / Playbook 有；**不是** generation"
        resourceVersion:
          type: string
          description: |
            CAS 写并发令牌（`rv1:<uid>:<revision>`，不透明）。POST 不需要；PUT/PATCH
            放在 body 的 `metadata.resourceVersion`，DELETE 放在 `?resourceVersion=`。
        creationTimestamp:
          type: string
          format: date-time
        displayName: {type: string}
      additionalProperties: false
    ListMeta:
      type: object
      description: "列表 metadata。只有 `continue`（不透明游标；末页省略）。"
      properties:
        continue:
          type: string
          description: "下一页游标；末页省略。"
    StatusCause:
      type: object
      properties:
        reason: {type: string}
        message: {type: string}
        field:
          type: string
          description: "出错字段路径（如 `spec.config.token`、`blocking`；requires 类 400/409 的 field 形如 `spec.requires[0].capability`、`spec.requires[0].minVersion`）"
    StatusDetails:
      type: object
      description: |
        结构化补充。`causes` 是逐点校验结论；`current` 在 CAS 冲突时带当前令牌；
        `retryAfterSeconds` 给 429。playbook 安装冲突额外带
        `valuesDigest` / `conflicts[]` / `hint`（`playbook_conflict` 是 400 专用形状）；
        `release_conflict`（409）带 `name` / `kind` / `ownerRelease` / `ownerInstallId`
        与同形状的 `conflicts[]`（这一行是哪个 release 装出来的）。
        `causes[]` 是三键 `{reason, message, field}`（不因依赖类错误而扩展）；
        其中 requires 类 400/409 的 field 形如 `spec.requires[0].capability`、
        `spec.requires[0].minVersion`，版本不足的判据在 `message` 的 `need:` / `have:` 字面里。
      properties:
        causes:
          type: array
          items: {$ref: '#/components/schemas/StatusCause'}
        current:
          type: object
          description: "CAS 冲突时的当前事实（至少 `resourceVersion`）"
          additionalProperties: true
        retryAfterSeconds:
          type: integer
          minimum: 0
        valuesDigest:
          type: string
          description: "仅 `playbook_conflict`"
        conflicts:
          type: array
          description: "仅 `playbook_conflict`（逐条 kind/ref/reason/declaredDigest/actualDigest/fields）"
          items:
            type: object
            additionalProperties: true
        hint:
          type: string
          description: "仅 `playbook_conflict`"
      additionalProperties: true
    Status:
      type: object
      description: |
        统一错误体（api-conventions §4.1）。所有错误响应都带 body；`code` 是 HTTP 状态
        码的冗余副本，`reason` 是封闭机器码。`status` 恒为 `Failure`。
      required: [apiVersion, kind, status, code, reason]
      properties:
        apiVersion:
          type: string
          enum: [anotify/v1]
        kind:
          type: string
          enum: [Status]
        status:
          type: string
          enum: [Failure]
        code:
          type: integer
          description: "HTTP 状态码（与响应行一致）"
        reason:
          type: string
          description: "封闭机器码（`BadRequest` / `resource_version_conflict` / …）"
        message: {type: string}
        details: {$ref: '#/components/schemas/StatusDetails'}
    AuthError:
      type: object
      description: |
        身份域（auth / admin / devices / keys / passkey-enroll / cli-auth）的**唯一**
        错误体：`{"error": "<人话或机器码>"}`。它**不是** Status 信封。
        两种产生点形状相同、`Content-Type` 不同：
        - 中间件（`internal/auth/*`）用 `http.Error` → `text/plain` 且正文带换行；
        - handler（`writeErr`）用 `writeJSON` → `application/json`。
        列入本文件是为了让 spec 说实话，而不是假装所有错误都是 Status。
      required: [error]
      properties:
        error: {type: string}
    AuthFlow:
      description: |
        身份流程的 409 体：`{"status": "<当前状态>"}`（终态冲突）或
        `{"error": "..."}`（已消费、重复提交）。用 `oneOf` 而不是把两者压成一个
        宽对象，是因为消费方要按有没有 `error` 决定「还要不要重试」。
      oneOf:
        - type: object
          required: [status]
          properties:
            status: {type: string}
        - $ref: '#/components/schemas/AuthError'
    BackpressureError:
      type: object
      description: |
        派发积压时的 503 body（backpressure.go 冻结形状，**snake_case**）：
        调用方据此判断等多久再来。同时带 `Retry-After` 头。
      required: [error, pending_age_sec, max_pending_age_sec, retry_after_sec]
      properties:
        error: {type: string}
        pending_age_sec:
          type: integer
          description: "最近一次采样到的积压年龄（秒）"
        max_pending_age_sec:
          type: integer
          description: "当前生效的阈值（秒）"
        retry_after_sec:
          type: integer
          description: "与 `Retry-After` 头同值"
    NodeUploadError:
      type: object
      description: |
        A1 节点产物上传的封闭错误体：`{"error": "<code>"}`。码集固定
        （`artifact_path_invalid` / `artifact_hash_mismatch` / `artifact_too_large` /
        `artifact_conflict` / `unauthorized` / `forbidden` /
        `artifact_upload_unavailable` / `internal`），节点侧只认这一种形状。
      required: [error]
      properties:
        error:
          type: string
          enum:
            - artifact_path_invalid
            - artifact_hash_mismatch
            - artifact_too_large
            - artifact_conflict
            - unauthorized
            - forbidden
            - artifact_upload_unavailable
            - internal

    # ------------------------------------------- 通用响应件（/yaml 文本承载）
    ResourceYAML:
      type: object
      description: |
        资源的 YAML 文本。两个方向都用这**同一个 shape**：

          - 只读端点的响应体（`GET …/capabilities/{name}/yaml`、
            `GET …/sources/{name}/yaml`）；
          - 两条 `POST …/yaml` 的请求体（`POST …/capabilities/yaml`、
            `POST …/sources/yaml`：把一份 YAML 文档贴回来创建资源）。

        **刻意不套信封**：信封规则的判据是「有 apiVersion + metadata」，
        给这个响应套信封会把它伪装成一种资源 kind。

        只读方向的 `yaml` 里是**存储定义的规范化重建**（不是用户原始字节；用户原文
        只在 playbook 包里），泄露面只到该资源的读投影（源的 `config.token` /
        `config.secret` 永不出现）；写入方向接受任意单文档 YAML（多文档、锚点/别名
        会被拒），`spec.config.token` / `secret` 是可写字段。
      additionalProperties: false
      required: [yaml]
      properties:
        yaml:
          type: string
          description: "资源文档全文（Capability 或 Source 的 YAML 文本）"

    # ------------------------------------------------------------ capability
    CapabilityEnvValue:
      description: |
        env 的一个值：字面量字符串，或 `{valueFrom:{fieldRef:{fieldPath}}}` 引用机器事实
        （字段路径是封闭集合，含 `vars.<NAME>`）。
      oneOf:
        - type: string
        - type: object
          required: [valueFrom]
          properties:
            valueFrom:
              type: object
              required: [fieldRef]
              properties:
                fieldRef:
                  type: object
                  required: [fieldPath]
                  properties:
                    fieldPath: {type: string}
    CapabilityRun:
      type: object
      description: "「怎么跑」（v4 只有脚本一种执行形式）"
      required: [entrypoint, files]
      properties:
        entrypoint:
          type: string
          description: "必须是 `files` 里的一个 key，且正文以 `#!` 开头（直接 exec，不经 shell）"
        files:
          type: object
          description: "相对路径 → 正文（全部展开进工作目录，0600；入口额外 0700）"
          additionalProperties: {type: string}
        env:
          type: object
          additionalProperties: {$ref: '#/components/schemas/CapabilityEnvValue'}
        workDir:
          type: string
          description: |
            执行目录模板：空 = 每次任务独立目录；否则绝对路径模板，可含
            `$(vars.NAME)` / `$(params.NAME)`。
    CapabilityRequires:
      type: object
      required: [commands, values]
      properties:
        commands:
          type: array
          description: "节点必须能 LookPath 到的命令（缺一条 → 该节点不匹配）"
          items: {type: string}
        values:
          type: array
          description: "必须能解析出的 `vars.<NAME>`（local → node → namespace 顺序）"
          items: {type: string}
    CapabilityLifecycle:
      type: object
      required: [idempotent, timeoutSec]
      description: |
        指针字段是「省略 vs 显式」的分界线：省略 `maxAttempts` = 3、省略
        `resultTtlSec` = 604800；显式 0 在 `resultTtlSec` 表示永不清、在
        `maxAttempts` 是非法值。
      properties:
        idempotent:
          type: boolean
          description: "明确幂等才允许对短暂基础设施失败自动重试"
        maxAttempts:
          type: integer
          minimum: 1
          description: "总尝试次数（含首次）；省略 = 3"
        resultTtlSec:
          type: integer
          minimum: 0
          description: "结果保留期（秒）；省略 = 604800，0 = 永不清理"
        timeoutSec:
          type: integer
          minimum: 0
          maximum: 86400
          description: "本地执行超时（秒，0 = 不设）"
    CapabilityConcurrency:
      type: object
      properties:
        maxPerNode:
          type: integer
          minimum: 1
          description: "该节点上最多同时跑几个；省略 = 1。超了不失败（停在 waiting_for_slot）"
    CapabilitySpec:
      type: object
      description: "能力的全部内容（六个字段；字段顺序参与 digest）"
      required: [params, next, run, requires, lifecycle, concurrency]
      properties:
        params:
          type: object
          description: |
            任务输入契约（JSON Schema 对象；省略 = `{}` = 怎么传都过）。
            写入期编译 `pattern`（RE2）：编不过 / 不是字符串 / 超过长度上限 → 400
            `param_pattern_invalid`，`details.causes[].field` 指到
            `spec.params.properties.<name>.pattern`。试跑与派发期执行 `pattern`：
            只约束字符串值，整串匹配请自带 `^...$`（RE2 默认子串匹配）。
          additionalProperties: true
        next:
          type: array
          description: "下游引用（`name` 或 `name@version`）；空 = 终端能力。不参与 digest"
          items: {type: string}
        run: {$ref: '#/components/schemas/CapabilityRun'}
        requires: {$ref: '#/components/schemas/CapabilityRequires'}
        lifecycle: {$ref: '#/components/schemas/CapabilityLifecycle'}
        concurrency: {$ref: '#/components/schemas/CapabilityConcurrency'}
      additionalProperties: false
    CapabilityCondition:
      type: object
      required: [type, status, reason]
      properties:
        type: {type: string}
        status: {type: string}
        reason: {type: string}
        message: {type: string}
    CapabilityNodeState:
      type: object
      required: [name, state]
      properties:
        name: {type: string}
        state:
          type: string
          description: "节点侧该 digest 的部署状态（deployed / pending / offline / …）"
    CapabilityResolvedNext:
      type: object
      required: [name]
      properties:
        name: {type: string}
        version:
          type: integer
          description: "解析出的版本；解析不到时**省略**（不公开哨兵 0）"
        digest:
          type: string
          description: "解析出的 digest；解析不到时省略"
        missing:
          type: boolean
          description: "下游不存在"
        reason:
          type: string
          description: "未解析原因（如 `downstream_missing`）"
    CapabilityResolved:
      type: object
      required: [next]
      properties:
        next:
          type: array
          items: {$ref: '#/components/schemas/CapabilityResolvedNext'}
    CapabilityStatus:
      type: object
      description: "只读派生面（无 reconciler、无 observedGeneration）"
      required: [version, digest, ready, conditions, nodes, deployCandidates, resolved, observed]
      properties:
        version: {type: integer}
        digest: {type: string, description: 内容标识（能力 spec 的 canonical sha256）}
        enabled:
          type: boolean
          description: |
            该能力是否接受新的**自动**触发（派生投影：从 `capability_switches` 的开关行读，
            无行 = `true`）。`false` 只拦自动触发（源事件 / 上游 emit 不建任务，留剪枝事实
            `capability_disabled`）：已排队与进行中的任务不受影响，`deploy` / 建版本 / 删除
            也照旧可用，人工 `POST …/test` 仍然能跑。与 `DELETE`（tombstone）无关。
        ready:
          type: boolean
          description: "四条 condition 全 True 且无 missing 下游"
        conditions:
          type: array
          items: {$ref: '#/components/schemas/CapabilityCondition'}
        nodes:
          type: array
          description: "**已经持有**这份能力（或持有旧 digest）的机器及其状态；首次部署前恒为 `[]`"
          items: {$ref: '#/components/schemas/CapabilityNodeState'}
        deployCandidates:
          type: array
          description: |
            “人工部署”可以把这份能力推过去的机器（**部署**判据，与 `nodes` 是两件事）：
            节点申报 ∩ 授权覆盖本命名空间、不在排空中；`online` 是此刻的连接事实。
            不看“是否已经部署过”（那是 `nodes` / NodesAvailable 的事）——否则首次部署时这里恒空，
            弹窗就只能写“没有候选节点”。
          items: {$ref: '#/components/schemas/CapabilityDeployCandidate'}
        resolved: {$ref: '#/components/schemas/CapabilityResolved'}
        observed:
          # 从没跑过时是空对象 `{}`（四个键都不写）；已跑但窗口内零条是 tasks:{total:0,failed:0}。
          $ref: '#/components/schemas/CapabilityObserved'
        installedFrom:
          type: string
          description: "初次安装来源（`ins_…`）；手工创建的能力没有这个键"
    CapabilityObserved:
      type: object
      description: |
        观察到的派生事实（capability.md §2「observed」）。

        **没有事实时是 `{}`**：四个键全部不写。这是刻意的向后兼容（本域早先恒返回
        `{}`），也让「从没跑过」不需要额外哨兵。
      additionalProperties: false
      properties:
        taskId:
          type: string
          description: "最近一个逻辑任务的 id；没有可保留的历史时整个键不出现（不是空串）"
        emits:
          type: array
          description: "最近任务自己的 emit（按发生顺序，至多 50 条）"
          items: {$ref: '#/components/schemas/CapabilityObservedEmit'}
        pruned:
          type: array
          description: "最近任务被剪掉的下游（按发生顺序，至多 50 条）"
          items: {$ref: '#/components/schemas/CapabilityObservedPrune'}
        tasks:
          $ref: '#/components/schemas/CapabilityObservedTasks'
    CapabilityObservedEmit:
      type: object
      description: "一次 emit：交给了谁、带了哪些字段、有没有真的建出任务"
      additionalProperties: false
      required: [to, fields, ok]
      properties:
        to:
          type: string
          description: "目标引用（`name` 或 `name@version`）"
        fields:
          type: array
          description: "本次请求体的**键名**（排序后）；请求体没有键时是 `[]` 而不是 null"
          items: {type: string}
        ok:
          type: boolean
          description: |
            这次 emit 是否**真的建出了任务**：剪枝回执（`taskId:null` + `pruned`）为 `false`；
            没有回执的旧行视为 `true`。注意下游任务**执行失败**仍是 `true` —— 「发出去没有」
            与「发出去之后成不成」是两个字段（后者看 `tasks.failed`）。
    CapabilityObservedPrune:
      type: object
      description: "一条剪枝事实：事件收到了，下游没建任务"
      additionalProperties: false
      required: [to, reason, detail]
      properties:
        to:
          type: string
          description: "没被派发出去的那个下游"
        reason:
          type: string
          description: "剪枝码（`param_missing` / `param_schema` / `param_type` / `no_target` / `event_schema`）"
        detail:
          type: string
          description: "人话补充，可为空串；不参与任何判断"
    CapabilityObservedTasks:
      type: object
      description: "近 24h 的计数——只够判断「最近是不是老挂」，不是统计报表"
      additionalProperties: false
      required: [total, failed]
      properties:
        total:
          type: integer
          description: "窗口内该能力的任务总数"
        failed:
          type: integer
          description: "其中 `phase=failed` 的数量"
    CapabilityDeployCandidate:
      type: object
      required: [name, online]
      properties:
        name: {type: string}
        online:
          type: boolean
          description: "此刻是否有已认证的节点 WS 会话；离线的候选仍可接部署意图（行落成 pending，重连时补齐）"
    Capability:
      type: object
      description: "能力文档（信封）"
      required: [apiVersion, kind, metadata, spec, status]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Capability]}
        metadata: {$ref: '#/components/schemas/ObjectMeta'}
        spec: {$ref: '#/components/schemas/CapabilitySpec'}
        status: {$ref: '#/components/schemas/CapabilityStatus'}
    CapabilityList:
      type: object
      required: [apiVersion, kind, metadata, items]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [CapabilityList]}
        metadata: {$ref: '#/components/schemas/ListMeta'}
        items:
          type: array
          items: {$ref: '#/components/schemas/Capability'}
    CapabilityWrite:
      type: object
      description: "写请求（`status` 非空 → 400 status_not_writable；未知字段 → 400 unknown_field）"
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Capability]}
        metadata:
          type: object
          required: [name]
          properties:
            name: {type: string}
            displayName: {type: string}
            version:
              type: integer
              minimum: 1
              description: "省略 = 按内容折叠复用已有行"
            namespace: {type: string}
            resourceVersion:
              type: string
              description: "PATCH 必填（CAS）"
          additionalProperties: false
        spec: {$ref: '#/components/schemas/CapabilitySpec'}
      additionalProperties: false
    CapabilityPatch:
      type: object
      description: "原地更新（只允许 `spec.next` / `metadata.displayName`；正文改动 → 400 immutable_field）"
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Capability]}
        metadata:
          type: object
          required: [name, resourceVersion]
          properties:
            name: {type: string}
            displayName: {type: string}
            resourceVersion: {type: string}
          additionalProperties: false
        spec: {$ref: '#/components/schemas/CapabilitySpec'}
      additionalProperties: false
    CapabilityDeployRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
          description: "省略 = 最新版本"
        nodes:
          type: array
          description: "目标节点名；省略 = 全部已授权且在线节点"
          items: {type: string}
    CapabilityDeployOutcome:
      type: object
      required: [node, state, sent]
      properties:
        node: {type: string}
        state:
          type: string
          description: "deployed / pending / offline / …"
        sent:
          type: boolean
          description: "是否真的发出了 capability.deploy 帧"
        requestId: {type: string}
    CapabilityDeployResponse:
      type: object
      required: [deployed, version]
      properties:
        deployed:
          type: array
          items: {$ref: '#/components/schemas/CapabilityDeployOutcome'}
        version: {type: integer}
    CapabilityDisableRequest:
      type: object
      description: |
        停用动作的可选 body。`reason` 只进审计的 `detail.reason`（不进 `status`）：
        「为什么停」是可追溯的操作事实，不是能力的期望状态。
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
          description: "停用原因（如「上游在改接口」）；超过 200 字符 → 400 `value_invalid`"
    CapabilityTestRequest:
      type: object
      description: "试跑动作的可选 body（三个字段全部可省略）"
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: "省略 / 0 = 当前 live 版本（与 PATCH/deploy 同一条解析）；显式版本不存在 → 404"
        params:
          type: object
          additionalProperties: true
          description: |
            该能力 `spec.params` 的实参；服务端按 JSON Schema 校验（不合 → 400，
            `details.causes[].field` 指到具体参数路径）
        nodes:
          type: array
          description: |
            试跑诊断用的**候选节点白名单**（节点名或 id）：给出时回执的 `warnings` 只按这些节点
            判「有没有机器能跑」；解析不到 → 404。
            注意：v4 的派发在 `lease.grant` 时按「在线 + 授权 + 已 applied + 持有所需 digest」选点，
            任务行**不钉节点**，所以本字段不改变最终派发到哪台机器。
          items: {type: string}
    CapabilityTestWarning:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [capability_not_deployed]
          description: |
            `capability_not_deployed` = 已排队，但当前没有（指定的）节点持有需要的 digest。
            任务停在 `pending`，节点上线或部署收敛后自动派发——它不是 4xx，也不是任务失败码。
        detail: {type: string}
    CapabilityTestReceipt:
      type: object
      description: |
        试跑回执（与 `SourceReceipt` 同形状口径：空列表恒 `[]`，`tasks[].taskId` 一定是
        **已建任务**的 id）。状态码是 200（已建任务、还没跑完），不是 202。
      required: [traceId, origin, tasks, pruned, warnings]
      properties:
        traceId: {type: string}
        origin:
          type: string
          enum: [test]
          description: "恒 `test`（让前端把人工试跑和外部投递分开）"
        tasks:
          type: array
          items: {$ref: '#/components/schemas/SourceReceiptTask'}
        pruned:
          type: array
          items: {$ref: '#/components/schemas/PruneFact'}
        warnings:
          type: array
          description: "「跑得起来但会等」的观察（不是 4xx、也不是任务失败码）"
          items: {$ref: '#/components/schemas/CapabilityTestWarning'}
    CapabilityAuditEntry:
      type: object
      description: "该能力的一次操作（append-only；没有删除/修改入口）"
      required: [id, action, actor, at, detail]
      properties:
        id: {type: string}
        action:
          type: string
          enum: [enable, disable, test]
        actor:
          type: string
          description: "发起操作的用户 id；空串 = 非会话主体（CLI / 系统），不做伪造"
        at:
          type: string
          description: "RFC3339（UTC）"
        detail:
          type: object
          additionalProperties: true
          description: |
            操作摘要：`enable`/`disable` 记 `{reason}`，`test` 记 `{traceId, version}`。
            试跑的 params 全文**不**落审计（参数里可能有业务数据）。
    CapabilityAuditList:
      type: object
      description: "审计列表（非信封，与 EdgeList 同类）：`items` 最新在前，空为 `[]`"
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CapabilityAuditEntry'}
    CapabilityEdge:
      type: object
      required: [from, to, kind]
      properties:
        from: {type: string}
        to: {type: string}
        kind:
          type: string
          enum: [capability, source]
          description: "边的来源（能力 spec.next 还是源 spec.targets）"
    EdgeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CapabilityEdge'}
    CapabilityTemplateField:
      type: object
      required: [key, label, type, required, default, help]
      properties:
        key:
          type: string
          description: "必须是 snake_case（会变成 ANOTIFY_PARAM_<UPPER>）"
        label: {type: string}
        type:
          type: string
          enum: [string, text, number, select]
        required: {type: boolean}
        default: {type: string}
        options:
          type: array
          items: {type: string}
        help: {type: string}
    CapabilityTemplate:
      type: object
      required: [id, displayName, category, description, fields, script, requires, next, timeoutSec]
      properties:
        id: {type: string}
        displayName: {type: string}
        category: {type: string, enum: [script, agent]}
        description: {type: string}
        fields:
          type: array
          items: {$ref: '#/components/schemas/CapabilityTemplateField'}
        script: {type: string, description: 入口文件 `run.sh` 的正文（不做文本插值）}
        requires:
          type: array
          items: {type: string}
        next:
          type: array
          items: {type: string}
        timeoutSec: {type: integer}
    CapabilityTemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: {$ref: '#/components/schemas/CapabilityTemplate'}

    # ---------------------------------------------------------------- source
    SourceTarget:
      type: object
      required: [capability]
      properties:
        capability: {type: string, description: 能力引用（`name` 或 `name@version`）}
        params:
          type: object
          description: |
            该下游的固定入参（JSON 对象，可省）。模板里只认 `$(payload)` / `$(payload.路径)`：
            `$(decision.…)` 属于 outcomes 动作（#522），写在这里建任务时求不出来、只会永远留成
            字面量，所以写入期直接 400（`invalid_source_config`，message 指出参数路径）。
          additionalProperties: true
        match:
          $ref: '#/components/schemas/SourceMatch'
        outcomes:
          type: object
          description: |
            **router 的结局表**（#522 / A3「判断用能力，执行留 hub」）：结局名 → 1..N 个动作。

            非空表示这个 target 的能力是 router——它只**判断**、只选一个结局名，平台按表
            **执行**。结局名就是白名单：陌生的事件内容最多影响 `params`，影响不了「运行哪段
            程序」。`params` 与 `outcomes` 同时出现是合法的（params 是 router 的输入）。

            - 结局名：`^[a-z0-9][a-z0-9_-]{0,31}$`，最多 32 个；单个结局最多 16 个动作。
            - `drop: []` 合法：**空动作 = 留痕不派发**（`outcome_dropped`）。
            - 动作的 `capability` 必须 ∈ 这个能力版本 `spec.next` 里声明过的下游 → 否则
              写入期 400（`details.causes[].field` 指到 `spec.targets[0].outcomes.close[0].capability`）。
            - 动作参数模板有两个根名：`$(payload.路径)` 在建 router 任务时求值，
              `$(decision.路径)` 在判决执行时求值（取不到 → 该动作按 `param_missing` 剪枝）。
            - 判决怎么回传：router 任务拿到一次性 `ANOTIFY_DECISION_TOKEN` 与
              `ANOTIFY_DECISION_URL`，`POST` 决策端点提交 `{outcome, params}`；任务结束仍无
              判决 → `no_decision`，任务失败 → `router_failed`，都不静默、都不派发。
          additionalProperties:
            type: array
            maxItems: 16
            items: {$ref: '#/components/schemas/SourceOutcomeAction'}
    SourceOutcomeAction:
      type: object
      required: [capability]
      description: |
        outcomes 表里的一条动作（#522）：结局被选中后要派给哪个下游能力。
      properties:
        capability:
          type: string
          description: |
            能力引用（`name` 或 `name@version`）。必须 ∈ router 能力 `spec.next` 里声明过的
            下游（裸名要在同 basename 的唯一声明里命中；`name@v` 只认精确声明）。
        params:
          type: object
          description: |
            动作参数模板：常量、`$(payload.路径)`（建任务时求值）与 `$(decision.路径)`
            （判决执行时用判决的 `params` 求值）混写。下游 `spec.params` 的 required 取不到
            → 该动作按 `param_missing` 剪枝（不是 4xx）。
          additionalProperties: true
    SourceMatch:
      type: object
      description: |
        条件派：`types` 是事件类型白名单（#513），`all` / `any` 是字段级组合子（#519）。

        - 不写 `match` → 全部命中（现状）。写了任意一组就按它判：三组**同时出现是 AND**、
          `all` 内 AND、`any` 内 OR；各组都必须非空（空组合子恒成立，等于没写它）。
        - 不命中时事件**照常入库**、回执 `pruned[].reason = no_match`、HTTP 仍 200、不建任务。
        - 求值顺序在解析下游**之前**：不命中的边不会去查目标能力，也不会报
          `downstream_missing`（那条边本来就不该看这次事件）。
        - 叶子取不到值或类型不符 → 该行 false（**不是**错误、不 500）：想知道「字段缺失或
          不等于 X」用 `negate: true`（`!=` 与 `==` 在字段缺失时都是 false）。
        - 写入期 400：未知键、空组合子、非法 `op`、`matches` 正则编不过、`field` 路径语法
          非法、单组超过 32 行、`value` 形状与 `op` 不符。`details.causes[].field` 指到
          `spec.targets[0].match.all[1].op` 这一层。
      properties:
        types:
          type: array
          description: 精确、大小写敏感的事件类型白名单（如 `issues.opened`）
          items: {type: string}
        all:
          type: array
          description: 每一行都必须成立（≥1 行，≤32 行）
          items: {$ref: '#/components/schemas/SourceMatchLeaf'}
        any:
          type: array
          description: 至少一行成立（≥1 行，≤32 行）
          items: {$ref: '#/components/schemas/SourceMatchLeaf'}
    SourceMatchLeaf:
      type: object
      required: [field, op]
      description: |
        一条字段级判据（#519）。`field` 是点号路径 + 数字下标（`issue.labels.0.name`），
        与 `config.envelope` 的指针、params 模板**同一套方言**（`$.a.b` 与 `a.b` 同义）。

        `op` 与 #512 的 router 规则表同一套词表：`== != > >= < <= contains matches in exists`。
        `matches` 用 RE2（写入期编译）；`contains` 大小写敏感；`>`/`>=`/`<`/`<=` 只比数字
        （`value` 必须是数字）；`in` 要求 `value` 是数组；`exists` 不看 `value`。
        `negate: true` 翻转整行结论（含「字段缺失」）。
      properties:
        field:
          type: string
          description: 载荷里的点号路径（数字段是数组下标），如 `issue.pull_request`
        op:
          type: string
          enum: ["==", "!=", ">", ">=", "<", "<=", contains, matches, in, exists]
          description: 比较词表（封闭集合；写别的值 400）
        value:
          description: "比较项：字符串 / 数字 / 布尔 / null / 数组（`in` 用）"
        negate:
          type: boolean
          description: 翻转整行结论（默认 false）
    SourceSpec:
      type: object
      description: |
        读形态的源 spec。`config` 是 kind 相关的自由对象，但**读**的时候
        `token`/`secret` 永不出现，webhook 另给只读投影 `hookUrl` / `secretSet`。
      required: [kind, enabled, config, targets]
      properties:
        kind:
          type: string
          description: "源类型（`webhook` / `cron` / `manual` / `poll`）；创建后不可变"
        enabled: {type: boolean}
        config:
          type: object
          description: |
            kind 相关的配置。读形态含只读投影 `hookUrl`（webhook）与 `secretSet`（bool）；
            `token`/`secret` 只写不读。

            写路径按 kind 封闭校验（`internal/sourcespec/config.go`），未知键 →
            400 `invalid_source_config`。webhook 额外两个适配键（#513）：

              envelope:   # 从哪取 {type, deliveryId, payload}；三个维度各自可缺省
                type:       { header: "x-github-event", joinFrom: "$.action" }
                deliveryId: { header: "x-github-delivery" }
                payload:    { whole: true }        # 或 { pointer: "$.data.object" }
              signature: { scheme: "github-sha256" }  # 或 anotify-sha256 / 省略

            规则：`type`/`deliveryId` 的 `header` 与 `pointer` 二选一（`joinFrom` 只
            `type` 支持）；`payload` 的 `whole: true` 与 `pointer` 二选一；缺省的
            维度回落今天的语义（`body.type` / `body.id` / `body.payload`），所以不写
            `envelope` = 逐字等价于今天的契约。指针是点号路径（`$.a.b` 与 `a.b` 同义，
            数字段表示数组下标，不支持通配/函数）。任一指针取不到时：`type` 回落源名、
            `deliveryId` 不去重、`payload` → 400。

            `config.payload` 对四个 kind **同语义**（静态打底 + 入站一层覆盖，冲突时
            入站覆盖静态）；webhook 以前接受但静默丢弃，本版起真生效。

            `kind: poll`（#532）的键（拉取型传输，只做 http-json）：

              url:       https://api.github.com/advisories?per_page=50   # 必填，只允许 https
              headers:   { Accept: application/vnd.github+json }         # 可选，≤20 项
              secretRef: { name: gh-token, header: Authorization, prefix: "Bearer " }
              schedule:  { expr: "*/5 * * * *", tz: UTC }                # 与 cron 同一套表达式
              timeoutMs: 10000        # 默认 10000，夹到 [1000, 60000]
              maxItems:  100          # 默认 100，硬上限 500；超限 = 该轮失败不截断
              allowInsecure: false    # 只给 e2e：允许 http + 跳过私网判据
              envelope:  { items: ".", type: {pointer: type}, deliveryId: {pointer: id}, payload: {pointer: ""} }

            `envelope.items` 是**第四个指针**：在响应里定位事件数组（`.` = 顶层数组，`$.data` /
            `data.items` 都行）；空/非数组 → 该次轮询失败（不是「0 条」）。其余三指针是**每个
            item 内部**的路径，方言与 webhook 完全同一套（共用 `walkPath`）。

            `secretRef.name` 指向命名空间凭据：值是 write-only 的 `secret`（写一次即落库，读取
            永不回显，PATCH 省略 = 保留），`sources.config` 里只有引用。引用不存在且本次没给
            `secret` → 400（`details.causes[].field = config.secretRef`）。
          additionalProperties: true
        targets:
          type: array
          items: {$ref: '#/components/schemas/SourceTarget'}
    SourceStatus:
      type: object
      description: "只读派生面"
      required: [hookUrl, enabled, health, targetsResolved, lastError, consecutiveFailures, skippedOverlaps]
      properties:
        hookUrl:
          type: string
          description: "webhook 源的调用地址（含 token 之外的公开部分）"
        lastFiredAt:
          type: string
          format: date-time
          description: "省略 = 从未触发；`kind: poll` 的语义是最近一次**成功**轮询"
        nextFireAt:
          type: string
          format: date-time
          description: "cron / poll 源的下次触发；省略 = 无排期"
        cursor:
          type: string
          description: |
            `kind: poll` 的不透明游标（服务端不解释）：上一次**整轮成功**响应的
            `ETag` / `Last-Modified`，下一轮作为 `If-None-Match` 发回。失败时不前进，
            省缺 = 还没有游标。
        lastPollAt:
          type: string
          format: date-time
          description: "`kind: poll` 最近一次**完成**的轮询（成功或失败都推进）；省略 = 从未轮询"
        consecutiveFailures:
          type: integer
          description: "`kind: poll` 连续失败数（成功清零）；其它 kind 恒 0"
        skippedOverlaps:
          type: integer
          description: "`kind: poll` 因上一轮未结束而跳过的 tick 数（不重叠纪律）；其它 kind 恒 0"
        enabled: {type: boolean}
        health:
          type: string
          enum: [ok, blocked, disabled]
        targetsResolved: {type: boolean}
        lastError:
          type: string
          nullable: true
          description: |
            最近一次失败的人话（脱敏；`kind: poll` 落库）。没有失败事实时恒 `null`。
            非 poll 源目前没有这个落库事实，恒 `null`。
    Source:
      type: object
      required: [apiVersion, kind, metadata, spec, status]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Source]}
        metadata: {$ref: '#/components/schemas/ObjectMeta'}
        spec: {$ref: '#/components/schemas/SourceSpec'}
        status: {$ref: '#/components/schemas/SourceStatus'}
    SourceList:
      type: object
      required: [apiVersion, kind, metadata, items]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [SourceList]}
        metadata: {$ref: '#/components/schemas/ListMeta'}
        items:
          type: array
          items: {$ref: '#/components/schemas/Source'}
    SourceWrite:
      type: object
      description: |
        写请求。`spec.config.hookUrl` / `spec.config.secretSet` 是**只读投影**，
        出现在写请求里 → 400 `unknown_field`。PATCH 省略 token = 保留旧值。
        `metadata.name` 创建后不可变；`spec.kind` 创建后不可变。
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Source]}
        metadata:
          type: object
          required: [name]
          properties:
            name: {type: string}
            resourceVersion:
              type: string
              description: "PATCH/DELETE 的 CAS（DELETE 走 query）"
          additionalProperties: false
        spec:
          type: object
          properties:
            kind: {type: string}
            enabled: {type: boolean}
            config:
              type: object
              description: "kind 相关配置；`token`/`secret` 为写入态（只写不读）"
              additionalProperties: true
            targets:
              type: array
              items: {$ref: '#/components/schemas/SourceTarget'}
          additionalProperties: false
      additionalProperties: false
    PruneFact:
      type: object
      required: [reason]
      properties:
        capability:
          type: string
          description: "被剪枝的目标（省略 = 整条输入没解析出目标）"
        reason:
          type: string
          description: |
            剪枝原因（封闭集合：`no_target` / `event_schema` / `param_schema` /
            `param_type` / `param_missing` / `downstream_missing`）。它是**剪枝事实**，
            不是任务失败码、也不是 4xx。
        detail: {type: string}
    SourceReceiptTask:
      type: object
      required: [taskId, capability]
      properties:
        taskId: {type: string}
        capability: {type: string, description: 真实请求名（保留 basename 语义）}
        version:
          type: integer
          description: "已解析版本；没有事实时**省略**（不公开 0）"
    SourceReceipt:
      type: object
      description: |
        投递/触发回执（W6 冻结形状）。`tasks[].taskId` 一定是**已建任务**的 id：
        未解析下游导致的失败任务也有真实 id，且出现在这里（E1）。
      required: [eventId, traceId, duplicate, tasks, pruned]
      properties:
        eventId: {type: string}
        traceId: {type: string}
        duplicate:
          type: boolean
          description: "幂等键命中（同 `deliveryId`/`id` 的重复投递）"
        tasks:
          type: array
          items: {$ref: '#/components/schemas/SourceReceiptTask'}
        pruned:
          type: array
          items: {$ref: '#/components/schemas/PruneFact'}
    SourcePreviewTarget:
      type: object
      required: [capability, params, state]
      properties:
        capability: {type: string}
        version:
          type: integer
          description: "解析不到具体版本时省略（不回会被当成真实版本的 0）"
        params:
          type: object
          additionalProperties: true
        state:
          type: string
          enum: [ready, pruned, missing]
        reason: {type: string}
        detail: {type: string}
    SourcePreview:
      type: object
      description: "试运行预览（**不**入事件/任务/去重表，所以没有 eventId/taskId）"
      required: [targets, pruned]
      properties:
        targets:
          type: array
          items: {$ref: '#/components/schemas/SourcePreviewTarget'}
        pruned:
          type: array
          items: {$ref: '#/components/schemas/PruneFact'}

    # -------------------------------------------------------------- playbook
    PlaybookSpec:
      type: object
      description: "默认摘要时是 `{}`；`?includeBody=true` 时给整份包体"
      properties:
        files:
          type: object
          additionalProperties: {type: string}
    PlaybookRequirement:
      type: object
      description: |
        包入口 `playbook.yaml` 的 `spec.requires` 一条：**包外依赖** —— 本包不安装它
        （也不替它造版本），只要求安装这一刻命名空间里已经有它（由别的包或手工创建提供）。
        `minVersion` 省略 = 任意已装版本。上界 32 条（含）；同一 `capability` 重复出现 = 400。
        写入期错误是 400 `invalid_playbook`，`details.causes[].field` 形如
        `spec.requires[0].capability`、`spec.requires[0].minVersion`。
      required: [capability]
      properties:
        capability:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: "被依赖能力的名字（字面量：不参与 `{{values.*}}` 渲染，按能力名规则校验）"
        minVersion:
          type: integer
          minimum: 1
          description: "至少要有的可见版本；省略 = 任意已装版本。显式写了但小于 1（含非整数）→ 400"
      additionalProperties: false
    PlaybookDependency:
      type: object
      description: |
        安装回执里的这条依赖**当时解析到**的可见版本（`dependencies[]` 的一项）：
        安装那一刻命名空间里该能力的最高版本。它是一次安装的审计原文，
        依赖锁的判定不看回执（看库里的依赖索引）。
      required: [capability, version]
      properties:
        capability: {type: string}
        version:
          type: integer
          description: "安装那一刻该能力的可见最高版本"
      additionalProperties: false
    PlaybookCondition:
      type: object
      required: [type, status]
      properties:
        type: {type: string}
        status: {type: string}
        reason: {type: string}
        message: {type: string}
        members:
          type: array
          items: {type: string}
    PlaybookItem:
      type: object
      required: [kind, name, state]
      properties:
        kind: {type: string, enum: [Capability, Source]}
        name: {type: string}
        version: {type: integer}
        state:
          type: string
          enum: [ok, no_node]
          description: "能力的 `no_node` = 当前节点池里没有能跑它的节点（= 该能力 NodesAvailable 不为 True）；源沿用 ok 等四态"
    PlaybookSourceStatus:
      type: object
      required: [total, unapplied]
      properties:
        total: {type: integer}
        unapplied: {type: integer}
    PlaybookUnappliedEntry:
      type: object
      required: [kind, ref, field, declared, actual, reason]
      properties:
        kind: {type: string}
        ref: {type: string}
        field: {type: string}
        declared:
          description: "声明值（JSON；能力路由是数组，源 targets 是对象数组）"
        actual:
          description: "库里现值"
        reason: {type: string}
    PlaybookStatus:
      type: object
      required: [ready, unapplied, total, conditions, items, sources, lastInstallId, source]
      properties:
        ready:
          type: boolean
          description: "四条 condition 全 True 且 unapplied 为空。四个 type 是成员能力的聚合（各成员全 True 才 True）"
        unapplied:
          type: array
          items: {$ref: '#/components/schemas/PlaybookUnappliedEntry'}
        total: {type: integer}
        conditions:
          type: array
          items: {$ref: '#/components/schemas/PlaybookCondition'}
        items:
          type: array
          items: {$ref: '#/components/schemas/PlaybookItem'}
        sources: {$ref: '#/components/schemas/PlaybookSourceStatus'}
        lastInstallId: {type: string}
        source:
          type: string
          nullable: true
          description: "OCI 来源的只读投影（`oci://…@sha256:…`）；手传包体时是 `null`"
    PlaybookVersionEntry:
      type: object
      description: "历史里的一版（不含包体原文）"
      required: [version, filesDigest, createdAt, createdBy, current]
      properties:
        version: {type: integer}
        filesDigest:
          type: string
          description: "这一版包体的 canonical sha256；与安装回执的 `playbook.filesDigest` 同一个算法"
        createdAt: {type: string, format: date-time}
        createdBy:
          type: string
          description: "写入这一版的操作者 id（手传包体时为空串）"
        current:
          type: boolean
          description: "这一版就是当前版本（当前版本的包体在 `spec.files`，本行只是标记）"
    PlaybookVersionList:
      type: object
      required: [total, currentVersion, versions]
      properties:
        total: {type: integer}
        currentVersion:
          type: integer
          description: "当前版本号（= `metadata.version`；当前包体仍以 `spec.files` 为准）"
        versions:
          type: array
          items: {$ref: '#/components/schemas/PlaybookVersionEntry'}
    Playbook:
      type: object
      required: [apiVersion, kind, metadata, spec, status]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Playbook]}
        metadata: {$ref: '#/components/schemas/ObjectMeta'}
        spec: {$ref: '#/components/schemas/PlaybookSpec'}
        status: {$ref: '#/components/schemas/PlaybookStatus'}
    PlaybookList:
      type: object
      required: [apiVersion, kind, metadata, items]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [PlaybookList]}
        metadata: {$ref: '#/components/schemas/ListMeta'}
        items:
          type: array
          items: {$ref: '#/components/schemas/Playbook'}
    PlaybookWrite:
      type: object
      description: |
        整份包体（`playbook.yaml` 是唯一根清单，不复制第二份并行 spec）。
        `spec.files` 里的 `playbook.yaml` 可以用 `spec.requires` 声明**包外依赖**
        （形状见 `PlaybookRequirement`：`[{capability, minVersion?}]`，上界 32 条）。
        创建/替换期的形状错误是 400 `invalid_playbook`，`details.causes[].field` 形如
        `spec.requires[0].capability`、`spec.requires[0].minVersion`。
        「依赖是否满足」不在这里判（创建只是把声明落库），安装期才解析。
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Playbook]}
        metadata:
          type: object
          required: [name]
          properties:
            name: {type: string, description: 包的 slug；创建后不可变}
            displayName: {type: string}
            version:
              type: integer
              minimum: 1
            namespace: {type: string}
            resourceVersion:
              type: string
              description: "PUT（整体替换）必填"
          additionalProperties: false
        spec:
          type: object
          description: "`files` 与 `source` **二选一**"
          properties:
            files:
              type: object
              additionalProperties: {type: string}
            source:
              type: string
              description: "OCI 引用；v4 一期返回 400 `oci_unsupported`"
          additionalProperties: false
      additionalProperties: false
    PlaybookActionRequest:
      type: object
      description: |
        动作请求（`render` 忽略 `dryRun`）。
        `release` 是**安装级身份**（Helm 语义）：同一个包可以有多个 release，
        每个 release 一套名字与 values、互不干扰。它是动作参数，不是资源写路径。
      properties:
        values:
          type: object
          description: "包 values（缺省用 playbook.yaml 的默认值）"
          additionalProperties: true
        dryRun:
          type: boolean
          description: "install 时 0 持久写（回执仍返回）"
        release:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: |
            安装级身份（1..63 个字符，首字符是小写字母或数字，其余只允许小写字母、
            数字、`.`、`_`、`-`）。缺省 = 包名（slug），也就是老包的行为。
            不同 release 的实例可以并存；要复用的行属于另一个 release 时 install 回
            409 `release_conflict`。`{{release.name}}` 在包模板里展开成它。
        version:
          type: integer
          minimum: 1
          description: |
            包版本（`GET …/versions` 里的一行）。缺省 = 当前版本，行为与不传时逐字相同。
            渲染与安装都用**被钉住版本**的文件；历史里没有这一版且它也不是当前版本时
            → `404` `version_not_found`（不回退成当前版本）。
    PlaybookRef:
      type: object
      description: |
        回执里的包身份。`version` 是**这次真的用的那一份**（按版本安装时是被钉住的那一版），
        `filesDigest` 是那份包体自己的 canonical 摘要（`sha256:<64 hex>`）——两个字段
        一起回答「这次装的是哪一版」，不用回头比文件。
      required: [name, version, filesDigest]
      properties:
        name: {type: string}
        version: {type: integer}
        filesDigest:
          type: string
          description: "包体 `{路径: 正文}` 的 canonical sha256（排序 + 长度前缀，与版本列表的 digest 同源）"
    PlaybookInstallRef:
      type: object
      description: |
        安装回执的身份（`playbook.InstallRef`，`ins_…`）。内容身份在回执**顶层**的
        `valuesDigest` 上，不在这个对象里：这里是「这次 install 是哪一次」的三件事
        （id / 时间 / 是否 dryRun）。
      required: [id, at, dryRun, release]
      properties:
        id: {type: string}
        at:
          type: string
          format: date-time
          description: "这次 install 的时间（RFC3339）"
        dryRun:
          type: boolean
          description: "dryRun=true 的回执不进库（只是预览）"
        release:
          type: string
          description: |
            这次安装的 release（安装级身份；缺省 = 包名）。实例清单按
            `(release, valuesDigest)` 折叠，回执上的 release 与分组里的一致。
    PlaybookCreated:
      type: object
      required: [capabilities, sources]
      properties:
        capabilities:
          type: array
          items: {type: string}
        sources:
          type: array
          items: {type: string}
    PlaybookUpgradedEntry:
      type: object
      description: "「已存在且被本次安装升级」的一条"
      additionalProperties: true
    PlaybookNote:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        ref: {type: string}
        message: {type: string}
    PlaybookReceipt:
      type: object
      description: |
        安装回执（`InstallReceipt`，动作文档例外：不是资源 kind）。
        `values` 里 JSON Schema 标 `writeOnly` 的字段已被替换成 `"***"`；
        `valuesDigest` 对**打码前**的值算（同一组值仍然可比）。
      required: [apiVersion, kind, playbook, install, namespace, values, valuesDigest, created, skipped, upgraded, unapplied, external, pending, notes]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [InstallReceipt]}
        playbook: {$ref: '#/components/schemas/PlaybookRef'}
        source:
          type: string
          description: "从 registry 拉来的包才有（`oci://…@sha256:…`）"
        install: {$ref: '#/components/schemas/PlaybookInstallRef'}
        namespace: {type: string}
        values:
          type: object
          description: "打码后的有效 values"
          additionalProperties: true
        valuesDigest: {type: string}
        created: {$ref: '#/components/schemas/PlaybookCreated'}
        skipped: {$ref: '#/components/schemas/PlaybookCreated'}
        upgraded:
          type: array
          items: {$ref: '#/components/schemas/PlaybookUpgradedEntry'}
        unapplied:
          type: array
          items: {$ref: '#/components/schemas/PlaybookUnappliedEntry'}
        external:
          type: array
          items: {type: string}
        pending:
          type: array
          items: {type: string}
        dependencies:
          type: array
          items: {$ref: '#/components/schemas/PlaybookDependency'}
          description: |
            本次安装解析到的外部依赖（`spec.requires` 逐条：能力名 + 当时可见的最高版本）。
            没有依赖时是 `[]`（不是 `null`）。**不在 `required` 里**：这个键是 #534 才加的，
            更早的回执读出来时同样归一成 `[]` —— 客户端按「缺省 = 空数组」处理。
        notes:
          type: array
          items: {$ref: '#/components/schemas/PlaybookNote'}
    RenderedCapability:
      type: object
      description: "归一化后的能力文档（默认值已补齐；与手工创建逐字节等价）"
      additionalProperties: true
    RenderedSource:
      type: object
      description: "渲染后的源文档"
      additionalProperties: true
    PlaybookRenderResult:
      type: object
      required: [values, valuesDigest, files, capabilities, sources]
      properties:
        values:
          type: object
          description: "有效 values（打码前）"
          additionalProperties: true
        valuesDigest: {type: string}
        files:
          type: object
          description: "渲染后的 `{路径: 正文}`（不含 playbook.yaml）"
          additionalProperties: {type: string}
        capabilities:
          type: array
          items: {$ref: '#/components/schemas/RenderedCapability'}
        sources:
          type: array
          items: {$ref: '#/components/schemas/RenderedSource'}
    PlaybookInstallGroup:
      type: object
      required: [release, valuesDigest, values, firstAt, lastAt, attempts, lastInstallId, capabilities, sources]
      description: |
        一个折叠组 = 一个 release 的一套 values（`attempts` 是这组装了几次，不是版本号）。
        折叠键是 `(release, valuesDigest)`：换一个 release 就是另一套实例，单独立组。
      properties:
        release: {type: string}
        valuesDigest: {type: string}
        values:
          type: object
          additionalProperties: true
        firstAt: {type: string, format: date-time}
        lastAt: {type: string, format: date-time}
        attempts: {type: integer}
        lastInstallId: {type: string}
        capabilities:
          type: array
          items: {type: string}
        sources:
          type: array
          items: {type: string}
    PlaybookInstallList:
      type: object
      required: [total, installs]
      properties:
        total:
          type: integer
          description: "折叠组总数（可能大于返回条数：超过上限按 lastAt 截断）"
        installs:
          type: array
          items: {$ref: '#/components/schemas/PlaybookInstallGroup'}
    PlaybookKept:
      type: object
      required: [capabilities, sources]
      properties:
        capabilities:
          type: array
          description: "留下了什么能力（`name@version`）"
          items: {type: string}
        sources:
          type: array
          description: "留下了什么源（名字）"
          items: {type: string}
    PlaybookDeleteResult:
      type: object
      required: [deleted, kept, values, note]
      properties:
        deleted: {type: boolean}
        kept: {$ref: '#/components/schemas/PlaybookKept'}
        values:
          type: array
          description: "这包装过的有效 values 组（打码后，按 valuesDigest 去重）"
          items:
            type: object
            additionalProperties: true
        note: {type: string}
    PlaybookUninstallResult:
      type: object
      required: [release, alreadyUninstalled, uninstalledAt, installIds, removed, kept, note]
      properties:
        release: {type: string}
        alreadyUninstalled:
          type: boolean
          description: "为真时本次零写：removed 两个列表与 kept 都是 []"
        uninstalledAt: {type: string, format: date-time}
        installIds:
          type: array
          description: "该 release 的全部回执 id（已卸载时仍返回）"
          items: {type: string}
        removed: {$ref: '#/components/schemas/PlaybookKept'}
        kept:
          type: array
          items: {$ref: '#/components/schemas/PlaybookUninstallKept'}
        note: {type: string}
    PlaybookUninstallKept:
      type: object
      required: [kind, name, reason]
      properties:
        kind: {type: string, enum: [capability, source]}
        name: {type: string}
        version:
          type: integer
          description: "仅能力有（源名在命名空间内唯一）"
        reason:
          type: string
          enum: [manual, other_release, shared_by_release]
          description: "manual=同名的行是手工建的；other_release=同名行属于别的安装；shared_by_release=被另一个仍生效的 release 复用"
        ownerRelease:
          type: string
          description: "仅 other_release / shared_by_release 有"

    # ------------------------------------------------------------- namespace
    NamespaceSpec:
      type: object
      description: "空对象（v4 不做「建命名空间时播种内置能力」）"
      additionalProperties: false
    NamespaceCounts:
      type: object
      required: [capabilities, nodes, sources, tasks]
      properties:
        capabilities: {type: integer}
        nodes: {type: integer}
        sources: {type: integer}
        tasks: {type: integer}
    NamespaceAggregate:
      type: object
      required: [tasksByPhase, edges]
      properties:
        tasksByPhase:
          type: object
          additionalProperties: {type: integer}
        edges: {type: integer}
    NamespaceStatus:
      type: object
      required: [counts, stats]
      properties:
        counts: {$ref: '#/components/schemas/NamespaceCounts'}
        stats: {$ref: '#/components/schemas/NamespaceAggregate'}
    Namespace:
      type: object
      required: [apiVersion, kind, metadata, spec, status]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Namespace]}
        metadata: {$ref: '#/components/schemas/ObjectMeta'}
        spec: {$ref: '#/components/schemas/NamespaceSpec'}
        status: {$ref: '#/components/schemas/NamespaceStatus'}
    NamespaceList:
      type: object
      required: [apiVersion, kind, metadata, items]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [NamespaceList]}
        metadata: {$ref: '#/components/schemas/ListMeta'}
        items:
          type: array
          items: {$ref: '#/components/schemas/Namespace'}
    NamespaceWrite:
      type: object
      description: "创建只需要 `metadata.name`；PATCH 带 `metadata.resourceVersion`"
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Namespace]}
        metadata:
          type: object
          required: [name]
          properties:
            name: {type: string}
            displayName: {type: string, description: PATCH 必填}
            resourceVersion:
              type: string
              description: "PATCH 必填（CAS）"
          additionalProperties: false
        spec: {$ref: '#/components/schemas/NamespaceSpec'}
      additionalProperties: false
    ConfigMeta:
      type: object
      required: [resourceVersion]
      properties:
        resourceVersion:
          type: string
          description: "配置子资源的 CAS 令牌（系统配置是纯十进制整数）"
    NamespaceConfig:
      type: object
      description: "命名空间配置 wrapper（不是资源：没有 apiVersion/kind/spec/status）"
      required: [metadata, vars, namespaceVarsRevision]
      properties:
        metadata: {$ref: '#/components/schemas/ConfigMeta'}
        vars:
          type: object
          additionalProperties: {type: string}
        namespaceVarsRevision:
          type: string
          description: "配置生效版本（不是 CAS 令牌；PUT 不接受该字段）"
    NamespaceConfigWrite:
      type: object
      required: [metadata, vars]
      properties:
        metadata: {$ref: '#/components/schemas/ConfigMeta'}
        vars:
          type: object
          additionalProperties: {type: string}
        status:
          type: object
          description: "非空 → 400 `status_not_writable`"
      additionalProperties: false
    Retention:
      type: object
      required: [eventTtlSec, taskTtlSec, resultTtlSec]
      properties:
        eventTtlSec: {type: integer, minimum: 0, description: 0 = 永久保留}
        taskTtlSec: {type: integer, minimum: 0, description: 0 = 永久保留}
        resultTtlSec: {type: integer, minimum: 0, description: 0 = 永久保留}
    SystemConfig:
      type: object
      required: [metadata, retention]
      properties:
        metadata: {$ref: '#/components/schemas/ConfigMeta'}
        retention: {$ref: '#/components/schemas/Retention'}
    SystemConfigWrite:
      type: object
      description: "三个字段都必填（省略不是 0：0 是「永久保留」这个有语义的常量）"
      required: [metadata, retention]
      properties:
        metadata: {$ref: '#/components/schemas/ConfigMeta'}
        retention: {$ref: '#/components/schemas/Retention'}
      additionalProperties: false

    # ------------------------------------------------------------------ node
    NodeSpec:
      type: object
      required: [namespaces, vars, limits, tags]
      properties:
        namespaces:
          type: array
          description: "授权列表（与本机申报取交集，只能收紧）"
          items: {type: string}
        vars:
          type: object
          additionalProperties: {type: string}
        limits:
          type: object
          additionalProperties: true
        tags:
          type: array
          items: {type: string}
    NodeCapacity:
      type: object
      required: [cpu]
      properties:
        cpu:
          type: string
          description: "wire 上是字符串（与本机 facts 的 int 不是同一形状）"
    NodeInstanceRef:
      type: object
      required: [id, task, busy]
      properties:
        id:
          type: string
          description: "实例身份（`nins_…`），**不是** wire 上的 slot"
        task:
          type: string
          nullable: true
          description: "该槽此刻的任务；`null` = 空闲"
        busy: {type: boolean}
    NodeStatus:
      type: object
      required: [online, draining, localVars, nodeVars, machineVars, configRevision, appliedRevision, appliedHash, effectiveNamespaces, instances]
      properties:
        online:
          type: boolean
          description: "这一刻有没有一条**已认证**的节点 WebSocket 会话（派生事实，不落库；不是用 lastSeenAt 猜的）。控制台靠它区分在线/离线"
        draining:
          type: boolean
          description: "是否被置为排空中（`POST /v1/nodes/{name}/drain`）：跑完手上的任务后不再接新任务（派生自 nodes.status=draining）"
        hostIP: {type: string}
        hostname: {type: string}
        os: {type: string}
        arch: {type: string}
        capacity: {$ref: '#/components/schemas/NodeCapacity'}
        workRoot: {type: string}
        homeDir: {type: string}
        localVars:
          type: object
          additionalProperties: {type: string}
        nodeVars:
          type: object
          additionalProperties: {type: string}
        machineVars:
          type: object
          additionalProperties: {type: string}
        configRevision:
          type: string
          description: "配置生效版本（中枢生成）；不是 CAS 令牌"
        appliedRevision:
          type: string
          description: "节点回报的已应用版本"
        appliedHash: {type: string}
        effectiveNamespaces:
          type: array
          items: {type: string}
        agentVersion: {type: string}
        instances:
          type: array
          items: {$ref: '#/components/schemas/NodeInstanceRef'}
        lastSeenAt: {type: string, format: date-time}
        namespaceVars:
          type: object
          description: "只有 `GET …?namespace=` 时出现"
          additionalProperties: {type: string}
        effectiveVars:
          type: object
          description: "只有 `GET …?namespace=` 时出现（每项是 `{value,source}`）"
          additionalProperties:
            type: object
            additionalProperties: true
    NodeReadContext:
      type: object
      required: [namespace]
      properties:
        namespace: {type: string}
    Node:
      type: object
      required: [apiVersion, kind, metadata, spec, status]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Node]}
        metadata: {$ref: '#/components/schemas/ObjectMeta'}
        spec: {$ref: '#/components/schemas/NodeSpec'}
        status: {$ref: '#/components/schemas/NodeStatus'}
        context:
          $ref: '#/components/schemas/NodeReadContext'
    NodeList:
      type: object
      required: [apiVersion, kind, metadata, items]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [NodeList]}
        metadata: {$ref: '#/components/schemas/ListMeta'}
        items:
          type: array
          items: {$ref: '#/components/schemas/Node'}
    NodeWrite:
      type: object
      description: "PATCH 是 merge-patch：`namespaces`/`tags` 省略 = 不动，显式空数组 = 清空"
      required: [apiVersion, kind, metadata, spec]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Node]}
        metadata:
          type: object
          required: [name]
          properties:
            name: {type: string}
            resourceVersion:
              type: string
              description: "PATCH 必填（CAS）"
          additionalProperties: false
        spec:
          type: object
          properties:
            namespaces:
              type: array
              items: {type: string}
            vars:
              type: object
              additionalProperties: {type: string}
            limits:
              type: object
              additionalProperties: true
            tags:
              type: array
              items: {type: string}
          additionalProperties: false
      additionalProperties: false
    NodeConfig:
      type: object
      description: |
        节点默认值子资源（不是独立 kind：没有 apiVersion/kind/spec/status）。
        与 `Node.spec` 是同一份底层事实、同一个 `resourceVersion`。
      required: [metadata, namespaces, vars, limits, configRevision, appliedRevision, appliedHash]
      properties:
        metadata: {$ref: '#/components/schemas/ConfigMeta'}
        namespaces:
          type: array
          items: {type: string}
        vars:
          type: object
          additionalProperties: {type: string}
        limits:
          type: object
          additionalProperties: true
        configRevision:
          type: string
          description: "只读（UI 不提交，也不当 CAS 令牌）"
        appliedRevision: {type: string}
        appliedHash: {type: string}
    NodeConfigWrite:
      type: object
      required: [metadata, namespaces, vars, limits]
      properties:
        metadata: {$ref: '#/components/schemas/ConfigMeta'}
        namespaces:
          type: array
          items: {type: string}
        vars:
          type: object
          additionalProperties: {type: string}
        limits:
          type: object
          additionalProperties: true
      additionalProperties: false
    NodeToken:
      type: object
      description: "令牌文档（动作响应例外，不是资源：没有 GET/list/DELETE）"
      required: [apiVersion, kind, node, token]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [NodeToken]}
        node:
          type: object
          required: [name]
          properties:
            name: {type: string}
        token:
          type: string
          writeOnly: false
          description: |
            节点身份令牌**明文**，只在这个响应里出现一次；库里只存 sha256。
            再次 POST = 轮换，旧令牌立即失效。
    NodeConfigBatchUpdate:
      type: object
      description: "三个可写字段都可选：省略 = 该项不动（不是清空）"
      required: [name, metadata]
      properties:
        name: {type: string}
        metadata:
          type: object
          required: [resourceVersion]
          properties:
            resourceVersion: {type: string}
          additionalProperties: false
        vars:
          type: object
          additionalProperties: {type: string}
        limits:
          type: object
          additionalProperties: true
        namespaces:
          type: array
          items: {type: string}
    NodeConfigBatchRequest:
      type: object
      required: [updates]
      properties:
        updates:
          type: array
          items: {$ref: '#/components/schemas/NodeConfigBatchUpdate'}
    NodeConfigBatchItem:
      type: object
      required: [name, ok]
      properties:
        name: {type: string}
        ok: {type: boolean}
        config: {$ref: '#/components/schemas/NodeConfig'}
        error:
          $ref: '#/components/schemas/Status'
    NodeConfigBatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/NodeConfigBatchItem'}
    NodeUpgradeResult:
      type: object
      required: [status, targetVersion]
      properties:
        status:
          type: string
          enum: [sent, up_to_date]
        targetVersion: {type: string}

    # ------------------------------------------------------------------ task
    TaskRef:
      type: object
      required: [name]
      properties:
        kind: {type: string, enum: [Task]}
        name: {type: string}
    TaskCapabilityRef:
      type: object
      description: |
        任务钉住的能力身份。`version`/`digest` **只在有真实事实时出现**（S1/E1）：
        未解析的派发失败没有解析出能力行，就不公开 version 0、更不造 digest。
      required: [name]
      properties:
        name: {type: string, description: 真实请求名（保留 basename 语义）}
        version:
          type: integer
          description: "声明/解析出的正版本；未声明且未解析时省略"
        digest: {type: string}
    TaskSpec:
      type: object
      required: [traceUID, parentRef, parentTaskId, capability, params]
      properties:
        traceUID: {type: string}
        parentRef:
          allOf: [{$ref: '#/components/schemas/TaskRef'}]
          nullable: true
        parentTaskId:
          type: string
          nullable: true
        capability:
          allOf: [{$ref: '#/components/schemas/TaskCapabilityRef'}]
          nullable: true
        params:
          type: object
          additionalProperties: true
    TaskEnvDiagnostic:
      type: object
      required: [name, source]
      properties:
        name: {type: string}
        source:
          type: string
          description: "值的来源层（local / node / namespace / machine / …）"
    TaskResult:
      type: object
      description: "结果事实；`artifacts` 恒为 `[]`"
      required: [summary, artifacts, error]
      properties:
        summary: {type: string}
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/TaskArtifactRef'}
        error:
          allOf: [{$ref: '#/components/schemas/TaskResultError'}]
          nullable: true
    TaskResultError:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: "封闭失败码（`script_failed` / `downstream_missing` / `max_attempts_exceeded` / …）"
        message: {type: string}
    TaskDecisionRequest:
      type: object
      required: [outcome]
      description: |
        router 的判决（#522）。`outcome` 必须是该任务 `outcomes` 表里声明过的结局名。
      properties:
        outcome:
          type: string
          description: "结局名（白名单 = 任务的 outcomes 表）"
        params:
          type: object
          description: "判决的附加事实（`reason` 等）；结局动作的 `$(decision.…)` 模板消费它"
          additionalProperties: true
    TaskDecisionResponse:
      type: object
      required: [taskId, outcome, actions]
      properties:
        taskId: {type: string}
        outcome: {type: string}
        actions:
          type: integer
          description: |
            该结局挂的动作数（`drop: []` → 0）。平台在任务成功终态之后才执行它们，
            所以它不是「已建任务数」。
    TaskArtifactRef:
      type: object
      required: [path, sha256]
      properties:
        path:
          type: string
          description: "逻辑相对路径（无绝对路径 / `..` / 反斜杠）"
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    TaskStatus:
      type: object
      description: "全部从 tasks 行派生（S2）。`configRevision`/`namespaceVarsRevision` 是**生效版本**，不是 CAS。"
      required: [phase, waitingReason, nextAttemptAt, nodeName, attempt, maxAttempts, leaseExpiresAt, startedAt, finishedAt, configRevision, namespaceVarsRevision, result]
      properties:
        phase:
          type: string
          description: "pending / waiting_for_slot / running / succeeded / failed / cancelled / abandoned"
        waitingReason:
          type: string
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        nodeName:
          type: string
          nullable: true
        attempt:
          type: integer
          description: "只有 lease.grant 生效才递增；未派发即失败的任务恒为 0"
        maxAttempts: {type: integer}
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        configRevision: {type: string}
        namespaceVarsRevision: {type: string}
        result: {$ref: '#/components/schemas/TaskResult'}
        envDiagnostics:
          type: array
          items: {$ref: '#/components/schemas/TaskEnvDiagnostic'}
    Task:
      type: object
      description: "任务文档。Task 不可 POST/DELETE，spec 不可变，没有 resourceVersion。"
      required: [apiVersion, kind, metadata, spec, status]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [Task]}
        metadata: {$ref: '#/components/schemas/ObjectMeta'}
        spec: {$ref: '#/components/schemas/TaskSpec'}
        status: {$ref: '#/components/schemas/TaskStatus'}
    TaskList:
      type: object
      required: [apiVersion, kind, metadata, items]
      properties:
        apiVersion: {type: string, enum: [anotify/v1]}
        kind: {type: string, enum: [TaskList]}
        metadata: {$ref: '#/components/schemas/ListMeta'}
        items:
          type: array
          items: {$ref: '#/components/schemas/Task'}
    TaskActionRequest:
      type: object
      properties:
        reason:
          type: string
          description: "人话原因（可选；写进 cancel_requested 事实）"
      additionalProperties: false
    TaskLogLine:
      type: object
      required: [sequence, stream, text, at]
      properties:
        sequence:
          type: integer
          description: "节点采集序号（保持节点侧顺序，不按时间重排）"
        stream:
          type: string
          enum: [stdout, stderr]
        text: {type: string}
        at:
          type: string
          format: date-time
          description: "节点采集时间"
    TaskLogs:
      type: object
      description: "logs 子资源（例外文档：没有 apiVersion/kind）"
      required: [taskId, attempt, lines, truncated]
      properties:
        taskId: {type: string}
        attempt:
          type: integer
          description: "**真实读到**的 attempt（`previous` 且无上一次时为 0）"
        lines:
          type: array
          items: {$ref: '#/components/schemas/TaskLogLine'}
        truncated: {type: boolean}
    TaskEmissionItem:
      type: object
      description: |
        一次 emit 调用的事实。`taskId`/`pruned` 是可空事实：剪枝回执的 `taskId`
        就是**真 null**（已接收、没派发）；解析不出时给 null，不猜。
      required: [eventId, to, taskId, pruned]
      properties:
        eventId: {type: string}
        to: {type: string}
        version:
          type: integer
          description: "省略 = 未声明且未解析（不公开哨兵 0）"
        taskId:
          type: string
          nullable: true
        id:
          type: string
          description: "调用方给的幂等键（可重复请求但只留一条事实）"
        pruned:
          # 与 PruneFact（route.Prune）**不是**同一个 DTO：emit 的剪枝回执来自节点侧的
          # protocol.EmitPruned，只有 reason/detail —— 目标在本次 emit 的 `to` 上，
          # 没有「解析出来的能力」可报（`taskEmissionItemOf` 只搬 reason/detail）。
          allOf:
            - type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: "剪枝原因（封闭集合：no_target / param_missing / downstream_missing …）"
                detail:
                  type: string
                  description: "人话补充（缺哪个参数/字段），不参与判定"
          nullable: true
    TaskEmissions:
      type: object
      description: "emissions 子资源（例外文档：没有 apiVersion/kind）"
      required: [metadata, items]
      properties:
        metadata: {$ref: '#/components/schemas/ListMeta'}
        items:
          type: array
          items: {$ref: '#/components/schemas/TaskEmissionItem'}

    # ----------------------------------------------------------- deployments
    Deployment:
      type: object
      description: "「某节点应当拥有某份产物」+ 节点回报的状态（只读投影）"
      required: [id, namespaceId, nodeId, capabilityId, capability, version, digest, state, reason, createdAt, updatedAt]
      properties:
        id: {type: string}
        namespaceId: {type: string}
        nodeId: {type: string}
        capabilityId: {type: string}
        capability: {type: string}
        version: {type: integer}
        digest: {type: string}
        state: {type: string}
        reason: {type: string}
        createdAt: {type: integer}
        updatedAt: {type: integer}
    DeploymentList:
      type: object
      required: [deployments]
      properties:
        deployments:
          type: array
          items: {$ref: '#/components/schemas/Deployment'}

  responses:
    Status400:
      description: "请求内容/字段校验失败（`reason` 见 Status.reason 封闭集合）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status401:
      description: "未认证（handler 内产生的 Status 形状；中间件产生的见 AuthError401）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status403:
      description: "已认证但无权限"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status404:
      description: "资源不存在（或不可见）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status405:
      description: "路径存在但该方法已退役（`Allow: GET, HEAD`）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status409:
      description: |
        冲突：`resource_version_conflict`（带 `details.current.resourceVersion`）、
        `AlreadyExists`、`Conflict`、`slug_taken`、`source_name_used`、`node_offline`、
        `dependency_missing`（`spec.requires` 的能力没有可见版本 / 版本不够）、
        `dependency_locked`（能力被已生效的安装依赖着）等
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status410:
      description: |
        事实已消失但引用仍在：`artifact_expired`（托管副本已清、manifest 仍在）、
        `no_local_archive`（节点上没有该 attempt 的日志档案）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status413:
      description: "请求体过大"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status429:
      description: "限流（`details.retryAfterSeconds` 与 `Retry-After` 头同值）"
      headers:
        Retry-After:
          description: "建议重试间隔（秒）"
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status500:
      description: "服务端内部错误"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status501:
      description: "能力未启用（如中枢没有自带 agent 二进制 → `agent_binary_unavailable`）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status502:
      description: "上游（节点）返回不可用响应（透传节点错误码）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status503:
      description: |
        依赖不可用：`node_offline`（节点离线）、`artifact_download_unavailable`
        （中枢没配置托管目录）等
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    Status504:
      description: "上游超时（`timeout`）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Status'}
    AuthError401:
      description: |
        未登录/凭据无效。`Content-Type` 有两种：中间件用 `http.Error` →
        `text/plain`（正文带换行），handler 用 `writeErr` → `application/json`；
        两种的 body 都是 `{"error": "..."}`。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthError'}
    AuthError403:
      description: "已登录但被中间件拒绝（超管/管理员权限不足）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthError'}
    AuthError429:
      description: "限流（hook 入口的写入口径）；带 `Retry-After` 头"
      headers:
        Retry-After:
          description: "建议重试间隔（秒）"
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthError'}
    Backpressure503:
      description: |
        派发积压（最老 pending 任务等待超过阈值）：只拒**新事件入口**，已入库任务不动。
        body 是 snake_case 的 `BackpressureError`，并带 `Retry-After` 头。
      headers:
        Retry-After:
          description: "建议重试间隔（秒）"
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BackpressureError'}
    AuthError400:
      description: "请求内容/字段校验失败（auth 域用 `writeErr`，`reason` 是**人话**而不是机器码）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthError'}
    AuthError404:
      description: "对象不存在或不可见（auth 域用 `writeErr`）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthError'}
    AuthError405:
      description: "方法不允许（裸挂载的 handler 内部 switch 落到 default）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthError'}
    AuthError409:
      description: "冲突（用户名已存在 / resourceVersion 冲突等，auth 域用 `writeErr`）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthError'}
    AuthError500:
      description: "服务端内部错误（auth 域会把底层错误文本放进 `error`）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthError'}
    AuthFlow409:
      description: |
        身份流程会话的状态冲突。两种真实形状（`oneOf`）：终态冲突回
        `{"status": "<当前状态>"}`（expired/denied/consumed 等）；已消费/重复提交
        回 `{"error": "..."}`。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AuthFlow'}
    NodeUploadError400:
      description: "逻辑路径不合法（`artifact_path_invalid`）或字节与 URL 里的 sha256 不符（`artifact_hash_mismatch`）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NodeUploadError'}
    NodeUploadError401:
      description: "节点身份无效（`unauthorized`）——节点侧终止不重试"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NodeUploadError'}
    NodeUploadError403:
      description: "授权事实不成立（`forbidden`：attempt/lease/token/相位/撤销/命名空间授权）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NodeUploadError'}
    NodeUploadError409:
      description: "同 attempt 同逻辑 path 但不同 hash（`artifact_conflict`，不偷偷覆盖）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NodeUploadError'}
    NodeUploadError413:
      description: "超过单文件 16 MiB / 单 attempt 64 MiB / 32 项（`artifact_too_large`）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NodeUploadError'}
    NodeUploadError503:
      description: "中枢没配置托管目录（`artifact_upload_unavailable`）"
      content:
        application/json:
          schema: {$ref: '#/components/schemas/NodeUploadError'}
