        - `status` / `metadata.uid` 等只读面 → 400 `status_not_writable` / `unknown_field`；
        - 文档层问题一律 400，`details.causes[].reason` ∈
          `invalid_yaml` / `unknown_field` / `value_invalid`。
      requestBody:
