        只读：写入入口是 `PUT /v1/system/config`（CAS），本端点不提供 PUT。
        管理员面：与 `GET /v1/system/config` 同一判据，非 admin → 403 `forbidden`
        （未登录仍是 401）。
      responses:
        '200':
          description: "ResourceYAML（`yaml` 为 SystemConfig 文档全文）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceYAML'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '403': {$ref: '#/components/responses/Status403'}
        '500': {$ref: '#/components/responses/Status500'}

