# anotify v4 · 资源域 HTTP 契约（exact-five 之一，共享组件的家）
#
# 本文件是五份 OpenAPI 真源中的 **resource.yaml**：#333 冻结归属表的 53 个 operation 在这里，
# 另有 4 条 `/yaml` 端点（共 57；归属表已删，本文件的 operation 集合即权威）——其中 2 条只读
# （`GET …/{name}/yaml`：
# 能力的正文全文 / 源的脱敏重建），2 条从 YAML 创建（`POST …/capabilities/yaml` /
# `POST …/sources/yaml`）；其余四份
# （events/agent/ingress/auth）通过**相对 `$ref`** 引用本文件的 components：
#
#     $ref: './resource.yaml#/components/schemas/Status'
#     $ref: './resource.yaml#/components/responses/Status400'
#
# 为什么共享组件放这里：api-conventions §3（信封）、§4（Status）、§7.5（配置 wrapper）
# 是**资源域**的语义，其它文件只是复用它们；放第六个文件会变成第二个真源。
#
# 归属键 = (METHOD, canonical path)：同 path 不同 method 不互相覆盖
# （`GET …/events` 在 events.yaml、`POST …/events` 在 ingress.yaml）。
# 路径写真实全路径 `/v1/...`，`servers` 不再补 `/v1`。
openapi: 3.1.0
info:
  title: "anotify v4 资源域 API"
  version: v4-g3c
  description: |
    Capability / Source / Playbook / Namespace / Node / Task 的管理与只读状态，以及
    只读的 edge / deployment 投影与公共 capability-templates。

    统一形状（api-conventions §3）：资源文档恒有 `apiVersion`(=anotify/v1) / `kind` /
    `metadata` / `spec` / `status` 五键；列表恒有 `items`（空为 `[]`）与 `metadata`。
    `status` 只读、从事实派生；写请求带非空 `status` → 400 `status_not_writable`。
    CAS 只走 `metadata.resourceVersion`（PUT/PATCH 在 body，DELETE 在 `?resourceVersion=`）。
servers:
  - url: /
    description: "路径自身已含 `/v1`，此处不再加前缀（否则会拼出 `/v1/v1/…`）"
tags:
  - name: capabilities
    description: "能力（版本 = capability_versions 的行；内容变化 = 新版本）"
  - name: sources
    description: "源（入口配置；fire / dry-run 属 ingress.yaml）"
  - name: playbooks
    description: "包（整份 playbook.yaml + 引用文件；install 只加不改）"
  - name: namespaces
    description: "命名空间与其配置 / 计数派生面"
  - name: nodes
    description: "节点登记、令牌、配置、drain / upgrade"
  - name: tasks
    description: "任务只读事实与动作（cancel / abandon / logs / emissions / 产物下载）"
  - name: deployments
    description: "只读的「某节点持有某 digest」事实投影"
paths:
  # ---------------------------------------------------------------- capabilities
  /v1/namespaces/{namespace}/capabilities:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
    get:
      operationId: listCapabilities
      tags: [capabilities]
      security: [{session: []}]
      summary: "列出命名空间内的能力（同名多版本各一行，name 升序、版本降序）"
      description: |
        `metadata.continue` 是不透明游标（keyset，排序键 `(name, version)`，与响应顺序一致），
        绑定该命名空间；拿别的作用域的游标来用 → 400。末页不带 `continue`。
      parameters:
        - name: includeBody
          in: query
          required: false
          description: |
            `true`/`1` 时返回 `spec.run.files` 正文；默认剥离（文件正文可能很大，
            列表默认不带）。剥离只影响 `files`，其它字段不变。
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/ContinueQuery'
      responses:
        '200':
          description: "CapabilityList（items 恒为数组）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityList'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}
    post:
      operationId: createCapability
      tags: [capabilities]
      security: [{session: []}]
      summary: "创建能力版本（省略 version 时按内容折叠复用已有行）"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapabilityWrite'}
      responses:
        '201':
          description: "创建出的 Capability（version 与 digest 是真实派生值）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capability'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/capabilities/yaml:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
    post:
      operationId: createCapabilityFromYAML
      tags: [capabilities]
      security: [{session: []}]
      summary: "从一份 Capability YAML 文档创建（与 JSON 创建同一套语义）"
      description: |
        请求体是**一份 YAML 文档**，装在 JSON 的 `yaml` 字段里（与只读端点
        `GET …/{name}/yaml` 同一个 `ResourceYAML` shape，所以「取 → 改 → 贴回」
        是一次 schema 复用的往返）。不用 `Content-Type: application/yaml`：本仓
        YAML 正文一律作为字符串装在 JSON 里（playbook 的 `spec.files` 同款）。

        处理链路与 `POST …/capabilities` 完全一致：YAML 先在文档层做严格解析
        （语法 / 未知字段 / 类型 / `metadata.name` 必填，带行号与字段路径），
        转成 canonical JSON 后走同一个严格信封解码，再走同一套 store 语义。
        所以版本处置与 JSON 创建逐字相同：省略 `metadata.version` 时按内容
        （foldKey）折叠复用已有行；显式版本已存在且内容不同 →
        400 `version_content_immutable`；显式同版本同内容 → 201 复用。

        文档层问题一律 400，细节在 `details.causes[]`：
        `reason` ∈ `invalid_yaml`（语法错 / 重复键 / 多文档 / 锚点别名 / 自定义
        tag / 非字符串键 / 空文档）、`unknown_field`、`value_invalid`；
        顶层 `reason` 是第一条 cause 的 reason，`message` 带「第 N 行」定位。

        `status` 仍不可写（400 `status_not_writable`）：多文档导入（一次创建多个
        资源）刻意不支持，一份文档只建一个资源。

        响应集与它的 JSON 兄弟 `POST …/capabilities` **逐字一致**（`201` / `400` /
        `401` / `500`，不多不少）：YAML 只是另一种输入形状，不新增失败模式，也不
        吞掉任何一种 —— 所以这里同样不声明 `404`，`401` 同样用 `AuthError401`
        （401 恒由会话中间件产出，handler 内产不出）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceYAML'}
      responses:
        '201':
          description: "从 YAML 创建出的 Capability（version 与 digest 是真实派生值）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capability'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/capabilities/{name}:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/CapabilityNamePath'
    get:
      operationId: getCapability
      tags: [capabilities]
      security: [{session: []}]
      summary: "读取单个能力（恒为最新版本；按版本读请用 /versions/{version}）"
      parameters:
        - name: includeBody
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: "Capability"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capability'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}
    patch:
      operationId: patchCapability
      tags: [capabilities]
      security: [{session: []}]
      summary: "原地更新 `next` / `displayName`（正文与 version 不可变）"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapabilityPatch'}
      responses:
        '200':
          description: "更新后的 Capability（digest 不变、不新增版本行）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capability'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}
    delete:
      operationId: deleteCapability
      tags: [capabilities]
      security: [{session: []}]
      summary: "删除能力版本（CAS 走 query，无请求体）"
      description: |
        逻辑删除该名字的**全部可见版本**，不级联改引用方（`next` / 源 `targets` 悬空由派生状态报出来）。
        例外是依赖锁（#534）：该能力被**已生效安装**的预案 `spec.requires` 引用时返回 409
        `dependency_locked`，`details.causes[]` 一条一个消费者（`message` 带 playbook slug + release）。
        锁只统计**清单仍在**的安装 —— 删掉预案清单后那条回执已经没有可卸载的入口，不再锁能力；
        卸载对应 release 后放行。
      parameters:
        - $ref: '#/components/parameters/ResourceVersionQuery'
      responses:
        '204':
          description: "已删除（无响应体）"
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/capabilities/{name}/yaml:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/CapabilityNamePath'
    get:
      operationId: getCapabilityYAML
      tags: [capabilities]
      security: [{session: []}]
      summary: "读取能力的 YAML 全文（最高版本，**含**脚本正文）"
      description: |
        `yaml` 是这份能力的**存储定义的规范化重建**，**不是**用户当初贴的原始字节：
        用户原文只存在于 playbook 包的 files 里，库里存的是归一化后的结构化 spec
        （默认值已补齐、键序固定），所以重新 Parse 这份文本得到的 digest 与库里一致。

        取该 `name` 的**最高版本**（与 `GET …/{name}` 同一套判据，不存在 → 404）。
        `spec.run.files` 与其它 spec 字段（`params` / `next` / `requires` / `lifecycle` /
        `concurrency`）**总是**全文返回——这个端点的用途就是把正文拿走，默认读面剥正文
        的纪律不适用于它。

        `metadata` 只含 `name` / `version` / `displayName`，**不含** `namespace`
        （包内禁止 namespace，保证这份文本可整份贴回 playbook 包）。
      responses:
        '200':
          description: "ResourceYAML（`yaml` 为 Capability 文档全文）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceYAML'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/capabilities/{name}/versions:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/CapabilityNamePath'
    get:
      operationId: listCapabilityVersions
      tags: [capabilities]
      security: [{session: []}]
      summary: "列出某能力名的全部版本（版本降序）"
      parameters:
        - name: includeBody
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: "CapabilityList（每个版本一行，各有独立 metadata.uid）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityList'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/capabilities/{name}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/CapabilityNamePath'
      - name: version
        in: path
        required: true
        description: "版本号（≥1 的整数，不做前导零归一）"
        schema: {type: integer, minimum: 1}
    get:
      operationId: getCapabilityVersion
      tags: [capabilities]
      security: [{session: []}]
      summary: "读取指定版本"
      parameters:
        - name: includeBody
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: "Capability"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capability'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/capabilities/{name}/deploy:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/CapabilityNamePath'
    post:
      operationId: deployCapability
      tags: [capabilities]
      security: [{session: []}]
      summary: "人工部署到指定节点（写「某节点持有某 digest」事实并推 capability.deploy）"
      description: |
        部署是**人工**动作（v4 不做自动收敛）。省略 `nodes` 时由中枢自己挑合格节点
        （已授权该 ns + 在线 + 配置已 apply + 命令齐 + 所需 vars 可解析）；显式给
        `nodes` 时未获授权该 ns 的节点 → **403**（`ErrEmitNamespaceDenied`），
        而不是逐节点 `deployed` 里的失败项。
        响应逐节点给 `deployed` 结论；节点离线是 `state=offline`，不是 5xx。
        动作 POST 不套 CAS（api-conventions §4.5）。
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapabilityDeployRequest'}
      responses:
        '200':
          description: "部署结论"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityDeployResponse'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}
        '403': {$ref: '#/components/responses/Status403'}

  /v1/namespaces/{namespace}/capabilities/{name}/enable:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/CapabilityNamePath'
    post:
      operationId: enableCapability
      tags: [capabilities]
      security: [{session: []}]
      summary: "启用能力（幂等；无请求体）"
      description: |
        开关是**派生投影**之外的一个事实：`capability_switches` 里按 `(namespace, name)` 存一行，
        **没有行 = 启用**。所以「启用」的两种状态（无行 / enabled 行）是同一个语义，本端点
        不报错也不跳过审计——重复调 = 200 + 同一条审计又加一条（「我又确认了一次」也是事实）。

        返回**整个** `Capability` 而不是 `204`：页面拿到 `metadata.resourceVersion` 才能接着
        做 PATCH/删除，省一次往返。动作 POST **不套 CAS**（与 `deploy` 一致），也**不**改能力行
        的 `resourceVersion` —— 开关不是能力内容，换版本（PATCH）也不重置开关。

        启用不影响已经排队的任务，也不触发任何派发：它是「下一次触发判定」的读时闸门。
      responses:
        '200':
          description: "启用后的能力（`status.enabled: true`）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capability'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '403': {$ref: '#/components/responses/Status403'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/capabilities/{name}/disable:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/CapabilityNamePath'
    post:
      operationId: disableCapability
      tags: [capabilities]
      security: [{session: []}]
      summary: "停用能力（幂等；拒绝新触发，进行中的任务不受影响）"
      description: |
        停用拦的是**自动**触发：源事件路由到它、上游 emit 指向它，都不建任务，留在剪枝事实
        `capability_disabled` 里。已排队/进行中的任务**不取消、不暂停**；`deploy` / 建版本 /
        删除照旧可用；人工 `POST …/test` 仍然能跑（停用不是「关掉一切」）。

        `reason` 只进审计的 `detail.reason`（不进 `status`），每次覆盖（= 最近一次操作是谁、
        为什么），全 history 在 `capability_audit`。
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapabilityDisableRequest'}
      responses:
        '200':
          description: "停用后的能力（`status.enabled: false`）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capability'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '403': {$ref: '#/components/responses/Status403'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/capabilities/{name}/test:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/CapabilityNamePath'
    post:
      operationId: testCapability
      tags: [capabilities]
      security: [{session: []}]
      summary: "手动跑一次该能力（建真任务；事件带 origin=test 标记）"
      description: |
        试跑是一次**真实的运行**：建真任务、走真派发、真出结果。它不是 dry-run（源的 dry-run
        是 0 写入预览），也不是「重跑一条历史事件」。与 `fireSource` 同一状态码语义：
        **200 + 接收回执**（已建任务、还没跑完），不是 202。

        三条边界：

          - `version` 省略 = 当前 live 版本（与 PATCH/deploy 同一条解析）；显式版本不存在 → 404。
          - `params` 按 `spec.params` 的 JSON Schema 校验；不合 schema → **400**，
            `details.causes[]` 每条给 `{reason, field, message}`，`field` 指到具体参数路径
            （如 `params.diff`）。它不是剪枝：人工试跑没有「下游不接」这回事。
          - 一个节点都没持有该 digest 时**仍然 200**：任务停在 `pending`，回执给一条
            `warnings[{reason: capability_not_deployed}]`。把「现在没有在线机器」伪装成 4xx
            会让调用方去重试一个永远不会成功的请求。

        在 `disabled` 能力上**可用**（L-D2）：停用拦的是自动触发，人工验证手段不受影响。
        审计在同一事务里写 `action='test'`，`detail={traceId, version}`（不存参数全文）。
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapabilityTestRequest'}
      responses:
        '200':
          description: "接收回执（`tasks[].taskId` 是已建任务的 id）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityTestReceipt'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '403': {$ref: '#/components/responses/Status403'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/capabilities/{name}/audit:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/CapabilityNamePath'
    get:
      operationId: listCapabilityAudit
      tags: [capabilities]
      security: [{session: []}]
      summary: "该能力的最近操作（enable / disable / test，最新在前）"
      description: |
        非信封（与 `GET …/edges` 同类）：这是一份派生观察，不是可寻址资源。

        `items` 按 `created_at DESC, id DESC`（最新在前），空为 `[]`（不是 `null`）。
        `action` 闭集是 `enable` / `disable` / `test`；`actor` 空串 = 非会话主体（CLI/系统），
        不做伪造；`at` 是 RFC3339（UTC）；`detail` 恒为对象（`enable`/`disable` 记 `{reason}`，
        `test` 记 `{traceId, version}` —— 试跑的 params 全文不落审计）。

        `limit` 缺省 50、上限 200（服务端夹取）；非整数 → 400。
      parameters:
        - name: limit
          in: query
          required: false
          description: "最近多少条（1..200，缺省 50）"
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: "审计列表"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityAuditList'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '403': {$ref: '#/components/responses/Status403'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/edges:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
    get:
      operationId: listEdges
      tags: [capabilities]
      security: [{session: []}]
      summary: "只读的派发边投影（能力 spec.next + 源 spec.targets）"
      description: |
        Edge 不是可写资源：它由 `Capability.spec.next` 与 `Source.spec.targets` 派生。
        v4 删除了 `POST/DELETE /v1/edges` 与 `PUT …/downstreams`（api-conventions A5）。
        响应是 `{items: [...]}` 文档，不是资源列表（没有 apiVersion/kind）。
      responses:
        '200':
          description: "边投影"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EdgeList'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '405': {$ref: '#/components/responses/Status405'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/capability-templates:
    get:
      operationId: listCapabilityTemplates
      tags: [capabilities]
      security: [{session: []}]
      summary: "控制台「新建能力」的内置模板（cluster 级公共数据）"
      description: |
        模板是代码生成器的输入，不是执行器类型：v4 只有脚本一种执行形式。
        模板不做文本插值——用户填的值在运行时经环境变量进入脚本。
      responses:
        '200':
          description: "模板集合"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapabilityTemplateList'}
        '401': {$ref: '#/components/responses/AuthError401'}

  # -------------------------------------------------------------------- sources
  /v1/namespaces/{namespace}/sources:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
    get:
      operationId: listSources
      tags: [sources]
      security: [{session: []}]
      summary: "列出命名空间内的源"
      description: |
        `metadata.continue` 是不透明游标（keyset，排序 `createdAt` 降序 + `id` 破平局），
        绑定该命名空间；拿别的作用域的游标来用 → 400。末页不带 `continue`。
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/ContinueQuery'
      responses:
        '200':
          description: "SourceList"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceList'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}
    post:
      operationId: createSource
      tags: [sources]
      security: [{session: []}]
      summary: "创建源"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceWrite'}
      responses:
        '201':
          description: "创建出的 Source（config 已脱敏）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/sources/yaml:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
    post:
      operationId: createSourceFromYAML
      tags: [sources]
      security: [{session: []}]
      summary: "从一份 Source YAML 文档创建（与 JSON 创建同一套语义）"
      description: |
        请求体是**一份 Source YAML 文档**，装在 JSON 的 `yaml` 字段里（与
        `GET …/{name}/yaml` 同一个 `ResourceYAML` shape）。

        具体校验与 JSON 创建没有第二份实现：`kind` / `config` / `targets` 的判据仍
        只在 store / sourcespec 一处（YAML 层只负责文档形状与行号）。同名源 →
        409 `source_name_used`（`UNIQUE(namespace_id,name)` 是硬约束，不做 upsert）。

        凭据面不变：`spec.config.token` / `spec.config.secret` **可写**（与 JSON
        同义），但响应只走读投影——它们永不回显，webhook 用 `hookUrl` /
        `secretSet` 代替。`spec.config.hookUrl` / `secretSet` 出现在文档里 →
        400 `unknown_field`（只读投影不可写回），错误消息不含 config 原文。

        响应集与它的 JSON 兄弟 `POST …/sources` **逐字一致**（`201` / `400` / `401` /
        `404` / `409` / `500`，不多不少）：YAML 只是另一种输入形状，不新增失败模式，
        也不吞掉任何一种 —— 包括 `404`（路径里的命名空间不存在时
        `authorizePathNamespace` 真的 404）与 `AuthError401`（401 恒由会话中间件
        产出，handler 内产不出）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceYAML'}
      responses:
        '201':
          description: "从 YAML 创建出的 Source（config 已脱敏）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/sources/{name}:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - name: name
        in: path
        required: true
        description: "源名（同命名空间内唯一；与共享的来源名校验器同口径）"
        schema: {type: string}
    get:
      operationId: getSource
      tags: [sources]
      security: [{session: []}]
      summary: "读取单个源（`config.token`/`config.secret` 永不回显）"
      responses:
        '200':
          description: "Source"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}
    patch:
      operationId: patchSource
      tags: [sources]
      security: [{session: []}]
      summary: "merge-patch 更新源（省略 config.token = 保留旧值）"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceWrite'}
      responses:
        '200':
          description: "更新后的 Source"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}
    delete:
      operationId: deleteSource
      tags: [sources]
      security: [{session: []}]
      summary: "删除源（CAS 走 query）"
      parameters:
        - $ref: '#/components/parameters/ResourceVersionQuery'
      responses:
        '204':
          description: "已删除（无响应体）"
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/sources/{name}/yaml:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - name: name
        in: path
        required: true
        description: "源名（同命名空间内唯一；与共享的来源名校验器同口径）"
        schema: {type: string}
    get:
      operationId: getSourceYAML
      tags: [sources]
      security: [{session: []}]
      summary: "读取源的 YAML 全文（读投影重建，永不回显 token/secret）"
      description: |
        `yaml` 是这条源的**存储定义的规范化重建**，**不是**用户当初贴的原始字节。

        脱敏面与 `GET …/{name}` 完全相同：`config.token` / `config.secret` 永不出现，
        webhook 用只读投影 `hookUrl` / `secretSet` 代替——泄露面只到读投影，这个端点
        **不是**绕开脱敏的第二条路径。

        `metadata` 只写 `name` / `displayName`（**不含** `namespace`：包内禁止 namespace，
        保证这份文本可整份贴回 playbook 包）；`spec` 写 `kind` / `enabled` / `config` /
        `targets`，不写 `status`（status 是读时派生的，不是定义）。
      responses:
        '200':
          description: "ResourceYAML（`yaml` 为 Source 文档全文）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceYAML'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  # ------------------------------------------------------------------ playbooks
  /v1/namespaces/{namespace}/playbooks:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
    get:
      operationId: listPlaybooks
      tags: [playbooks]
      security: [{session: []}]
      summary: "列出命名空间内的包（默认摘要，不含包体全文）"
      description: |
        `metadata.continue` 是不透明游标（keyset，排序 `createdAt` 升序 + `id` 破平局），
        绑定该命名空间；拿别的作用域的游标来用 → 400。末页不带 `continue`。
      parameters:
        - name: includeBody
          in: query
          required: false
          description: "`true`/`1` 时每项返回整份 `spec.files`；默认 `spec` 是 `{}`。"
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/ContinueQuery'
      responses:
        '200':
          description: "PlaybookList"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybookList'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}
    post:
      operationId: createPlaybook
      tags: [playbooks]
      security: [{session: []}]
      summary: "创建包（整份包体；同 slug 已存在 → 409 slug_taken）"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaybookWrite'}
      responses:
        '201':
          description: "创建出的 Playbook"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Playbook'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/playbooks/{slug}:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - name: slug
        in: path
        required: true
        description: "包的 slug（`metadata.name`；创建后不可变）"
        schema: {type: string}
    get:
      operationId: getPlaybook
      tags: [playbooks]
      security: [{session: []}]
      summary: "读取包（默认摘要）"
      parameters:
        - name: includeBody
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: "Playbook"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Playbook'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}
    put:
      operationId: replacePlaybook
      tags: [playbooks]
      security: [{session: []}]
      summary: "整体替换包体（必须带 metadata.resourceVersion）"
      description: |
        PUT 是整体替换（不是 merge-patch）：`spec.files` 与 `spec.source` 二选一，
        两个都给/都不给 → 400 `invalid_playbook`；只给 `source` → 400 `oci_unsupported`
        （v4 一期没有 registry 拉取实现）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaybookWrite'}
      responses:
        '200':
          description: "替换后的 Playbook"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Playbook'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}
    delete:
      operationId: deletePlaybook
      tags: [playbooks]
      security: [{session: []}]
      summary: "删除包清单（不级联卸载；响应说明留下了什么）"
      parameters:
        - $ref: '#/components/parameters/ResourceVersionQuery'
      responses:
        '200':
          description: "删除结果（deleted / kept / values / note）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybookDeleteResult'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/playbooks/{slug}/render:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - name: slug
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: renderPlaybook
      tags: [playbooks]
      security: [{session: []}]
      summary: "只读渲染（不写库、不产生回执）"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaybookActionRequest'}
      responses:
        '200':
          description: "渲染产物（写库前形态）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybookRenderResult'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/playbooks/{slug}/install:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - name: slug
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: installPlaybook
      tags: [playbooks]
      security: [{session: []}]
      summary: "幂等安装（单事务；`dryRun` 时 0 持久写）"
      description: |
        安装冲突（库里已有行不许改）→ **400** `playbook_conflict`（不是 409），
        `details` 带 `valuesDigest` / `conflicts[]` / `hint`，整包原子 0 写。

        包声明的外部依赖（`spec.requires`）未满足 → **409**，同样一行不写；
        `details.causes[]` 逐条带 `field` / `message`，`field` 形如
        `spec.requires[0].capability`，判断依据写在 `message` 的字面里：
        - `dependency_missing`：依赖的能力在命名空间里没有可见版本（`message` 含
          `need: N, have: none`），或可见版本低于 `minVersion`（`message` 含
          `need: N, have: M`）；
        - `dependency_locked`：能力被已生效的安装依赖着（与
          `DELETE …/capabilities/{name}` 共用同一个 reason）。
        `dryRun: true` 走同一条路径，所以 400 / 409 一样会发（只是不落库）。
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaybookActionRequest'}
      responses:
        '200':
          description: "安装回执（values 已按 writeOnly 打码）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybookReceipt'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/playbooks/{slug}/versions:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - name: slug
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listPlaybookVersions
      tags: [playbooks]
      security: [{session: []}]
      summary: "包版本历史（读模型：不回包体原文）"
      description: |
        每次 PUT 把包体换掉时旧的那一份留在历史里，于是 `install` 可以按 `version`
        把旧版本再装一份（同一个包的不同版本可以各自有实例）。
        当前版本的真身仍是 `playbooks.files`：`spec.files` 只回答「现在是什么」，
        本读模型只回答「历史上有哪几版、每一版的内容摘要是什么」。
        内容没变的重复 PUT 不产生新的历史行。
      responses:
        '200':
          description: "版本列表（按 version 降序）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybookVersionList'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/playbooks/{slug}/installs:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - name: slug
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: listPlaybookInstalls
      tags: [playbooks]
      security: [{session: []}]
      summary: "实例清单（按 valuesDigest 折叠的读模型）"
      responses:
        '200':
          description: "折叠组清单（total 可能大于返回条数）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybookInstallList'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/playbooks/{slug}/installs/{installId}:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - name: slug
        in: path
        required: true
        schema: {type: string}
      - name: installId
        in: path
        required: true
        description: "安装回执 id（`ins_…`）"
        schema: {type: string}
    get:
      operationId: getPlaybookInstall
      tags: [playbooks]
      security: [{session: []}]
      summary: "读取单条安装回执"
      responses:
        '200':
          description: "安装回执"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybookReceipt'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '500': {$ref: '#/components/responses/Status500'}

  /v1/namespaces/{namespace}/playbooks/{slug}/releases/{release}:
    parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - name: slug
        in: path
        required: true
        schema: {type: string}
      - name: release
        in: path
        required: true
        description: "实例身份（`^(a-z0-9)[a-z0-9._-]{0,62}$`）"
        schema: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'}
    delete:
      operationId: uninstallPlaybookRelease
      tags: [playbooks]
      security: [{session: []}]
      summary: "卸载一个实例：删掉它装出来的能力与源，保留回执与他人的行"
      description: |
        归属键是 **release**（不是某一次 install）：只删 `installed_from` 属于该 release 回执的未删行
        （能力按行软删 + 行级 CAS，源删行），回执保留作审计、只打上卸载时刻 `uninstalledAt`。

        不删、进 `kept[]` 并带 `reason` 的行：同名的**手工行**（`manual`）、同名但属于**别的安装**的行
        （`other_release`）、本 release 建的但被**另一个仍生效的 release** 记在 `skipped` 里复用的行
        （`shared_by_release`）。同名 = 能力按 `name`（跨版本）、源按 `name`。

        重复卸载 → `200` 且 `alreadyUninstalled: true`，零变化（`removed` 两个列表与 `kept` 都是 `[]`）；
        release 从未存在 → `404` `release_not_found`。

        `installId` 可选：用「我看到的那次安装」钉住 release，不属于该 release → `409` `install_conflict`。
        删除走逐行 CAS，并发改动某行 → `409` `resource_version_conflict`（不静默删）。
      parameters:
        - name: installId
          in: query
          required: false
          description: "把这次卸载钉在某一条安装回执上（视图过期的保护；不属于该 release → 409 install_conflict）"
          schema: {type: string}
      responses:
        '200':
          description: "卸载结果（removed / kept / installIds / note）"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybookUninstallResult'}
        '400': {$ref: '#/components/responses/Status400'}
        '401': {$ref: '#/components/responses/AuthError401'}
        '404': {$ref: '#/components/responses/Status404'}
        '409': {$ref: '#/components/responses/Status409'}
        '500': {$ref: '#/components/responses/Status500'}

  # ----------------------------------------------------------------- namespaces
  /v1/namespaces:
    get:
      operationId: listNamespaces
      tags: [namespaces]
      security: [{session: []}]
      summary: "列出当前用户可见的命名空间（带计数派生面）"
      responses:
        '200':
          description: "NamespaceList"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NamespaceList'}
        '401': {$ref: '#/components/responses/AuthError401'}
