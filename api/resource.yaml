      tags: [nodes]
      security: [{session: []}]
      summary: "读取节点配置的规范化 YAML（可整份贴回）"
      description: |
        `yaml` 是 Node 文档（`apiVersion` / `kind` / `metadata` / `spec`）的规范化重建，
        **不是**用户当初贴的原始字节：键序与缺省由序列化固定，所以「取 → 改 → 贴回」
        是一次 schema 复用的往返。

        三条边界：① 只投影 `Node.spec` 的字段集（`namespaces` / `vars` / `limits` / `tags`），
        不新增字段；② `status` 是派生只读面，**不出现**在文档里；③ `anode.yaml` 的私有字段
        （`server` / `token` / `listen` / `envPassthrough`）不进 Node spec、不上报，
        因此也不出现在这里（令牌明文只在 `POST …/tokens` 出现一次）。
      responses:
