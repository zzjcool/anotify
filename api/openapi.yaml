openapi: 3.0.3
info:
  title: Anotify API
  version: "1.0.0"
  description: |
    事件中心 API（契约见 docs/contracts/CONTRACT.md）。

    模型演化：从「通知终端」到「事件中心」。
    外部事件（webhook / cron / watch）→ `events` → 派发成 `tasks` → 节点执行 → 回报出口 → 下一跳。

    鉴权三种：
      - **会话 Cookie**（`anotify_session`）：控制台浏览，Passkey 登录后获得
      - **Bearer API Key**（`ant_...`）：机器调用（上报 / 事件入口），带 scope
      - **Bearer 节点 token**（`ant_node_...`）：节点 WS 长连接，opaque，仅存 sha256

    约定：
      - 所有 JSON 字段 **camelCase**
      - 空列表返回 `[]` 而不是 `null`（不变量 I9）
      - 一切租户数据先过 `orgId`（不变量 I10）；显式传 `orgId` 时必须校验成员身份

    ## 迁移中的旧端点

    原有 `/notify`、`/notifications`、`/devices`、`/stream` 属于**旧的「通知终端」模型**，
    现在仍在服务（存量前端页面依赖），但响应带 `Deprecation: true` 与
    `Link: </v1/events>; rel="successor-version"`。
    它们将在前端切换到事件中心后下线，届时 `messages` 表一并删除。
servers:
  - url: /v1
tags:
  - name: events
    description: 事件入口（外部世界的变化）
  - name: tasks
    description: 任务（派发出来的执行单元）
  - name: sources
    description: 源（origin）—— 事件的入口实例：cron / webhook / manual
  - name: namespaces
    description: 命名空间（组织之下的隔离层：能力/节点/源/事件/任务都按它隔离）
  - name: stats
    description: 命名空间级统计
  - name: capabilities
    description: 能力定义（append-only，每次改动开新版本）
  - name: edges
    description: 出口表（路由的唯一依据）
  - name: playbooks
    description: 预案（可安装的流程零件：清单 + 就绪体检 + 幂等安装）
  - name: nodes
    description: 节点（执行者）
  - name: node-stream
    description: 节点 WebSocket 协议
  - name: auth
    description: 认证与恢复
  - name: keys
    description: API Key
  - name: devices
    description: "[旧模型] 推送设备"
  - name: notify
    description: "[旧模型] 通知上报与查询"
  - name: cli-auth
    description: CLI 设备授权
  - name: passkey-enroll
    description: Passkey 设备补建
  - name: admin
    description: 管理后台

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ========== 事件中心：事件 ==========
  /admin:
    get:
      tags: [admin]
      summary: 管理后台端点索引
      description: 无尾斜杠访问（/v1/admin）返回可用子端点列表，不发重定向。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 子端点清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /../agent-login.sh:
    get:
      tags: [cli-auth]
      summary: 获取 CLI 登录脚本（curl | sh 的源头）
      description: |
        **注意**：这个端点不在 `/v1` 下，实际路径是 `/agent-login.sh`。
        在本文件里写成 `/../agent-login.sh` 是为了相对 `servers: /v1` 表达它。
        返回 plain text 的 shell 脚本，供 `curl -fsSL .../agent-login.sh | sh`。
      security: []
      responses:
        "200":
          description: shell 脚本正文
          content:
            text/plain:
              schema: { type: string }

  /events:
    post:
      tags: [events]
      summary: 提交一个外部事件（webhook 通用入口）
      description: |
        把外部世界的变化变成一条 `event` 并触发第一次派发。

        - `traceId` 由**触发器**生成（不给时），中枢不代生成
        - `idemKey` 用于幂等：冲突时返回**已有**的 `eventId` + `traceId`，**不是 409**
          （对发送方而言「已收过」和「本次收下」都该是 200）
        - 不带 `idemKey` 允许重复——不是所有来源都有稳定投递 ID
        - 派发失败（非起点问题）仍返回 200（事件确实收下了）
        - **来源未知 → 422**：没有匹配的起点能力时事件永远派不出去，
          静默 200 会让调用方以为成功。响应带 `available` 列出可用的来源
        - `source` 匹配的是**能力名**。内置起点 `github`/`cron`/`http`/`manual`
          开箱可用，无需先定义；也可自定义能力（如 `jira@1`）后使用

        鉴权是 Bearer 机器入口，所以 `namespaceId` **主要放 body**（body 优先、其次 query，
        两者都缺 → `400`）；事件落进哪个命名空间是调用方必须明确的事实，
        不存在隐式默认，也不接受 `*`（写端点）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, type]
              properties:
                namespaceId:
                  type: string
                  description: |
                    **必填**（本字段或 query 二者给一个；body 优先）。事件落进哪个命名空间。
                    不存在 → 404；属于别的组织 → 403；`*` → 400（写端点）。
                source:
                  type: string
                  description: |
                    事件来源，与能力名一致。内置起点（github / cron / http / manual）
                    开箱可用；也可使用自定义能力名。找不到则返回 422。
                  example: github
                type:
                  type: string
                  description: 事件类型，**同时是 origin 能力的出口名**
                  example: pull_request.opened
                idemKey:
                  type: string
                  description: 幂等键（如 X-GitHub-Delivery）。省略则允许重复
                traceId:
                  type: string
                  description: 可选；省略时由触发器生成
                payload:
                  type: object
                  description: 原始负载，只存不解释（不求值、不改写）
                orgId:
                  type: string
                  description: 可选；省略时用调用者的主组织
      responses:
        "422":
          description: |
            来源未匹配到任何起点能力。事件已入库，但不会派发。
            响应带 `available`（可用来源列表）与 `eventId`（如实告知已入库）。
          content:
            application/json:
              schema:
                type: object
                required: [error, source, available]
                properties:
                  error: { type: string }
                  source: { type: string }
                  available:
                    type: array
                    items: { type: string }
                  eventId:
                    type: string
                    description: 已入库的事件 ID（便于排查/清理孤儿行）
        "200":
          description: 事件已受理（含幂等命中）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventIngestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [events]
      summary: 事件列表（按 trace 过滤）
      description: |
        事件流（**不带** `traceId`）回答「外部世界发生了什么」：
        **不含** `source=route` 的剪枝行（剪枝是中枢内部的诊断记录，不是外部事件）。

        带 `traceId` 时是 trace 视图：**含**剪枝行（最新在前）。
        显式给 `source` 时听调用方的（`source=route` 能单独拉出剪枝）。

        `namespaceId` **必填**；`*` 允许（跨命名空间汇总：各命名空间分别查询后
        合并，再按 `limit` 统一截断）。响应里的每条事件自带自己的 `namespaceId`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: traceId, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: '事件列表（空时 `events: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ========== 认证：当前用户与凭据 ==========
  /auth/me:
    get:
      tags: [auth]
      summary: 当前会话的用户 + 主组织
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  org:
                    type: object
                    description: 主组织（注册即得，不变量 A1）
                    properties:
                      id: { type: string }
                      name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/passkeys:
    get:
      tags: [auth]
      summary: 列出当前用户的 Passkey
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "Passkey 列表（空时 passkeys 为 []）"
          content:
            application/json:
              schema:
                type: object
                required: [passkeys]
                properties:
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/passkeys/{id}:
    patch:
      tags: [auth]
      summary: 重命名 Passkey
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200": { description: 已重命名 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [auth]
      summary: 删除 Passkey
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/passkeys/register/options:
    post:
      tags: [auth]
      summary: 补建 Passkey（新设备）——取 challenge
      security:
        - cookieAuth: []
      responses:
        "200": { description: WebAuthn 注册选项 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/passkeys/register:
    post:
      tags: [auth]
      summary: 补建 Passkey（新设备）——提交凭证
      security:
        - cookieAuth: []
      responses:
        "200": { description: 已注册 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ========== 统计（命名空间级）==========
  #
  # 统计不再是组织级：「本组织有多少事件」这个数字不存在了，同一套流程在
  # prod / staging 各有各的统计（契约 §6.2）。
  /stats:
    get:
      tags: [stats]
      summary: 命名空间级统计（事件总数 / 今日 / 任务完成率 / 热力图）
      description: |
        统计是**命名空间级**资源（契约 §6.2）：事件与任务都按命名空间隔离，
        「本组织有多少事件」这个数字不存在了 —— 同一套流程在 prod / staging
        各有各的统计。

        - `namespaceId` **必填**（缺 → `400`）
        - 与其它读端点不同，`namespaceId=*`（跨命名空间汇总）在本端点**不支持**：
          汇总口径未定义，传 `*` → `400`（不悄悄给一个用户没要求的数字）
        - `deviceCount` 仍按**用户**维度（推送设备是用户的东西，不是命名空间的）
        - 没有数据时 `daily` 是 `[]` 而不是 `null`（不变量 I9）
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: 统计数字（口径见 description）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }


  # ========== 事件中心：控制台读取 ==========
  /console/events:
    get:
      tags: [events]
      summary: 事件列表（控制台视图，会话 Cookie 鉴权）
      description: |
        浏览器控制台读事件流用。

        与 `GET /events` 的区别是**鉴权模型**：
        - `GET /events` 是机器入口，Bearer API Key + `notify:send` scope，给外部系统拉事件
        - `GET /console/events` 是控制台入口，会话 Cookie + 组织成员身份

        两者语义不同（一个要 scope，一个要成员身份），所以不共用一个 handler。

        `namespaceId` **必填**（契约 §6.2）；`*` 允许（跨命名空间汇总的管理视图，
        各命名空间分别查询后合并，再按 `limit` 统一截断）。

        **剪枝行的可见性**：事件流（不带 `traceId`）**不含** `source=route` 的剪枝行；
        带 `traceId` 时**含**剪枝行（最新在前）。显式给 `source` 时听调用方的。

        **顺序（视图契约）**：带 `traceId` 时**根事件（非剪枝）一定排在最前**
        （`events[0]`）—— trace 页用第一条事件的 source 去 `GET /sources` 找源拓扑当底图，
        剪枝行顶替根事件会让底图丢失。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: traceId, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: 事件列表（空时 events 为 []）
          content:
            application/json:
              schema:
                type: object
                required: [events, namespaceId]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ========== 事件中心：trace 视图 ==========
  #
  # 「一条链为什么这样」一次请求答完：events（含剪枝）+ tasks + pruned。
  # 剪枝记录从 #142 起落进 events（source='route'、type='pruned.<reason>'），
  # 所以它既能在 events 里看到原始行，也被解析成 pruned 列表。
  /traces/{id}:
    get:
      tags: [events]
      summary: 单条 trace 全景（events + tasks + pruned）
      description: |
        一条 trace 的完整链路：
        - `events`：该 trace 的全部事件，**含** `source=route` 的剪枝行（最新在前）
        - `tasks`：该 trace 的任务链
        - `pruned`：从 `source=route` 的事件解析出的剪枝记录（`type` 去掉 `pruned.` 前缀即 `reason`）

        `events` 与 `tasks` 都为空时返回 404（该 trace 在本组织不存在）。
        空列表一律是 `[]` 而不是 `null`。

        **顺序**：`events` 按最新在前（`created_at DESC`），**不保证** `events[0]` 是根事件
        —— 剪枝行的时间一定晚于根事件，可能顶在最前。要根事件请按 `source != "route"`
        挑，或者直接读 `pruned`（这才是「为什么没跑」的答案）。

        `namespaceId` **必填**，且**不接受 `*`**：一条 trace 只属于一个命名空间，
        「跨命名空间的一条 trace」没有定义（带 `*` → `400`）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '一条 trace 的全景（空列表为 `[]`）'
          content:
            application/json:
              schema:
                type: object
                required: [traceId, namespaceId, events, tasks, pruned]
                properties:
                  traceId: { type: string }
                  namespaceId:
                    type: string
                    description: 这条 trace 所属的命名空间（单对象视图，恒为具体 id）
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  pruned:
                    type: array
                    items: { $ref: "#/components/schemas/PrunedTraceRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'trace 不存在（`{"error":"trace not found"}`）' }

  # ========== 事件中心：任务 ==========
  /tasks:
    get:
      tags: [tasks]
      summary: 任务列表（按 trace / node / status 过滤）
      description: |
        `namespaceId` **必填**（契约 §6.2）；`*` 允许（跨命名空间汇总的管理视图，
        各命名空间分别查询后合并，再按 `limit` 统一截断）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: traceId, in: query, schema: { type: string } }
        - { name: nodeId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: orgId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: '任务列表（空时 `tasks: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [tasks, namespaceId]
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tasks/{id}:
    get:
      tags: [tasks]
      summary: 单个任务详情（含整条 trace 的任务链）
      description: |
        深链（点通知跳 `message.html?id=tsk_xxx`）只有任务 ID，不知道它属于哪条 trace，
        所以需要按 ID 取单任务。响应同时带上整条链，详情页一次请求即可画出任务链。

        `namespaceId` **必填**，且**不接受 `*`**（单对象端点）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: "任务详情 + 整条链（链为空时 chain 为 []）"
          content:
            application/json:
              schema:
                type: object
                required: [task, chain]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
                  chain:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 任务不存在 }

  /tasks/{id}/cancel:
    post:
      tags: [tasks]
      summary: 取消任务
      description: |
        把任务推进到 `canceled`（终态）。终态不可再变，
        对已终态的任务再取消返回 409。

        `namespaceId` **必填**，**只从 query 读取**（请求体不解析），
        且不接受 `*`（写端点）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 任务已是终态（`invalid_transition`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 源（origin）：事件的入口实例 ==========
  #
  # 源 ≠ 能力。能力回答"能干什么"（由节点声明、中枢派任务）；
  # 源回答"什么时候开始干"（有配置、自己产生事件、自己不干活）。
  /sources:
    get:
      tags: [sources]
      summary: 源列表（含出口能力可读信息）
      description: |
        源是事件的**入口实例**：`cron`（定时）/ `webhook`（回调）/ `manual`（手动）。
        每个源带一组出口能力（`targets`），触发时事件直接派给它们。

        与「能力 + 边」的区别：源不建边。用户不需要理解 `kind=origin`、
        也不需要为每种事件类型手建一条边。

        `namespaceId` **必填**；`*` 允许（跨命名空间汇总）。每个源对象自带
        `namespaceId`，跨命名空间时 `targetCaps` 按**源自己**的命名空间解析。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '源列表（空时 `sources: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [sources]
      summary: 新建源
      description: |
        - `targets` 至少一个：没有出口的源产生的事件永远派不出去，直接 400
        - `kind=cron` 时 `config.expr` 必须是合法五段表达式（`61 * * * *` → 400）
        - `kind=webhook` 时服务端自动生成 `token`，返回的 `hookUrl` 可直接贴给外部系统
        - 同一个命名空间内 `name` 唯一（重名 → 409）
        - `namespaceId` **必填**（query 或 body，query 优先）；缺 → 400
        - 每个出口能力必须与源**同命名空间**（跨命名空间引用 → 400，不变量 I11）
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source: { $ref: "#/components/schemas/Source" }
        "400":
          description: 参数非法（kind 未知 / cron 表达式非法 / targets 为空）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 同名源已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/NamespaceId"
    get:
      tags: [sources]
      summary: 取单个源
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 源详情
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [sources]
      summary: 更新源（name / config / enabled / targets）
      description: |
        `kind` **不可修改**：换种类等于换语义（cron 表达式对 webhook 无意义）。
        需要换种类时请删除后重建。

        `namespaceId` **必填**（query 或 body，query 优先）；它不能用来"搬家"：
        改不到另一个命名空间里去。

        `config` 的合并语义：

        - `"config": null` 视为**本次不改 config**（no-op）；
        - `config` 里**未带** `vars` / `payload` 键时从**当前配置继承**（这两个键由别的入口写入，
          控制台改 `expr` / `token` 时不会带上它们）；
        - 显式传 `"vars": []` / `"payload": {}` **才是真的清空**。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source: { $ref: "#/components/schemas/Source" }
        "400":
          description: 参数非法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 同名源已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [sources]
      summary: 删除源
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sources/dry-run:
    post:
      tags: [sources]
      summary: 试运行（草稿，尚未保存）
      description: |
        用请求体里的草稿源算出"会派发什么、会剪枝什么"，**不写事件、不建任务**。

        与 `POST /sources/{id}/fire` 共用同一套派发判定（`Dispatcher.Dispatch`
        的 `DryRun` 模式），所以试运行和真实触发不会给出不同结论 ——
        那种"试运行说能跑、真点却剪枝"的差异会直接摧毁用户对配置的信任。

        不检查 `enabled`：停用状态下也该能先验证再启用。

        `namespaceId` **必填**：推演"会派给哪些节点/能力"全部在某个命名空间里，
        所以它同样必需（不接受 `*`）。取值：query 优先，其次 body `namespaceId`，
        再次草稿里的 `source.namespaceId`。草稿的命名空间以参数为准（不信 body 里的手写值）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（query 优先）
                source:
                  type: object
                  description: 与创建源时的请求体同形（草稿，无需 id；其 `namespaceId` 也可作为取值来源）
                payload:
                  type: object
                  description: 用哪份 payload 试算；缺省为空对象
                type: { type: string }
      responses:
        "200":
          description: 推演结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  dispatch:
                    type: object
                    properties:
                      tasks:
                        type: array
                        description: 会派发的出口（含求值后的 params）
                        items: { type: object }
                      pruned:
                        type: array
                        description: 被跳过的出口及原因
                        items: { type: object }
        "400":
          description: 缺 source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sources/{id}/dry-run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/NamespaceId"
    post:
      tags: [sources]
      summary: 试运行（已保存的源）
      description: |
        同 `/sources/dry-run`，只是用库里已保存的源。
        `namespaceId` **必填**（query 或 body，query 优先），不接受 `*`。
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（query 优先）
                type: { type: string }
                payload: { type: object }
      responses:
        "200":
          description: 推演结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  dispatch: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sources/{id}/fire:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/NamespaceId"
    post:
      tags: [sources]
      summary: 手动触发一次（调试 / manual 源的正常用法）
      description: |
        写一条事件并立即派发给源的出口能力。
        `type` 缺省用源的名字；带 `payload` 时其内容作为任务 params 传下去
        （原样传递，不做模板替换——不变量 I6）。

        `namespaceId` **必填**（query 或 body，query 优先）；不接受 `*`（触发是写操作）。
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（query 优先）
                type: { type: string }
                payload: { type: object }
      responses:
        "200":
          description: 已触发
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
                  inserted: { type: boolean }
                  idempotent: { type: boolean }
                  dispatch: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 事件中心：预案（playbook）==========
  #
  # 预案是**清单，不是所有权**：一份 manifest 说清「跑通这条流程需要哪些能力定义 /
  # 边 / 触发器」，安装时幂等补齐（能力 → 边 → 源，单事务），删预案**不回滚**已装的
  # 东西（它们已经独立存在了）。设计见 docs/design/playbooks.md，表的定义见
  # CONTRACT.md §2.8。
  #
  # 与 issue #193 草稿的差异（**验收基准是 web/mock.js 与已写好的前端**，不是草稿）：
  #   - `status` 是**四态** `ready / blocked / needs-node / partial`
  #     （不是 `ready|incomplete`）
  #   - `counts` 是 `{capabilities, edges, triggers}` 三类项的**数量**
  #     （不是 `ok/no-node/offline/missing` 的分布）
  #   - `next` 是**第一个非 ok 的检查项对象**（不是一句人话字符串），全 ok 时 `null`
  # 这三个形状与 `pbChecks` / `pbView`（web/mock.js:1395-1780）逐字段一致。
  #
  # 作用域：本组**每个**端点都必填 `namespaceId`（`NamespaceIdStrict`）——
  # 缺参 400、`*` 400、不存在 404、**别的 org 也是 404**（与「不存在」逐字节相同）。
  # 预案**不提供**跨命名空间汇总：体检结论只能按单个命名空间算。
  /playbooks:
    get:
      tags: [playbooks]
      summary: 预案列表（每项带就绪体检结论）
      description: |
        每项 = 预案行 + 体检结论（`status` / `next` / `ready` / `total` / `counts`），
        **不带** `items`（逐项明细在 `GET /playbooks/{idOrSlug}` 里）。

        体检是**查询时算出来的推导量，不落库**（不变量 I3 同源）：能力定义在不在、
        有没有节点声明、`edges` 里有没有这条边、有没有命中入口能力的源。

        排序按 `(createdAt, id)` **升序**（与 mock 卡片的顺序一致）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceIdStrict"
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '预案列表（空时 `playbooks: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [playbooks, namespaceId]
                properties:
                  playbooks:
                    type: array
                    description: 空为 `[]`（不变量 I9）
                    items: { $ref: "#/components/schemas/PlaybookView" }
                  namespaceId:
                    type: string
                    description: 本次作用域（预案没有 `*`，这里恒是具体的命名空间 id）
        "400":
          description: |
            参数非法：缺 `namespaceId`（`namespaceId is required`）；
            或 `namespaceId=*`（预案不提供跨命名空间汇总口径）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            命名空间不存在，或属于**别的组织**——两者响应**逐字节相同**
            （`{"error":"namespace not found"}`，不回显传入的 id）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 服务端错误（`{"error":"internal error"}`，细节只进服务端日志）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [playbooks]
      summary: 从 manifest 创建预案（**不安装**）
      description: |
        只落一行 `playbooks`（清单本身），**不写**能力定义 / 边 / 源 ——
        要装是另一个动作（`POST /playbooks/{idOrSlug}/install`）。

        创建期把矛盾说清（都返 `400`，错误信息指出是哪一项违反）：
        - `slug`：`^[a-z0-9]+(?:-[a-z0-9]+)*$`、长度 ≤ 64、**不 trim**
          （带空格 / 大写 / 下划线即非法——不把写错的地方静默改对）
        - `slug` 在**同一命名空间**内唯一（重名 → `409`，不是 `400`）
        - `name` 必填非空
        - `manifest`：能力 `name` 非空且不是内置 origin 保留名（`github` / `cron` /
          `http` / `manual`）、`version > 0`、同一 manifest 内 `(name, version)` 不重复、
          `paramsSchema`（若给）是 JSON 对象；边的三个字段非空，且 `from` 在本 manifest
          里声明过时 `fromPort` 必须属于它的 `outputs`（不变量 I2）；触发的 `kind` 合法
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceIdStrict"
        - { name: orgId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（**query 优先**）；二者给一个，都缺 → 400
                slug:
                  type: string
                  example: pr-review
                  description: |
                    URL 用的稳定标识，命名空间内唯一；
                    规则 `^[a-z0-9]+(?:-[a-z0-9]+)*$`、长度 ≤ 64。
                name: { type: string, example: PR 审查, description: 展示名，不能为空 }
                description: { type: string, description: 一句话说明，可省略（缺省是空串） }
                manifest:
                  allOf:
                    - $ref: "#/components/schemas/PlaybookManifest"
                  description: |
                    缺省 / `null` → 归一化成
                    `{"capabilities":[],"edges":[],"triggers":[]}`（空是 `[]`）。
                    **原文存**：含 `runner` / `paramsSchema` / 自定义键在内，一律只校验、
                    不重新编码、不解释（不变量 I1）。
      responses:
        "201":
          description: 已创建（返回的 `playbook` 是详情形态，**带** `items`）
          content:
            application/json:
              schema:
                type: object
                required: [playbook]
                properties:
                  playbook: { $ref: "#/components/schemas/PlaybookDetail" }
        "400":
          description: |
            参数非法（`code: invalid_playbook`）：`slug` 缺失或非法 / `name` 缺失 /
            `manifest` 非法 / 触发 `kind` 非法；或作用域非法（缺 `namespaceId`、`namespaceId=*`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            命名空间不存在，或属于**别的组织**——两者响应**逐字节相同**
            （`{"error":"namespace not found"}`，不回显传入的 id）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            同命名空间里已有同名 `slug` 的预案
            （`{"error":"同命名空间里已有同名 slug 的预案","code":"slug_taken"}`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 服务端错误（`{"error":"internal error"}`，细节只进服务端日志）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /playbooks/{idOrSlug}:
    parameters:
      - name: idOrSlug
        in: path
        required: true
        schema: { type: string }
        description: |
          预案的 `id`（`pb_...`）或 `slug`（如 `pr-review`）—— 两种都能定位。
          别的命名空间的 id/slug 一律 `404`（不变量 I11：不跨命名空间取）。
      - $ref: "#/components/parameters/NamespaceIdStrict"
    get:
      tags: [playbooks]
      summary: 预案详情（逐项体检结果）
      description: |
        详情比列表多一个 `items`：按**依赖顺序**排的逐项检查（能力项 → 边项 → 触发项），
        每项自带 `status`（`ok` / `missing` / `no-node` / `offline`）。
        `no-node` 与 `offline` **必须分开**：前者要去写节点配置装机器，后者只需要把机器连上。

        无项时 `items: []`（空是 `[]`，不是 `null`）。
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: 预案详情
          content:
            application/json:
              schema:
                type: object
                required: [playbook]
                properties:
                  playbook: { $ref: "#/components/schemas/PlaybookDetail" }
        "400":
          description: 参数非法（缺 `namespaceId`，或 `namespaceId=*`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            两种情况：命名空间不存在 / 属于别的组织（`{"error":"namespace not found"}`，
            二者逐字节相同）；或预案不存在（含别命名空间的 id/slug）
            （`{"error":"预案不存在","code":"not_found"}`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 服务端错误（`{"error":"internal error"}`，细节只进服务端日志）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [playbooks]
      summary: 删预案（**不删已安装的能力/边/源**）
      description: |
        只删 `playbooks` 里的这一行。预案是**清单，不是所有权**：
        已经装进去的能力定义 / 边 / 源**原样保留** —— 要拆就明确去删那些东西
        （把两种语义混进一个删除动作里，迟早误删生产配置）。

        幂等视角：重复删同一个预案，第二次是 `404`（不是 `200`）。
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, example: true }
        "400":
          description: 参数非法（缺 `namespaceId`，或 `namespaceId=*`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            命名空间不存在 / 属于别的组织（与「不存在」逐字节相同：
            `{"error":"namespace not found"}`）；或预案不存在（`code: not_found`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 服务端错误（`{"error":"internal error"}`，细节只进服务端日志）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /playbooks/{idOrSlug}/install:
    parameters:
      - name: idOrSlug
        in: path
        required: true
        schema: { type: string }
        description: 预案的 `id`（`pb_...`）或 `slug`
      - $ref: "#/components/parameters/NamespaceIdStrict"
    post:
      tags: [playbooks]
      summary: 幂等安装（能力定义 → 边 → 源，单事务）
      description: |
        把 manifest 里声明的零件补进当前命名空间。**顺序硬性**：能力 → 边 → 源
        （边的两端要有定义才建得了，源要有人可派）；全过程**单事务**，真正的内部
        错误才整体回滚（单条零件不成立只 skip，见下）。

        幂等：已存在的 `(name, version)` 能力定义 / 已存在的同一条边 / 已存在的源
        一律进 `skipped`，**绝不覆盖**（能力定义 append-only，不变量 I8）。
        已经装了源时再装一次不会多出一个触发器 —— 判据是「同名源已存在」或
        「已有同 kind 且 targets 命中本预案入口能力的源」。

        能装什么装什么：单条边两端缺定义、`fromPort` 不在上游 `outputs` 里（I2）、
        能力同内容冲突（`UNIQUE(namespace_id, content_hash)`）、源配置非法都**只 skip
        那一条**，不整体失败，原因写进 `notes`（安装期只能 skip，不返 `400`）。

        入口能力为空 → 该触发 skip（不建没有入口的源）。
        写入的一切都锁在**本次**命名空间内（不变量 I11）。

        这是**动作**，不改变预案的身份 → `200`（不是 `201`）。
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: |
            安装完成（返回刷新后的详情 + 本次 created / skipped / notes）。
            单条边 / 源不成立**只**进 `skipped`（原因见 `notes`），不整体失败；
            真正的内部错误才整体回滚（一个零件都不落地，返 `500`）。
          content:
            application/json:
              schema:
                type: object
                required: [playbook, created, skipped, notes]
                properties:
                  playbook:
                    allOf:
                      - $ref: "#/components/schemas/PlaybookDetail"
                    description: 安装**完成后**重新体检过的详情（状态已随安装变化）
                  created: { $ref: "#/components/schemas/PlaybookInstallSet" }
                  skipped:
                    allOf:
                      - $ref: "#/components/schemas/PlaybookInstallSet"
                    description: 已存在 / 这一轮装不了的（原因见 `notes`）
                  notes:
                    type: array
                    items: { type: string }
                    description: skipped 的人话说明；无则 `[]`
        "400":
          description: |
            `400` **只**来自作用域：缺 `namespaceId` / `namespaceId=*`（契约 §6.2）。
            安装期的源配置非法（如 `cron` 的 `types[0]` 不是合法五段表达式）**不是**
            `400`：它是 skip + `notes`，不整体回滚（契约 §10 A4）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            命名空间不存在 / 属于别的组织（与「不存在」逐字节相同：
            `{"error":"namespace not found"}`）；或预案不存在（`code: not_found`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            服务端错误（`{"error":"internal error"}`，细节只进服务端日志）。
            整个安装是单事务：出错时**一个零件都不会落地**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== webhook 入口（无需会话，鉴权靠 URL 里的 token）==========
  /hooks/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [sources]
      # 匿名端点：鉴权靠 URL 里的 token，不是 Cookie/Key。
      # 必须显式写空数组，check_openapi.py 靠它区分"忘了写"和"故意匿名"。
      security: []
      summary: 外部系统投递事件（webhook 源）
      description: |
        **不需要 Cookie / API Key**：鉴权就是 URL 里的 token。
        外部系统（GitHub / 监控告警）不可能带我们的会话。

        **也不需要 `namespaceId`**：命名空间从 token 解析出来（源行自带
        `namespace_id`）—— 外部系统根本不知道它，也不应该知道。

        - token 无效或源已停用 → 404（不区分两者，避免探测 token 有效性）
        - `type` 缺省用源的名字；可用 body.type 区分不同事件
        - 空 body 允许（有些系统只发 ping）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string }
                payload: { type: object }
      responses:
        "200":
          description: 已接收并派发
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
                  inserted: { type: boolean }
                  dispatch: { type: object }
        "404":
          description: token 无效或源已停用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 命名空间自身（#162 / 契约 §6.1、设计文档 §6.1）==========
  #
  # **/v1/namespaces 是组织级资源**：请求**不带** namespaceId，响应里的 namespace
  # 对象也**不带** namespaceId（问「这个命名空间属于哪个命名空间」是自指）。
  # 资源端点（/sources、/stats ……）才需要 namespaceId，见 NamespaceId 参数。
  /namespaces:
    get:
      tags: [namespaces]
      summary: 列出本组织的命名空间（带资源计数，UI 直接用）
      description: |
        每个命名空间带 `capabilityCount` / `nodeCount` / `sourceCount` / `edgeCount`，
        控制台侧栏与命名空间页直接用，不必再逐页拉一次。

        空列表是 `[]` 不是 `null`（不变量 I9）。本端点**不需要** `namespaceId`。
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '命名空间列表（空时 `namespaces: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [namespaces]
                properties:
                  namespaces:
                    type: array
                    items: { $ref: "#/components/schemas/Namespace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [namespaces]
      summary: 新建命名空间（同事务播种内置能力）
      description: |
        - `slug` 是**稳定标识**（出现在 URL 与节点令牌作用域里）：1~31 字符，
          只允许小写字母、数字、连字符，且以字母或数字开头；不合法 → `400`
          （`code: invalid_slug`）。slug 建了不可改（改名只改 `name`）
        - `name` 省略/空串时回落成 `slug`（不会出现没有展示名的命名空间）
        - 同组织 slug 重复 → `409`
        - 新命名空间在**同一事务**里拿到内置能力（`notify.phone` 等）：没有它们
          连一个 end 节点都声明不出来，推送直接失效
        - 本端点**不需要** `namespaceId`（命名空间是组织级资源）
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                  example: staging
                  description: 稳定标识；建了不可改
                name:
                  type: string
                  example: 预发
                  description: 展示名（可改）；省略则用 slug
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [namespace]
                properties:
                  namespace: { $ref: "#/components/schemas/Namespace" }
        "400":
          description: '非法 slug（`code: invalid_slug`）或请求体不是合法 JSON'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 同组织 slug 已存在（`{"error":"namespace slug already exists"}`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /namespaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [namespaces]
      summary: 改名（只改展示名 name；slug 不可改）
      description: |
        `slug` 是稳定标识（出现在 URL 与节点令牌作用域里），**建了不可改**：
        请求里带非空 `slug` 一律 `400`（`code: slug_immutable`）——不是静默忽略：
        「我改了但没生效」比「你不能改」难查得多。要换 slug 请删了重建。

        `name` **必填**且不能是空串/纯空白（→ `400`）。
        本端点**不需要** `namespaceId`。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: 预发 }
                slug:
                  type: string
                  description: 不要传（只用于触发 400 `slug_immutable`）
      responses:
        "200":
          description: 已改名（返回改完之后的命名空间）
          content:
            application/json:
              schema:
                type: object
                required: [namespace]
                properties:
                  namespace: { $ref: "#/components/schemas/Namespace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [namespaces]
      summary: 删除命名空间（阻塞 409 / 最后一个 400 / force 级联）
      description: |
        三档结果：

        - 不带 `force`：里面还有 sources / edges / tasks / nodes → **409**，
          响应带 `blocking`（形如 `["sources=2","edges=5"]`），让人看清在拆什么
        - **最后一个**命名空间 → **400**（带不带 `force` 都一样）：删了组织就没有
          「这套流程属于哪里」了，代码里不存在「没有命名空间」的分支
        - `?force=true`（或 `force=1`）→ 级联删除（连机器、能力、事件、任务、
          图快照一起删），`200`

        `force` 的含义是「我知道里面的机器会全部掉线」——所以默认档必须先把阻塞
        对象列出来，不能当「清理配置」做。本端点**不需要** `namespaceId`。
      security:
        - cookieAuth: []
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: string
                    description: 被删除的命名空间 id
        "400":
          description: 不允许删除最后一个命名空间（带不带 force 都一样）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 命名空间非空（未带 force），响应带阻塞对象清单
          content:
            application/json:
              schema:
                type: object
                required: [error, blocking]
                properties:
                  error: { type: string }
                  blocking:
                    type: array
                    items: { type: string }
                    example: ["sources=2", "edges=5"]

  # ========== 事件中心：能力 ==========
  /capabilities:
    get:
      tags: [capabilities]
      summary: 能力定义列表（带推导出的 kind）
      description: |
        `kind` 是**推导量，不落库**（不变量 I3）：
        - 没有任何节点声明 → `origin`
        - 有节点声明且 `outputs` 全空 → `end`
        - 有节点声明且 `outputs` 有非空项 → `pipe`

        `namespaceId` **必填**；`*` 允许（跨命名空间汇总，每条能力自带自己的 `namespaceId`）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '能力列表（空时 `capabilities: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [capabilities, namespaceId]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: "#/components/schemas/CapabilityWithKind" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [capabilities]
      summary: 定义新能力（自动算 contentHash、自动开版本）
      description: |
        `capability_versions` 是 **append-only**（不变量 I8）：
        - 不指定 `version` 时自动开下一个版本
        - 同名同版本但内容不同 → 409（版本不能被改写）
        - 内容相同（含 name）→ 幂等返回已有定义

        `namespaceId` **必填**（query 或 body，query 优先）：一条能力定义只属于一个命名空间，
        同名同版本在**不同命名空间**里是两个独立定义（不冲突）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityInput" }
      responses:
        "200":
          description: 已创建（或幂等返回已有）
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability: { $ref: "#/components/schemas/Capability" }
                  kind: { $ref: "#/components/schemas/Kind" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: 同 name@version 换内容（`capability_conflict`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [capabilities]
      summary: 改能力的显示名（只动 display_name 一列）
      description: |
        `displayName` 是**纯展示**标签，不属于能力定义：

        - **不参与 `contentHash`** —— 改它不产生新版本，不会让旧 trace 无法解释
        - **不参与路由** —— 出口名来自 `outputs`，边指向 `id`，节点声明用 `name`
        - 传空串表示清掉显示名（前端回落到 `name@version`）

        这是这张表上**唯一**的 UPDATE。其余字段仍然 append-only（不变量 I8）。

        `namespaceId` **必填**（query 或 body，query 优先）；`id` 必须属于该命名空间。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（query 优先）
                id: { type: string, description: 能力的 capability_versions.id }
                displayName: { type: string, description: 空串 = 清除显示名 }
      responses:
        "200":
          description: 已更新（返回更新后的能力）
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability: { $ref: "#/components/schemas/Capability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========== 事件中心：出口表 ==========
  /edges:
    get:
      tags: [edges]
      summary: 出口表列表
      description: |
        `namespaceId` **必填**；`*` 允许（跨命名空间汇总）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: fromCapability, in: query, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '边列表（空时 `edges: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [edges, namespaceId]
                properties:
                  edges:
                    type: array
                    items: { $ref: "#/components/schemas/Edge" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [edges]
      summary: 新增一条边
      description: |
        配置期三条硬校验（违反即 400）：
        1. `fromPort` 必须属于上游的 `outputs`（**出口是封闭集合**，不变量 I2）
        2. 两端能力必须**同命名空间**（跨命名空间引用 → 400，不变量 I11）
        3. `namespaceId` **必填**（query 或 body，query 优先）：一条边属于且只属于一个命名空间

        `fromIsSource=true` 时 `fromCapability` 被解释为**来源名**（如 `github`，建入口边），
        此时只校验右端能力在本命名空间；来源名不跨命名空间解析。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeInput" }
      responses:
        "200":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  edge: { $ref: "#/components/schemas/Edge" }
        "400":
          description: 出口不在 outputs 里 / 跨命名空间引用 / 能力不存在（`edge_rejected`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [edges]
      summary: 删除一条边
      description: |
        `namespaceId` **必填**（query 或 body，query 优先）；其余四个定位参数 query 优先、
        body 兜底（`fromIsSource` 也接受 query 的 `1` / `true`）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: fromCapability, in: query, required: true, schema: { type: string } }
        - { name: fromPort, in: query, required: true, schema: { type: string } }
        - { name: toCapability, in: query, required: true, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========== 事件中心：节点 ==========
  /nodes:
    get:
      tags: [nodes]
      summary: 节点列表（含在线状态、声明的能力、实例占用）
      description: |
        `namespaceId` **必填**；`*` 允许（跨命名空间汇总，每台节点自带自己的 `namespaceId`）。

        节点属于**命名空间**（不是一个节点跨多个命名空间）：切命名空间时列表整页重取。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '节点列表（空时 `nodes: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [nodes, namespaceId]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/NodeView" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [nodes]
      summary: 注册节点（返回一次性令牌）
      description: |
        **`namespaceId` 必填**：query 或 body，**query 优先**；两处都没有 → `400`，
        错误体点名 `namespaceId`（写端点绝不回退默认命名空间）。`namespaceId=*`
        在写端点无定义 → `400`。

        **属于别的组织的命名空间 → `404`（本端点刻意不区分「不存在」与「别人的」）**：
        命名空间不存在 → `404`；存在但属于别的组织 → **同样 `404`**，响应逐字节相同
        （`{"error":"namespace not found"}`，不回显传入的 id）。写端点不能用来探测
        别的组织有哪些命名空间 id —— 这是契约 §6.2「属于别的 org → `403`」的
        **显式例外**，其余命名空间资源端点保持 `403`。

        **令牌明文只在这里出现一次**：响应里的 `token`（`ant_node_...`）是明文，
        库里只存 `sha256`（`token_hash`）；此后任何读接口（`GET /v1/nodes`、
        `GET /v1/nodes/{id}`）都不回 `token` / `token_hash`。令牌即归属：
        token → 节点行 → `nodes.namespace_id`，创建后不可改（契约 §10.3）。

        `instances` 只是**槽位建议值，不落库**：不创建 `node_instances` 行，也不改
        `nodes.max_instances`（`max_instances` 是安全硬顶，不能被一个建议值静默改写）。
        真正的槽位以节点 `hello` 帧的申报为准（契约 Q5）；字段保留是为了让客户端能把
        同一份节点配置原样发过来。只校验非负。

        `name` 规则：`^[a-z0-9][a-z0-9._-]{0,62}$`（1..63 字符，只允许 `[a-z0-9._-]`，
        以字母/数字开头）；**不 trim**（带空白即非法 —— 不把写错的输入静默改对）。
        同一命名空间内重名 → `409`（`code: name_taken`）；不同命名空间可以同名。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      requestBody:
        description: |
          允许空对象：缺 `namespaceId` 由 handler 报 `400`（错误体点名 `namespaceId`），
          不会先报 "invalid JSON body"。
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                namespaceId:
                  type: string
                  description: 可选（query 优先）；query 与 body 都没有 → 400
                name:
                  type: string
                  example: mbp-16
                  description: |
                    `^[a-z0-9][a-z0-9._-]{0,62}$`（1..63 字符，以字母/数字开头，
                    只允许 `[a-z0-9._-]`，**不 trim**）
                tags:
                  type: array
                  items: { type: string }
                  description: 自由标签，与节点视图同形
                instances:
                  type: integer
                  minimum: 0
                  description: |
                    槽位**建议值，不落库**：不创建 `node_instances` 行，也不改
                    `nodes.max_instances`；真正的槽位以节点 `hello` 帧的申报为准（契约 Q5）
      responses:
        "201":
          description: '节点已创建（`token` 是**一次性明文令牌**，此后任何读接口都不再出现）'
          content:
            application/json:
              schema:
                type: object
                required: [node, token]
                properties:
                  node: { $ref: "#/components/schemas/NodeView" }
                  token:
                    type: string
                    description: |
                      一次性明文令牌（`ant_node_<base64url(24B)>`）。库里只存 `sha256`，
                      这是它唯一一次出现在响应里；丢了只能删了重建节点。
                    example: ant_node_MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1u
        "400":
          description: |
            请求参数非法（命中任一条即 400）：缺 `namespaceId`（错误体点名 `namespaceId`，
            **不回退默认命名空间**）/ `namespaceId=*`（写端点无定义）/ `name` 缺失或非法
            （`code: invalid_name`）/ `instances` 为负（`instances must be >= 0`）/
            请求体不是合法 JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        # OAS 3.0 里 `$ref` 的兄弟键（如 description）会被忽略，故此处 inline 写，不 $ref：
        # 这个 404 必须自带说明——它与「命名空间不存在」共用同一个响应体，且是 §6.2 的显式例外。
        "404":
          description: |
            **命名空间不存在，或存在但属于别的组织** —— 两者响应逐字节相同
            （`{"error":"namespace not found"}`，不回显传入的 id；本端点刻意不区分，
            避免用写端点探测别人的命名空间 id，契约 §6.2 的显式例外）。
            响应形状同 `#/components/responses/NotFound`。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            同一命名空间内同名节点已存在
            （`{"error":"同名节点已存在","code":"name_taken"}`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /nodes/{id}:
    get:
      tags: [nodes]
      summary: 节点详情（含每个并发槽位的当前状态）
      description: |
        比列表多给 `instances` 的**逐槽细节**：哪个槽在跑哪个任务。
        列表只给数量 —— 列表页不需要 N×M 行，详情页要能回答
        "这台机器现在卡在哪个槽上"。

        `namespaceId` **必填**，且**不接受 `*`**（单对象端点）。
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 节点详情
          content:
            application/json:
              schema:
                type: object
                required: [node, instances]
                properties:
                  node: { $ref: "#/components/schemas/NodeView" }
                  instances:
                    type: array
                    description: '申报的并发槽位（空时 instances 为 []）'
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        namespaceId:
                          type: string
                          description: 槽位所属命名空间（从父行 nodes 取）
                        nodeId: { type: string }
                        slot: { type: integer }
                        concurrency: { type: integer }
                        busyTask:
                          type: string
                          nullable: true
                          description: 占用该槽的任务 id（空闲为 null）
                        alive: { type: boolean }
                        updatedAt: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 节点不存在
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string } }

  /nodes/{id}/drain:
    post:
      tags: [nodes]
      summary: 排空节点（不再接新任务，在跑的继续）
      description: |
        只把 `status` 改成 `draining`（派发时会被过滤掉），
        **不主动取消**已在跑的任务——取消是破坏性操作，排空是渐进退役。

        `namespaceId` **必填**，**只从 query 读取**（请求体不解析），不接受 `*`（写端点）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: 已排空
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========== 事件中心：节点协议 ==========
  /node/stream:
    get:
      tags: [node-stream]
      summary: 节点 WebSocket 长连接（九帧协议）
      description: |
        **必须**在 Upgrade 之前用 `Authorization: Bearer <node token>` 完成鉴权：
        鉴权失败返回 401/403，**绝不返回 101**。

        token 是 opaque（`ant_node_...`），服务端只存 sha256。
        握手成功后先发 `hello`，收到 `welcome` 即接入成功。

        ### 上行（节点 → 中枢）
        | type | 说明 |
        |---|---|
        | `hello` | 自报身份 + 能力声明 + 实例申报（必须第一帧） |
        | `heartbeat` | 心跳；任何上行帧都续命 |
        | `ack` | 接单：`assigned → acked` |
        | `progress` | 开始执行：`acked → running` |
        | `result` | 结果：`running → succeeded/failed` |

        ### 下行（中枢 → 节点）
        | type | 说明 |
        |---|---|
        | `welcome` | 握手成功，带 `heartbeatSec` / `leaseTtlSec` |
        | `assign` | 派活：能力名 + 版本 + params + 租约（**不含命令/脚本/argv**） |
        | `cancel` | 停止任务 |
        | `error` | 协议错误（不关连接，除 hello 失败） |

        ### result 的 out 三态（不变量 I5）
        | 线上 JSON | 落库 | 含义 |
        |---|---|---|
        | 没有 `out` 键 | `reported=0, out=NULL` | 没回报出口 → 不派下一跳 |
        | `"out": null` | `reported=1, out=NULL` | 明确到头了 |
        | `"out": "fix"` | `reported=1, out='fix'` | 走 fix 出口 |

        ### hello 的可选 `manifest`：节点声明「我怎么跑」

        `hello` 除了 `capabilities: [{capability, version}]`（老字段，语义不变），
        还可以带一个**可选**的 `manifest` 数组：

        ```jsonc
        { "manifest": [
            { "capability": "review", "version": 1,
              "run": { "runner": "bash", "command": "./runners/review.sh",
                       "timeoutSec": 900, "concurrency": 2,
                       "env": { "LOG_LEVEL": "info" } } } ] }
        ```

        - 缺省 `manifest` = 老行为：只报 `name@version`，`runSpec` 存 `{}`。
        - `capabilities` 与 `manifest` 同时出现时**以 manifest 为准**（信息更全）；
          manifest 里没写的 `capabilities` 项仍然是声明，只是 `runSpec` 为 `{}`。
        - `run` 在 manifest 条目里**必填**；`runner` 本期只接受 `bash`，
          `command` 非空，`concurrency` 必须在 `[1, nodes.max_concurrency]`。
          不合法时握手失败，`error.code = invalid_manifest`，`message` 列出**全部**问题项
          （与 `unknown_capability` 同构：每种拒绝原因一个码）。
        - **只存不执行**（不变量 I1）：`run` 落到 `node_capabilities.run_spec` 后
          仅用于控制台展示与排障（`GET /nodes/{id}` 的 `capabilities[].runSpec`）。
          中枢不解码、不拆参数、不判路径存在/可执行、不拼命令行，也不把它写进 `assign`。
      security:
        - nodeToken: []
      responses:
        "101":
          description: 协议切换成功（此后走 WebSocket 帧）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/register/options:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 开始 Passkey 注册（返回 WebAuthn challenge）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
                displayName: { type: string }
      responses:
        "200": { description: WebAuthn creation options }
  /auth/register:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 完成 Passkey 注册（校验 attestation，建用户+会话+恢复码）
      responses:
        "200":
          description: |
            注册成功，Set-Cookie 会话。响应含可选字段 `recoveryCodes`（明文仅此一次）。
        "400": { $ref: "#/components/responses/Error" }
  /auth/login/options:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 开始 Passkey 登录
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
      responses:
        "200": { description: WebAuthn request options }
  /auth/login:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 完成 Passkey 登录（建会话）
      responses:
        "200": { description: 登录成功，Set-Cookie 会话 }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 登出（吊销会话）
      responses:
        "200": { description: 已登出 }
  /auth/sessions:
    get:
      security:
        - cookieAuth: []
      tags: [auth]
      summary: 列出当前用户的登录会话
      responses:
        "200": { description: 会话列表 }

  /auth/recovery/login:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 用恢复码登录（校验哈希 → 作废该码 → 建会话 Cookie）
      description: |
        body: `{username, code}`。成功后该恢复码一次性作废；会话模型与 Passkey 登录相同，
        随后可走 `/auth/passkeys/register*` 补建 Passkey。
        码格式：`XXXX-XXXX-XXXX-XXXX`（去歧义字符集，大小写不敏感，连字符可选）。
        限速：10/min/IP + 10/min/username（小写）；超限返回 429，带 `Retry-After: 60`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, code]
              properties:
                username: { type: string }
                code: { type: string, description: "恢复码明文" }
      responses:
        "200": { description: 登录成功，Set-Cookie 会话 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: '限速（IP 或 username）；响应头 Retry-After: 60'

  /auth/recovery/regenerate:
    post:
      security:
        - cookieAuth: []
      tags: [auth]
      summary: 重新生成恢复码（需登录；作废全部未用旧码）
      description: |
        作废当前用户全部未使用恢复码，签发新一批（默认 8 个），明文仅在本响应返回一次。
      responses:
        "200":
          description: 新恢复码明文（仅此一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /auth/recovery/status:
    get:
      security:
        - cookieAuth: []
      tags: [auth]
      summary: 恢复码状态（需登录；不含明文）
      responses:
        "200":
          description: 未用码数量
          content:
            application/json:
              schema:
                type: object
                properties:
                  unusedCount: { type: integer }
                  hasCodes: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }

  /keys:
    get:
      security:
        - cookieAuth: []
      tags: [keys]
      summary: 列出 API Keys（不含明文/哈希）
      responses:
        "200": { description: Key 列表 }
    post:
      security:
        - cookieAuth: []
      tags: [keys]
      summary: 新建 API Key（仅此处返回一次明文）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items:
                    {
                      type: string,
                      enum: [notify:send, notify:receive, devices:read],
                    }
      responses:
        "200": { description: 创建的 Key（含明文，仅此一次） }
  /keys/{id}/revoke:
    post:
      security:
        - cookieAuth: []
      tags: [keys]
      summary: 停用 API Key
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已停用 }

  /devices:
    get:
      deprecated: true
      security:
        - cookieAuth: []
      tags: [devices]
      summary: 列出接收设备
      responses:
        "200": { description: 设备列表 }
    post:
      deprecated: true
      security:
        - cookieAuth: []
      tags: [devices]
      summary: 注册/更新推送订阅设备（前端订阅后上报）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUpsert" }
      responses:
        "200": { description: 已保存 }
  /devices/{id}:
    patch:
      deprecated: true
      security:
        - cookieAuth: []
      tags: [devices]
      summary: 更新设备（重命名/开关/status 过滤/标签）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                enabled: { type: boolean }
                eventScope: { type: string, enum: [final, all] }
                tags: { type: array, items: { type: string } }
      responses:
        "200": { description: 已更新 }
    delete:
      deprecated: true
      security:
        - cookieAuth: []
      tags: [devices]
      summary: 解绑设备
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已删除 }

  /vapid-public-key:
    get:
      security: []  # 匿名可访问
      tags: [devices]
      summary: 返回 VAPID 公钥（前端订阅用）
      responses:
        "200": { description: 公钥 }

  /cli-auth/sessions:
    post:
      tags: [cli-auth]
      summary: 创建 CLI 设备授权会话（匿名，IP 限速 10/min）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceName, scopes]
              properties:
                deviceName:
                  { type: string, description: 设备名（hostname），≤64 字符 }
                scopes:
                  {
                    type: array,
                    items: { type: string },
                    description: 请求的 scope 列表,
                  }
      responses:
        "200":
          description: 会话创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  secret:
                    {
                      type: string,
                      description: 轮询凭证（仅此一次返回，不进 URL）,
                    }
                  userCode: { type: string, description: 8 位短码 XXXX-XXXX }
                  authUrl: { type: string, description: 授权链接 }
                  pollInterval: { type: integer, default: 2 }
                  expiresAt: { type: integer }
                  scopes: { type: array, items: { type: string } }
        "400":
          $ref: "#/components/responses/Error"
        "429":
          description: 限速

  /cli-auth/sessions/{id}:
    get:
      tags: [cli-auth]
      summary: 查询授权会话信息（需登录 Cookie）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 会话信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  deviceName: { type: string }
                  requestedScopes: { type: array, items: { type: string } }
                  status:
                    {
                      type: string,
                      enum: [pending, approved, consumed, denied, expired],
                    }
                  createdAt: { type: integer }
                  expiresAt: { type: integer }
        "404":
          description: 会话不存在或已过期

  /cli-auth/sessions/by-code:
    get:
      tags: [cli-auth]
      summary: 按短码查询会话（需登录 Cookie，按用户限速 20/min）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            { type: string, description: 8 位短码，大小写不敏感、容忍连字符 }
      responses:
        "200":
          description: 会话信息（同 /cli-auth/sessions/{id}）
        "404":
          description: 会话不存在或已过期
        "429":
          description: 限速

  /cli-auth/sessions/{id}/approve:
    post:
      tags: [cli-auth]
      summary: 批准授权（需登录 Cookie）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  {
                    type: array,
                    items: { type: string },
                    description: 授予的 scope（必须 ⊆ requestedScopes）,
                  }
      responses:
        "200":
          description: 批准成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: approved }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: 终态冲突（会话不在 pending 状态）

  /cli-auth/sessions/{id}/deny:
    post:
      tags: [cli-auth]
      summary: 拒绝授权（需登录 Cookie）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 拒绝成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: denied }
        "409":
          description: 终态冲突

  /cli-auth/sessions/{id}/poll:
    get:
      tags: [cli-auth]
      summary: 轮询会话状态（匿名，secret 门控）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: secret
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 轮询结果（status 可为 pending/approved/denied/expired/consumed）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    {
                      type: string,
                      enum: [pending, approved, denied, expired, consumed],
                    }
                  apiKey:
                    {
                      type: string,
                      description: 仅 approved 时一次性返回明文 Key,
                    }
                  keyId: { type: string }
                  name: { type: string }
                  scopes: { type: array, items: { type: string } }
        "401":
          description: secret 无效
        "404":
          description: 会话不存在
