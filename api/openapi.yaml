components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: APIKey }
    cookieAuth: { type: apiKey, in: cookie, name: anotify_session }
    nodeToken:
      type: http
      scheme: bearer
      bearerFormat: NodeToken
      description: |
        节点专用 opaque token（`ant_node_...`），只存 sha256。
        与 `bearerAuth`（用户 API Key）是两套凭据。

  parameters:
    # 可复用的命名空间作用域参数（契约 §6.2 / docs/design/namespaces.md §6.2）。
    #
    # 只挂在**命名空间资源**上：/capabilities、/nodes、/nodes/{id}、/nodes/{id}/drain、
    # /nodes/{id}/upgrade、
    # /edges、/sources、/sources/{id}、/sources/{id}/fire、/sources/{id}/dry-run、
    # /sources/dry-run、/events、/tasks、/tasks/{id}、/tasks/{id}/cancel、/traces/{id}、
    # /console/events、/stats。
    # 部署级端点（/admin/*、/auth/*、/keys、/devices）与 /namespaces 自身、
    # /hooks/{token}、/node/stream 不加（它们的命名空间不是从这里来的）。
    NamespaceId:
      name: namespaceId
      in: query
      required: true
      schema: { type: string }
      description: |
        **必填**。本次请求作用于哪个命名空间（契约 §6.2）—— 显式，或者显式全部，
        **永远没有隐式默认**。

        - 缺参 → `400`（`namespaceId is required`），**绝不回退到默认命名空间**：
          回退等于把调用方写错的地方藏起来
        - 不存在 → `404`（`{"error":"namespace not found"}`，不回显传入的 id）
        - 未登录 / 用户不存在 → `401`
        - **没有 `403`**：组织层已在迁移 14 删除（#204），本部署内不再有
          「有、但属于别人」这一态 —— 存在就 `200`，不存在就 `404`。
          原先 `POST /nodes` 与 `/playbooks*` 那套「跨组织也报 404、且与『不存在』
          逐字节相同，以免写端点被当作命名空间 id 探测器」的显式例外
          （`#185` / 契约 D2）已随之失效，写读同一份口径
        - `namespaceId=*`：跨命名空间汇总（管理员视图），**只允许读端点**（列表类）；
          写端点、单对象端点（`/tasks/{id}`、`/nodes/{id}`、`/sources/{id}`、
          `/traces/{id}`）以及口径未定义的 `/stats` 带 `*` → `400`
        - 跨命名空间引用 → `400`（不变量 I11）：边两端能力、源的目标能力、子任务的父链
          都必须与本次作用域同一个命名空间
        - `POST`/`PATCH` 的写端点也可以把它放在请求体的 `namespaceId` 字段里：
          `POST /events` 是 **body 优先**，其余写端点是 **query 优先**；
          只读 query 的写端点（`/tasks/{id}/cancel`、`/nodes/{id}/drain`、
          `DELETE /sources/{id}`）见各自 operation 说明

        所有资源响应的对象里都带 `namespaceId` 回显归属（`/namespaces` 自身不带：
        它是隔离维度本身）。

    # 预案（playbook）专用的命名空间作用域参数。
    #
    # **刻意不复用 `NamespaceId`**：那条描述的是命名空间资源的通用口径
    # （读端点允许 `*` 做跨命名空间汇总），与预案「只按单命名空间」的口径相反。
    # 预案的 5 个端点全部按「单命名空间」硬约束（契约 §6.2、CONTRACT.md §2.8）。
    NamespaceIdStrict:
      name: namespaceId
      in: query
      required: true
      schema: { type: string }
      description: |
        **必填**（契约 §6.2）—— 显式指定本次请求作用于哪个命名空间，
        **永远没有隐式默认**。`GET` **只读** query；`POST` / `DELETE` 可放 query
        或 body 的 `namespaceId` 字段（**query 优先**、body 兜底，与契约 §6.2 一致）。

        - **缺参 → `400`**（`namespaceId is required`）。
          绝不回退到默认命名空间：回退等于把调用方写错的地方藏起来
        - **`namespaceId=*` → `400`（一律）**：预案**不提供跨命名空间汇总**。
          体检结论（能力定义 / 边 / 触发器的存在性）只能按**单个**命名空间算，
          「汇总的 ready 率」是个没有定义的量
        - **不存在 → `404`**：`{"error":"namespace not found"}`（不回显传入的 id）
        - **没有 `403`**：组织层已在迁移 14 删除（#204），不存在「属于别的组织」
          这一态，所以也不需要为「防 id 探测」单独做一套不可区分的响应 ——
          存在与不存在本来就只有两种结果
        - 跨命名空间引用 → `400`（不变量 I11）：安装预案时写入的能力定义、
          边、源全部落在**这一个**命名空间里

        响应里的对象都带 `namespaceId` 回显归属。

  schemas:

    # ---------- 命名空间（#162）----------
    Namespace:
      type: object
      description: |
        命名空间对象。**不带** `namespaceId`：它是隔离维度本身，不是「某个命名空间
        里的资源」（给命名空间加 namespaceId 是自指）。

        `capabilityCount` / `nodeCount` / `sourceCount` / `edgeCount` 只在
        `GET /namespaces`（列表）里是真计数；单对象响应（`POST` / `PATCH`）里
        这四个字段恒为 `0`（未做计数查询）。
      required: [id, slug, name, createdAt, capabilityCount, nodeCount, sourceCount, edgeCount]
      properties:
        id: { type: string, example: ns_1730000000_a1b2c3d4 }
        slug:
          type: string
          example: default
          description: 稳定标识（URL / 令牌作用域）；建了不可改
        name: { type: string, example: 默认, description: 展示名，可改 }
        createdAt: { type: integer, format: int64 }
        capabilityCount: { type: integer, description: 能力定义数（仅列表端点计算） }
        nodeCount: { type: integer, description: 节点数（仅列表端点计算） }
        sourceCount: { type: integer, description: 源数（仅列表端点计算） }
        edgeCount: { type: integer, description: 边数（仅列表端点计算） }

    Stats:
      type: object
      description: |
        命名空间级统计（`GET /stats`）。#80 之后的口径：`total` / `today` / `daily`
        是**事件**数，`delivered` / `deliveryTotal` 是**任务**终态统计，
        `deviceCount` 是当前用户的推送设备数（设备仍按用户维度）。
      required: [total, today, delivered, deliveryTotal, deviceCount, daily]
      properties:
        total: { type: integer, description: 该命名空间的事件总数 }
        today: { type: integer, description: 今日（服务端本地时区 0 点起；由 TZ 环境变量决定）事件数 }
        delivered: { type: integer, description: 成功任务数 }
        deliveryTotal: { type: integer, description: 已结束任务数（完成率的分母） }
        deviceCount: { type: integer, description: 当前用户已启用的推送设备数 }
        daily:
          type: array
          description: 近 ~371 天每天的事件数（热力图）；无数据时是 `[]`
          items:
            type: object
            required: [day, count]
            properties:
              day: { type: string, example: "2026-08-10" }
              count: { type: integer }

    # ---------- 事件中心 ----------
    Kind:
      type: string
      enum: [origin, end, pipe]
      description: |
        能力在链上的角色，**推导量，不落库**（不变量 I3）。**以边为准**（#383）：
        end = 没有出边；origin = 有出边、没有入边；pipe = 有出边、也有入边。
        入边包括能力边（别人 → 它）与入口边（来源 → 它）。

    # ---------- 能力正文（Capability Spec v3 §3）----------
    #
    # 三份 schema 说的是同一件东西的三种视角：
    #   CapabilityRunInput    请求体里的实现（扁平形状，P1-b 的入参）
    #   CapabilitySpec        正文**全文**（详情端点 / 产物里的 spec）
    #   CapabilitySpecSummary 正文的**列表投影**（files 换成 {count,bytes}）
    CapabilityRunInput:
      type: object
      required: [entrypoint, files]
      description: |
        能力的实现（**脚本形式**）：由任意 `agent` 节点执行。

        Capability Spec v3 §3.1 说实现只有两种形式、**恰好给一组**：
        本对象（files + entrypoint）或 `handler`（内置执行器，白名单，只有中枢的
        builtin 节点能认领）。HTTP 创建设计的只有前者；`handler` 形式由平台侧播种。
      properties:
        entrypoint:
          type: string
          example: run.sh
          description: |
            入口文件名，必须是 `files` 的一个 key，且正文以 `#!` 开头（直接 exec，
            不经 shell —— 没有 shell 就没有插值、拼接与引号问题）。
            省略时服务端按 `run.sh` 处理。
        files:
          type: object
          additionalProperties: { type: string }
          description: |
            相对路径 → 文件正文（普通文本）。单文件 ≤ 256 KiB、合计 ≤ 1 MiB；
            路径必须是相对路径（不得以 `/` 开头、不得含 `..`）。
        timeoutSec:
          type: integer
          default: 0
          description: |
            节点本地超时（秒）。0 = 不设本地超时，只受中枢租约约束。上限 86400。
        env:
          type: object
          additionalProperties: { type: string }
          description: |
            产物自带的环境变量。键必须是合法 shell 变量名，且**不得**以 `ANOTIFY_`
            开头（契约保留前缀）。
        workDir:
          type: string
          description: |
            执行目录：绝对路径，或 `~` / `~/…`（`~` 由**节点**展开为 agent 用户的
            家目录，不展开 `$VAR`）。空 = 每次任务一个独立目录。

    CapabilityFilesSummary:
      type: object
      required: [count, bytes]
      description: 列表里 `files` 的摘要（正文不进列表，见 `CapabilitySpecSummary`）。
      properties:
        count: { type: integer, description: 文件个数 }
        bytes:
          type: integer
          description: 全部文件正文的合计字节数（按 UTF-8 计，与产物上限同口径）

    CapabilitySpecSummary:
      type: object
      required: [outputs]
      description: |
        能力正文的**列表投影**：字段集合与 `CapabilitySpec` 逐字对齐，只把
        `run.files` 的正文换成 `{count, bytes}`。
      properties:
        params:
          type: object
          description: JSON Schema 的**受控子集**（不支持 $ref / if-then-else）。
            省略表示「没有参数」。
        outputs:
          type: array
          items: { type: string }
          description: 出口名的封闭集合（不变量 I2）；空时 `[]`
        requires:
          type: array
          items: { type: string }
          description: 节点必须预装的外部命令；空时省略
        lifecycle:
          type: object
          description: 重试 / 幂等 / 结果保留策略（不透明透传，原样进入 digest）
        sticky: { type: string, description: 粘性路由键类型（空 = 不粘） }
        run:
          type: object
          description: |
            脚本形式的实现。`handler` 形式的能力没有这个键（两组恰好给一组）。
          properties:
            entrypoint: { type: string }
            files: { $ref: "#/components/schemas/CapabilityFilesSummary" }
            timeoutSec: { type: integer, description: 0 = 不设本地超时 }
            env:
              type: object
              additionalProperties: { type: string }
              description: 产物自带的环境变量（空时不出现这个键）
            workDir: { type: string }
        handler:
          type: string
          description: |
            内置执行器的名字（白名单：`notify-phone` / `noop`）。中枢的 builtin 节点
            认领，**不可部署到节点**（`POST /deployments` → 400 `builtin_not_deployable`）。

    CapabilitySpec:
      type: object
      required: [outputs, run]
      description: |
        能力正文的**全文**（Capability Spec v3 §3）：契约 + 实现。

        与 `CapabilitySpecSummary` 的差别只有 `run.files`：这里是相对路径 → 文件正文。
      properties:
        params:
          type: object
          description: JSON Schema 的**受控子集**（不支持 $ref / if-then-else）
        outputs:
          type: array
          items: { type: string }
          description: 出口名的封闭集合（不变量 I2）；空时 `[]`
        requires:
          type: array
          items: { type: string }
          description: 节点必须预装的外部命令
        lifecycle:
          type: object
          description: 重试 / 幂等 / 结果保留策略
        sticky: { type: string, description: 粘性路由键类型（空 = 不粘） }
        run:
          type: object
          required: [entrypoint, files]
          description: 脚本形式的实现；`handler` 形式下是零值（没有文件）
          properties:
            entrypoint: { type: string }
            files:
              type: object
              additionalProperties: { type: string }
              description: 相对路径 → 文件正文（普通文本，不是 base64）
            timeoutSec: { type: integer }
            env:
              type: object
              additionalProperties: { type: string }
            workDir: { type: string }
        handler:
          type: string
          description: 内置执行器的名字（与 `run` 恰好给一组）

    Capability:
      type: object
      properties:
        id: { type: string, example: cap_1730000000_a1b2c3d4 }
        namespaceId:
          type: string
          description: 能力定义所属命名空间（恒存在；同名同版本在不同命名空间里是不同定义）
        name: { type: string, example: review }
        displayName:
          type: string
          description: |
            **纯展示**用的标签（用户自己取的名字，如「分析 PR」）。空串表示没取，
            前端回落到 `name@version`。
            它不参与路由，也**不参与 contentHash** —— 改它不会产生新版本。
        version: { type: integer, example: 1 }
        paramsSchema:
          type: object
          description: JSON Schema 的**受控子集**（不支持 $ref / if-then-else）
        outputs:
          type: array
          items: { type: string }
          description: 出口名的**封闭集合**（不变量 I2）；边的 fromPort 必须属于它
        run:
          type: object
          nullable: true
          description: |
            「这个能力怎么跑」的**只读投影**（超时 / 工作目录 / 依赖），真相在产物 spec.run 里
            （随 digest 走、中枢只存不解释）。取不到产物时为 null —— 前端据此显示「—」，
            而不是把这两行藏起来（藏起来会让人以为这个能力没有超时）。
          properties:
            entrypoint: { type: string }
            timeoutSec: { type: integer, description: 0 = 不设本地超时，交给中枢租约兜底 }
            workDir:
              type: string
              description: 绝对路径，或以 ~/ 开头（~ 在节点上展开为 agent 用户的家目录，不展开 $VAR）；空 = 每次任务一个独立目录（#289：目录属于能力定义，不是节点配置）
        sticky:
          type: string
          description: 粘性路由的 selector 键名（空表示不粘）
        lifecycle:
          type: object
          properties:
            expiresInSec: { type: integer }
            retryable: { type: boolean }
            maxAttempts: { type: integer }
            resultTtlSec: { type: integer }
        source: { type: string, enum: [builtin, custom] }
        contentHash:
          type: string
          description: 规范化内容的 sha256；内容相同则幂等返回同一行
        createdAt: { type: integer, format: int64 }
        spec:
          $ref: "#/components/schemas/CapabilitySpecSummary"
          description: |
            能力正文（Capability Spec v3 §3）的**列表投影**：`files` 只剩 `{count, bytes}`，
            其余字段（params / outputs / requires / lifecycle / sticky / run / handler）原样。

            为什么列表不给正文：一份能力的脚本单文件上限 256 KiB、合计 1 MiB，列表一次
            几十条会被白涨几百 MB 级。要看正文，走
            `GET /capabilities/{id}/artifact`（那里的 `spec` 是**全文**）。

            注意 `run`（旧投影）与本字段**同源**：都由同一份能力正文算出，P4 删旧投影。

    CapabilityWithKind:
      allOf:
        - $ref: "#/components/schemas/Capability"
        - type: object
          required: [kind, declaredBy, executedBy]
          properties:
            kind: { $ref: "#/components/schemas/Kind" }
            executedBy:
              type: string
              enum: [hub, node, none]
              description: |
                谁执行这个能力（推导量，不落库）：
                `hub` 中枢自己执行（本来就不需要节点声明）、
                `none` 事件起点（不执行代码、不产生任务）、
                `node` 需要节点声明才跑得起来。
            declaredBy:
              type: array
              description: |
                声明了这个能力的节点（含 offline / draining —— 声明是配置事实，
                排空中的机器仍然声明着它）。空数组表示**没有任何节点能跑它**，
                这是一个永远跑不起来的配置。
              items:
                type: object
                required: [id, name, status]
                properties:
                  id: { type: string }
                  name: { type: string }
                  status: { type: string, enum: [online, offline, draining] }

    CapabilityArtifact:
      type: object
      required: [digest, entrypoint, files, timeoutSec, workDir, requires, env, spec]
      properties:
        digest:
          type: string
          description: '最新产物的内容寻址标识 `sha256:<64 hex>`'
          example: "sha256:ab12"
        entrypoint:
          type: string
          description: 入口文件名（一定在 `files` 里，且正文以 `#!` 开头）
          example: run.sh
        files:
          type: object
          additionalProperties: { type: string }
          description: |
            相对路径 → **文件正文**（普通文本，不是 base64）。
            空产物（没有文件）返回 `{}` 而不是 null。
        timeoutSec:
          type: integer
          description: 0 = 不设本地超时（交给中枢租约兜底）
        workDir:
          type: string
          description: 绝对路径，或以 ~/ 开头（~ 在节点上展开为 agent 用户的家目录，不展开 $VAR）；空 = 每次任务一个独立目录
        requires:
          type: array
          items: { type: string }
          description: 机器上必须预装的命令（空时 `[]`）
        env:
          type: object
          additionalProperties: { type: string }
          description: |
            产物自带的环境变量（键不得以 `ANOTIFY_` 开头：那是契约保留前缀）。
            没声明时返回 `{}` 而不是 null。
        spec:
          $ref: "#/components/schemas/CapabilitySpec"
          description: |
            **完整**正文（含 `files` 正文）。与上面那几个扁平字段是同一份数据：
            扁平投影是历史形状（前端已经在用），`spec` 才是 Capability Spec v3 的正文形状。

    CapabilityInput:
      type: object
      required: [name, run]
      description: |
        建能力的请求体（**扁平形状**：Capability Spec v3 §5 把请求形状切换推到 P4，
        P1-b 里服务端负责把它组装成 `spec`）。

        `run` 是**必填**的（P1-b2 起）：能力必须有实现（契约 R2），缺了就是
        `400 impl_missing`。占位请给一个什么都不做、退出码 0 的脚本。

        注意：`handler` 形式（内置执行器）**不接受**由本端点创建 —— 那是平台侧
        （内置播种 / 预案安装）的事，HTTP 创建一律走 `run`。
      properties:
        namespaceId:
          type: string
          description: |
            **必填**（本字段或 query 二者给一个；query 优先）。
            能力定义所属命名空间；不存在 → 404，未登录 → 401，`*` → 400（写端点）。
        name: { type: string, example: review }
        displayName:
          type: string
          description: |
            纯展示标签，可省略。**不参与 contentHash**：改名不产生新版本。
            但同一 name@version 已有内容时，改 displayName 会被判为
            "同内容已存在"（hash 相同）而不落库 —— 见 CreateCapability 注释。
        version:
          type: integer
          description: 省略时自动开下一个版本（append-only，不变量 I8）
        paramsSchema: { type: object }
        outputs:
          type: array
          items: { type: string }
          description: 出口名的**封闭集合**（不变量 I2）；边的 `fromPort` 必须属于它
        requires:
          type: array
          items: { type: string }
          description: |
            节点必须预装的外部命令（部署时 `LookPath` 探测，缺了部署失败）。
            上限 16 个；名字只允许 `[A-Za-z0-9._+-]`。
        sticky: { type: string }
        lifecycle: { type: object }
        source: { type: string, enum: [builtin, custom], default: custom }
        run:
          $ref: "#/components/schemas/CapabilityRunInput"
        force:
          type: boolean
          default: false
          description: |
            显式越过**升级闸门**（P2.2，设计 §3.6）：仅当新版本成为 latest 且会破坏
            已有的 name 型 link 时才需要。它只表示「我知道哪些线会断，仍然要推」——
            中枢**不会**替你改任何 link（改线仍然是用户的动作）。
        links:
          type: array
          description: |
            **能力 + 下游边一次提交**（可选）。带它就走**原子路径**：
            能力行、产物行（由 `CapabilityInput.run` 编译）、边行写在同一个事务里 ——
            要么全成，要么全不成。

            不带它 = 原有的两步流程（建完能力再用 `POST /edges` 逐条建边），行为不变。

            左端恒为**这个新能力的裸名字**（= 跟随 latest）；右端原样透传
            （`notify` 跟随 latest / `notify@2` 钉死）。任何一条不合法 → 400，
            整体回滚并把 `links[i]` 带在 `error` 里。
          items: { $ref: "#/components/schemas/CapabilityLinkInput" }

    CapabilityLinkInput:
      type: object
      description: |
        一条待建的 link（能力定义时一起提交）。字段口径与 `POST /edges` 一致，
        但没有 `fromRef`（左端恒为新能力的裸名字，跟随 latest）
        也没有 `fromIsSource`（能力定义时建的边一定是能力边）。
      required: [fromPort, toRef]
      properties:
        fromPort:
          type: string
          description: 出口名，必须属于**这次提交的** `outputs`（出口封闭，不变量 I2）。
        toRef:
          type: string
          description: |
            下游能力引用：`name`（跟随 latest）/ `name@version`（钉死）。
            解析不到、跨命名空间、或指向自己（自连）都会被拒（400 `edge_rejected`）。
        literals:
          type: object
          nullable: true
          description: |
            常量覆盖（设计 §3.3）：键必须在**目标能力**的 `paramsSchema.properties` 里，
            值类型必须与声明精确相等。不传 / `{}` = 没有覆盖。
          additionalProperties: true

    CapabilityBatchInput:
      type: object
      description: |
        批量创建的请求体（`POST /capabilities/batch`）。

        `capabilities[]` 的元素**就是** `CapabilityInput` —— 不另造一份「几乎一样」的
        schema：handler 复用同一个 decode 结构，而两份 schema 迟早会在「单建生效、
        批量静默丢弃」这种字段上分叉（例如以后加 `balance`，批量应该自动跟着有）。
        代价是元素里也能写出 `links` / `namespaceId` / `force` 这三个**批级**字段，
        它们的处置写在字段说明里（冲突或取或，不静默吃掉）。
      required: [capabilities]
      properties:
        namespaceId:
          type: string
          description: |
            **必填**（本字段与 query 二者给一个，query 优先；与 `POST /capabilities` 同口径）。
            一批能力只能属于一个命名空间；`*` → 400（写端点），不存在 → 404。
        capabilities:
          type: array
          minItems: 1
          description: |
            要建的能力（至少一条，空批 → 400 `capabilities is required`）。
            **批内 `name` 不可重复**：`links` 用名字寻址，重名会让同一条边指向两个定义。

            元素里三个批级字段的处置（因为复用 `CapabilityInput`，它们写在这里是合法的）：

            - `namespaceId` 与批级冲突 → 400（不静默采用其中一个）
            - `links` → 400（边只能走批级 `links`：元素里的边无法引用本批新建的名字，
              而「看起来配好了」的半成功比一个 400 贵得多）
            - `force` → 与批级取或（闸门是整批的，任一处声明都算数）
          items: { $ref: "#/components/schemas/CapabilityInput" }
        links:
          type: array
          description: |
            一个表单里声明的全部下游边：**两端都是引用**，可以指向本批新建的名字
            （事务里先插全部能力行，边后解析）。允许成环（契约 §2）。
            任一条不合法 → 400 `edge_rejected`，整批回滚。
          items: { $ref: "#/components/schemas/BatchLinkInput" }
        force:
          type: boolean
          default: false
          description: |
            越过**整批**的升级闸门（与单建同语义：只见「哪些线会断」、中枢不会替你改任何
            link）。它放在批级而不是逐元素：一个表单承诺的是「这些能力一起生效」，
            逐元素 force 会造出「批里一半被强制、一半没有」这种没人能预期的状态。
            元素里写 `force` 也算数（与批级取或），那是为了兼容「把单建的请求体贴进来」
            这一种用法。

    BatchLinkInput:
      type: object
      description: |
        批量创建里的一条边。与 `CapabilityLinkInput` 的差别只有一处：左端不再隐含
        「刚建的那个能力」，而是显式给 `fromRef` —— 它可以是本批新建的名字、库里已有的
        名字，或 `name@version` 钉死。

        没有 `fromIsSource`：入口边的左端是**来源名**，「一个表单建多个能力再接线」
        不会产生入口边（入口边由源页单独建）。
      required: [fromRef, fromPort, toRef]
      properties:
        fromRef:
          type: string
          description: |
            上游能力引用：`name`（跟随 latest）/ `name@version`（钉死）。
            可以引用**本批新建**的名字。
        fromPort:
          type: string
          description: 出口名，必须属于解析到的**上游版本**的 `outputs`（出口封闭，不变量 I2）。
        toRef:
          type: string
          description: |
            下游能力引用：`name`（跟随 latest）/ `name@version`（钉死）。
            同样可以引用本批新建的名字；解析不到 / 跨命名空间 → 400 `edge_rejected`。
            **不判自连与环**：`review → fix → review` 是合法编排（契约 §2），
            兜底是运行期的 hop 预算与 trace 任务预算。
        literals:
          type: object
          nullable: true
          description: |
            常量覆盖（设计 §3.3）：键必须在**目标能力**的 `paramsSchema.properties` 里，
            值类型必须与声明精确相等。不传 / `{}` = 没有覆盖。
          additionalProperties: true
        priority:
          type: integer
          default: 0
          description: |
            这条候选的优先级（契约 §1：**小的优先**）——同一 `(上游能力, 端口)` 的候选集合按
            `priority` 升序、取最小 priority 组，组内轮盘。

            **本期只接收、不落库**：落库是 `edges.priority` 那一条竖切的事（schema 迁移 +
            `store.Edge.Priority` + `createEdgeTx` 的 INSERT 列）。在那条竖切合入之前，
            这个字段会被解码，但**不入库、不出现在响应 `edges[]` 里、不影响派发选择**。
            先把字段写进契约而不是等接线完再加：前端/调用方可按冻结契约先发，
            届时中枢侧接线不需要再改一次契约。

    UpgradeImpact:
      type: object
      description: |
        升级影响面（P2.2，设计 §3.6）：把这一版变成 latest 会动到什么。
        非破坏性时 `breaking=false`、`changes`/`links` 都是**空数组**。
      required: [capability, breaking, changes, links]
      properties:
        capability: { type: string, description: 能力名 }
        fromVersion:
          type: integer
          description: 比对的上一版 latest（0 = 之前没有任何版本）
        toVersion: { type: integer }
        breaking:
          type: boolean
          description: true = 会破坏跟随 latest 的 link（需要 `force` 才能写入）
        changes:
          type: array
          items:
            type: object
            required: [kind, detail]
            properties:
              kind:
                type: string
                enum: [removed_port, param_type_changed, param_added_required]
              detail: { type: string, description: 人可读的说明 }
        links:
          type: array
          description: 受影响的 link（`fromRef --port--> toRef`）
          items:
            type: object
            required: [fromRef, port, toRef, reason]
            properties:
              fromRef: { type: string }
              port: { type: string }
              toRef: { type: string }
              reason: { type: string, description: 为什么这条 link 会受影响 }

    Edge:
      type: object
      properties:
        namespaceId:
          type: string
          description: 边所属命名空间（恒存在；主键前缀就是它）
        fromRef:
          type: string
          description: |
            左端**引用**（P2.2）：能力边是 `name`（跟随 latest）/ `name@version`（钉死）；
            入口边（`fromIsSource=true`）是**来源名**（如 `github`）。
        fromCapabilityId:
          type: string
          description: |
            `fromRef` **此刻**解析到的能力定义 id（只读派生量，**不落库**）。

            为什么要有它：边的真值只有引用（存 id 的话升级永远不生效），
            但界面要「点进去看这一版」就得知道当前解析到哪一版；让前端自己算
            name→latest 等于把解析语义复制一份，两边一漂就是「页面说 review@2、
            派发走了 review@3」。

            **入口边恒为空串**（左端是来源名，没有「哪一版」）；解析不到
            （引用的能力已被删）时也是空串。
        fromPort:
          type: string
          description: |
            必须属于**解析到的上游版本**的 `outputs`。入口边（fromIsSource=true）例外：
            事件类型由外部系统决定，也可以是 `"*"`（= 该来源的任意事件类型）。
        toRef:
          type: string
          description: |
            右端**引用**：`name`（跟随 latest，升级自动生效）/ `name@version`（钉死）。
            **不是** `capability_versions.id` —— 存 id 的话升级永远不会生效。
        toCapabilityId:
          type: string
          description: |
            `toRef` **此刻**解析到的能力定义 id（只读派生量，**不落库**）。

            与 `fromCapabilityId` 同口径：解析不到时是空串（这条边现在走不通），
            裸名字引用的取值会随能力发新版而变化 —— 这正是「跟随 latest」的体现。
        literals:
          type: object
          description: |
            这条边的**常量覆盖**（设计 §3.3）：进入下游的 params = data ⊎ literals，
            字面量优先，所以 data 里不必再带这些键。`{}` = 没有覆盖。
            键与值类型受目标 `paramsSchema` 约束（定义期硬拒）。
          additionalProperties: true
        mapping:
          type: object
          nullable: true
          description: |
            这条边的**引用模板**（P2.1，设计 §11.5）：进入下游的 params =
            `ResolveParams(mapping, 事件 payload)` ⊎ `literals`。`{}` / `null` = 没有模板。

            **只有入口边（`fromIsSource=true`）允许非空**：外部世界不会替你拼参数
            （GitHub 的 `pull_request.title` 得有人声明成下游的 `params.title`）；
            能力边带非空 mapping → 400（`code=edge_rejected`）——参数怎么拼是实现的
            内部事务，能力边的 data 由 emit 提供。

            每个键必须在目标能力的 `paramsSchema.properties` 里；值可以是常量或
            `{{点号路径}}` 模板（模板值的类型要触发时求值后才知道，定义期不判类型）。
          example: { title: "{{pull_request.title}}", n: "{{pull_request.number}}" }
          additionalProperties: true
        createdAt: { type: integer, format: int64 }

    DownstreamsInput:
      type: object
      required: [links]
      properties:
        namespaceId:
          type: string
          description: |
            **必填**（本字段或 query 二者给一个；query 优先）。这组下游属于该命名空间；
            目标能力必须与它同命名空间（I11）。
        links:
          type: array
          description: |
            这组下游的**全部**（replace 语义）。空数组 = 清空（终端能力）。
            **字段必须存在**：缺字段 → 400 `links_required`（漏传与清空是两件事）。
          maxItems: 100
          items: { $ref: "#/components/schemas/DownstreamInput" }

    DownstreamInput:
      type: object
      required: [toRef]
      properties:
        toRef:
          type: string
          description: |
            目标能力引用：`name`（跟随 latest）/ `name@version`（钉死）。
            能力 id 也接受并归一成 `name@version` 落库（输入兼容一个版本）。
          example: script.echo
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: |
            候选优先级（小的优先，同级轮盘）。缺省 0。
            它只影响「同一个能力有多个下游时先选谁」，不改变这条边通不通。
        literals:
          type: object
          nullable: true
          description: |
            常量覆盖（下游 params = data ⊎ literals，字面量优先）。默认 `{}` / `null` = 没有覆盖。
            每个键必须出现在目标 `paramsSchema.properties` 里，值类型必须与声明**精确相等**。
          example: { to: user_123 }
          additionalProperties: true

    DownstreamLink:
      type: object
      required: [toRef, priority, literals, toCapabilityId, resolvedVersion]
      properties:
        toRef:
          type: string
          description: '落库的引用（原样保存用户给的 `name` / `name@version`）'
        priority: { type: integer }
        literals:
          type: object
          description: '落库的字面量（`{}` = 没有覆盖）'
          additionalProperties: true
        toCapabilityId:
          type: string
          description: |
            `toRef` 在**写入那一刻**解析到的能力定义 id（解析不到为空串——存量坏边不会让
            整个列表 500）。前端拿它做详情链接，不必自己实现 name→latest。
        resolvedVersion:
          type: integer
          description: '同一个定义的版本号（`name` 型引用 = 此刻的 latest）'

    DownstreamsResult:
      type: object
      required: [name, links]
      properties:
        name:
          type: string
          description: '能力名（一个能力的所有版本共用同一组出边）'
        links:
          type: array
          description: '落库后的完整集合，与请求同序；空时 `[]`（不是 null）'
          items: { $ref: "#/components/schemas/DownstreamLink" }

    EdgeInput:
      type: object
      required: [fromPort]
      properties:
        namespaceId:
          type: string
          description: |
            **必填**（本字段或 query 二者给一个；query 优先）。边所属命名空间；
            两端能力必须与它同命名空间（I11，跨命名空间引用 → 400）。
        fromIsSource:
          type: boolean
          default: false
          description: true 时 fromRef 被解释为来源名（建入口边）
        fromRef:
          type: string
          description: |
            左端引用：能力边 `name` / `name@version`；入口边是被引用的**来源名**。
            `fromRef` 与旧的 `fromCapability` 至少给一个（新的优先）。
        fromPort: { type: string }
        toRef:
          type: string
          description: |
            右端引用：`name`（跟随 latest）/ `name@version`（钉死）。
            `toRef` 与旧的 `toCapability` 至少给一个（新的优先）；
            旧字段的值可以是能力 id（输入兼容，落库时被解析成 `name@version`）。
        fromCapability:
          type: string
          deprecated: true
          description: '`fromRef` 的旧名（兼容一个版本）'
        toCapability:
          type: string
          deprecated: true
          description: '`toRef` 的旧名（兼容一个版本；值可以是能力 id）'
        literals:
          type: object
          nullable: true
          description: |
            可选的字面量覆盖（默认 `{}` / `null` = 没有覆盖）。
            必须**是对象**（数组、标量、坏 JSON → 400）；每个键必须出现在目标能力的
            `paramsSchema.properties` 里；值类型必须与声明**精确相等**（不做转换）。
          example: { to: u_123 }
          additionalProperties: true
        mapping:
          type: object
          nullable: true
          description: |
            可选的**引用模板**（默认 `{}` / `null` = 没有模板）。只有入口边
            （`fromIsSource=true`）允许非空，否则 400 `edge_rejected`。

            必须**是对象**；每个键必须出现在目标能力的 `paramsSchema.properties` 里；
            值可以是常量（按 schema 判类型），也可以是 `{{点号路径}}` 引用（求值后才知道类型，
            定义期只校验占位符语法），或旧对象的映射声明 `{"from":"路径"}` / `{"var":"别名"}`。
          example: { title: "{{pull_request.title}}" }
          additionalProperties: true

    TaskStatus:
      type: string
      description: 九态状态机（契约 §3）
      enum:
        - pending
        - assigned
        - acked
        - running
        - succeeded
        - failed
        - canceled
        - abandoned
        - lease_expired

    Task:
      type: object
      properties:
        id: { type: string, example: tsk_1730000000_abcd1234 }
        namespaceId:
          type: string
          description: 任务所属命名空间（恒存在；子任务继承父任务）
        traceId: { type: string, description: 一个根事件引起的全部工作 }
        parentTaskId:
          type: string
          nullable: true
          description: 谁派生；根事件直接派生的为 null
        path:
          type: array
          items: { type: string }
          description: 从根到本任务的能力序列（环剪枝用）
        capabilityId: { type: string }
        capability: { type: string, description: 冗余存 name，展示用 }
        version: { type: integer }
        params: { type: object }
        status: { $ref: "#/components/schemas/TaskStatus" }
        nodeId: { type: string, nullable: true }
        instanceId: { type: string, nullable: true }
        leaseUntil: { type: integer, format: int64, nullable: true }
        attempts: { type: integer }
        seqInTrace:
          type: integer
          description: |
            这条任务在同一 (namespace, trace, 能力名) 里是第几次执行（1 起；派发时算好落库）。
            与 attempts 的区别：attempts 是「派发了几次」（重派 +1），seqInTrace 是
            「这一行在组内的位置」（重派不变），只用于展示/审计（节点本地执行记录的命名）。
            0 = 从未派发过，或加这一列之前建的老任务。
        reported:
          type: boolean
          deprecated: true
          description: 历史字段：结果帧到过为 true（新写入恒为 true）。不要再据此判断语义。
        summary:
          type: string
          description: |
            唯一的 message：成功=做了什么，失败=为什么失败（失败时非空，空则服务端兜底 "failed"）。
        artifacts:
          type: array
          items: { type: string }
        error:
          type: string
          description: summary 的派生位（失败时相等，成功时为空）；仅为兼容保留。
        capHash:
          type: string
          description: 派发时的能力定义 content_hash（版本钉住，不变量 I8）
        digest:
          type: string
          description: |
            派发时钉住的**产物内容** digest（artifacts.digest 的副本，P0-a）。
            与 capHash 的区别：capHash 钉能力定义（params_schema + ports），
            digest 钉真正被执行的那份字节（内容寻址，改内容就换 digest）。
            "" = 这次派发没有可钉的产物：中枢执行的内置能力（如 notify.phone）、
            派发时该能力还没登记过产物、或加这一列之前建的老任务。
        graphId:
          type: string
          description: 派发时的 graph_versions.id
        createdAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64, nullable: true }
        finishedAt: { type: integer, format: int64, nullable: true }

    TaskLogs:
      type: object
      description: |
        一条任务的日志快照（CONTRACT-logs-on-node §2）。**中枢每次请求都向节点现取**
        （一帧 `logs_request` / `logs_response`），**不落库、不缓存**：日志只存在节点上，
        中枢手里的任何副本都只会更旧。

        响应**恰好四个数据字段 + `available` / `reason`**：不额外给 taskId /
        namespaceId / createdAt（调用方已经知道在问哪个任务，多一份事实源只会有两种口径）。

        `stdout` / `stderr` 是**原文**（含节点追加的截断标记），中枢不再裁剪；
        两个流分开给：合并之后 stderr 的「谁先写谁先上」顺序就没了，而报错时恰恰
        要看清是哪个流。

        `available: false` 时四个数据字段一定是空值 / 0，`reason` 说明为什么没取到；
        `available: true` 时 `reason` 不存在（`omitempty`）。
      required: [stdout, stderr, truncated, bytes, available]
      properties:
        stdout:
          type: string
          description: 子进程 stdout 原文（空串 = 没输出或没取到；不 trim、不转义）
        stderr:
          type: string
          description: 子进程 stderr 原文（空串 = 没输出或没取到；失败原因通常在这里）
        truncated:
          type: boolean
          description: |
            节点侧这次**回包**被截断过（每流都留尾部，两流合计不超 1 MiB；档案本身仍完整）。
            采集侧的事实，**不能**由字符串长度反推：恰好卡在上限时反推不出来，
            而「看得不是全部」这句话必须说得准。
        bytes:
          type: integer
          format: int64
          description: |
            截断**前**两个流的真实字节数之和（前端据此显示「原始多大」）。
            `0` 不能当「没取到」用（一次什么都没输出的执行也是 0），这两件事由 `available` 区分。
        available:
          type: boolean
          description: |
            四个数据字段是否**真的从节点上取回来了**。恒出现：缺字段会让「没取到」
            看起来像「取到了但为空」。`false` → 看 `reason`。
        reason:
          type: string
          description: |
            没取到的原因（仅 `available: false` 时出现）。**封闭集合**：前端按它选降级文案，
            新增取值等于给用户看空白。
            - `node_offline` —— 节点没有活跃连接（稍后连上可再看）；
            - `no_local_archive` —— 节点上没有那次执行的档案（可能已过保留期），
              或者任务还没派给任何节点；
            - `timeout` —— 帧发出去了没等到回包，以及其它一切没取到的情况。
          enum: [node_offline, no_local_archive, timeout]

    Emission:
      type: object
      description: |
        一次 emit 的落库行（emit-protocol §3.1 的帧 + §3.2 的派发计数）。
        `routed` / `pruned` 是**首次**处理的结果：重复 seq 一律回同一份计数，
        所以它们必须落库（不能只放在 emit_ack 的返回值里）。
      required: [seq, port, data, note, routed, pruned, createdAt]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: |
            任务内单调递增、从 1 开始（§4）。它同时是幂等键的一半
            （`UNIQUE(task_id, seq)`），所以页面上显示的是「第几次 emit」，不是行号。
        port:
          type: string
          description: 上游回报的出口名（路由的唯一输入；端口名没有保留字）
        data:
          type: object
          additionalProperties: true
          description: |
            这次产出的 JSON 对象——**原样**返回（审计要的是当时那份字节，不重排键）。
            注意是对象而不是字符串：它直接就是下游的 params（§3.3）。
        note:
          type: string
          description: |
            emit 帧里的人类可读备注（§3.1，不参与路由）。
            当前恒为空串：emissions 表还没有 note 列，字段先占位以固定响应形状。
        routed:
          type: integer
          description: 首次处理派发出去的下游条数（= 建出的子任务行数）。0 是合法值
        pruned:
          type: integer
          description: 首次处理剪掉的 link 条数（no_node / foreign_user / path / param_*）
        createdAt:
          type: integer
          format: int64
          description: 首次落库时刻（unix 秒）；重复 seq 不会更新时间

    # ---------- 源（origin）----------

    SourceInput:
      type: object
      required: [name, kind, targets]
      properties:
        namespaceId:
          type: string
          description: |
            **必填**（本字段或 query 二者给一个；query 优先）。源所属命名空间；
            每个出口能力必须与它同命名空间（I11，跨命名空间引用 → 400）。
        name:
          type: string
          description: 用户可读名，**同一个命名空间内**唯一（如「每晚体检」）
        kind:
          type: string
          enum: [cron, webhook, github, manual]
          description: |
            - `cron`：定时器，按 config.expr 到点触发
            - `webhook`：外部 POST 到 hookUrl
            - `github`：GitHub 触发器。投递路径与 webhook 完全相同，
              区别只在载荷形状已知——前端据此给字段清单和 GitHub 侧配置指引
            - `manual`：页面上点一下就跑

            创建后不可修改（换种类等于换语义）。
        config:
          type: object
          description: |
            按 kind 解释（**只读配置字段，不求值、不执行** —— 不变量 I6）：

            - cron：`{"expr": "0 3 * * *", "tz": "Asia/Shanghai"}`
              五段表达式，支持 `*` `/` `,` `-`；不支持 `@daily` 等宏
            - webhook：`{"token": "src_..."}`（留空则服务端生成）
            - manual：`{}`

            `vars` / `payload` 不随 kind 专属字段重写：PATCH 时未带它们 = 从当前配置**继承**
            （显式 `"vars": []` / `"payload": {}` 才是清空），`"config": null` = 本次不改 config。
          properties:
            expr: { type: string }
            tz: { type: string }
            token: { type: string }
            vars:
              type: array
              deprecated: true
              description: |
                已弃用。旧配置里的别名表仍会被读取用作别名解析：
                `{{name}}` 先查别名表，未命中再当 payload 点号路径。新配置不再写入。
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string, example: "author" }
                  from:
                    type: string
                    description: payload 点号路径（与 `value` 恰有其一）
                  value:
                    description: |
                      旧形态的常量值（与 `from` 恰有其一，兼容读取；新配置不再写入）。
            payload:
              type: object
              description: |
                cron/manual 的事件 payload 字面量，作为参数引用的取值来源。

                **仅 cron/manual 保留并校验；webhook/github 丢弃该键**
                （投递体本身就是 payload；残留的坏值不会导致 400）。

                合并方向：`config.payload` 打底，**用户字段覆盖同名键**——包括 cron 的系统字段
                `source` / `kind` / `firedAt`（用户显式写的配置不该被静默盖掉）。
                **仅 cron/manual** 上要求是 JSON 对象（数组 / 标量 → 400）。
        enabled:
          type: boolean
          default: true
        targets:
          type: array
          minItems: 1
          description: |
            出口能力列表（多选 = 扇出）。至少要一个：没有出口的源产生的事件永远派不出去。

            **每个出口带自己的参数**（`params`）——各能力的 `params_schema`
            字段名与必填项都不同，一份公共参数必然对不上至少一边。
            服务端在建源时就用该能力的 schema 校验，非法直接 400：顶层 `required` 按**模板键集合**
            判定（写了键就算满足，值还能是占位符），只对能完全解析的字面量逐字段校验类型。

            **它就是入口边**（P2.1）：每个 target 落库为一条
            `from_is_source=1 / from_key=<源名> / from_port='*'` 的边，`params` 存在
            `edges.mapping` 上。所以「源触发」与 `POST /v1/events` 走的是同一条派发路径。

            兼容两种写法：
              `["cap_a", "cap_b"]`                              只要 ID
              `[{"capabilityId":"cap_a","params":{"x":1}}]`      带参数
          items:
            oneOf:
              - type: string
                description: 出口能力 ID（不传参数）
              - type: object
                required: [capabilityId]
                properties:
                  capabilityId: { type: string }
                  params:
                    type: object
                    description: |
                      该能力的参数（按它的 params_schema 校验）。

                      每个值可以是**字面量**或**引用**：`"{{pull_request.additions}}"`
                      （整值引用，保留原始类型）、`"PR #{{pull_request.number}}"`
                      （混写，结果一律字符串）、旧对象形态 `{"from":"路径"}` /
                      `{"var":"别名","default":...,"as":...}`。

                      **不做求值**（不变量 I6）：单趟替换，替换结果**不再扫描**；
                      不做条件/循环/函数/运算。

                      值也可以是 `null`（原样传）：OpenAPI 3.0.3 无法表达 null 分支，
                      因此下面的 oneOf 只列 string / number / boolean / object / array；null 见上注。

                      **取值结果是 `null` 一律算未命中**（别名表的值，或 payload 里的**显式 `null`**）：
                      有 `default` 用 `default`，否则 `param_missing`；混写里未命中不会静默拼成空串。

                      **配置期校验口径**：顶层 `required` 按**模板键集合**判定（写了键就算满足，
                      不要求值已解析），只对能完全解析的字面量逐字段校验，含占位符 / 映射的子树留到派发期。
                      所以 `{"to":"{{pull_request.user.login}}","title":"hi"}` 能直接保存。
                    additionalProperties:
                      oneOf:
                        - type: string
                          description: |
                            字面量，或模板引用：整值引用 `"{{pull_request.additions}}"` 保留原始类型；
                            混写 `"PR #{{pull_request.number}}: {{pull_request.title}}"` 结果一律字符串。
                        - type: number
                          description: 字面量数字（原样传，不做类型转换）
                        - type: boolean
                          description: 字面量布尔（原样传）
                        - type: array
                          items: {}
                          description: 字面量数组（原样传，不做类型转换）
                        - type: object
                          description: |
                            字面量对象，或**映射声明**（旧形态，向后兼容）：必须恰好含 `from`（payload 点号路径）
                            或 `var`（源 config.vars 里声明的别名）之一，两者互斥；可选 `default`（未命中时的兜底值）
                            与 `as`（string/number/boolean/json）。

                            多一个键就按字面量对象处理：`{"from": 1}`、`{"from":"a","x":2}` 都是**字面量**，
                            配置期也不拦（只有 `from`+`var` 并存、`{var}` 未声明、写全了 `default`/`as` 却没有
                            `from`/`var` 这三种才 400）。

    Source:
      type: object
      required: [id, namespaceId, name, kind, enabled, targets, createdAt]
      properties:
        id: { type: string, example: "src_..." }
        namespaceId:
          type: string
          description: 源所属命名空间（恒存在；名字的唯一性也是按命名空间算的）
        name: { type: string }
        kind:
          type: string
          enum: [cron, webhook, github, manual]
          description: |
            cron 定时器 / webhook 通用 HTTP 回调 / github GitHub 触发器（形状已知，
            前端给字段清单与一键配置；投递路径与 webhook 相同）/ manual 手动。
        config:
          type: object
          description: |
            按 kind 解释的配置。

            **已弃用 `vars`**：别名表（给 payload 路径起短名字）整个删掉了。
            参数里直接写完整路径即可，前端提供点选补全。

            老配置里的 `vars` 仍会被读取（按别名解析 `{{name}}`），
            但新配置不再写入。顺序是：`{{name}}` 先查别名表，未命中再当 payload 点号路径。
            `{var:"name"}` 是显式引用，只查别名表（配置期必须已声明）。
          properties:
            expr: { type: string, description: "cron 专用：五段表达式" }
            tz: { type: string, description: "cron 专用：时区，默认 Local" }
            vars:
              type: array
              deprecated: true
              description: |
                已弃用。旧配置里的别名表仍会被读取用作别名解析：
                `{{name}}` 先查别名表，未命中再当 payload 点号路径。
                新配置不再写入。
              items:
                type: object
                required: [name]
                properties:
                  name: { type: string, example: "author" }
                  from:
                    type: string
                    description: |
                      payload 点号路径，如 `pull_request.user.login`（与 `value` 恰有其一）。
                      别名不承载数据，新配置只写 `from`；常量直接写在参数值里。
                  value:
                    description: |
                      旧形态的常量值（与 `from` 恰有其一）。仍会被读取，新配置不再写入。
            payload:
              type: object
              description: |
                cron/manual 的事件 payload 字面量，作为参数引用的取值来源。

                **仅 cron/manual 保留并校验；webhook/github 丢弃该键**
                （投递体本身就是 payload；残留的坏值不会导致 400）。

                合并方向：`config.payload` 打底，**用户字段覆盖同名键**——包括 cron 的系统字段
                `source` / `kind` / `firedAt`（用户显式写的配置不该被静默盖掉）。
        enabled: { type: boolean }
        targets:
          type: array
          description: |
            出口能力列表（含各自已配置的参数）。

            它们就是**入口边**的 DTO（P2.1）：读源时从 `edges` 里
            （`from_is_source=1 AND from_key=<源名>`）读回来，`params` = 该边的 `mapping`。
          items:
            type: object
            required: [capabilityId]
            properties:
              capabilityId: { type: string }
              params:
                type: object
                description: |
                  参数值。按内容区分形态：

                  - **字面量**：`{"env": "prod"}`（不转换，尊重用户写的）
                  - **整值引用**：`{"lines": "{{pull_request.additions}}"}`
                    保留原始类型（payload 里是数字就是数字）
                  - **模板拼接**：`{"title": "PR #{{number}}: {{title}}"}`
                    结果一定是字符串
                  - **别名**：`{"author": "{{author}}"}`（`config.vars` 里声明的短名字）
                  - **映射声明**（旧形态）：`{"title": {"from":"pull_request.title","default":"(无标题)"}}`
                    （`from` 与 `var` 互斥，可选 `default` / `as`）

                  解析顺序：先查 `config.vars` 别名表，未命中就当 payload 点号路径
                  （`{var}` 只查别名表）。
                  类型按 `as` → 目标能力 `paramsSchema` 推断；转不了则按 `param_type` 剪枝；
                  路径取不到且无 `default` 则按 `param_missing` 剪枝。

                  **不做求值**（不变量 I6）：单趟替换，替换结果不再扫描；
                  不做条件/循环/函数/运算 —— 占位符语法只接受标识符加点号。
                  占位符正则（含捕获组）：`\{\{\s*([A-Za-z_][A-Za-z0-9_.]*)\s*\}\}`。

                  值也可以是 `null`（原样传）：OpenAPI 3.0.3 无法表达 null 分支，
                  因此下面的 oneOf 只列 string / number / boolean / object / array；null 见上注。

                  **取值结果是 `null` 一律算未命中**（别名表的值，或 payload 里的**显式 `null`**）：
                  有 `default` 用 `default`，否则 `param_missing`；混写里未命中不会静默拼成空串。
                additionalProperties:
                  oneOf:
                    - type: string
                      description: |
                        字面量，或模板引用：整值引用 `"{{pull_request.additions}}"` 保留原始类型；
                        混写 `"PR #{{pull_request.number}}: {{pull_request.title}}"` 结果一律字符串。
                    - type: number
                      description: 字面量数字（原样传，不做类型转换）
                    - type: boolean
                      description: 字面量布尔（原样传）
                    - type: array
                      items: {}
                      description: 字面量数组（原样传，不做类型转换）
                    - type: object
                      description: |
                        字面量对象，或**映射声明**（旧形态，向后兼容）：必须恰好含 `from`（payload 点号路径）
                        或 `var`（源 config.vars 里声明的别名）之一，两者互斥；可选 `default`（未命中时的兜底值）
                        与 `as`（string/number/boolean/json）。

                        多一个键就按字面量对象处理：`{"from": 1}`、`{"from":"a","x":2}` 都是**字面量**，
                        配置期也不拦（只 400 的三种：`from`+`var` 并存、`{var}` 未声明、只写 `default`/`as`）。
        targetCaps:
          type: array
          description: |
            出口能力的可读信息（前端直接用，不必再拉一次能力列表做 join）。
            `missing=true` 表示该能力已被删除但源仍指向它。
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              version: { type: integer }
              missing: { type: boolean }
        hookUrl:
          type: string
          nullable: true
          description: 仅 webhook 源有：可直接贴给外部系统的回调路径（`/v1/hooks/<token>`）
        lastFiredAt: { type: integer, format: int64, nullable: true }
        nextFireAt:
          type: integer
          format: int64
          nullable: true
          description: 仅 cron 源有：下次计划触发时刻
        createdAt: { type: integer, format: int64 }

    Event:
      type: object
      properties:
        id: { type: string, example: evt_1730000000_abcd1234 }
        namespaceId:
          type: string
          description: 事件落进的命名空间（恒存在；trace 与任务都跟着它走）
        traceId: { type: string }
        source: { type: string, example: github }
        type: { type: string, example: pull_request.opened }
        payload:
          type: object
          description: 原始负载，只存不解释
        idemKey: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }

    EventIngestResponse:
      type: object
      required: [eventId, traceId, inserted, tasks, pruned]
      properties:
        eventId: { type: string }
        traceId: { type: string }
        inserted:
          type: boolean
          description: false 表示命中幂等（返回的是已有事件，且**不重复派发**）
        origin:
          type: string
          description: 匹配到的起点能力（name@version）；找不到时省略
          example: github@1
        tasks:
          type: array
          description: 首轮派发建出的任务；幂等命中时为空数组
          items: { $ref: "#/components/schemas/TaskBrief" }
        pruned:
          type: array
          description: 首轮派发的剪枝记录（静默但一律留痕）
          items: { $ref: "#/components/schemas/PrunedRecord" }

    TaskBrief:
      type: object
      properties:
        id: { type: string }
        capability: { type: string }
        version: { type: integer }
        status: { $ref: "#/components/schemas/TaskStatus" }

    PrunedRecord:
      type: object
      required: [reason, detail]
      properties:
        reason:
          type: string
          description: |
            剪枝原因（契约 §7）。注意「上游没回报出口」**不是**剪枝，
            不会出现在这里。

            - `param_missing`：参数引用的路径在 payload/别名表里取不到，且没有 `default`。
            - `param_type`：取值结果转不成目标 `params_schema` 要求的类型（不静默退回原值）。
          enum: [no_edge, param_schema, no_node, foreign_user, path, param_missing, param_type]
        capabilityId: { type: string }
        port: { type: string }
        detail:
          type: string
          description: |
            给人看的证据。`param_missing` / `param_type` 的形态是
            「能力前缀 `能力名@版本 ` + 冻结正文」：如
            `review@1 参数 title 取不到 {{pull_request.title}}（payload 里没有这个字段）`。
            扇出时只有前缀能回答「是哪个目标的参数出了问题」。

    PrunedTraceRecord:
      type: object
      description: |
        trace 视图里的剪枝记录（由 `source=route` 的事件解析出来）。
        `reason` 是事件 `type` 去掉 `pruned.` 前缀；
        字段恒存在（不省略空值），前端不必逐个判空。
      required: [reason, fromCapability, port, targetCapability, detail, createdAt]
      properties:
        reason:
          type: string
          enum: [no_edge, param_schema, no_node, foreign_user, path, param_missing, param_type]
        fromCapability:
          type: string
          description: 上游标识；入口边时是来源名（github / cron / …）
        port: { type: string, description: 上游回报的出口名 }
        targetCapability:
          type: string
          description: 被剪枝的目标能力 id；`no_edge` 时为空
        detail:
          type: string
          description: |
            给人看的证据。`param_missing` / `param_type` 带「能力名@版本 」前缀，
            前缀后是冻结正文（详见 CONTRACT §5.5）。
        createdAt: { type: integer, format: int64 }

    Node:
      type: object
      properties:
        id: { type: string }
        namespaceId:
          type: string
          description: |
            机器所属命名空间（恒存在）。创建时确定，**创建后不可改**：
            令牌也绑在这个命名空间上，要换就删了重建。
        name: { type: string, example: mbp-16 }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [online, offline, draining] }
        maxInstances: { type: integer }
        maxConcurrency: { type: integer }
        agentVersion:
          type: string
          description: |
            节点上跑的 agent 版本（`hello.agent_version` 自报；升级成功后由
            `upgrade_ack.version` 覆盖，CONTRACT-agent-upgrade §3/§5）。
            **空串 = 未知（老 agent 不带这个字段）**，控制台显示「未知（老版本）」。
          example: 1.5.0+3fd5a59
        agentCommit:
          type: string
          description: |
            最近一次**成功**升级带来的 git short sha（`upgrade_ack.commit`）。
            空串 = 未知 / 还没升级过（hello 帧没有这个字段，只有 ack 能写它）。
          example: 3fd5a59
        agentUpgrade:
          type: object
          description: |
            最近一次升级尝试的结果（CONTRACT-agent-upgrade §5.1）。**恒存在**：
            `{"status":"","targetVersion":"","error":"","at":0}` = 从未尝试。
            落库为 `nodes.agent_upgrade`（JSON），控制台刷新/重启后仍能看到上次结果
            ——没有它，`need_root` 的失败提示（「去节点跑 sudo」）就永远只是一个死代码。
          required: [status, targetVersion, error, at]
          properties:
            status:
              type: string
              enum: ["", sent, ok, failed]
              description: '`""` 从未尝试 / `sent` 已下发等 ack / `ok` ack 成功 / `failed` ack 失败'
            targetVersion:
              type: string
              description: 这次尝试的目标版本（`sent` 时写入；`ok` 时等于新版本）
            error:
              type: string
              enum: ["", need_root, bad_sha, download_failed, not_supported]
              description: 失败短码（与 `upgrade_ack.error` 同一套；空 = 无错误）
            at:
              type: integer
              format: int64
              description: sent / ok / failed 的时刻（unix 秒）；0 = 从未尝试
        lastSeenAt: { type: integer, format: int64, nullable: true }
        createdAt: { type: integer, format: int64 }

    NodeView:
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          properties:
            capabilities:
              type: array
              description: '这台节点声明自己具备的能力（来自节点 hello 帧）：中枢只记能力名 + 节点自报的 `runSpec`（只存不执行，见 `/node/stream`）'
              items:
                type: object
                required: [id, name, version]
                properties:
                  id: { type: string }
                  name: { type: string }
                  version: { type: integer }
                  displayName:
                    type: string
                    description: '纯展示标签，空串表示没取（前端回落 name@version）'
                  runSpec:
                    type: object
                    additionalProperties: true
                    description: |
                      节点自己声明的执行方式原文（hello 帧 `manifest[].run`，见 `/node/stream`）。
                      `{}` = 声明了能力但没声明执行方式（老节点，或 manifest 里没写这一项）。

                      **中枢只存不执行**（不变量 I1）：不解码、不拆参数、不判路径存在/可执行、
                      不拼命令行，也不写进任何下行帧；唯一用途是控制台展示与排障。
                      这一列也不参与派发选点（`NodesForCapability` 看不到它）。
            instances: { type: integer, description: 申报的槽位总数 }
            busy: { type: integer, description: 正在占用的槽位数 }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, member] }
        createdAt: { type: integer, format: int64 }

    Passkey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: integer, format: int64 }
        lastUsedAt: { type: integer, format: int64, nullable: true }
        backupEligible: { type: boolean }
        backupState: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          description: 机器可读错误码（如 edge_rejected / invalid_transition / capability_conflict）

    DeviceUpsert:
      type: object
      required: [endpoint, keys]
      properties:
        name: { type: string }
        platform: { type: string, enum: [ios, mac, win, android, other] }
        tags: { type: array, items: { type: string } }
        endpoint: { type: string }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        userAgent: { type: string }
    NotifyRequest:
      type: object
      required: [agentState, title]
      properties:
        agentId: { type: string }
        sessionId: { type: string }
        cwd: { type: string }
        agentState:
          { type: string, enum: [working, blocked, done, interrupted, error] }
        durationMs: { type: integer }
        title: { type: string }
        body: { type: string }
        model: { type: string }
        link: { type: string }
        deviceTags:
          { type: array, items: { type: string }, description: 路由键；空=广播 }
        priority: { type: string, default: normal }
        ttl: { type: integer, default: 86400 }
    TestNotifyRequest:
      type: object
      description: 工作台测试通知请求体（会话鉴权，字段精简）
      properties:
        title: { type: string, default: 测试通知 }
        body: { type: string }
        agentState:
          type: string
          enum: [working, blocked, done, interrupted, error]
          default: done
        link: { type: string }
        deviceTags: { type: array, items: { type: string } }
        priority: { type: string, default: normal }
    SystemStats:
      type: object
      description: 管理后台系统总览统计
      properties:
        userCount: { type: integer }
        adminCount: { type: integer }
        activeUserCount:
          { type: integer, description: 近 7 天有消息上报的用户数 }
        messageCount: { type: integer }
        todayMessages: { type: integer }
        deviceCount: { type: integer }
        enabledDevices: { type: integer }
        keyCount: { type: integer }
        sessionCount: { type: integer, description: 活跃会话数 }
        deliveredCount: { type: integer }
        deliveryTotal: { type: integer }
        daily:
          type: array
          items:
            type: object
            properties:
              day: { type: string }
              count: { type: integer }
        topUsers:
          type: array
          items: { $ref: "#/components/schemas/UserMetric" }
    UserMetric:
      type: object
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        messageCount: { type: integer }
        deviceCount: { type: integer }
    AdminUser:
      type: object
      description: 管理后台用户视图（含各用户实体计数）
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, member] }
        disabled: { type: boolean }
        createdAt: { type: integer }
        messageCount: { type: integer }
        deviceCount: { type: integer }
        keyCount: { type: integer }
        sessionCount: { type: integer }
    AdminGlobalMessage:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        seq: { type: integer }
        title: { type: string }
        agentState: { type: string }
        createdAt: { type: integer }
    AdminSessionRow:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        deviceName: { type: string }
        createdAt: { type: integer }
        expiresAt: { type: integer }
        lastSeen: { type: integer }

    # ---------- 预案（#193）----------
    #
    # 形状的唯一依据是 web/mock.js 的 `pbView` / `pbChecks`（验收基准）与
    # `internal/store/playbook.go` 的 struct（契约 §5）。与 issue 草稿的差异已在
    # 每个字段的 description 里点名（`status` 四态 / `counts` 三类数量 / `next` 是对象）。
    Playbook:
      type: object
      description: |
        预案行（`playbooks` 表）。一份可以直接存下来的**清单**：
        它说清「跑通这条流程需要哪些能力定义 / 边 / 触发器」，但**不拥有**它们
        （删预案不会回滚已安装物）。

        `manifest` 是**用户提交的 JSON 原文**：中枢只校验、不重新编码、也不解释 ——
        `runner` / `paramsSchema` / 自定义键都原样往返（不变量 I1：中枢不知道「怎么执行」，
        runner 属于节点侧配置）。
      required: [id, namespaceId, slug, name, description, manifest, createdAt]
      properties:
        id: { type: string, example: pb_1730000000_a1b2c3d4 }
        namespaceId:
          type: string
          description: 预案所属命名空间（恒存在；体检只在这个命名空间里算）
        slug:
          type: string
          example: pr-review
          description: |
            URL 用的稳定标识，**命名空间内唯一**（`UNIQUE (namespace_id, slug)`）。
            规则 `^[a-z0-9]+(?:-[a-z0-9]+)*$`、长度 ≤ 64、**不 trim**。
            安装时用它派生源名（`<slug>-<kind>-<idx>`），所以它也是幂等的键之一。
        name: { type: string, example: PR 审查, description: 展示名（必填非空） }
        description:
          type: string
          description: 一句话说明（可省略，缺省是空串）
        manifest: { $ref: "#/components/schemas/PlaybookManifest" }
        createdAt: { type: integer, format: int64 }

    PlaybookManifest:
      type: object
      additionalProperties: true
      description: |
        预案清单。中枢**认得的**只有三个数组，其余键一律原样存、原样返回 ——
        所以这里的 schema 是**宽松**的（`additionalProperties: true`）：
        多一个字段不会被当成错误。

        缺省 / `null` → 归一化成
        `{"capabilities":[],"edges":[],"triggers":[]}`（空是 `[]`）。
      properties:
        capabilities:
          type: array
          description: 需要的能力定义（无项为 `[]`）
          items: { $ref: "#/components/schemas/PlaybookManifestCapability" }
        edges:
          type: array
          description: 需要的边（无项为 `[]`）
          items: { $ref: "#/components/schemas/PlaybookManifestEdge" }
        triggers:
          type: array
          description: 需要的触发器（无项为 `[]`）
          items: { $ref: "#/components/schemas/PlaybookManifestTrigger" }

    PlaybookManifestCapability:
      type: object
      additionalProperties: true
      required: [name, version]
      description: |
        manifest 里声明的一条能力定义。`name` 不能是内置 origin 的保留名
        （`github` / `cron` / `http` / `manual`），`version` 必须 > 0 ——
        这些在**创建预案**时就校验（→ 400），而不是等到安装时。
      properties:
        name: { type: string, example: analyze-pr }
        version: { type: integer, example: 1 }
        outputs:
          type: array
          items: { type: string }
          description: |
            出口名的**封闭集合**（不变量 I2）；本 manifest 里的边的 `fromPort`
            必须属于它。无项为 `[]`。
        paramsSchema:
          type: object
          description: JSON Schema 的受控子集；**原样透传**（中枢不求值，不变量 I6）
        runner:
          description: |
            节点侧的运行配置（怎么执行）。**中枢只存不解释**（不变量 I1）：
            任意 JSON 原样往返，所以这里不限定类型。

    PlaybookManifestEdge:
      type: object
      additionalProperties: true
      required: [from, fromPort, to]
      description: |
        manifest 里声明的一条边。三个字段都写**能力名**（不是 id）：
        安装与体检时在本次命名空间里解析成 `capability_versions.id`（I11：不跨命名空间）。
      properties:
        from:
          type: string
          description: 上游能力名（本 manifest 声明的，或命名空间里已存在的）
        fromPort:
          type: string
          description: |
            必须属于上游的 `outputs`（不变量 I2）。
            `from` 在本 manifest 里声明过时，创建期就校验；否则安装时只能 skip。
        to: { type: string, description: 下游能力名 }

    PlaybookManifestTrigger:
      type: object
      additionalProperties: true
      required: [kind]
      description: |
        manifest 里声明的一个触发器。`kind` 非法（不在 `webhook/github/cron/manual` 里）
        在**创建预案**时就 400。安装时每个触发建一个源，它的 targets 指向本预案的
        **入口能力**（没有作为任何边 `to` 的那些能力）；入口能力为空 → 该触发 skip。
      properties:
        kind:
          type: string
          enum: [webhook, github, cron, manual]
        types:
          type: array
          items: { type: string }
          description: |
            事件类型（如 `pull_request.opened`）；`cron` 时 `types[0]` 就是五段表达式
            本身，安装源时**原样**写进 `config.expr`。无项为 `[]`。

    PlaybookView:
      allOf:
        - $ref: "#/components/schemas/Playbook"
        - type: object
          description: |
            列表项 = 预案行 + 就绪体检结论。**不带** `items`（逐项明细在详情里）。

            体检是**查询时算的推导量，不落库**（不变量 I3 同源）。
          required: [status, next, ready, total, counts]
          properties:
            status:
              type: string
              enum: [ready, blocked, needs-node, partial]
              description: |
                总体状态，**四态**（优先级从高到低）：

                - `blocked`：有能力定义 `missing`（连定义都没有，什么都跑不了）
                - `needs-node`：定义齐了，但有 `no-node` / `offline`
                - `partial`：节点齐了，但边或触发器还不是全 `ok`
                - `ready`：全 `ok`

                与 issue #193 草稿的 `ready|incomplete` 不同：验收基准是 mock `pbChecks`
                与已写好的前端（`STATUS_KEY` / `STATUS_FALLBACK` 只认这四种）。
            next:
              allOf:
                - $ref: "#/components/schemas/PlaybookCheckItem"
              nullable: true
              description: |
                「最该先做的一件事」= 按依赖顺序（能力 → 边 → 触发）第一个非 `ok` 的项，
                全 `ok` 时是 `null`。

                是**对象**不是字符串（前端 `nextLine()` 读 `kind/status/ref/label`）；
                issue 草稿里写的是一句人话，已废弃。
                （OpenAPI 3.0 里 `$ref` 的兄弟键会被忽略，所以用 `allOf` 包一层才真的 nullable。）
            ready: { type: integer, description: 通过的项数 }
            total: { type: integer, description: 体检项总数（= `counts` 三项之和） }
            counts: { $ref: "#/components/schemas/PlaybookCounts" }

    PlaybookDetail:
      allOf:
        - $ref: "#/components/schemas/PlaybookView"
        - type: object
          description: 详情 = 列表项 + 逐项体检结果。
          required: [items]
          properties:
            items:
              type: array
              description: |
                逐项检查结果，按**依赖顺序**排：能力项 → 边项 → 触发项。
                无项时为 `[]`（不变量 I9）。
              items: { $ref: "#/components/schemas/PlaybookCheckItem" }

    PlaybookCounts:
      type: object
      description: |
        三类检查项的**数量**（卡片上的「能力 3 · 出口 3 · 触发器 1」）。

        注意：这是**分类项数**，不是通过情况分布。每一项到底过没过，看该 item
        自己的 `status`。issue 草稿里的 `{ok, noNode, offline, missing}` 是过时写法。
      required: [capabilities, edges, triggers]
      properties:
        capabilities: { type: integer, description: manifest 里的能力项数 }
        edges: { type: integer, description: manifest 里的边项数 }
        triggers: { type: integer, description: manifest 里的触发项数 }

    PlaybookCheckNode:
      type: object
      description: |
        声明了该能力的节点（**含 draining / offline**：声明是配置事实，
        排空中的机器仍然声明着它）。
      required: [name, status]
      properties:
        name: { type: string }
        status:
          type: string
          enum: [online, offline, draining]

    PlaybookCheckItem:
      type: object
      description: |
        一项体检结果。`kind` 决定哪些字段会出现（其余字段省略）：

        - `capability`：`ref`（`name@version`）、`outputs`、`capId`、`runner`、`nodes`
        - `edge`：`label`（`a --port--> b`）、`from` / `fromPort` / `to` /
          `fromId` / `toId`、或 `blockedByCap`（端点缺定义时）
        - `trigger`：`label`（`webhook · t1 / t2`）、`entryCaps`、`declaredKind`
      required: [kind, status]
      properties:
        kind:
          type: string
          enum: [capability, edge, trigger]
          description: 检查项类型（三态）
        status:
          type: string
          enum: [ok, missing, no-node, offline]
          description: |
            单项状态（四态）：

            - `ok`：满足
            - `missing`：没有（没定义 / 没这条边 / 没这个源）
            - `no-node`：定义有了，但**没有任何节点声明**自己能跑它
              —— 要去写节点配置装机器
            - `offline`：有节点声明了，但**全部不在线**
              —— 只需要把机器连上

            `no-node` 与 `offline` 必须分开：两者要做的事完全不同，
            合成一个「未就绪」会让人做错事。
        ref:
          type: string
          example: analyze-pr@1
          description: 能力项的引用（`name@version`）
        label:
          type: string
          example: analyze-pr --needs-fix--> lint-fix
          description: 边项 / 触发项的人读标签
        outputs:
          type: array
          items: { type: string }
          description: 能力项的出口集合（解析到定义时用定义里的 `outputs`）
        capId:
          type: string
          description: 能力定义 id（解析到定义时才有）
        runner:
          description: 清单里声明的 runner 原样带回（任意 JSON；没声明则省略）
        nodes:
          type: array
          description: 声明了该能力的节点（无则省略）
          items: { $ref: "#/components/schemas/PlaybookCheckNode" }
        blockedByCap:
          type: string
          description: 边项：缺定义的那个端点能力名（先补能力）
        from: { type: string, description: 边项：上游能力名 }
        fromPort: { type: string, description: 边项：出口名 }
        to: { type: string, description: 边项：下游能力名 }
        fromId: { type: string, description: 边项：解析到的上游定义 id }
        toId: { type: string, description: 边项：解析到的下游定义 id }
        entryCaps:
          type: array
          items: { type: string }
          description: |
            触发项：本预案的**入口能力**名 = manifest 能力里没有作为任何边 `to` 的那些。
            触发项的判定要求「kind 匹配 **且** 那个源的 targets 命中入口能力」
            （只看 kind 会把「你有个 webhook 源」当成「这条流程有触发器了」）。
        declaredKind:
          type: string
          enum: [webhook, github, cron, manual]
          description: 触发项：manifest 里声明的源 kind

    PlaybookInstallSet:
      type: object
      description: 安装结果里的一组（**无项一律 `[]`**，不变量 I9）。
      required: [capabilities, edges, sources]
      properties:
        capabilities:
          type: array
          items: { type: string }
          description: 能力引用（`name@version`）；无则 `[]`
        edges:
          type: array
          items: { type: string }
          description: 边标签（`a --port--> b`）；无则 `[]`
        sources:
          type: array
          items: { type: string }
          description: |
            源名 `"<slug>-<kind>-<idx>"`（如 `pr-review-webhook-0`）；无则 `[]`。
            与 mock 的差异：mock 用「预案名 · kind」，真后端按 slug 派生
            （`sources` 的唯一键是 `(namespace_id, name)`，slug 在命名空间内唯一
            → 确定性、可幂等）。`skipped.sources` 里放的是**实际存在的那个源名**。

    PlaybookInstallResult:
      type: object
      description: |
        幂等安装的结果。`created` = 本次新写进去的；`skipped` = 已经存在或这一轮
        装不了的（判据：能力同名同版本已存在 / 边已存在 / 源同名，或已有同 kind 且
        targets 命中本预案入口能力的源）。**已存在的定义绝不覆盖**（能力定义
        append-only，不变量 I8）。
      required: [created, skipped, notes]
      properties:
        created: { $ref: "#/components/schemas/PlaybookInstallSet" }
        skipped: { $ref: "#/components/schemas/PlaybookInstallSet" }
        notes:
          type: array
          items: { type: string }
          description: |
            skipped 的**人话**说明（如「边 X 的上游缺定义」「端口不在上游 outputs 里」）；
            无则 `[]`。
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    # 四个通用错误响应：check_openapi.py 只校验 security / path 集合，
    # 但这些 $ref 在外部调用方（与渲染器）眼里必须能解析。
    BadRequest:
      description: |
        请求参数非法（缺参 / `namespaceId is required` / 跨命名空间引用 I11 /
        非法 slug 等）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未登录 / 凭据无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        权限不足（与「命名空间存不存在」无关 —— 那类是 `404`）。三种来源：
        账号角色不够（`/v1/admin/*` 需要管理员）、API Key 缺少所需 scope
        （如 `notify:send`）、节点令牌指向的命名空间已被删除（WS 握手）。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在（含命名空间不存在）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    CapabilityTemplateField:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, description: 'snake_case；会变成 ANOTIFY_PARAM_<UPPER>' }
        label: { type: string }
        type: { type: string, enum: [string, text, number, select] }
        required: { type: boolean }
        default: { type: string }
        options:
          type: array
          items: { type: string }
          description: 仅 type=select 有意义
        help: { type: string }

    CapabilityTemplate:
      type: object
      required: [id, displayName, category, script, requires, outputs, timeoutSec]
      properties:
        id: { type: string, example: agent.claude }
        displayName: { type: string }
        category: { type: string, enum: [script, agent] }
        description: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/CapabilityTemplateField" }
        script: { type: string, description: 入口文件 run.sh 的正文（只读展示，可切脚本模式覆盖） }
        requires:
          type: array
          items: { type: string }
          description: 机器上必须预装的命令；部署时探测，缺了部署失败
        outputs:
          type: array
          items: { type: string }
        timeoutSec: { type: integer }

    Artifact:
      type: object
      required: [id, namespaceId, capabilityId, digest, spec, createdAt]
      properties:
        id: { type: string, example: af_xxx }
        namespaceId: { type: string }
        capabilityId: { type: string }
        digest:
          type: string
          description: '内容寻址标识 `sha256:<64 hex>`'
          example: "sha256:ab12"
        spec:
          type: string
          format: byte
          description: |
            产物的正文：**base64(canonical JSON)**（`store.Artifact.Spec` 是 `[]byte`，
            JSON 编码默认就是 base64 字符串 —— 之前这里声明成 `object` 是错的）。

            解出来是一份完整产物：`{apiVersion, kind, metadata, spec}`，
            其中 `spec` 就是 `CapabilitySpec`。给人看的**解析后**形状请走
            `GET /capabilities/{id}/artifact`（那里的 `files` 是普通文本）。
        createdAt: { type: integer }

    Deployment:
      type: object
      required: [id, namespaceId, nodeId, capabilityId, digest, state]
      properties:
        id: { type: string, example: dp_xxx }
        namespaceId: { type: string }
        nodeId: { type: string }
        artifactId: { type: string }
        capabilityId: { type: string }
        capability: { type: string }
        version: { type: integer }
        digest: { type: string }
        state:
          type: string
          enum: [pending, applied, failed, local]
        reason: { type: string, description: 'failed 时是短码 + 说明；local 时是两端 digest' }
        createdAt: { type: integer }
        updatedAt: { type: integer }

    DeploymentInput:
      type: object
      required: [capabilityId]
      properties:
        namespaceId: { type: string }
        capabilityId: { type: string }
        digest: { type: string, description: 缺省取该能力最新一份产物 }
        nodeIds:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
          description: 与 nodeIds 取并集
    DeploymentResult:
      type: object
      required: [nodeId, pushed]
      properties:
        nodeId: { type: string }
        nodeName: { type: string }
        deployId: { type: string }
        pushed:
          type: boolean
