openapi: 3.0.3
info:
  title: Anotify API
  version: "1.0.0"
  description: |
    事件中心 API（契约见 docs/contracts/CONTRACT.md）。

    模型演化：从「通知终端」到「事件中心」。
    外部事件（webhook / cron / watch）→ `events` → 派发成 `tasks` → 节点执行 → 回报出口 → 下一跳。

    鉴权三种：
      - **会话 Cookie**（`anotify_session`）：控制台浏览，Passkey 登录后获得
      - **Bearer API Key**（`ant_...`）：机器调用（上报 / 事件入口），带 scope
      - **Bearer 节点 token**（`ant_node_...`）：节点 WS 长连接，opaque，仅存 sha256

    约定：
      - 所有 JSON 字段 **camelCase**
      - 空列表返回 `[]` 而不是 `null`（不变量 I9）
      - 一切租户数据先过 `orgId`（不变量 I10）；显式传 `orgId` 时必须校验成员身份

    ## 迁移中的旧端点

    原有 `/notify`、`/notifications`、`/devices`、`/stream` 属于**旧的「通知终端」模型**，
    现在仍在服务（存量前端页面依赖），但响应带 `Deprecation: true` 与
    `Link: </v1/events>; rel="successor-version"`。
    它们将在前端切换到事件中心后下线，届时 `messages` 表一并删除。
servers:
  - url: /v1
tags:
  - name: events
    description: 事件入口（外部世界的变化）
  - name: tasks
    description: 任务（派发出来的执行单元）
  - name: capabilities
    description: 能力定义（append-only，每次改动开新版本）
  - name: edges
    description: 出口表（路由的唯一依据）
  - name: nodes
    description: 节点（执行者）
  - name: node-stream
    description: 节点 WebSocket 协议
  - name: auth
    description: 认证与恢复
  - name: keys
    description: API Key
  - name: devices
    description: "[旧模型] 推送设备"
  - name: notify
    description: "[旧模型] 通知上报与查询"
  - name: cli-auth
    description: CLI 设备授权
  - name: passkey-enroll
    description: Passkey 设备补建
  - name: admin
    description: 管理后台

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ========== 事件中心：事件 ==========
  /admin:
    get:
      tags: [admin]
      summary: 管理后台端点索引
      description: 无尾斜杠访问（/v1/admin）返回可用子端点列表，不发重定向。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 子端点清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /../agent-login.sh:
    get:
      tags: [cli-auth]
      summary: 获取 CLI 登录脚本（curl | sh 的源头）
      description: |
        **注意**：这个端点不在 `/v1` 下，实际路径是 `/agent-login.sh`。
        在本文件里写成 `/../agent-login.sh` 是为了相对 `servers: /v1` 表达它。
        返回 plain text 的 shell 脚本，供 `curl -fsSL .../agent-login.sh | sh`。
      security: []
      responses:
        "200":
          description: shell 脚本正文
          content:
            text/plain:
              schema: { type: string }

  /events:
    post:
      tags: [events]
      summary: 提交一个外部事件（webhook 通用入口）
      description: |
        把外部世界的变化变成一条 `event` 并触发第一次派发。

        - `traceId` 由**触发器**生成（不给时），中枢不代生成
        - `idemKey` 用于幂等：冲突时返回**已有**的 `eventId` + `traceId`，**不是 409**
          （对发送方而言「已收过」和「本次收下」都该是 200）
        - 不带 `idemKey` 允许重复——不是所有来源都有稳定投递 ID
        - 事件已入库但派发失败/起源未知时**仍返回 200**（事件确实收下了）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, type]
              properties:
                source:
                  type: string
                  description: 事件来源，与 origin 能力同名（github / cron / watch / ...）
                  example: github
                type:
                  type: string
                  description: 事件类型，**同时是 origin 能力的出口名**
                  example: pull_request.opened
                idemKey:
                  type: string
                  description: 幂等键（如 X-GitHub-Delivery）。省略则允许重复
                traceId:
                  type: string
                  description: 可选；省略时由触发器生成
                payload:
                  type: object
                  description: 原始负载，只存不解释（不求值、不改写）
                orgId:
                  type: string
                  description: 可选；省略时用调用者的主组织
      responses:
        "200":
          description: 事件已受理（含幂等命中）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventIngestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [events]
      summary: 事件列表（按 trace 过滤）
      security:
        - bearerAuth: []
      parameters:
        - { name: traceId, in: query, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: '事件列表（空时 `events: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ========== 认证：当前用户与凭据 ==========
  /auth/me:
    get:
      tags: [auth]
      summary: 当前会话的用户 + 主组织
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  org:
                    type: object
                    description: 主组织（注册即得，不变量 A1）
                    properties:
                      id: { type: string }
                      name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/passkeys:
    get:
      tags: [auth]
      summary: 列出当前用户的 Passkey
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "Passkey 列表（空时 passkeys 为 []）"
          content:
            application/json:
              schema:
                type: object
                required: [passkeys]
                properties:
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/passkeys/{id}:
    patch:
      tags: [auth]
      summary: 重命名 Passkey
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200": { description: 已重命名 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [auth]
      summary: 删除 Passkey
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/passkeys/register/options:
    post:
      tags: [auth]
      summary: 补建 Passkey（新设备）——取 challenge
      security:
        - cookieAuth: []
      responses:
        "200": { description: WebAuthn 注册选项 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/passkeys/register:
    post:
      tags: [auth]
      summary: 补建 Passkey（新设备）——提交凭证
      security:
        - cookieAuth: []
      responses:
        "200": { description: 已注册 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ========== 统计 ==========
  /stats:
    get:
      tags: [notify]
      summary: "[旧模型] 通知统计"
      deprecated: true
      security:
        - cookieAuth: []
      responses:
        "200": { description: 统计数字 }
        "401": { $ref: "#/components/responses/Unauthorized" }


  # ========== 事件中心：控制台读取 ==========
  /console/events:
    get:
      tags: [events]
      summary: 事件列表（控制台视图，会话 Cookie 鉴权）
      description: |
        浏览器控制台读事件流用。

        与 `GET /events` 的区别是**鉴权模型**：
        - `GET /events` 是机器入口，Bearer API Key + `notify:send` scope，给外部系统拉事件
        - `GET /console/events` 是控制台入口，会话 Cookie + 组织成员身份

        两者语义不同（一个要 scope，一个要成员身份），所以不共用一个 handler。
      security:
        - cookieAuth: []
      parameters:
        - { name: traceId, in: query, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: 事件列表（空时 events 为 []）
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ========== 事件中心：任务 ==========
  /tasks:
    get:
      tags: [tasks]
      summary: 任务列表（按 trace / node / status 过滤）
      security:
        - cookieAuth: []
      parameters:
        - { name: traceId, in: query, schema: { type: string } }
        - { name: nodeId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: orgId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: '任务列表（空时 `tasks: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tasks/{id}:
    get:
      tags: [tasks]
      summary: 单个任务详情（含整条 trace 的任务链）
      description: |
        深链（点通知跳 `message.html?id=tsk_xxx`）只有任务 ID，不知道它属于哪条 trace，
        所以需要按 ID 取单任务。响应同时带上整条链，详情页一次请求即可画出任务链。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: "任务详情 + 整条链（链为空时 chain 为 []）"
          content:
            application/json:
              schema:
                type: object
                required: [task, chain]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
                  chain:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 任务不存在 }

  /tasks/{id}/cancel:
    post:
      tags: [tasks]
      summary: 取消任务
      description: |
        把任务推进到 `canceled`（终态）。终态不可再变，
        对已终态的任务再取消返回 409。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 任务已是终态（`invalid_transition`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 事件中心：能力 ==========
  /capabilities:
    get:
      tags: [capabilities]
      summary: 能力定义列表（带推导出的 kind）
      description: |
        `kind` 是**推导量，不落库**（不变量 I3）：
        - 没有任何节点声明 → `origin`
        - 有节点声明且 `outputs` 全空 → `end`
        - 有节点声明且 `outputs` 有非空项 → `pipe`
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '能力列表（空时 `capabilities: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: "#/components/schemas/CapabilityWithKind" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [capabilities]
      summary: 定义新能力（自动算 contentHash、自动开版本）
      description: |
        `capability_versions` 是 **append-only**（不变量 I8）：
        - 不指定 `version` 时自动开下一个版本
        - 同名同版本但内容不同 → 409（版本不能被改写）
        - 内容相同（含 name）→ 幂等返回已有定义
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityInput" }
      responses:
        "200":
          description: 已创建（或幂等返回已有）
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability: { $ref: "#/components/schemas/Capability" }
                  kind: { $ref: "#/components/schemas/Kind" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: 同 name@version 换内容（`capability_conflict`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 事件中心：出口表 ==========
  /edges:
    get:
      tags: [edges]
      summary: 出口表列表
      security:
        - cookieAuth: []
      parameters:
        - { name: fromCapability, in: query, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '边列表（空时 `edges: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [edges]
                properties:
                  edges:
                    type: array
                    items: { $ref: "#/components/schemas/Edge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [edges]
      summary: 新增一条边
      description: |
        配置期两条硬校验（违反即 400，`code: edge_rejected`）：
        1. `fromPort` 必须属于 `fromCapability.outputs`（**出口是封闭集合**，不变量 I2）
        2. 两端能力必须**同组织**（不允许跨组织边）
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeInput" }
      responses:
        "200":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  edge: { $ref: "#/components/schemas/Edge" }
        "400":
          description: 出口不在 outputs 里 / 跨组织 / 能力不存在（`edge_rejected`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [edges]
      summary: 删除一条边
      security:
        - cookieAuth: []
      parameters:
        - { name: fromCapability, in: query, required: true, schema: { type: string } }
        - { name: fromPort, in: query, required: true, schema: { type: string } }
        - { name: toCapability, in: query, required: true, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========== 事件中心：节点 ==========
  /nodes:
    get:
      tags: [nodes]
      summary: 节点列表（含在线状态、声明的能力、实例占用）
      security:
        - cookieAuth: []
      parameters:
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '节点列表（空时 `nodes: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/NodeView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /nodes/{id}/drain:
    post:
      tags: [nodes]
      summary: 排空节点（不再接新任务，在跑的继续）
      description: |
        只把 `status` 改成 `draining`（派发时会被过滤掉），
        **不主动取消**已在跑的任务——取消是破坏性操作，排空是渐进退役。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: orgId, in: query, schema: { type: string } }
      responses:
        "200":
          description: 已排空
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========== 事件中心：节点协议 ==========
  /node/stream:
    get:
      tags: [node-stream]
      summary: 节点 WebSocket 长连接（九帧协议）
      description: |
        **必须**在 Upgrade 之前用 `Authorization: Bearer <node token>` 完成鉴权：
        鉴权失败返回 401/403，**绝不返回 101**。

        token 是 opaque（`ant_node_...`），服务端只存 sha256。
        握手成功后先发 `hello`，收到 `welcome` 即接入成功。

        ### 上行（节点 → 中枢）
        | type | 说明 |
        |---|---|
        | `hello` | 自报身份 + 能力声明 + 实例申报（必须第一帧） |
        | `heartbeat` | 心跳；任何上行帧都续命 |
        | `ack` | 接单：`assigned → acked` |
        | `progress` | 开始执行：`acked → running` |
        | `result` | 结果：`running → succeeded/failed` |

        ### 下行（中枢 → 节点）
        | type | 说明 |
        |---|---|
        | `welcome` | 握手成功，带 `heartbeatSec` / `leaseTtlSec` |
        | `assign` | 派活：能力名 + 版本 + params + 租约（**不含命令/脚本/argv**） |
        | `cancel` | 停止任务 |
        | `error` | 协议错误（不关连接，除 hello 失败） |

        ### result 的 out 三态（不变量 I5）
        | 线上 JSON | 落库 | 含义 |
        |---|---|---|
        | 没有 `out` 键 | `reported=0, out=NULL` | 没回报出口 → 不派下一跳 |
        | `"out": null` | `reported=1, out=NULL` | 明确到头了 |
        | `"out": "fix"` | `reported=1, out='fix'` | 走 fix 出口 |
      security:
        - nodeToken: []
      responses:
        "101":
          description: 协议切换成功（此后走 WebSocket 帧）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/register/options:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 开始 Passkey 注册（返回 WebAuthn challenge）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
                displayName: { type: string }
      responses:
        "200": { description: WebAuthn creation options }
  /auth/register:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 完成 Passkey 注册（校验 attestation，建用户+会话+恢复码）
      responses:
        "200":
          description: |
            注册成功，Set-Cookie 会话。响应含可选字段 `recoveryCodes`（明文仅此一次）。
        "400": { $ref: "#/components/responses/Error" }
  /auth/login/options:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 开始 Passkey 登录
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
      responses:
        "200": { description: WebAuthn request options }
  /auth/login:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 完成 Passkey 登录（建会话）
      responses:
        "200": { description: 登录成功，Set-Cookie 会话 }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 登出（吊销会话）
      responses:
        "200": { description: 已登出 }
  /auth/sessions:
    get:
      security:
        - cookieAuth: []
      tags: [auth]
      summary: 列出当前用户的登录会话
      responses:
        "200": { description: 会话列表 }

  /auth/recovery/login:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 用恢复码登录（校验哈希 → 作废该码 → 建会话 Cookie）
      description: |
        body: `{username, code}`。成功后该恢复码一次性作废；会话模型与 Passkey 登录相同，
        随后可走 `/auth/passkeys/register*` 补建 Passkey。
        码格式：`XXXX-XXXX-XXXX-XXXX`（去歧义字符集，大小写不敏感，连字符可选）。
        限速：10/min/IP + 10/min/username（小写）；超限返回 429，带 `Retry-After: 60`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, code]
              properties:
                username: { type: string }
                code: { type: string, description: "恢复码明文" }
      responses:
        "200": { description: 登录成功，Set-Cookie 会话 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: '限速（IP 或 username）；响应头 Retry-After: 60'

  /auth/recovery/regenerate:
    post:
      security:
        - cookieAuth: []
      tags: [auth]
      summary: 重新生成恢复码（需登录；作废全部未用旧码）
      description: |
        作废当前用户全部未使用恢复码，签发新一批（默认 8 个），明文仅在本响应返回一次。
      responses:
        "200":
          description: 新恢复码明文（仅此一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /auth/recovery/status:
    get:
      security:
        - cookieAuth: []
      tags: [auth]
      summary: 恢复码状态（需登录；不含明文）
      responses:
        "200":
          description: 未用码数量
          content:
            application/json:
              schema:
                type: object
                properties:
                  unusedCount: { type: integer }
                  hasCodes: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }

  /keys:
    get:
      security:
        - cookieAuth: []
      tags: [keys]
      summary: 列出 API Keys（不含明文/哈希）
      responses:
        "200": { description: Key 列表 }
    post:
      security:
        - cookieAuth: []
      tags: [keys]
      summary: 新建 API Key（仅此处返回一次明文）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items:
                    {
                      type: string,
                      enum: [notify:send, notify:receive, devices:read],
                    }
      responses:
        "200": { description: 创建的 Key（含明文，仅此一次） }
  /keys/{id}/revoke:
    post:
      security:
        - cookieAuth: []
      tags: [keys]
      summary: 停用 API Key
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已停用 }

  /devices:
    get:
      deprecated: true
      security:
        - cookieAuth: []
      tags: [devices]
      summary: 列出接收设备
      responses:
        "200": { description: 设备列表 }
    post:
      deprecated: true
      security:
        - cookieAuth: []
      tags: [devices]
      summary: 注册/更新推送订阅设备（前端订阅后上报）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUpsert" }
      responses:
        "200": { description: 已保存 }
  /devices/{id}:
    patch:
      deprecated: true
      security:
        - cookieAuth: []
      tags: [devices]
      summary: 更新设备（重命名/开关/status 过滤/标签）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                enabled: { type: boolean }
                eventScope: { type: string, enum: [final, all] }
                tags: { type: array, items: { type: string } }
      responses:
        "200": { description: 已更新 }
    delete:
      deprecated: true
      security:
        - cookieAuth: []
      tags: [devices]
      summary: 解绑设备
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已删除 }

  /vapid-public-key:
    get:
      security: []  # 匿名可访问
      tags: [devices]
      summary: 返回 VAPID 公钥（前端订阅用）
      responses:
        "200": { description: 公钥 }

  /cli-auth/sessions:
    post:
      tags: [cli-auth]
      summary: 创建 CLI 设备授权会话（匿名，IP 限速 10/min）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceName, scopes]
              properties:
                deviceName:
                  { type: string, description: 设备名（hostname），≤64 字符 }
                scopes:
                  {
                    type: array,
                    items: { type: string },
                    description: 请求的 scope 列表,
                  }
      responses:
        "200":
          description: 会话创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  secret:
                    {
                      type: string,
                      description: 轮询凭证（仅此一次返回，不进 URL）,
                    }
                  userCode: { type: string, description: 8 位短码 XXXX-XXXX }
                  authUrl: { type: string, description: 授权链接 }
                  pollInterval: { type: integer, default: 2 }
                  expiresAt: { type: integer }
                  scopes: { type: array, items: { type: string } }
        "400":
          $ref: "#/components/responses/Error"
        "429":
          description: 限速

  /cli-auth/sessions/{id}:
    get:
      tags: [cli-auth]
      summary: 查询授权会话信息（需登录 Cookie）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 会话信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  deviceName: { type: string }
                  requestedScopes: { type: array, items: { type: string } }
                  status:
                    {
                      type: string,
                      enum: [pending, approved, consumed, denied, expired],
                    }
                  createdAt: { type: integer }
                  expiresAt: { type: integer }
        "404":
          description: 会话不存在或已过期

  /cli-auth/sessions/by-code:
    get:
      tags: [cli-auth]
      summary: 按短码查询会话（需登录 Cookie，按用户限速 20/min）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            { type: string, description: 8 位短码，大小写不敏感、容忍连字符 }
      responses:
        "200":
          description: 会话信息（同 /cli-auth/sessions/{id}）
        "404":
          description: 会话不存在或已过期
        "429":
          description: 限速

  /cli-auth/sessions/{id}/approve:
    post:
      tags: [cli-auth]
      summary: 批准授权（需登录 Cookie）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  {
                    type: array,
                    items: { type: string },
                    description: 授予的 scope（必须 ⊆ requestedScopes）,
                  }
      responses:
        "200":
          description: 批准成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: approved }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: 终态冲突（会话不在 pending 状态）

  /cli-auth/sessions/{id}/deny:
    post:
      tags: [cli-auth]
      summary: 拒绝授权（需登录 Cookie）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 拒绝成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: denied }
        "409":
          description: 终态冲突

  /cli-auth/sessions/{id}/poll:
    get:
      tags: [cli-auth]
      summary: 轮询会话状态（匿名，secret 门控）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: secret
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 轮询结果（status 可为 pending/approved/denied/expired/consumed）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    {
                      type: string,
                      enum: [pending, approved, denied, expired, consumed],
                    }
                  apiKey:
                    {
                      type: string,
                      description: 仅 approved 时一次性返回明文 Key,
                    }
                  keyId: { type: string }
                  name: { type: string }
                  scopes: { type: array, items: { type: string } }
        "401":
          description: secret 无效
        "404":
          description: 会话不存在
        "429":
          description: 轮询过快

  /cli-auth/sessions/{id}/qr.txt:
    get:
      tags: [cli-auth]
      summary: 获取 ASCII 二维码（匿名，IP 限速 30/min）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ASCII 半块字符二维码（内容=authUrl）
          content:
            text/plain:
              schema: { type: string }
        "404":
          description: 会话不存在

  # --- Passkey 设备授权 ---
  /passkey-enroll/sessions:
    post:
      tags: [passkey-enroll]
      summary: 创建 Passkey 设备授权会话（需登录 Cookie）
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceName]
              properties:
                deviceName: { type: string, description: 发起设备名，≤64 字符 }
      responses:
        "200":
          description: 会话创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  secret:
                    { type: string, description: 旧设备持有，不进二维码/链接 }
                  userCode: { type: string, description: 8 位短码 XXXX-XXXX }
                  authUrl: { type: string, description: 新设备接入链接 }
                  pollInterval: { type: integer, default: 2 }
                  expiresAt: { type: integer }
                  kind: { type: string, example: passkey }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /passkey-enroll/sessions/{id}:
    get:
      tags: [passkey-enroll]
      summary: 匿名查询会话（IP 限速）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 会话信息（最小视图，不含密钥）
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  status:
                    {
                      type: string,
                      enum:
                        [
                          pending,
                          requested,
                          approved,
                          consumed,
                          denied,
                          expired,
                        ],
                    }
                  initiatorName: { type: string, description: 批准后才有值 }
                  deviceHint: { type: string, description: requested 后才有值 }
                  expiresAt: { type: integer }
        "404":
          description: 会话不存在或已过期
        "429":
          description: 限速
    delete:
      tags: [passkey-enroll]
      summary: 旧设备取消会话（需登录 Cookie）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: deleted }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: 会话不存在

  /passkey-enroll/sessions/by-code:
    get:
      tags: [passkey-enroll]
      summary: 匿名按短码查询会话（IP 限速 10/min）
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 会话信息（同 /passkey-enroll/sessions/{id}）
        "404":
          description: 授权码无效或已过期
        "429":
          description: 限速

  /passkey-enroll/sessions/{id}/request:
    post:
      tags: [passkey-enroll]
      summary: 新设备敲门（匿名，IP 限速）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceHint: { type: string, description: 新设备自报设备信息 }
      responses:
        "200":
          description: 敲门成功，返回 secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: 新设备轮询凭证 }
        "409":
          description: 非 pending 状态
        "429":
          description: 限速

  /passkey-enroll/sessions/{id}/watch:
    get:
      tags: [passkey-enroll]
      summary: 旧设备轮询会话状态（需登录 Cookie）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 会话状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    {
                      type: string,
                      enum:
                        [
                          pending,
                          requested,
                          approved,
                          consumed,
                          denied,
                          expired,
                        ],
                    }
                  deviceHint: { type: string }
                  expiresAt: { type: integer }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: 会话不存在

  /passkey-enroll/sessions/{id}/poll:
    get:
      tags: [passkey-enroll]
      summary: 新设备轮询（匿名，secret 门控）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: secret
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 轮询结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    {
                      type: string,
                      enum:
                        [
                          pending,
                          requested,
                          approved,
                          consumed,
                          denied,
                          expired,
                        ],
                    }
                  attestationOptions:
                    { type: object, description: 仅 approved 时一次性返回 }
                  registrationToken:
                    { type: string, description: 仅 approved 时一次性返回 }
                  initiatorName: { type: string }
        "401":
          description: secret 无效
        "404":
          description: 会话不存在
        "429":
          description: 轮询过快

  /passkey-enroll/sessions/{id}/approve:
    post:
      tags: [passkey-enroll]
      summary: 旧设备批准（需登录 Cookie，requested→approved）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 批准成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: approved }
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: 非 requested 状态

  /passkey-enroll/sessions/{id}/deny:
    post:
      tags: [passkey-enroll]
      summary: 旧设备拒绝（需登录 Cookie，requested→denied）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 拒绝成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: denied }
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: 非 requested 状态

  /passkey-enroll/sessions/{id}/complete:
    post:
      tags: [passkey-enroll]
      summary: 新设备提交 attestation（匿名，registrationToken 门控）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: registrationToken
          in: query
          required: true
          schema: { type: string }
        - name: name
          in: query
          required: false
          schema: { type: string, default: 新设备 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 裸 WebAuthn attestation JSON
      responses:
        "200":
          description: 凭证创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  passkeyId: { type: string }
        "401":
          description: registrationToken 无效
        "409":
          description: 会话已完成或非 approved 状态
        "429":
          description: 限速

  /passkey-enroll/sessions/{id}/qr.txt:
    get:
      tags: [passkey-enroll]
      summary: 获取 ASCII 二维码（匿名，IP 限速）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ASCII 二维码（内容=authUrl）
          content:
            text/plain:
              schema: { type: string }
        "404":
          description: 会话不存在

  /keys/self:
    get:
      tags: [keys]
      summary: Key 自检（Bearer，任何有效 Key）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Key 信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  prefix: { type: string }
                  scopes: { type: array, items: { type: string } }
        "401":
          $ref: "#/components/responses/Error"

  # ===== 管理后台（需登录会话 + 超管权限） =====
  /admin/stats:
    get:
      tags: [admin]
      summary: 系统总览统计（超管）
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 系统级总览统计
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStats"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/users:
    get:
      tags: [admin]
      summary: 用户列表（含各用户实体计数，超管）
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/users/{id}:
    get:
      tags: [admin]
      summary: 单用户详情（超管）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 用户详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: 改用户角色/禁用状态（超管，不能改自己）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, member] }
                disabled: { type: boolean }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "409": { $ref: "#/components/responses/Error" }

  /admin/users/{id}/role:
    patch:
      tags: [admin]
      summary: 改用户角色（超管，不能改自己，不能降权最后一个 admin）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, member] }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "409": { $ref: "#/components/responses/Error" }

  /admin/users/{id}/disable:
    post:
      tags: [admin]
      summary: 禁用用户（超管，不能禁自己，不能禁最后一个 admin）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }
        "409": { $ref: "#/components/responses/Error" }

  /admin/users/{id}/enable:
    post:
      tags: [admin]
      summary: 启用用户（超管）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }

  /admin/messages:
    get:
      tags: [admin]
      summary: 全局消息流（跨用户，超管）
      security: [{ cookieAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        "200":
          description: 全局消息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/AdminGlobalMessage" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/sessions:
    get:
      tags: [admin]
      summary: 全站活跃会话总览（超管）
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: 活跃会话列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/AdminSessionRow" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: APIKey }
    cookieAuth: { type: apiKey, in: cookie, name: anotify_session }
    nodeToken:
      type: http
      scheme: bearer
      bearerFormat: NodeToken
      description: |
        节点专用 opaque token（`ant_node_...`），只存 sha256。
        与 `bearerAuth`（用户 API Key）是两套凭据。
  schemas:

    # ---------- 事件中心 ----------
    Kind:
      type: string
      enum: [origin, end, pipe]
      description: |
        能力在链上的角色，**推导量，不落库**（不变量 I3）。
        origin = 没有节点声明；end = 有声明且 outputs 全空；pipe = 有声明且有出口。

    Capability:
      type: object
      properties:
        id: { type: string, example: cap_1730000000_a1b2c3d4 }
        orgId: { type: string }
        name: { type: string, example: review }
        version: { type: integer, example: 1 }
        paramsSchema:
          type: object
          description: JSON Schema 的**受控子集**（不支持 $ref / if-then-else）
        outputs:
          type: array
          items: { type: string }
          description: 出口名的**封闭集合**（不变量 I2）；边的 fromPort 必须属于它
        sticky:
          type: string
          description: 粘性路由的 selector 键名（空表示不粘）
        lifecycle:
          type: object
          properties:
            expiresInSec: { type: integer }
            retryable: { type: boolean }
            maxAttempts: { type: integer }
            resultTtlSec: { type: integer }
        source: { type: string, enum: [builtin, custom] }
        contentHash:
          type: string
          description: 规范化内容的 sha256；内容相同则幂等返回同一行
        createdAt: { type: integer, format: int64 }

    CapabilityWithKind:
      allOf:
        - $ref: "#/components/schemas/Capability"
        - type: object
          required: [kind]
          properties:
            kind: { $ref: "#/components/schemas/Kind" }

    CapabilityInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: review }
        version:
          type: integer
          description: 省略时自动开下一个版本（append-only，不变量 I8）
        paramsSchema: { type: object }
        outputs:
          type: array
          items: { type: string }
        sticky: { type: string }
        lifecycle: { type: object }
        source: { type: string, enum: [builtin, custom], default: custom }

    Edge:
      type: object
      properties:
        orgId: { type: string }
        fromCapability: { type: string }
        fromPort:
          type: string
          description: 必须属于 fromCapability.outputs
        toCapability: { type: string }
        createdAt: { type: integer, format: int64 }

    EdgeInput:
      type: object
      required: [fromCapability, fromPort, toCapability]
      properties:
        fromCapability: { type: string }
        fromPort: { type: string }
        toCapability: { type: string }

    TaskStatus:
      type: string
      description: 九态状态机（契约 §3）
      enum:
        - pending
        - assigned
        - acked
        - running
        - succeeded
        - failed
        - canceled
        - abandoned
        - lease_expired

    Task:
      type: object
      properties:
        id: { type: string, example: tsk_1730000000_abcd1234 }
        orgId: { type: string }
        traceId: { type: string, description: 一个根事件引起的全部工作 }
        parentTaskId:
          type: string
          nullable: true
          description: 谁派生；根事件直接派生的为 null
        path:
          type: array
          items: { type: string }
          description: 从根到本任务的能力序列（环剪枝用）
        capabilityId: { type: string }
        capability: { type: string, description: 冗余存 name，展示用 }
        version: { type: integer }
        params: { type: object }
        status: { $ref: "#/components/schemas/TaskStatus" }
        nodeId: { type: string, nullable: true }
        instanceId: { type: string, nullable: true }
        leaseUntil: { type: integer, format: int64, nullable: true }
        attempts: { type: integer }
        out:
          type: string
          nullable: true
          description: |
            出口名。与 reported 一起表达三态（不变量 I5）：
            reported=0 且 out=null → 没回报；reported=1 且 out=null → 到头了；
            reported=1 且 out="x" → 走 x 出口。
        reported: { type: boolean }
        summary: { type: string }
        artifacts:
          type: array
          items: { type: string }
        error: { type: string }
        capHash:
          type: string
          description: 派发时的能力定义 content_hash（版本钉住，不变量 I8）
        graphId:
          type: string
          description: 派发时的 graph_versions.id
        createdAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64, nullable: true }
        finishedAt: { type: integer, format: int64, nullable: true }

    Event:
      type: object
      properties:
        id: { type: string, example: evt_1730000000_abcd1234 }
        orgId: { type: string }
        traceId: { type: string }
        source: { type: string, example: github }
        type: { type: string, example: pull_request.opened }
        payload:
          type: object
          description: 原始负载，只存不解释
        idemKey: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }

    EventIngestResponse:
      type: object
      required: [eventId, traceId, inserted, tasks, pruned]
      properties:
        eventId: { type: string }
        traceId: { type: string }
        inserted:
          type: boolean
          description: false 表示命中幂等（返回的是已有事件，且**不重复派发**）
        origin:
          type: string
          description: 匹配到的起点能力（name@version）；找不到时省略
          example: github@1
        tasks:
          type: array
          description: 首轮派发建出的任务；幂等命中时为空数组
          items: { $ref: "#/components/schemas/TaskBrief" }
        pruned:
          type: array
          description: 首轮派发的剪枝记录（静默但一律留痕）
          items: { $ref: "#/components/schemas/PrunedRecord" }

    TaskBrief:
      type: object
      properties:
        id: { type: string }
        capability: { type: string }
        version: { type: integer }
        status: { $ref: "#/components/schemas/TaskStatus" }

    PrunedRecord:
      type: object
      required: [reason, detail]
      properties:
        reason:
          type: string
          description: |
            剪枝原因（契约 §7）。注意「上游没回报出口」**不是**剪枝，
            不会出现在这里。
          enum: [no_edge, param_schema, no_node, foreign_user, path]
        capabilityId: { type: string }
        port: { type: string }
        detail: { type: string, description: 给人看的证据 }

    Node:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        name: { type: string, example: mbp-16 }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [online, offline, draining] }
        maxInstances: { type: integer }
        maxConcurrency: { type: integer }
        lastSeenAt: { type: integer, format: int64, nullable: true }
        createdAt: { type: integer, format: int64 }

    NodeView:
      allOf:
        - $ref: "#/components/schemas/Node"
        - type: object
          properties:
            capabilities:
              type: array
              items: { type: string }
              description: 形如 review@1
            instances: { type: integer, description: 申报的槽位总数 }
            busy: { type: integer, description: 正在占用的槽位数 }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, member] }
        createdAt: { type: integer, format: int64 }

    Passkey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: integer, format: int64 }
        lastUsedAt: { type: integer, format: int64, nullable: true }
        backupEligible: { type: boolean }
        backupState: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          description: 机器可读错误码（如 edge_rejected / invalid_transition / capability_conflict）

    DeviceUpsert:
      type: object
      required: [endpoint, keys]
      properties:
        name: { type: string }
        platform: { type: string, enum: [ios, mac, win, android, other] }
        tags: { type: array, items: { type: string } }
        endpoint: { type: string }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        userAgent: { type: string }
    NotifyRequest:
      type: object
      required: [agentState, title]
      properties:
        agentId: { type: string }
        sessionId: { type: string }
        cwd: { type: string }
        agentState:
          { type: string, enum: [working, blocked, done, interrupted, error] }
        durationMs: { type: integer }
        title: { type: string }
        body: { type: string }
        model: { type: string }
        link: { type: string }
        deviceTags:
          { type: array, items: { type: string }, description: 路由键；空=广播 }
        priority: { type: string, default: normal }
        ttl: { type: integer, default: 86400 }
    TestNotifyRequest:
      type: object
      description: 工作台测试通知请求体（会话鉴权，字段精简）
      properties:
        title: { type: string, default: 测试通知 }
        body: { type: string }
        agentState:
          type: string
          enum: [working, blocked, done, interrupted, error]
          default: done
        link: { type: string }
        deviceTags: { type: array, items: { type: string } }
        priority: { type: string, default: normal }
    SystemStats:
      type: object
      description: 管理后台系统总览统计
      properties:
        userCount: { type: integer }
        adminCount: { type: integer }
        activeUserCount:
          { type: integer, description: 近 7 天有消息上报的用户数 }
        messageCount: { type: integer }
        todayMessages: { type: integer }
        deviceCount: { type: integer }
        enabledDevices: { type: integer }
        keyCount: { type: integer }
        sessionCount: { type: integer, description: 活跃会话数 }
        deliveredCount: { type: integer }
        deliveryTotal: { type: integer }
        daily:
          type: array
          items:
            type: object
            properties:
              day: { type: string }
              count: { type: integer }
        topUsers:
          type: array
          items: { $ref: "#/components/schemas/UserMetric" }
    UserMetric:
      type: object
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        messageCount: { type: integer }
        deviceCount: { type: integer }
    AdminUser:
      type: object
      description: 管理后台用户视图（含各用户实体计数）
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, member] }
        disabled: { type: boolean }
        createdAt: { type: integer }
        messageCount: { type: integer }
        deviceCount: { type: integer }
        keyCount: { type: integer }
        sessionCount: { type: integer }
    AdminGlobalMessage:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        seq: { type: integer }
        title: { type: string }
        agentState: { type: string }
        createdAt: { type: integer }
    AdminSessionRow:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: string }
        deviceName: { type: string }
        createdAt: { type: integer }
        expiresAt: { type: integer }
        lastSeen: { type: integer }
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
