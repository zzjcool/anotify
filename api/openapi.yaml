openapi: 3.0.3
info:
  title: Anotify API
  version: "1.0.0"
  description: |
    事件中心 API（契约见 docs/contracts/CONTRACT.md）。

    模型演化：从「通知终端」到「事件中心」。
    外部事件（webhook / cron / watch）→ `events` → 派发成 `tasks` → 节点执行 → 回报出口 → 下一跳。

    鉴权三种：
      - **会话 Cookie**（`anotify_session`）：控制台浏览，Passkey 登录后获得
      - **Bearer API Key**（`ant_...`）：机器调用（上报 / 事件入口），带 scope
      - **Bearer 节点 token**（`ant_node_...`）：节点 WS 长连接，opaque，仅存 sha256

    约定：
      - 所有 JSON 字段 **camelCase**
      - 空列表返回 `[]` 而不是 `null`（不变量 I9）
      - **命名空间是唯一隔离边界**（不变量 I10）：命名空间资源端点必须显式给 `namespaceId`，
        缺参 `400`、不存在 `404`；**跨命名空间引用一律 `400`**（不变量 I11）。
        组织层已在迁移 14 删除，`orgId` / `X-Org-Id` 不再是任何端点的参数

    ## 迁移中的旧端点

    原有 `/notify`、`/notifications`、`/devices`、`/stream` 属于**旧的「通知终端」模型**，
    现在仍在服务（存量前端页面依赖），但响应带 `Deprecation: true` 与
    `Link: </v1/events>; rel="successor-version"`。
    它们将在前端切换到事件中心后下线，届时 `messages` 表一并删除。
servers:
  - url: /v1
tags:
  - name: events
    description: 事件入口（外部世界的变化）
  - name: tasks
    description: 任务（派发出来的执行单元）
  - name: sources
    description: 源（origin）—— 事件的入口实例：cron / webhook / manual
  - name: namespaces
    description: 命名空间（组织之下的隔离层：能力/节点/源/事件/任务都按它隔离）
  - name: stats
    description: 命名空间级统计
  - name: capabilities
    description: 能力定义（append-only，每次改动开新版本）
  - name: edges
    description: 出口表（路由的唯一依据）
  - name: playbooks
    description: 预案（可安装的流程零件：清单 + 就绪体检 + 幂等安装）
  - name: nodes
    description: 节点（执行者）
  - name: node-stream
    description: 节点 WebSocket 协议
  - name: auth
    description: 认证与恢复
  - name: keys
    description: API Key
  - name: devices
    description: "[旧模型] 推送设备"
  - name: notify
    description: "[旧模型] 通知上报与查询"
  - name: cli-auth
    description: CLI 设备授权
  - name: passkey-enroll
    description: Passkey 设备补建
  - name: admin
    description: 管理后台

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ========== 事件中心：事件 ==========
  /admin:
    get:
      tags: [admin]
      summary: 管理后台端点索引
      description: 无尾斜杠访问（/v1/admin）返回可用子端点列表，不发重定向。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 子端点清单
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /../agent-login.sh:
    get:
      tags: [cli-auth]
      summary: 获取 CLI 登录脚本（curl | sh 的源头）
      description: |
        **注意**：这个端点不在 `/v1` 下，实际路径是 `/agent-login.sh`。
        在本文件里写成 `/../agent-login.sh` 是为了相对 `servers: /v1` 表达它。
        返回 plain text 的 shell 脚本，供 `curl -fsSL .../agent-login.sh | sh`。
      security: []
      responses:
        "200":
          description: shell 脚本正文
          content:
            text/plain:
              schema: { type: string }

  /events:
    post:
      tags: [events]
      summary: 提交一个外部事件（webhook 通用入口）
      description: |
        把外部世界的变化变成一条 `event` 并触发第一次派发。

        - `traceId` 由**触发器**生成（不给时），中枢不代生成
        - `idemKey` 用于幂等：冲突时返回**已有**的 `eventId` + `traceId`，**不是 409**
          （对发送方而言「已收过」和「本次收下」都该是 200）
        - 不带 `idemKey` 允许重复——不是所有来源都有稳定投递 ID
        - 派发失败（非起点问题）仍返回 200（事件确实收下了）
        - **来源未知 → 422**：没有匹配的起点能力时事件永远派不出去，
          静默 200 会让调用方以为成功。响应带 `available` 列出可用的来源
        - `source` 匹配的是**能力名**。内置起点 `github`/`cron`/`http`/`manual`
          开箱可用，无需先定义；也可自定义能力（如 `jira@1`）后使用

        鉴权是 Bearer 机器入口，所以 `namespaceId` **主要放 body**（body 优先、其次 query，
        两者都缺 → `400`）；事件落进哪个命名空间是调用方必须明确的事实，
        不存在隐式默认，也不接受 `*`（写端点）。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, type]
              properties:
                namespaceId:
                  type: string
                  description: |
                    **必填**（本字段或 query 二者给一个；body 优先）。事件落进哪个命名空间。
                    不存在 → 404；未登录 → 401；`*` → 400（写端点）。
                source:
                  type: string
                  description: |
                    事件来源，与能力名一致。内置起点（github / cron / http / manual）
                    开箱可用；也可使用自定义能力名——它就是入口边的左端（契约 §2.4）。

                    **找不到入口边不是错误**（#110）：事件照收（`200`），派发结果里
                    记一条 `pruned[].reason = no_edge`，用来回答「为什么没触发」。
                    旧模型那种「来源必须对应一个 origin 能力，否则 422 + 可用来源列表」
                    已整条删除。
                  example: github
                type:
                  type: string
                  description: 事件类型，**同时是 origin 能力的出口名**
                  example: pull_request.opened
                idemKey:
                  type: string
                  description: 幂等键（如 X-GitHub-Delivery）。省略则允许重复
                traceId:
                  type: string
                  description: 可选；省略时由触发器生成
                payload:
                  type: object
                  description: 原始负载，只存不解释（不求值、不改写）
      responses:
        "200":
          description: 事件已受理（含幂等命中）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventIngestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [events]
      summary: 事件列表（按 trace 过滤）
      description: |
        事件流（**不带** `traceId`）回答「外部世界发生了什么」：
        **不含** `source=route` 的剪枝行（剪枝是中枢内部的诊断记录，不是外部事件）。

        带 `traceId` 时是 trace 视图：**含**剪枝行（最新在前）。
        显式给 `source` 时听调用方的（`source=route` 能单独拉出剪枝）。

        `namespaceId` **必填**；`*` 允许（跨命名空间汇总：各命名空间分别查询后
        合并，再按 `limit` 统一截断）。响应里的每条事件自带自己的 `namespaceId`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: traceId, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        # 机器入口的 limit **没有** minimum：实现是 `n > 0` 才采纳、否则回 100
        # （见 internal/api/events.go 的 list），`limit=0` / 负数 = 回退默认值，不是夹到 1。
        # 所以这里不能写 minimum: 1 —— 那会把一个服务端接受、且回显 100 的请求标成非法。
        - name: limit
          in: query
          description: |
            缺省 / 非整数 / `<= 0` → `100`（**回退默认值**，不是夹到下限 1）；
            `> 500` → 钳到 `500`。响应回显生效值。
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: '事件列表（空时 `events: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [events, limit]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  limit:
                    type: integer
                    description: 生效值（服务端硬顶 500）——调用方据此分辨「要到了」与「被截断」
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ========== 认证：当前用户与凭据 ==========
  /auth/me:
    get:
      tags: [auth]
      summary: 当前会话的用户
      description: |
        返回**扁平**的用户字段（`id` / `username` / `displayName` / `role` /
        `disabled` / `createdAt`），不是 `{user: ...}` 包装。

        #204 之后不再返回组织：组织层已在迁移 14 删除。用户与命名空间之间没有
        归属关系（本部署内所有已登录用户都能访问所有命名空间），所以这里没有
        「我的命名空间」可回 —— 命名空间列表请用 `GET /v1/namespaces`。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/passkeys:
    get:
      tags: [auth]
      summary: 列出当前用户的 Passkey
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "Passkey 列表（空时 passkeys 为 []）"
          content:
            application/json:
              schema:
                type: object
                required: [passkeys]
                properties:
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/passkeys/{id}:
    patch:
      tags: [auth]
      summary: 重命名 Passkey
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200": { description: 已重命名 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [auth]
      summary: 删除 Passkey
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/passkeys/register/options:
    post:
      tags: [auth]
      summary: 补建 Passkey（新设备）——取 challenge
      security:
        - cookieAuth: []
      responses:
        "200": { description: WebAuthn 注册选项 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/passkeys/register:
    post:
      tags: [auth]
      summary: 补建 Passkey（新设备）——提交凭证
      security:
        - cookieAuth: []
      responses:
        "200": { description: 已注册 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ========== 统计（命名空间级）==========
  #
  # 统计不再是组织级：「本组织有多少事件」这个数字不存在了，同一套流程在
  # prod / staging 各有各的统计（契约 §6.2）。
  /stats:
    get:
      tags: [stats]
      summary: 命名空间级统计（事件总数 / 今日 / 任务完成率 / 热力图）
      description: |
        统计是**命名空间级**资源（契约 §6.2）：事件与任务都按命名空间隔离，
        「本组织有多少事件」这个数字不存在了 —— 同一套流程在 prod / staging
        各有各的统计。

        - `namespaceId` **必填**（缺 → `400`）
        - 与其它读端点不同，`namespaceId=*`（跨命名空间汇总）在本端点**不支持**：
          汇总口径未定义，传 `*` → `400`（不悄悄给一个用户没要求的数字）
        - `deviceCount` 仍按**用户**维度（推送设备是用户的东西，不是命名空间的）
        - 没有数据时 `daily` 是 `[]` 而不是 `null`（不变量 I9）
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: 统计数字（口径见 description）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }


  # ========== 事件中心：控制台读取 ==========
  /console/events:
    get:
      tags: [events]
      summary: 事件列表（控制台视图，会话 Cookie 鉴权）
      description: |
        浏览器控制台读事件流用。

        与 `GET /events` 的区别是**鉴权模型**：
        - `GET /events` 是机器入口，Bearer API Key + `notify:send` scope，给外部系统拉事件
        - `GET /console/events` 是控制台入口，会话 Cookie + 组织成员身份

        两者语义不同（一个要 scope，一个要成员身份），所以不共用一个 handler。

        **`limit` 口径**（与 `GET /events` 不同；这是**既有**差异，不是本批引入）：
        缺省 / 非整数 → `100`；`≤0` → 夹到下限 `1`（不是回退到默认值）；`> 500` → 钳到 `500`。
        机器入口 `GET /events` 是 `n > 0` 才采纳、否则回 `100`，所以两个端点的 `limit=0`
        语义不同 —— 改一边的解析前先确认另一边没被顺手带坏。响应一律回显**生效值**。

        `namespaceId` **必填**（契约 §6.2）；`*` 允许（跨命名空间汇总的管理视图，
        各命名空间分别查询后合并，再按 `limit` 统一截断）。

        **剪枝行的可见性**：事件流（不带 `traceId`）**不含** `source=route` 的剪枝行；
        带 `traceId` 时**含**剪枝行（最新在前）。显式给 `source` 时听调用方的。

        **顺序（视图契约）**：带 `traceId` 时**根事件（非剪枝）一定排在最前**
        （`events[0]`）—— trace 页用第一条事件的 source 去 `GET /sources` 找源拓扑当底图，
        剪枝行顶替根事件会让底图丢失。

        **游标分页（#235）**：`before` = 上一页的 `nextCursor`，只取更旧的一页；
        `nextCursor` 为空 ⇔ **没有更旧的行**（服务端每页多看一行确认，所以库里正好整页时
        也返回满页 + 空 `nextCursor`，不会再给一个多余的空页）。
        已知上限：`limit=500`（= 硬顶）时取不到那多出来的一行，退化为「行数 ≥ limit ⇒ 给游标」
        的近似判据 —— 此时库里正好 500 条会多给一个空页（store 的 500 硬顶使然，见契约 §6.2）。
        游标是不透明字符串（内部就是 `<createdAt>:<id>` 的 URL-safe base64），
        客户端**不应解析**，原样回传即可。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: traceId, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        # minimum: 1 是**真**的机器可读约束：实现是 intParam(..., 100, 1, 500)，
        # `limit <= 0` 会被夹到 1 并回显 1（不是回退默认 100）。
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - name: before
          in: query
          schema: { type: string }
          description: |
            不透明游标，取自上一页响应的 `nextCursor`；返回「比它更旧」的一页。
            格式非法 → `400` `{"error":"invalid before cursor"}`（**不静默降级**回第一页）。
            省略 = 第一页（最新）。
      responses:
        "200":
          description: 事件列表（空时 events 为 []）
          content:
            application/json:
              schema:
                type: object
                required: [events, namespaceId, limit, nextCursor]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
                  limit:
                    type: integer
                    description: 生效值（服务端硬顶 500）——调用方据此分辨「要到了」与「被截断」
                  nextCursor:
                    type: string
                    description: 下一页的游标；为空表示没有更旧的行（不透明，原样回传即可）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ========== 事件中心：trace 视图 ==========
  #
  # 「一条链为什么这样」一次请求答完：events（含剪枝）+ tasks + pruned。
  # 剪枝记录从 #142 起落进 events（source='route'、type='pruned.<reason>'），
  # 所以它既能在 events 里看到原始行，也被解析成 pruned 列表。
  /traces/{id}:
    get:
      tags: [events]
      summary: 单条 trace 全景（events + tasks + pruned）
      description: |
        一条 trace 的完整链路：
        - `events`：该 trace 的全部事件，**含** `source=route` 的剪枝行（最新在前）
        - `tasks`：该 trace 的任务链
        - `pruned`：从 `source=route` 的事件解析出的剪枝记录（`type` 去掉 `pruned.` 前缀即 `reason`）

        `events` 与 `tasks` 都为空时返回 404（该 trace 在本组织不存在）。
        空列表一律是 `[]` 而不是 `null`。

        **顺序**：`events` 按最新在前（`created_at DESC`），**不保证** `events[0]` 是根事件
        —— 剪枝行的时间一定晚于根事件，可能顶在最前。要根事件请按 `source != "route"`
        挑，或者直接读 `pruned`（这才是「为什么没跑」的答案）。

        `namespaceId` **必填**，且**不接受 `*`**：一条 trace 只属于一个命名空间，
        「跨命名空间的一条 trace」没有定义（带 `*` → `400`）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: '一条 trace 的全景（空列表为 `[]`）'
          content:
            application/json:
              schema:
                type: object
                required: [traceId, namespaceId, events, tasks, pruned]
                properties:
                  traceId: { type: string }
                  namespaceId:
                    type: string
                    description: 这条 trace 所属的命名空间（单对象视图，恒为具体 id）
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  pruned:
                    type: array
                    items: { $ref: "#/components/schemas/PrunedTraceRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 'trace 不存在（`{"error":"trace not found"}`）' }

  # ========== 事件中心：任务 ==========
  /tasks:
    get:
      tags: [tasks]
      summary: 任务列表（按 trace / node / status 过滤）
      description: |
        `namespaceId` **必填**（契约 §6.2）；`*` 允许（跨命名空间汇总的管理视图，
        各命名空间分别查询后合并，再按 `limit` 统一截断）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: traceId, in: query, schema: { type: string } }
        - { name: nodeId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: '任务列表（空时 `tasks: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [tasks, namespaceId]
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tasks/{id}:
    get:
      tags: [tasks]
      summary: 单个任务详情（含整条 trace 的任务链）
      description: |
        深链（点通知跳 `message.html?id=tsk_xxx`）只有任务 ID，不知道它属于哪条 trace，
        所以需要按 ID 取单任务。响应同时带上整条链，详情页一次请求即可画出任务链。

        `namespaceId` **必填**，且**不接受 `*`**（单对象端点）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: "任务详情 + 整条链（链为空时 chain 为 []）"
          content:
            application/json:
              schema:
                type: object
                required: [task, chain]
                properties:
                  task: { $ref: "#/components/schemas/Task" }
                  chain:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: 任务不存在 }

  /tasks/{taskId}/logs:
    get:
      tags: [tasks]
      summary: 任务日志（中枢向节点按需取）
      description: |
        节点上跑这条任务的子进程留下了什么（CONTRACT-logs-on-node §2）。

        **日志的真相在节点上**：中枢**每次请求都向节点现取一次**（一帧
        `logs_request` / `logs_response`，5 秒超时），**不落库、不缓存**。
        节点上的档案是完整的（8 MiB/流、保留 7 天）；中枢手里的任何副本都只会更旧，
        而排障时看的恰好是「最完整的那一份」。

        **取不到日志 → `200` + `available:false` + `reason`，绝不是 4xx/5xx**：
        `{"stdout":"","stderr":"","truncated":false,"bytes":0,"available":false,"reason":"node_offline"}`。
        取不到是合法状态（节点离线 / 档案被回收 / 节点没回），前端据此选降级文案；
        做成错误响应会让前端在**正常路径**上处理错误，也会把「点开了一台离线节点的日志」
        记成服务故障。`reason` 是**封闭集合**：`node_offline`（节点没有活跃连接，
        稍后连上可再看）、`no_local_archive`（节点上没有那次执行的档案：可能已过保留期，
        或者任务还没派给任何节点）、`timeout`（帧发出去了没等到回包，以及其它一切失败）。

        `stdout` / `stderr` 是节点侧档案的**原文**：
        包括节点追加的截断标记（`…（日志已截断：共 N 字节，只保留最后 32768 字节）`），
        不 trim、不转义、不再裁剪——中枢不再二次裁剪（两层各裁一次，「共 N 字节」
        到底指哪一层的 N 就说不清了）。

        - `truncated` 是采集侧的事实（回包被截过，档案本身仍完整），**不能**由长度反推
          （恰好 32 KiB 时反推不出来），而「看得不是全部」这句话必须说得准；
        - `bytes` 是截断**前**两个流的真实字节数之和（前端据此显示「原始多大」）；
          `bytes: 0` **不能**当作「没取到」——一次什么都没输出的执行同样是 0 字节，
          这两件事由 `available` 区分。

        `namespaceId` **必填**（契约 §6.2），且**不接受 `*`**（单对象端点）。
        跨命名空间的 `taskId` 与「不存在」同形：都是 `404 task not found`
        （与 `/tasks/{id}` 同口径，不留 id 探测面）。
      security:
        - cookieAuth: []
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: |
            日志快照。**取不到日志时也是 200**：四个数据字段全为空值（`bytes: 0`）
            且 `available: false` + `reason`，而不是 404/5xx。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskLogs" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 任务（在该命名空间下）不存在——跨命名空间与此同形
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /namespaces/{ns}/tasks/{taskId}/emissions:
    get:
      tags: [tasks]
      summary: 某个任务的 emit 列表（一次运行到底发了什么）
      description: |
        `emit` 是唯一的产出通道（design/typed-pipeline.md §2）：一次运行可以 emit 0..N 次，
        每次都独立路由、独立剪枝。这个端点把那些产物摊开——按 `seq` **升序**，一次 emit 一条。

        形状与语义：
        - `seq`：任务内单调递增、从 1 开始，**也是幂等键的一半**（`UNIQUE(task_id, seq)`，
          emit-protocol §4）。它就是「第几次 emit」，不是行号。
        - `port`：上游回报的出口名（路由的唯一输入，I2/I4）。
        - `data`：**原样 JSON 对象**（不是字符串）：这次产出直接就是下游的 params。
        - `routed` / `pruned`：**首次**处理的结果（重复 seq 一律回同一份计数，§3.2）。
          `routed=0` 是合法结果（这个出口没接下游 / 全被剪枝），不是错误。
        - `note`：emit 帧里的人类备注（§3.1，不参与路由）。当前恒为空串——
          emissions 表还没有 note 列，字段先占位以固定响应形状。
        - `createdAt`：首次落库时刻（unix 秒）；重复 seq 不更新。

        命名空间是 URL 的一部分（任务的子资源 = 命名空间资源）：不接受 `*`，
        也不从 query 读 `namespaceId`。跨命名空间的 `taskId` → `404`
        （与「任务不存在」逐字节相同：组织层删除后不存在「有、但属于别人」这一态）。

        空列表返回 `[]` 而不是 `null`（不变量 I9）。
      security:
        - cookieAuth: []
      parameters:
        - name: ns
          in: path
          required: true
          schema: { type: string }
          description: 命名空间 id（`*` → 400：跨命名空间汇总一条任务的 emit 没有定义）
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "emit 列表（还没 emit 时 `emissions: []`）"
          content:
            application/json:
              schema:
                type: object
                required: [taskId, namespaceId, emissions]
                properties:
                  taskId: { type: string }
                  namespaceId: { type: string, description: 作用域回显 }
                  emissions:
                    type: array
                    items: { $ref: "#/components/schemas/Emission" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 任务（在该命名空间下）不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{id}/cancel:
    post:
      tags: [tasks]
      summary: 取消任务
      description: |
        把任务推进到 `canceled`（终态）。终态不可再变，
        对已终态的任务再取消返回 409。

        `namespaceId` **必填**，**只从 query 读取**（请求体不解析），
        且不接受 `*`（写端点）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 任务已是终态（`invalid_transition`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{id}/abandon:
    post:
      tags: [tasks]
      summary: 放弃一条 pending 任务（孤儿任务处置）
      description: |
        把**仍处于 pending** 的任务推进到 `abandoned`（终态），并把 `reason`
        写进任务的 `error` 列——「这条事件本该被处理但没被处理」需要留下答案。

        为什么需要它：`pending` 原本没有 abandon 路径。能力升级后再没有节点声明那个版本、
        唯一能跑它的节点永久下线、能力被禁用/删除，都会让任务永远停在 pending。
        这不只是垃圾数据：背压的判定信号是 `MIN(created_at) WHERE status='pending'`，
        **一条孤儿任务就能把整个部署的新事件入口钉死在 503 上**。

        语义是 CAS（`WHERE status='pending'`）：任务在这期间被派发/取消/完成 → 409，
        绝不会把一条正在执行的任务改成终态。

        `namespaceId` **必填**，**只从 query 读取**，不接受 `*`（写端点）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: "写进 task.error 的原因（缺省给一句可读默认值）" }
      responses:
        "200":
          description: 已放弃
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 任务已不是 pending（`invalid_transition`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orphans:
    get:
      tags: [tasks]
      summary: 列出孤儿 pending 任务（诊断视图）
      description: |
        「pending 且超过 `olderThan`，且当前**没有任何在线节点**能执行」的任务。

        两个原因分类，处置方式完全不同：

        - `no_node_declares`：这个命名空间里没有任何节点声明该能力版本 → 改能力/加节点
        - `no_online_node`：有节点声明，但都不在线 → 救节点

        判据用 `capability_id`（具体版本），不是能力名：能力升级到 @2 后，
        只有 @1 的节点对 @1 的任务无效。

        刻意**不自动处置**：孤儿任务是有价值的事实记录，自动清理会把事故证据一起抹掉。
        确认后用 `POST /v1/tasks/{id}/abandon` 显式放弃。

        `namespaceId` 必填；`*` 允许（诊断需要一次看全）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - name: olderThan
          in: query
          required: false
          schema: { type: string, default: "1h" }
          description: |
            时长（`1h` / `30m` / `90s`）或秒数。下限 1 分钟（派发瞬间"暂时没有在线节点"
            是正常现象，不能当孤儿），上限 30 天。
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200, maximum: 1000 }
      responses:
        "200":
          description: 孤儿任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  orphans:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Task"
                        - type: object
                          properties:
                            idleSec: { type: integer, description: "创建至今的秒数" }
                            reason:
                              type: string
                              enum: [no_node_declares, no_online_node]
                  count: { type: integer }
                  olderThan: { type: integer, description: "实际生效的秒数" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ========== 源（origin）：事件的入口实例 ==========
  #
  # 源 ≠ 能力。能力回答"能干什么"（由节点声明、中枢派任务）；
  # 源回答"什么时候开始干"（有配置、自己产生事件、自己不干活）。
  /sources:
    get:
      tags: [sources]
      summary: 源列表（含出口能力可读信息）
      description: |
        源是事件的**入口实例**：`cron`（定时）/ `webhook`（回调）/ `manual`（手动）。
        每个源带一组出口能力（`targets`），触发时事件直接派给它们。

        与「能力 + 边」的区别：源不建边。用户不需要理解 `kind=origin`、
        也不需要为每种事件类型手建一条边。

        `namespaceId` **必填**；`*` 允许（跨命名空间汇总）。每个源对象自带
        `namespaceId`，跨命名空间时 `targetCaps` 按**源自己**的命名空间解析。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: '源列表（空时 `sources: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [sources]
      summary: 新建源
      description: |
        - `targets` 至少一个：没有出口的源产生的事件永远派不出去，直接 400
        - `kind=cron` 时 `config.expr` 必须是合法五段表达式（`61 * * * *` → 400）
        - `kind=webhook` 时服务端自动生成 `token`，返回的 `hookUrl` 可直接贴给外部系统
        - 同一个命名空间内 `name` 唯一（重名 → 409）
        - `namespaceId` **必填**（query 或 body，query 优先）；缺 → 400
        - 每个出口能力必须与源**同命名空间**（跨命名空间引用 → 400，不变量 I11）
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source: { $ref: "#/components/schemas/Source" }
        "400":
          description: 参数非法（kind 未知 / cron 表达式非法 / targets 为空）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 同名源已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/NamespaceId"
    get:
      tags: [sources]
      summary: 取单个源
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 源详情
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [sources]
      summary: 更新源（name / config / enabled / targets）
      description: |
        `kind` **不可修改**：换种类等于换语义（cron 表达式对 webhook 无意义）。
        需要换种类时请删除后重建。

        `namespaceId` **必填**（query 或 body，query 优先）；它不能用来"搬家"：
        改不到另一个命名空间里去。

        `config` 的合并语义：

        - `"config": null` 视为**本次不改 config**（no-op）；
        - `config` 里**未带** `vars` / `payload` 键时从**当前配置继承**（这两个键由别的入口写入，
          控制台改 `expr` / `token` 时不会带上它们）；
        - 显式传 `"vars": []` / `"payload": {}` **才是真的清空**。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceInput" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [source]
                properties:
                  source: { $ref: "#/components/schemas/Source" }
        "400":
          description: 参数非法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 同名源已存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [sources]
      summary: 删除源
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sources/dry-run:
    post:
      tags: [sources]
      summary: 试运行（草稿，尚未保存）
      description: |
        用请求体里的草稿源算出"会派发什么、会剪枝什么"，**不写事件、不建任务**。

        与 `POST /sources/{id}/fire` 共用同一套派发判定（`Dispatcher.Dispatch`
        的 `DryRun` 模式），所以试运行和真实触发不会给出不同结论 ——
        那种"试运行说能跑、真点却剪枝"的差异会直接摧毁用户对配置的信任。

        不检查 `enabled`：停用状态下也该能先验证再启用。

        `namespaceId` **必填**：推演"会派给哪些节点/能力"全部在某个命名空间里，
        所以它同样必需（不接受 `*`）。取值：query 优先，其次 body `namespaceId`，
        再次草稿里的 `source.namespaceId`。草稿的命名空间以参数为准（不信 body 里的手写值）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（query 优先）
                source:
                  type: object
                  description: 与创建源时的请求体同形（草稿，无需 id；其 `namespaceId` 也可作为取值来源）
                payload:
                  type: object
                  description: 用哪份 payload 试算；缺省为空对象
                type: { type: string }
      responses:
        "200":
          description: 推演结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  dispatch:
                    type: object
                    properties:
                      tasks:
                        type: array
                        description: 会派发的出口（含求值后的 params）
                        items: { type: object }
                      pruned:
                        type: array
                        description: 被跳过的出口及原因
                        items: { type: object }
        "400":
          description: 缺 source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /sources/{id}/dry-run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/NamespaceId"
    post:
      tags: [sources]
      summary: 试运行（已保存的源）
      description: |
        同 `/sources/dry-run`，只是用库里已保存的源。
        `namespaceId` **必填**（query 或 body，query 优先），不接受 `*`。
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（query 优先）
                type: { type: string }
                payload: { type: object }
      responses:
        "200":
          description: 推演结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  dispatch: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sources/{id}/fire:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/NamespaceId"
    post:
      tags: [sources]
      summary: 手动触发一次（调试 / manual 源的正常用法）
      description: |
        写一条事件并立即派发给源的出口能力。
        `type` 缺省用源的名字；带 `payload` 时其内容作为任务 params 传下去
        （原样传递，不做模板替换——不变量 I6）。

        `namespaceId` **必填**（query 或 body，query 优先）；不接受 `*`（触发是写操作）。
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（query 优先）
                type: { type: string }
                payload: { type: object }
      responses:
        "200":
          description: 已触发
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
                  inserted: { type: boolean }
                  idempotent: { type: boolean }
                  dispatch: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 源不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 事件中心：预案（playbook）==========
  #
  # 预案是**清单，不是所有权**：一份 manifest 说清「跑通这条流程需要哪些能力定义 /
  # 边 / 触发器」，安装时幂等补齐（能力 → 边 → 源，单事务），删预案**不回滚**已装的
  # 东西（它们已经独立存在了）。设计见 docs/design/playbooks.md，表的定义见
  # CONTRACT.md §2.8。
  #
  # 与 issue #193 草稿的差异（**验收基准是 web/mock.js 与已写好的前端**，不是草稿）：
  #   - `status` 是**四态** `ready / blocked / needs-node / partial`
  #     （不是 `ready|incomplete`）
  #   - `counts` 是 `{capabilities, edges, triggers}` 三类项的**数量**
  #     （不是 `ok/no-node/offline/missing` 的分布）
  #   - `next` 是**第一个非 ok 的检查项对象**（不是一句人话字符串），全 ok 时 `null`
  # 这三个形状与 `pbChecks` / `pbView`（web/mock.js:1395-1780）逐字段一致。
  #
  # 作用域：本组**每个**端点都必填 `namespaceId`（`NamespaceIdStrict`）——
  # 缺参 400、`*` 400、不存在 404（组织层删除后没有「别人的命名空间」可区分）。
  # 预案**不提供**跨命名空间汇总：体检结论只能按单个命名空间算。
  /playbooks:
    get:
      tags: [playbooks]
      summary: 预案列表（每项带就绪体检结论）
      description: |
        每项 = 预案行 + 体检结论（`status` / `next` / `ready` / `total` / `counts`），
        **不带** `items`（逐项明细在 `GET /playbooks/{idOrSlug}` 里）。

        体检是**查询时算出来的推导量，不落库**（不变量 I3 同源）：能力定义在不在、
        有没有节点声明、`edges` 里有没有这条边、有没有命中入口能力的源。

        排序按 `(createdAt, id)` **升序**（与 mock 卡片的顺序一致）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceIdStrict"
      responses:
        "200":
          description: '预案列表（空时 `playbooks: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [playbooks, namespaceId]
                properties:
                  playbooks:
                    type: array
                    description: 空为 `[]`（不变量 I9）
                    items: { $ref: "#/components/schemas/PlaybookView" }
                  namespaceId:
                    type: string
                    description: 本次作用域（预案没有 `*`，这里恒是具体的命名空间 id）
        "400":
          description: |
            参数非法：缺 `namespaceId`（`namespaceId is required`）；
            或 `namespaceId=*`（预案不提供跨命名空间汇总口径）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            命名空间不存在（`{"error":"namespace not found"}`，不回显传入的 id）。
            组织层已在迁移 14 删除（#204），**没有「有、但属于别人」这个中间态**：
            存在就 `200`，不存在就 `404`，所以这里不再有 `403` 分支
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 服务端错误（`{"error":"internal error"}`，细节只进服务端日志）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [playbooks]
      summary: 从 manifest 创建预案（**不安装**）
      description: |
        只落一行 `playbooks`（清单本身），**不写**能力定义 / 边 / 源 ——
        要装是另一个动作（`POST /playbooks/{idOrSlug}/install`）。

        创建期把矛盾说清（都返 `400`，错误信息指出是哪一项违反）：
        - `slug`：`^[a-z0-9]+(?:-[a-z0-9]+)*$`、长度 ≤ 64、**不 trim**
          （带空格 / 大写 / 下划线即非法——不把写错的地方静默改对）
        - `slug` 在**同一命名空间**内唯一（重名 → `409`，不是 `400`）
        - `name` 必填非空
        - `manifest`：能力 `name` 非空且不是内置 origin 保留名（`github` / `cron` /
          `http` / `manual`）、`version > 0`、同一 manifest 内 `(name, version)` 不重复、
          `paramsSchema`（若给）是 JSON 对象；边的三个字段非空，且 `from` 在本 manifest
          里声明过时 `fromPort` 必须属于它的 `outputs`（不变量 I2）；触发的 `kind` 合法
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceIdStrict"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（**query 优先**）；二者给一个，都缺 → 400
                slug:
                  type: string
                  example: pr-review
                  description: |
                    URL 用的稳定标识，命名空间内唯一；
                    规则 `^[a-z0-9]+(?:-[a-z0-9]+)*$`、长度 ≤ 64。
                name: { type: string, example: PR 审查, description: 展示名，不能为空 }
                description: { type: string, description: 一句话说明，可省略（缺省是空串） }
                manifest:
                  allOf:
                    - $ref: "#/components/schemas/PlaybookManifest"
                  description: |
                    缺省 / `null` → 归一化成
                    `{"capabilities":[],"edges":[],"triggers":[]}`（空是 `[]`）。
                    **原文存**：含 `runner` / `paramsSchema` / 自定义键在内，一律只校验、
                    不重新编码、不解释（不变量 I1）。
      responses:
        "201":
          description: 已创建（返回的 `playbook` 是详情形态，**带** `items`）
          content:
            application/json:
              schema:
                type: object
                required: [playbook]
                properties:
                  playbook: { $ref: "#/components/schemas/PlaybookDetail" }
        "400":
          description: |
            参数非法（`code: invalid_playbook`）：`slug` 缺失或非法 / `name` 缺失 /
            `manifest` 非法 / 触发 `kind` 非法；或作用域非法（缺 `namespaceId`、`namespaceId=*`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            命名空间不存在（`{"error":"namespace not found"}`，不回显传入的 id）。
            组织层已在迁移 14 删除（#204），**没有「有、但属于别人」这个中间态**：
            存在就 `200`，不存在就 `404`，所以这里不再有 `403` 分支
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            同命名空间里已有同名 `slug` 的预案
            （`{"error":"同命名空间里已有同名 slug 的预案","code":"slug_taken"}`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 服务端错误（`{"error":"internal error"}`，细节只进服务端日志）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /playbooks/{idOrSlug}:
    parameters:
      - name: idOrSlug
        in: path
        required: true
        schema: { type: string }
        description: |
          预案的 `id`（`pb_...`）或 `slug`（如 `pr-review`）—— 两种都能定位。
          别的命名空间的 id/slug 一律 `404`（不变量 I11：不跨命名空间取）。
      - $ref: "#/components/parameters/NamespaceIdStrict"
    get:
      tags: [playbooks]
      summary: 预案详情（逐项体检结果）
      description: |
        详情比列表多一个 `items`：按**依赖顺序**排的逐项检查（能力项 → 边项 → 触发项），
        每项自带 `status`（`ok` / `missing` / `no-node` / `offline`）。
        `no-node` 与 `offline` **必须分开**：前者要去写节点配置装机器，后者只需要把机器连上。

        无项时 `items: []`（空是 `[]`，不是 `null`）。
      security:
        - cookieAuth: []
      parameters:
      responses:
        "200":
          description: 预案详情
          content:
            application/json:
              schema:
                type: object
                required: [playbook]
                properties:
                  playbook: { $ref: "#/components/schemas/PlaybookDetail" }
        "400":
          description: 参数非法（缺 `namespaceId`，或 `namespaceId=*`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            两种情况：命名空间不存在（`{"error":"namespace not found"}`，
            不回显传入的 id）；或预案不存在（含别命名空间的 id/slug）
            （`{"error":"预案不存在","code":"not_found"}`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 服务端错误（`{"error":"internal error"}`，细节只进服务端日志）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [playbooks]
      summary: 删预案（**不删已安装的能力/边/源**）
      description: |
        只删 `playbooks` 里的这一行。预案是**清单，不是所有权**：
        已经装进去的能力定义 / 边 / 源**原样保留** —— 要拆就明确去删那些东西
        （把两种语义混进一个删除动作里，迟早误删生产配置）。

        幂等视角：重复删同一个预案，第二次是 `404`（不是 `200`）。
      security:
        - cookieAuth: []
      parameters:
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, example: true }
        "400":
          description: 参数非法（缺 `namespaceId`，或 `namespaceId=*`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            命名空间不存在（`{"error":"namespace not found"}`，不回显传入的 id）；
            或预案不存在（`code: not_found`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: 服务端错误（`{"error":"internal error"}`，细节只进服务端日志）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /playbooks/{idOrSlug}/install:
    parameters:
      - name: idOrSlug
        in: path
        required: true
        schema: { type: string }
        description: 预案的 `id`（`pb_...`）或 `slug`
      - $ref: "#/components/parameters/NamespaceIdStrict"
    post:
      tags: [playbooks]
      summary: 幂等安装（能力定义 → 边 → 源，单事务）
      description: |
        把 manifest 里声明的零件补进当前命名空间。**顺序硬性**：能力 → 边 → 源
        （边的两端要有定义才建得了，源要有人可派）；全过程**单事务**，真正的内部
        错误才整体回滚（单条零件不成立只 skip，见下）。

        幂等：已存在的 `(name, version)` 能力定义 / 已存在的同一条边 / 已存在的源
        一律进 `skipped`，**绝不覆盖**（能力定义 append-only，不变量 I8）。
        已经装了源时再装一次不会多出一个触发器 —— 判据是「同名源已存在」或
        「已有同 kind 且 targets 命中本预案入口能力的源」。

        能装什么装什么：单条边两端缺定义、`fromPort` 不在上游 `outputs` 里（I2）、
        能力同内容冲突（`UNIQUE(namespace_id, content_hash)`）、源配置非法都**只 skip
        那一条**，不整体失败，原因写进 `notes`（安装期只能 skip，不返 `400`）。

        入口能力为空 → 该触发 skip（不建没有入口的源）。
        写入的一切都锁在**本次**命名空间内（不变量 I11）。

        这是**动作**，不改变预案的身份 → `200`（不是 `201`）。
      security:
        - cookieAuth: []
      parameters:
      responses:
        "200":
          description: |
            安装完成（返回刷新后的详情 + 本次 created / skipped / notes）。
            单条边 / 源不成立**只**进 `skipped`（原因见 `notes`），不整体失败；
            真正的内部错误才整体回滚（一个零件都不落地，返 `500`）。
          content:
            application/json:
              schema:
                type: object
                required: [playbook, created, skipped, notes]
                properties:
                  playbook:
                    allOf:
                      - $ref: "#/components/schemas/PlaybookDetail"
                    description: 安装**完成后**重新体检过的详情（状态已随安装变化）
                  created: { $ref: "#/components/schemas/PlaybookInstallSet" }
                  skipped:
                    allOf:
                      - $ref: "#/components/schemas/PlaybookInstallSet"
                    description: 已存在 / 这一轮装不了的（原因见 `notes`）
                  notes:
                    type: array
                    items: { type: string }
                    description: skipped 的人话说明；无则 `[]`
        "400":
          description: |
            `400` **只**来自作用域：缺 `namespaceId` / `namespaceId=*`（契约 §6.2）。
            安装期的源配置非法（如 `cron` 的 `types[0]` 不是合法五段表达式）**不是**
            `400`：它是 skip + `notes`，不整体回滚（契约 §10 A4）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            命名空间不存在（`{"error":"namespace not found"}`，不回显传入的 id）；
            或预案不存在（`code: not_found`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            服务端错误（`{"error":"internal error"}`，细节只进服务端日志）。
            整个安装是单事务：出错时**一个零件都不会落地**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== webhook 入口（无需会话，鉴权靠 URL 里的 token）==========
  /hooks/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [sources]
      # 匿名端点：鉴权靠 URL 里的 token，不是 Cookie/Key。
      # 必须显式写空数组，check_openapi.py 靠它区分"忘了写"和"故意匿名"。
      security: []
      summary: 外部系统投递事件（webhook 源）
      description: |
        **不需要 Cookie / API Key**：鉴权就是 URL 里的 token。
        外部系统（GitHub / 监控告警）不可能带我们的会话。

        **也不需要 `namespaceId`**：命名空间从 token 解析出来（源行自带
        `namespace_id`）—— 外部系统根本不知道它，也不应该知道。

        - token 无效或源已停用 → 404（不区分两者，避免探测 token 有效性）
        - `type` 缺省用源的名字；可用 body.type 区分不同事件
        - 空 body 允许（有些系统只发 ping）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string }
                payload: { type: object }
      responses:
        "200":
          description: 已接收并派发
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/Event" }
                  inserted: { type: boolean }
                  dispatch: { type: object }
        "404":
          description: token 无效或源已停用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 命名空间自身（#162 / 契约 §6.1、设计文档 §6.1）==========
  #
  # **/v1/namespaces 是组织级资源**：请求**不带** namespaceId，响应里的 namespace
  # 对象也**不带** namespaceId（问「这个命名空间属于哪个命名空间」是自指）。
  # 资源端点（/sources、/stats ……）才需要 namespaceId，见 NamespaceId 参数。
  /namespaces:
    get:
      tags: [namespaces]
      summary: 列出本组织的命名空间（带资源计数，UI 直接用）
      description: |
        每个命名空间带 `capabilityCount` / `nodeCount` / `sourceCount` / `edgeCount`，
        控制台侧栏与命名空间页直接用，不必再逐页拉一次。

        空列表是 `[]` 不是 `null`（不变量 I9）。本端点**不需要** `namespaceId`。
      security:
        - cookieAuth: []
      parameters:
      responses:
        "200":
          description: '命名空间列表（空时 `namespaces: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [namespaces]
                properties:
                  namespaces:
                    type: array
                    items: { $ref: "#/components/schemas/Namespace" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [namespaces]
      summary: 新建命名空间（同事务播种内置能力）
      description: |
        - `slug` 是**稳定标识**（出现在 URL 与节点令牌作用域里）：1~31 字符，
          只允许小写字母、数字、连字符，且以字母或数字开头；不合法 → `400`
          （`code: invalid_slug`）。slug 建了不可改（改名只改 `name`）
        - `name` 省略/空串时回落成 `slug`（不会出现没有展示名的命名空间）
        - 同组织 slug 重复 → `409`
        - 新命名空间在**同一事务**里拿到内置能力（`notify.phone` 等）：没有它们
          连一个 end 节点都声明不出来，推送直接失效
        - 本端点**不需要** `namespaceId`（命名空间是组织级资源）
      security:
        - cookieAuth: []
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                  example: staging
                  description: 稳定标识；建了不可改
                name:
                  type: string
                  example: 预发
                  description: 展示名（可改）；省略则用 slug
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [namespace]
                properties:
                  namespace: { $ref: "#/components/schemas/Namespace" }
        "400":
          description: '非法 slug（`code: invalid_slug`）或请求体不是合法 JSON'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 同组织 slug 已存在（`{"error":"namespace slug already exists"}`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /namespaces/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [namespaces]
      summary: 改名（只改展示名 name；slug 不可改）
      description: |
        `slug` 是稳定标识（出现在 URL 与节点令牌作用域里），**建了不可改**：
        请求里带非空 `slug` 一律 `400`（`code: slug_immutable`）——不是静默忽略：
        「我改了但没生效」比「你不能改」难查得多。要换 slug 请删了重建。

        `name` **必填**且不能是空串/纯空白（→ `400`）。
        本端点**不需要** `namespaceId`。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: 预发 }
                slug:
                  type: string
                  description: 不要传（只用于触发 400 `slug_immutable`）
      responses:
        "200":
          description: 已改名（返回改完之后的命名空间）
          content:
            application/json:
              schema:
                type: object
                required: [namespace]
                properties:
                  namespace: { $ref: "#/components/schemas/Namespace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [namespaces]
      summary: 删除命名空间（阻塞 409 / 最后一个 400 / force 级联）
      description: |
        三档结果：

        - 不带 `force`：里面还有 sources / edges / tasks / nodes → **409**，
          响应带 `blocking`（形如 `["sources=2","edges=5"]`），让人看清在拆什么
        - **最后一个**命名空间 → **400**（带不带 `force` 都一样）：删了组织就没有
          「这套流程属于哪里」了，代码里不存在「没有命名空间」的分支
        - `?force=true`（或 `force=1`）→ 级联删除（连机器、能力、事件、任务、
          图快照一起删），`200`

        `force` 的含义是「我知道里面的机器会全部掉线」——所以默认档必须先把阻塞
        对象列出来，不能当「清理配置」做。本端点**不需要** `namespaceId`。
      security:
        - cookieAuth: []
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: string
                    description: 被删除的命名空间 id
        "400":
          description: 不允许删除最后一个命名空间（带不带 force 都一样）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 命名空间非空（未带 force），响应带阻塞对象清单
          content:
            application/json:
              schema:
                type: object
                required: [error, blocking]
                properties:
                  error: { type: string }
                  blocking:
                    type: array
                    items: { type: string }
                    example: ["sources=2", "edges=5"]

  # ========== 事件中心：能力 ==========
  /capabilities:
    get:
      tags: [capabilities]
      summary: 能力定义列表（带推导出的 kind）
      description: |
        `kind` 是**推导量，不落库**（不变量 I3），**以边为准**（#383）：
        - 没有出边 → `end`
        - 有出边、没有入边 → `origin`
        - 有出边、也有入边 → `pipe`

        `outputs` 是产物里的端口声明，不再是拓扑真相：一个建时声明 `outputs: []`
        的能力接上下游之后，`kind` 不再是 `end`，`assign.ports` 也会带上那个出口。

        `namespaceId` **必填**；`*` 允许（跨命名空间汇总，每条能力自带自己的 `namespaceId`）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: '能力列表（空时 `capabilities: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [capabilities, namespaceId]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: "#/components/schemas/CapabilityWithKind" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [capabilities]
      summary: 定义新能力（自动算 contentHash、自动开版本）
      description: |
        `capability_versions` 是 **append-only**（不变量 I8）：
        - 不指定 `version` 时自动开下一个版本
        - 同名同版本但内容不同 → 409（版本不能被改写）
        - 内容相同（含 name）→ 幂等返回已有定义

        `namespaceId` **必填**（query 或 body，query 优先）：一条能力定义只属于一个命名空间，
        同名同版本在**不同命名空间**里是两个独立定义（不冲突）。

        **升级闸门**（P2.2，设计 §3.6）：新版本成为 latest 时，与上一版比对契约：

        | 变化 | 处置 |
        |---|---|
        | 加可选入参 / 加 port | 直接生效 |
        | 删 port / 改入参类型 / 加必填 | **409 `upgrade_breaking`** + `upgradeImpact`（变了什么 + 受影响的 link），除非显式传 `force: true` |

        「受影响」的判据是「这条 link 会不会解析到新版」：`to_ref` 是**裸名字**
        （跟随 latest）的 link 会被列出来，`name@version` 型 link 不受影响
        （它钉死旧版）。响应里**总是**带 `upgradeImpact`（空影响面也是 `[]` 而不是 `null`），
        前端可以先展示再决定要不要 `force`。

        **`links`：能力 + 下游边一次提交**（可选）。带 `links` 时走**原子路径**：
        能力行、产物行（由 `CapabilityInput.run` 编译）、边行写在**同一个事务**里 ——
        要么全成，要么全不成（任何一条边不合法 → 整体回滚，不会留下「能力在、边缺」的半成品）。
        不带 `links` = 原有的两步流程（建完能力再逐条 `POST /edges`），行为不变。

        边不合法时返回 **400 `edge_rejected`**，`error` 里带 `links[i]` 下标：

        ```json
        { "error": "links[1]: edge_rejected: to link ref \"ghost\": store: record not found: edges.to_ref \"ghost\"",
          "code": "edge_rejected" }
        ```
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityInput" }
      responses:
        "200":
          description: |
            已创建（或幂等返回已有）。带 `links` 时额外返回建成的边与产物：
            `links` 是本次入库的边（形状与 `GET /edges` 的行一致）。

            `digest` / `artifact` **恒在**：请求体的 `run` 是必填的（见
            `CapabilityInput.run`），每个能力创建成功都伴一份产物。
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability: { $ref: "#/components/schemas/Capability" }
                  kind: { $ref: "#/components/schemas/Kind" }
                  upgradeImpact: { $ref: "#/components/schemas/UpgradeImpact" }
                  links:
                    type: array
                    description: |
                      本次一起建成的边（空列表是 `[]`）。**只有请求带 `links` 时才有这个键**：
                      不带 `links` 的响应与旧版本逐字一致。
                    items: { $ref: "#/components/schemas/Edge" }
                  digest:
                    type: string
                    description: |
                      产物 digest（`sha256:<64 hex>`）。与 `artifact.digest` 同值，
                      由请求体的 `run`（见 `CapabilityInput.run`）编译出的产物算出。
                  artifact: { $ref: "#/components/schemas/Artifact" }
        "400":
          description: |
            三种 400，看 `code` 区分：
            - `impl_missing`：**没给实现**（请求体缺 `run`）。能力必须有实现
              （契约 R2），占位请写一个 `exit 0` 的空脚本；缺了什么都不建
            - `edge_rejected`：某条 link 不合法（目标不存在 / 端口不在 `outputs` /
              `literals` 的键不存在 / 成环或自连 / 跨命名空间）。`error` 里带
              `links[i]`，且**能力一行都没建**（整个事务已回滚）
            - `invalid_artifact`：`run` 编译不出产物（同样什么都没建）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: 'links[1]: edge_rejected: to link ref "ghost": store: record not found: edges.to_ref "ghost"'
                code: edge_rejected
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            两种 409，看 `code` 区分：
            - `upgrade_breaking`：新版会破坏跟随 latest 的 link（带 `upgradeImpact`；
              确认要改线就带 `force: true` 重试）
            - `capability_conflict`：同 name@version 换内容（append-only，不变量 I8）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [capabilities]
      summary: 改能力的显示名（只动 display_name 一列）
      description: |
        `displayName` 是**纯展示**标签，不属于能力定义：

        - **不参与 `contentHash`** —— 改它不产生新版本，不会让旧 trace 无法解释
        - **不参与路由** —— 出口名来自 `outputs`，边指向 `id`，节点声明用 `name`
        - 传空串表示清掉显示名（前端回落到 `name@version`）

        这是这张表上**唯一**的 UPDATE。其余字段仍然 append-only（不变量 I8）。

        `namespaceId` **必填**（query 或 body，query 优先）；`id` 必须属于该命名空间。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                namespaceId:
                  type: string
                  description: 与 query 同义（query 优先）
                id: { type: string, description: 能力的 capability_versions.id }
                displayName: { type: string, description: 空串 = 清除显示名 }
      responses:
        "200":
          description: 已更新（返回更新后的能力）
          content:
            application/json:
              schema:
                type: object
                properties:
                  capability: { $ref: "#/components/schemas/Capability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========== 批量创建能力（一个表单建多个能力 + 它们之间的边）==========
  /capabilities/batch:
    post:
      tags: [capabilities]
      summary: 一个表单建多个能力 + 它们之间的边（整批一个事务）
      description: |
        为什么需要这个端点：一个表单里常常要同时定义 `a` 和 `b`，再把 `a → b` 接起来。
        逐条调 `POST /capabilities` 时，中间任何一步失败都会留下半成品（能力表 append-only，
        撤不回来）；而「先建的指向后建的」这种互相依赖在逐条路径上**根本无法表达**。
        所以这里是**整批一个事务**：全部能力行 + 全部产物行 + 全部边行，
        任一步失败整体回滚 —— 能力 0 条、产物 0 条、边 0 条。

        与 `POST /capabilities` 的分工是**分层**而不是分叉：校验、升级闸门、幂等折叠、
        建边全部复用同一套实现，这里只多一层「批」的编排；单建接口的行为一个字都不变。

        - `capabilities[]` 的元素**就是** `CapabilityInput`：handler 复用同一个 decode
          结构，不另造一份几乎一样的 schema（造第二份的代价是「同一个字段在一个端点生效、
          在另一个端点静默丢弃」）。代价是元素里也能写出 `links` / `namespaceId` / `force`
          这三个**批级**字段，它们的处置见 `CapabilityBatchInput` 的字段说明。
        - `links[].fromRef` / `toRef` 是**引用**（`name` 跟随 latest / `name@version` 钉死），
          可以引用**本批新建**的名字：事务里先插全部能力行，再逐条解析边。
        - `links` **允许成环**：`review → fix → review` 是合法编排，兜底是运行期的
          hop 预算（`ANOTIFY_MAX_HOPS`）与 trace 任务预算，不做配置期静态环检测。
        - 批内 `capabilities[].name` **不可重复**：`links` 用名字寻址，重名会让同一条边
          指向两个定义，而「谁是谁」在请求里根本没有表达方式。
        - `namespaceId` **必填**（`*` → 400：一批能力只能属于一个命名空间；
          元素里再写一个与之冲突的值同样 400，不静默采用其中一个）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityBatchInput" }
      responses:
        "200":
          description: |
            整批已写入。三个键**恒在**（没有边时 `edges: []`，没有变化时 `upgradeImpact`
            里的 `changes` / `links` 也是 `[]`），前端不必判空就能遍历（不变量 I9）。
          content:
            application/json:
              schema:
                type: object
                required: [capabilities, edges, upgradeImpact]
                properties:
                  capabilities:
                    type: array
                    description: |
                      与请求 `capabilities` **同序**。元素是**权威能力行**（形状同
                      `POST /capabilities` 响应里的 `capability`）：幂等折叠时 `version` /
                      `id` 来自库里已有那一行 —— 请求里那份是「我想要的」，这里是
                      「实际生效的」，调用方要用后者。
                    items: { $ref: "#/components/schemas/Capability" }
                  edges:
                    type: array
                    description: |
                      与请求 `links` **同序**。形状同 `GET /edges` 的行，含
                      `fromCapabilityId` / `toCapabilityId` 这两个「此刻解析到哪一版」的
                      只读派生量。
                    items: { $ref: "#/components/schemas/Edge" }
                  upgradeImpact:
                    allOf:
                      - $ref: "#/components/schemas/UpgradeImpact"
                    description: |
                      **整批合并**后的影响面（不是「最后一个能力」的，也不是只报第一个撞上
                      闸门的）——整批只给一个影响面对象，前端与单建共用同一套渲染：

                      - 没有破坏性变更时，`capability` / `fromVersion` / `toVersion` 取自
                        **批内第一个**能力（与单建一样总有值，不是空对象）
                      - 有破坏性变更时，这三个字段换成**第一个破坏性**能力
                      - `changes` / `links` 是整批的**并集**（去重、稳定顺序：`changes` 按
                        `kind` 再按 `detail` 排，`links` 按 `fromRef` / `port` / `toRef` 排）
                      - `changes[].detail` 带 **`能力名: ` 前缀**：两个能力都删了同名出口时
                        说明文字一字不差，不加前缀会被去重成一条（用户看到「1 处变化」而
                        实际是两处，也看不出是哪条能力变的）；`links` 不用前缀（它自带
                        `fromRef` / `toRef`）
        "400":
          description: |
            五类 400，看 `code` 区分（没有 `code` 表示请求本身不成立，文案里带下标）：

            - `duplicate_name`：批内 `capabilities[].name` 重复（`error` 里带
              `capabilities[i]` 下标，并指出第一次出现的位置）
            - `impl_missing`：某个元素**没给实现**（缺 `run`，见 `CapabilityInput.run`）。
              与单建同一口径：`error` 里带 `capabilities[i]` 下标，整批一条都没建
            - `edge_rejected`：某条 link 不合法（目标不存在 / 端口不在 `outputs` /
              `literals` 的键不存在 / 跨命名空间）。`error` 里带 `links[i]` 下标，
              且**整批已回滚**（能力 0 条、产物 0 条、边 0 条）
            - `invalid_artifact`：某个 `run` 编译不出产物（同样什么都没建）
            - 无 `code`：`capabilities` 为空 / 元素缺 `name` / 元素里的 `namespaceId`
              与批级冲突 / 元素里写了 `links`（边必须放批级）/ 缺 `namespaceId`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: 'capabilities[1]: capability_batch_duplicate_name: "b" 在批内重复（第一次出现在 capabilities[0]）'
                code: duplicate_name
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            两种 409，看 `code` 区分：

            - `upgrade_breaking`：批内任一能力会破坏跟随 latest 的 link。body 带
              `upgradeImpact`（**整批合并**后的影响面，口径见 200），确认要改线就带
              `force: true` 重试；元素里的 `force` 也算数（与批级取或）
            - `capability_conflict`：同 name@version 换内容（append-only，不变量 I8）；
              `error` 里同样带 `capabilities[i]` 下标
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 能力最新产物（详情页看脚本）==========
  /capabilities/{id}/artifact:
    get:
      tags: [capabilities]
      summary: 能力最新产物的解析后内容（详情页展示脚本）
      description: |
        返回该能力**最新一份产物**里能直接给人看的东西：文件正文（`files`，普通文本，
        **不是** base64）、入口文件名、超时、工作目录、预装依赖、env。

        另带一份 `spec`：该产物的**完整正文**（Capability Spec v3 §5 的「详情给全文」）。
        与 `GET /capabilities` 列表里的 `spec` 同名字段对照着看：列表那份是摘要
        （`files` → `{count, bytes}`），这份是全文（`files` 是相对路径 → 正文）。

        与 `GET /artifacts?capabilityId=` 的分工：那个返回 `spec` 原文（base64，给部署与
        排障用），这里返回解析后的文件正文（给「让人看一眼脚本」用）。

        为什么不并进 `GET /capabilities`：`files` 是全部文件正文（单文件 256 KiB、
        合计 1 MiB），列表一次几十条能力会被撑爆 —— 详情展开时才懒加载这一个端点。

        **404 的两种情形 body 逐字节相同**（防越权探测）：

        - 能力不属于该命名空间（或不存在）
        - 能力还没有产物（内置 `handler` 形式的能力天生没有产物行，见
          Capability Spec v3 §6.1；这类能力的正文看 `GET /capabilities` 的 `spec`）

        `namespaceId` **必填**（`*` → 400：单个能力的产物没有跨命名空间汇总形态）。
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: 能力的 capability_versions.id
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: 最新产物的解析后内容
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityArtifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========== 能力的下游（整体替换）==========
  /capabilities/{name}/downstreams:
    put:
      tags: [capabilities]
      summary: 整体替换某个能力的下游（能力边唯一的写入口）
      description: |
        语义是 **replace（整体替换）**，不是 append：提交的这组就是该能力的**全部**下游。
        空数组（`{"links":[]}`）是合法的——清空 = 这个能力没有下游（终端能力）。

        为什么是 `PUT` 而不是 `PATCH`：语义是「这组就是全部」，不是增量。PATCH 会让
        「删掉一个」只能靠哨兵值表达，而哨兵值会被任何一个漏传字段的客户端无意触发。

        一条下游 = 一条能力边 `(from_ref=能力名, from_port='out', to_ref, priority, literals)`：

        - `from_ref` 是**能力名**（不是版本）：一个能力的所有版本共用同一组出边；
        - `from_port` 固定隐式出口 `out`（`store.ImplicitPort`）—— API 与界面都不出现它；
        - `to_ref` 是引用（`name` 跟随 latest / `name@version` 钉死；能力 id 也接受并归一）。

        **校验全部先做**（任一失败 → 400，一个字节都不写）：

        1. `toRef` 必须在本命名空间解析得到，否则 `unknown_target`（`error` 里带名字）；
           跨命名空间引用 → 400（不变量 I11，`error` 里说明两端的命名空间）
        2. `toRef` 不能指向 `{name}` 自己 → `self_link`
        3. 条目数 ≤ 100 → 否则 `too_many_links`
        4. `priority` ∈ [0, 1000]（缺省 0）→ 否则 `priority_out_of_range`
        5. `literals` 必须满足目标 `paramsSchema`（与 `POST /edges` 同一份校验）→ 否则
           `edge_rejected`（`error` 里带具体原因：哪个键不存在 / 期望什么类型）
        6. 同一 `toRef` 出现两次（按归一后的引用判）→ `duplicate_target`

        落库在一个事务里：先删掉**这个能力在隐式出口 `out` 上**本次没提交的边（不动别人的边、
        不动入口边、也不动历史多出口能力别的端口上的边——那些能力在界面上是只读保留的），
        其余 `INSERT … ON CONFLICT DO UPDATE`（改 `priority` / `literals` 时**不刷新**
        `createdAt`）。一次成功的 replace 之后，这个能力在 `out` 上的下游**按 `toRef`** 恰好
        是提交的那组（没提交的 `toRef` 被删掉，提交的被 upsert）。

        本端点**只写边**，不改能力定义的 `outputs`（那属于能力版本契约，append-only）：
        端口固定为隐式 `out`，界面上的「有没有下游」与 `outputs` 的对应由能力保存路径负责
        （见 CONTRACT-hide-ports）。

        这条路径**取代**了 `POST /edges` 的能力边分支（那里现在回 405 `edge_write_removed`）。
      security:
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: 能力**名字**（不是版本：全部版本共用同一组出边）
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownstreamsInput" }
            example:
              links:
                - { toRef: script.echo, priority: 0 }
                - { toRef: notify.phone@1, priority: 10, literals: { to: "+8613800000000" } }
      responses:
        "200":
          description: '落库后的完整集合（与请求同序；空时 `links: []`）'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownstreamsResult" }
        "400":
          description: |
            校验失败（一个字节都没写）。看 `code` 区分：

            - `unknown_target`：`toRef` 解析不到（带名字）
            - `self_link`：`toRef` 指向能力自己
            - `duplicate_target`：同一个 `toRef` 出现两次
            - `too_many_links`：超过 100 条
            - `priority_out_of_range`：`priority` 不在 [0, 1000]
            - `edge_rejected`：`literals` 不满足目标 `paramsSchema`（原因透传）
            - `links_required`：请求里没有 `links` 字段（`[]` 才是清空，漏传是 bug）
            - 无 `code`：跨命名空间引用（I11）/ 缺 `namespaceId` / `namespaceId=*`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: '能力不存在（`code: not_found`）/ 命名空间不存在'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 事件中心：出口表 ==========
  /edges:
    get:
      tags: [edges]
      summary: 出口表列表
      description: |
        `namespaceId` **必填**；`*` 允许（跨命名空间汇总）。

        边的一端是**引用**（P2.2，设计 §3.2）：`fromRef` / `toRef` 写
        `name`（跟随 latest）或 `name@version`（钉死）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: fromRef, in: query, schema: { type: string }, description: '按左端过滤（`name` / `name@version` / 能力 id 均可；按**名字**匹配，两种引用形态都算）' }
        - { name: fromCapability, in: query, deprecated: true, schema: { type: string }, description: '`fromRef` 的旧名（兼容一个版本）' }
      responses:
        "200":
          description: '边列表（空时 `edges: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [edges, namespaceId]
                properties:
                  edges:
                    type: array
                    items: { $ref: "#/components/schemas/Edge" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [edges]
      summary: 新增一条**入口边**（能力边的写入口已迁移）
      description: |
        **只接受入口边**（`fromIsSource=true`：`fromRef` 是来源名，如 `github`）。

        能力的下游不再从这条路径写：建/删/改优先级/重排统一走
        `PUT /capabilities/{name}/downstreams`（整体替换）。请求建能力边
        （`fromIsSource=false`，含**缺省**该字段）→ **405** `edge_write_removed`。
        为什么收掉：原来「建下游在能力页、删下游在出口页、改优先级两处都没有」，
        用户在能力页配了 3 个下游想删 1 个就得换一页（CONTRACT-downstream-edit §0）。

        `DELETE /edges` 与 `GET /edges` 仍然保留（运维纠正 / 图 / 详情 / trace）。

        入口边的两端仍是**引用**（P2.2，设计 §3.2）：右端 `toRef` 写 `name`（跟随
        latest，升级自动生效）或 `name@version`（钉死那一版）。**边里只存引用，不存 id**。

        配置期校验（违反即 400 `edge_rejected`）：
        1. 右端引用必须能在本**命名空间**里解析（跨命名空间引用 → 400，不变量 I11）
        2. `namespaceId` **必填**（query 或 body，query 优先）：一条边属于且只属于一个命名空间
        3. `literals` 是**常量覆盖**（设计 §3.3：下游 params = data ⊎ literals，字面量优先）：
           必须是 JSON 对象（`null` = 没有覆盖）；每个键必须出现在**解析到的目标版本**的
           `paramsSchema.properties` 里（拼错当场拒）；值类型必须与声明**精确相等**
           （`integer` 不收 string，反之亦然，不做任何转换）。
        4. `mapping`（引用模板）只有入口边允许（能力边带非空 mapping 会被 store 硬拒）。
        5. `fromPort` 是**事件类型**，不校验封闭集合（外部系统决定，`*` = 任意事件）。

        **输入兼容一个版本**：旧的 `fromCapability` / `toCapability` 字段仍然接受，
        值可以是能力 id（P2.2 之前的形状）；store 会把它解析成 `name@version` 再落库
        ——绝不会把 id 存进边。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeInput" }
      responses:
        "200":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  edge: { $ref: "#/components/schemas/Edge" }
        "400":
          description: |
            引用解析不到 / 跨命名空间引用 / `literals` 不合法 / 缺 `fromRef`·`fromPort`·`toRef`
            （`edge_rejected`；`error` 里带具体原因，如「哪个引用不存在」「哪个键不存在」
            「期望什么类型」）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: |
            请求建的是**能力边**（`fromIsSource=false`，含缺省该字段）→ `edge_write_removed`。
            能力的下游请在能力里改：`PUT /capabilities/{name}/downstreams`（整体替换）。
            `fromIsSource=true` 的入口边不受影响。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: edge_write_removed
                error: 能力的下游请在能力里改（PUT /v1/capabilities/{name}/downstreams）
    delete:
      tags: [edges]
      summary: 删除一条边
      description: |
        `namespaceId` **必填**（query 或 body，query 优先）；其余四个定位参数 query 优先、
        body 兜底（`fromIsSource` 也接受 query 的 `1` / `true`）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: fromRef, in: query, schema: { type: string }, description: '左端引用（`name` / `name@version` / 能力 id）' }
        - { name: fromPort, in: query, required: true, schema: { type: string } }
        - { name: toRef, in: query, schema: { type: string }, description: '右端引用（同上）' }
        - { name: fromCapability, in: query, deprecated: true, schema: { type: string }, description: '`fromRef` 的旧名' }
        - { name: toCapability, in: query, deprecated: true, schema: { type: string }, description: '`toRef` 的旧名' }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ========== 事件中心：节点 ==========
  /nodes:
    get:
      tags: [nodes]
      summary: 节点列表（含在线状态、声明的能力、实例占用）
      description: |
        `namespaceId` **必填**；`*` 允许（跨命名空间汇总，每台节点自带自己的 `namespaceId`）。

        节点属于**命名空间**（不是一个节点跨多个命名空间）：切命名空间时列表整页重取。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: '节点列表（空时 `nodes: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [nodes, namespaceId, targetAgentVersion]
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/NodeView" }
                  namespaceId:
                    type: string
                    description: 本次作用域（`*` 表示跨命名空间汇总）
                  targetAgentVersion:
                    type: string
                    description: |
                      中枢当前自带的 agent 二进制版本（= `POST /nodes/{id}/upgrade` 的目标版本，
                      CONTRACT-agent-upgrade §5.1）。控制台据此在**点之前**显示「已是最新 / 可升级」。
                      **空串 = 服务端没带 agent 二进制**（此时不显示升级按钮，或显示「服务端未提供」）。
                    example: 1.5.0+3fd5a59
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [nodes]
      summary: 注册节点（返回一次性令牌）
      description: |
        **`namespaceId` 必填**：query 或 body，**query 优先**；两处都没有 → `400`，
        错误体点名 `namespaceId`（写端点绝不回退默认命名空间）。`namespaceId=*`
        在写端点无定义 → `400`。

        **命名空间不存在 → `404`**：响应 `{"error":"namespace not found"}`，不回显
        传入的 id。组织层在迁移 14 删除后没有「别人的命名空间」这一态 —— 存在就
        `200`/`201`，不存在就 `404`，所以不再有 403 分支，也不需要为写端点单独
        准备一套「防 id 探测」的映射（`#185` / 契约 D2 已随组织层删除而失效）。

        **令牌明文只在这里出现一次**：响应里的 `token`（`ant_node_...`）是明文，
        库里只存 `sha256`（`token_hash`）；此后任何读接口（`GET /v1/nodes`、
        `GET /v1/nodes/{id}`）都不回 `token` / `token_hash`。令牌即归属：
        token → 节点行 → `nodes.namespace_id`，创建后不可改（契约 §10.3）。

        `instances` 只是**槽位建议值，不落库**：不创建 `node_instances` 行，也不改
        `nodes.max_instances`（`max_instances` 是安全硬顶，不能被一个建议值静默改写）。
        真正的槽位以节点 `hello` 帧的申报为准（契约 Q5）；字段保留是为了让客户端能把
        同一份节点配置原样发过来。只校验非负。

        `name` 规则：`^[a-z0-9][a-z0-9._-]{0,62}$`（1..63 字符，只允许 `[a-z0-9._-]`，
        以字母/数字开头）；**不 trim**（带空白即非法 —— 不把写错的输入静默改对）。
        同一命名空间内重名 → `409`（`code: name_taken`）；不同命名空间可以同名。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
      requestBody:
        description: |
          允许空对象：缺 `namespaceId` 由 handler 报 `400`（错误体点名 `namespaceId`），
          不会先报 "invalid JSON body"。
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                namespaceId:
                  type: string
                  description: 可选（query 优先）；query 与 body 都没有 → 400
                name:
                  type: string
                  example: mbp-16
                  description: |
                    `^[a-z0-9][a-z0-9._-]{0,62}$`（1..63 字符，以字母/数字开头，
                    只允许 `[a-z0-9._-]`，**不 trim**）
                tags:
                  type: array
                  items: { type: string }
                  description: 自由标签，与节点视图同形
                instances:
                  type: integer
                  minimum: 0
                  description: |
                    槽位**建议值，不落库**：不创建 `node_instances` 行，也不改
                    `nodes.max_instances`；真正的槽位以节点 `hello` 帧的申报为准（契约 Q5）
      responses:
        "201":
          description: '节点已创建（`token` 是**一次性明文令牌**，此后任何读接口都不再出现）'
          content:
            application/json:
              schema:
                type: object
                required: [node, token]
                properties:
                  node: { $ref: "#/components/schemas/NodeView" }
                  token:
                    type: string
                    description: |
                      一次性明文令牌（`ant_node_<base64url(24B)>`）。库里只存 `sha256`，
                      这是它唯一一次出现在响应里；丢了只能删了重建节点。
                    example: ant_node_MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1u
        "400":
          description: |
            请求参数非法（命中任一条即 400）：缺 `namespaceId`（错误体点名 `namespaceId`，
            **不回退默认命名空间**）/ `namespaceId=*`（写端点无定义）/ `name` 缺失或非法
            （`code: invalid_name`）/ `instances` 为负（`instances must be >= 0`）/
            请求体不是合法 JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        # OAS 3.0 里 `$ref` 的兄弟键（如 description）会被忽略，故此处 inline 写，不 $ref：
        # 这个 404 必须自带说明——它与「命名空间不存在」共用同一个响应体，且是 §6.2 的显式例外。
        "404":
          description: |
            **命名空间不存在**（`{"error":"namespace not found"}`，不回显传入的 id）。
            组织层已在迁移 14 删除（#204）：「有、但属于别人」这一态不存在了，所以
            `#185` 那套「写端点跨组织也报 404、响应逐字节相同、以免被当作 id 探测器」
            的显式例外随之失效——不存在一律 `404`，存在一律成功。
            响应形状同 `#/components/responses/NotFound`。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            同一命名空间内同名节点已存在
            （`{"error":"同名节点已存在","code":"name_taken"}`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /nodes/{id}:
    get:
      tags: [nodes]
      summary: 节点详情（含每个并发槽位的当前状态）
      description: |
        比列表多给 `instances` 的**逐槽细节**：哪个槽在跑哪个任务。
        列表只给数量 —— 列表页不需要 N×M 行，详情页要能回答
        "这台机器现在卡在哪个槽上"。

        `namespaceId` **必填**，且**不接受 `*`**（单对象端点）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 节点详情
          content:
            application/json:
              schema:
                type: object
                required: [node, instances]
                properties:
                  node: { $ref: "#/components/schemas/NodeView" }
                  instances:
                    type: array
                    description: '申报的并发槽位（空时 instances 为 []）'
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        namespaceId:
                          type: string
                          description: 槽位所属命名空间（从父行 nodes 取）
                        nodeId: { type: string }
                        slot: { type: integer }
                        concurrency: { type: integer }
                        busyTask:
                          type: string
                          nullable: true
                          description: 占用该槽的任务 id（空闲为 null）
                        alive: { type: boolean }
                        updatedAt: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 节点不存在
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string } }

  /nodes/{id}/drain:
    post:
      tags: [nodes]
      summary: 排空节点（不再接新任务，在跑的继续）
      description: |
        只把 `status` 改成 `draining`（派发时会被过滤掉），
        **不主动取消**已在跑的任务——取消是破坏性操作，排空是渐进退役。

        `namespaceId` **必填**，**只从 query 读取**（请求体不解析），不接受 `*`（写端点）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
      responses:
        "200":
          description: 已排空
          content:
            application/json:
              schema:
                type: object
                properties:
                  node: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /nodes/{id}/upgrade:
    post:
      tags: [nodes]
      summary: 让节点把自己的 agent 升级到中枢当前版本（控制台下发）
      description: |
        向该节点的活跃连接推一帧 `upgrade`（`target_version` / `sha256` / `url_path`），
        节点用自己的 node token 去 `url_path` 下载、校验 sha256、原子替换二进制后重启。

        **帧里不带二进制**：agent 是 15 MB 量级，塞进一条 WS 帧会阻塞同一条连接上的
        心跳与 assign（节点读超时 = 掉线）。下载走普通 HTTP（`GET /node/binary`）。

        ### 判定顺序（CONTRACT-agent-upgrade §5）
        | 情况 | 响应 |
        |---|---|
        | 节点没有活跃连接 | `409 {"error":"node_offline"}` |
        | 服务端没带 agent 二进制 | `501 {"error":"agent_binary_unavailable"}` |
        | `agentVersion == targetVersion` 且没 `force` | `200 {"status":"up_to_date","targetVersion":"…"}` |
        | 其它 | 推帧，`200 {"status":"sent","targetVersion":"…"}` |

        `force` 可用 `?force=1|true|yes` 或 JSON body `{"force":true}` 表达：
        同版本也照样下发（用于二进制被手改、或节点自报版本不可信的场景）。

        ### ack 与控制台结果
        节点回报 `upgrade_ack` 后：成功 → 用 ack 的 `version` 更新 `agentVersion`；
        失败 → `agentUpgrade.status = failed` + 可判别错误码（`need_root` / `bad_sha` /
        `download_failed` / `not_supported`）。两者都体现在 `GET /nodes` 的
        `agentUpgrade` 对象里（刷新页面仍可见，CONTRACT-agent-upgrade §5.1）。

        `namespaceId` **必填**（query 或 body），不接受 `*`（写端点）。
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/NamespaceId"
        - name: force
          in: query
          required: false
          schema: { type: boolean }
          description: 同版本也下发（也可用 body `{"force":true}`）
      requestBody:
        required: false
        description: 可选；空 body 表示 `force=false`、`namespaceId` 只从 query 取。
        content:
          application/json:
            schema:
              type: object
              properties:
                namespaceId: { type: string }
                force: { type: boolean }
      responses:
        "200":
          description: 已下发，或已是最新
          content:
            application/json:
              schema:
                type: object
                required: [status, targetVersion]
                properties:
                  status: { type: string, enum: [sent, up_to_date] }
                  targetVersion:
                    type: string
                    description: 本次的目标版本（= 中枢自带的 agent 版本）
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: '节点没有活跃连接（`{"error":"node_offline"}`）'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: '服务端没带 agent 二进制（`{"error":"agent_binary_unavailable"}`）'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ========== 事件中心：节点协议 ==========
  /node/binary:
    get:
      tags: [node-stream]
      summary: 下载中枢自带的 agent 二进制（节点令牌鉴权）
      description: |
        升级源（CONTRACT-agent-upgrade §2）。调用方是节点上的 agent / CLI（`anotify-agent
        upgrade`），用**自己的 node token** 鉴权（`Authorization: Bearer ant_node_...`）——
        不是控制台会话 Cookie：下载方手里没有浏览器会话。

        响应头是两个升级承诺：
        - `X-Agent-Version`：中枢版本（= 升级目标版本）；
        - `X-Agent-Sha256`：body 的 sha256（64 位十六进制）。**校验不符必须拒绝替换**
          （`bad_sha`），这是「中枢二进制被改动/传输截断」的唯一证据。

        服务端没带二进制（`ANOTIFY_AGENT_BIN` 指向的文件不存在）→ `501`：
        明确说「这里没有升级源」，调用方据此退出（CLI 退出码 2），而不是当成网络错误重试。

        排空中的节点（`status=draining`）**仍然可以**下载：升级是维护动作，不是接新任务。
      security:
        - nodeToken: []
      responses:
        "200":
          description: agent 二进制原文
          headers:
            X-Agent-Version:
              schema: { type: string }
              description: 中枢版本（= 目标版本）
            X-Agent-Sha256:
              schema: { type: string }
              description: body 的 sha256（64 位十六进制，无前缀）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501":
          description: '服务端没带 agent 二进制（`{"error":"agent_binary_unavailable"}`）'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /node/stream:
    get:
      tags: [node-stream]
      summary: 节点 WebSocket 长连接（十三帧协议）
      description: |
        **必须**在 Upgrade 之前用 `Authorization: Bearer <node token>` 完成鉴权：
        鉴权失败返回 401/403，**绝不返回 101**。

        token 是 opaque（`ant_node_...`），服务端只存 sha256。
        握手成功后先发 `hello`，收到 `welcome` 即接入成功。

        ### 上行（节点 → 中枢）
        | type | 说明 |
        |---|---|
        | `hello` | 自报身份 + 能力声明 + 实例申报（必须第一帧） |
        | `heartbeat` | 心跳；任何上行帧都续命 |
        | `ack` | 接单：`assigned → acked` |
        | `progress` | 开始执行：`acked → running` |
        | `result` | 结果：`running → succeeded/failed` |
        | `upgrade_ack` | agent 升级回报：`{ok, version, commit, error}`（见 `/nodes/{id}/upgrade`） |
        | `logs_response` | 日志回包：`{task_id, request_id, stdout, stderr, truncated, bytes, error}`；`request_id` 原样回带，`error=no_local_archive` = 本机没有那次执行的档案（CONTRACT-logs-on-node §1） |

        ### 下行（中枢 → 节点）
        | type | 说明 |
        |---|---|
        | `welcome` | 握手成功，带 `heartbeatSec` / `leaseTtlSec` |
        | `assign` | 派活：能力名 + 版本 + params + 租约（**不含命令/脚本/argv**） |
        | `cancel` | 停止任务 |
        | `error` | 协议错误（不关连接，除 hello 失败） |
        | `upgrade` | 去升级：`{target_version, sha256, url_path}`，二进制走 HTTP 下载（见 `/node/binary`） |
        | `logs_request` | 来一份日志：`{task_id, request_id}`（中枢发起，5 秒超时；日志**只存在节点上**，中枢按需取——见 `/tasks/{taskId}/logs`） |

        `hello` 还带一个可选的 `agent_version`（string）：节点上跑的 agent 版本，
        中枢落库并回显为 `GET /nodes` 的 `agentVersion`。老 agent 不带 = 空串（未知），
        **不是错误**（CONTRACT-agent-upgrade §3）。

        ### result 不再路由：出口只来自 `emit`

        P1.5 起 `result` 帧里的 `out` 字段已退役，`tasks.out` 列也在迁移 28 删掉。
        现在的语义只有一条：

        | 线上 JSON | 服务端行为 |
        |---|---|
        | 带 `out` 键（任何值） | **忽略**：不落库、不建下游（老客户端的写法仍然照收，不报错） |
        | 不带 `out` 键 | 同上（两者**完全等价**） |

        下一跳的唯一入口是 `emit` 帧：`emit(port=fix)` 才会查边、建子任务行并派发。
        「路由与 status 无关」这条性质因此变成：失败**之前** emit 过的下游照样在
        （失败不会撤回已经发生的接力）。失败必须带非空 `summary`（原因），
        服务端在缺失时兜底写成 `"failed"`。

        「没回报」（节点掉线/超时）不在上面这张表里：那是**没有 result 帧**，
        任务会停在 pending/running，由租约到期 + 巡检重派处理。

        ### hello 的可选 `manifest`：节点声明「我怎么跑」

        `hello` 除了 `capabilities: [{capability, version}]`（老字段，语义不变），
        还可以带一个**可选**的 `manifest` 数组：

        ```jsonc
        { "manifest": [
            { "capability": "review", "version": 1,
              "run": { "runner": "bash", "command": "./runners/review.sh",
                       "timeoutSec": 900, "concurrency": 2,
                       "env": { "LOG_LEVEL": "info" } } } ] }
        ```

        - 缺省 `manifest` = 老行为：只报 `name@version`，`runSpec` 存 `{}`。
        - `capabilities` 与 `manifest` 同时出现时**以 manifest 为准**（信息更全）；
          manifest 里没写的 `capabilities` 项仍然是声明，只是 `runSpec` 为 `{}`。
        - `run` 在 manifest 条目里**必填**；`runner` 本期只接受 `bash`，
          `command` 非空，`concurrency` 必须在 `[1, nodes.max_concurrency]`。
          不合法时握手失败，`error.code = invalid_manifest`，`message` 列出**全部**问题项
          （与 `unknown_capability` 同构：每种拒绝原因一个码）。
        - **只存不执行**（不变量 I1）：`run` 落到 `node_capabilities.run_spec` 后
          仅用于控制台展示与排障（`GET /nodes/{id}` 的 `capabilities[].runSpec`）。
          中枢不解码、不拆参数、不判路径存在/可执行、不拼命令行，也不把它写进 `assign`。
      security:
        - nodeToken: []
      responses:
        "101":
          description: 协议切换成功（此后走 WebSocket 帧）
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/register/options:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 开始 Passkey 注册（返回 WebAuthn challenge）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
                displayName: { type: string }
      responses:
        "200": { description: WebAuthn creation options }
  /auth/register:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 完成 Passkey 注册（校验 attestation，建用户+会话+恢复码）
      responses:
        "200":
          description: |
            注册成功，Set-Cookie 会话。响应含可选字段 `recoveryCodes`（明文仅此一次）。
        "400": { $ref: "#/components/responses/Error" }
  /auth/login/options:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 开始 Passkey 登录
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
      responses:
        "200": { description: WebAuthn request options }
  /auth/login:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 完成 Passkey 登录（建会话）
      responses:
        "200": { description: 登录成功，Set-Cookie 会话 }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 登出（吊销会话）
      responses:
        "200": { description: 已登出 }
  /auth/sessions:
    get:
      security:
        - cookieAuth: []
      tags: [auth]
      summary: 列出当前用户的登录会话
      responses:
        "200": { description: 会话列表 }

  /auth/recovery/login:
    post:
      security: []  # 匿名可访问
      tags: [auth]
      summary: 用恢复码登录（校验哈希 → 作废该码 → 建会话 Cookie）
      description: |
        body: `{username, code}`。成功后该恢复码一次性作废；会话模型与 Passkey 登录相同，
        随后可走 `/auth/passkeys/register*` 补建 Passkey。
        码格式：`XXXX-XXXX-XXXX-XXXX`（去歧义字符集，大小写不敏感，连字符可选）。
        限速：10/min/IP + 10/min/username（小写）；超限返回 429，带 `Retry-After: 60`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, code]
              properties:
                username: { type: string }
                code: { type: string, description: "恢复码明文" }
      responses:
        "200": { description: 登录成功，Set-Cookie 会话 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: '限速（IP 或 username）；响应头 Retry-After: 60'

  /auth/recovery/regenerate:
    post:
      security:
        - cookieAuth: []
      tags: [auth]
      summary: 重新生成恢复码（需登录；作废全部未用旧码）
      description: |
        作废当前用户全部未使用恢复码，签发新一批（默认 8 个），明文仅在本响应返回一次。
      responses:
        "200":
          description: 新恢复码明文（仅此一次）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /auth/recovery/status:
    get:
      security:
        - cookieAuth: []
      tags: [auth]
      summary: 恢复码状态（需登录；不含明文）
      responses:
        "200":
          description: 未用码数量
          content:
            application/json:
              schema:
                type: object
                properties:
                  unusedCount: { type: integer }
                  hasCodes: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }

  /keys:
    get:
      security:
        - cookieAuth: []
      tags: [keys]
      summary: 列出 API Keys（不含明文/哈希）
      responses:
        "200": { description: Key 列表 }
    post:
      security:
        - cookieAuth: []
      tags: [keys]
      summary: 新建 API Key（仅此处返回一次明文）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items:
                    {
                      type: string,
                      enum: [notify:send, notify:receive, devices:read],
                    }
      responses:
        "200": { description: 创建的 Key（含明文，仅此一次） }
  /keys/{id}/revoke:
    post:
      security:
        - cookieAuth: []
      tags: [keys]
      summary: 停用 API Key
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: 已停用 }

  /capability-templates:
    get:
      tags: [capabilities]
      summary: 内置能力模板
      description: |
        控制台「新建能力」用的模板。**模板是代码生成器的输入，不是执行器类型**：
        v1 只有一种执行器（脚本），所谓 Agent 类型只是预置的脚本 + 预置的表单字段。

        模板与产物格式的契约见 `.pi-orchestrator/console-declares/CONTRACT-artifact.md` §8。
        放在服务端而不是前端硬编码，是为了只有一个事实源。

        模板字段 `key` 一律 snake_case —— 它会变成 `ANOTIFY_PARAM_<UPPER>`，
        而节点侧只做「大写 + 非字母数字换下划线」，camelCase 会变成不可猜的变量名。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 模板列表（固定 9 个）
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/CapabilityTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /artifacts:
    get:
      tags: [capabilities]
      summary: 某能力的产物流水
      description: |
        一份**产物**（artifact）是能力的不可变实现快照：参数契约 + 入口文件 + 全部文件内容
        + 超时 + 环境变量 + 依赖的外部命令。它自包含（脚本内联，不引用外部 blob），
        所以可以拷到另一台机器脱离中枢单跑。

        `digest` 是内容寻址标识 `sha256:<64 hex>`：同一份内容永远同一个 digest，
        因此「跑过什么」可以被永久审计。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: capabilityId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: '产物列表（新的在前；空时 `artifacts: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [artifacts]
                properties:
                  artifacts:
                    type: array
                    items: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /deployments:
    get:
      tags: [deployments]
      summary: 部署状态列表
      description: |
        一条部署 = 「中枢希望这台节点拥有这份产物」+「节点回报的状态」。
        `namespaceId` 必填；`*` 允许（跨命名空间汇总）。

        状态：`pending`（还没收到节点确认）/ `applied`（节点确认应用成功）/
        `failed`（节点拒绝，`reason` 是短码 + 说明）/ `local`（节点上的 digest 与中枢期望
        不一致 = 本地变体，**中枢永不覆盖**）。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: nodeId, in: query, schema: { type: string } }
        - { name: capabilityId, in: query, schema: { type: string } }
      responses:
        "200":
          description: '部署列表（空时 `deployments: []`）'
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    items: { $ref: "#/components/schemas/Deployment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [deployments]
      summary: 把产物部署到选中的节点
      description: |
        `digest` 缺省取该能力最新一份产物。目标节点 = `nodeIds` ∪ 命中 `tags` 任一标签的节点，
        去重后按 nodeId 稳定排序。

        **`pushed=false` 不代表失败**：行已经建好（`state=pending`），节点上线后由重连对账补推。
        UI 必须区分「已下发」与「已排队」，否则运维会以为离线机器上的东西已经生效。

        **`handler` 形式的能力不可部署**（Capability Spec v3 §5）：它们由中枢的 builtin
        节点认领，没有 `files`，推给节点只会得到一份跑不起来的产物 —— 所以先判
        handler、再走产物解析，直接 `400 builtin_not_deployable`（一行都不建）。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentInput" }
      responses:
        "200":
          description: 逐台的部署结果
          content:
            application/json:
              schema:
                type: object
                required: [artifact, deployments]
                properties:
                  artifact: { $ref: "#/components/schemas/Artifact" }
                  deployments:
                    type: array
                    items: { $ref: "#/components/schemas/DeploymentResult" }
        "400":
          description: |
            三种 400，看 `code` 区分：
            - `missing_capability_id`：没给 `capabilityId`
            - `builtin_not_deployable`：这个能力由**中枢内置执行器**认领
              （`spec.handler != ""`），不需要也不能部署到节点
            - `no_target_node`：选择器一台都没选中（`nodeIds` ∪ `tags`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: |
            这份产物不存在（`code=artifact_not_found`）：显式 `digest` 查不到，或该能力
            还没有产物行。注意「建能力时没填 run」已经不可能（`POST /capabilities` 会
            400 `impl_missing`），`handler` 形式走 400 `builtin_not_deployable`。
    delete:
      tags: [deployments]
      summary: 撤销一次部署
      description: 先推 remove 帧（尽力而为），再删行。推失败不构成故障——节点上多缓存一份产物不会被派发。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespaceId"
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties: { deleted: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices:
    get:
      deprecated: true
      security:
        - cookieAuth: []
      tags: [devices]
      summary: 列出接收设备
