# Anotify CI —— 分阶段 + 按改动自适应选择（2026-11-18）
#
# ── 一句话 ────────────────────────────────────────────────────────────
# 不是「跑得更快」，而是「不再跑不需要跑的」，并且**全量永远有一个与选择逻辑
# 无关的出口**（nightly / workflow_dispatch / PR label `full-ci`）。
#
# ── 四个阶段（改动的风险面不相等，门禁也不该相等）────────────────────
#   triage        PR：用与本地同一个分类器算出「这次是不是 docs-only」
#   quick         PR + main push：`make ci`（contract / 守卫 / lint / fe / 单测 /
#                 基准冒烟）—— **内容与改造前完全一致**，只是 PR 上多了一层 e2e
#   e2e-affected  PR：只跑被改动选中的 e2e 套件（`make plan-affected` 的结论）
#   full-e2e      nightly / workflow_dispatch / PR label `full-ci`：`make ci` + **全量** e2e
#
# ── 硬纪律 ────────────────────────────────────────────────────────────
# 1. **没有全量跑的地方 = 这段不许合进 main。** 全量的入口是 nightly（每天
#    18:00 UTC = 02:00 CST）与 `full-ci` 标签，二者都不经过 affected 选择器。
# 2. **不许静默降低覆盖。** PR 上跳过某个套件的理由必须由 `make plan-affected`
#    打印出来（选择器的输出里有「跳过清单 + 原因」）；找不到理由的跳过一次都不许有。
# 3. docs-only 的判据来自 `scripts/e2e/affected-map.mjs` 的 NO_E2E_IMPACT 表，
#    不是「后缀看起来像文档」——所以 `docs/**` 与 `web/docs.html` 是两回事。
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 每天 18:00 UTC（02:00 CST）跑一次全量：选择器可能漏，nightly 是那张兜底的网。
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 同一个 ref 上后来的运行取消前面的：改造前同一条分支上曾出现连续 7 次运行
# 同时跑满（每条 200s 级），其中绝大多数结果被后一次覆盖 —— 纯浪费。
# nightly 用独立 group：别让一次 push 把定时全量取消掉。
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

jobs:
  # ── 分类：这次改动有没有「e2e 会读的东西」──────────────────────────
  triage:
    name: triage（docs-only？）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # merge-base 需要历史；blob:none 只取提交图，不取文件内容。
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 分类（--no-go：只判 docs-only，不需要 Go 工具链）
        id: classify
        run: |
          set -euo pipefail
          node scripts/e2e/affected.mjs --json --no-go \
            --base "origin/${{ github.base_ref }}" > plan.json
          docs_only=$(python3 -c 'import json;print(str(json.load(open("plan.json"))["docsOnly"]).lower())')
          echo "docsOnly=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = "true" ]; then
            echo "::notice::本次改动只碰了 e2e 不读的路径（docs/**、*.md、.reports/** …）⇒ 跳过 quick 与 e2e"
          fi

  # ── 快门禁：内容与改造前一致（make ci）────────────────────────────
  quick:
    name: quick（make ci）
    needs: triage
    # 显式写成 pull_request：main push 走下面的 regression（避免依赖「被 needs 的 job
    # 被 skip 时下游是否还会跑」这种容易想错的语言细节）。
    if: >-
      github.event_name == 'pull_request' &&
      needs.triage.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # quick 不需要历史（make ci 只看工作树），1 个提交就够。
          fetch-depth: 1
          filter: blob:none

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 显式声明：模块缓存 + 构建/测试缓存都由 setup-go 管（key 含 go.sum）。
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # staticcheck 装在 .bin/（make tools）。缓存它：`go install pkg@version` 每次
      # 都要向 honnef.co 做 go-get 解析，网络抖一下就把「工具没装上」伪装成「代码有问题」。
      - name: Cache Go static tools
        uses: actions/cache@v4
        with:
          path: .bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # 改造前这里是 `npm install --no-save yaml@2`：每次都重新解析 registry，且
      # check-wire-fields.mjs 依赖的 yaml 是**隐式**依赖（不在 package.json 里）。
      # `npm ci` 按 package-lock.json 装（yaml 已在 lock 里作为传递依赖），配合
      # setup-node 的 npm 缓存，冷启动只走一次 tarball 下载。
      - name: Install JS deps（按 lock 安装，不再临时装单个包）
        run: npm ci --no-audit --no-fund

      - name: PR gate
        run: make ci

  # ── PR：只跑被改动选中的 e2e 套件（分片并行，总判定收口）─────────────
  #
  # 为什么分片：套件之间没有共享状态，同一次选择可以拆到 N 个 runner 上并行跑（实测 29 套
  # 串行 13m17s，run 44865127142）。分片不许改覆盖 —— 下面的「总判定」用 --selected 硬校验并集。
  # 分片器是纯函数：同一份 selected 永远切出同一份分片（复现/重跑不会漂）。
  e2e-plan:
    name: e2e（affected · 计划分片）
    needs: [triage, quick]
    if: >-
      github.event_name == 'pull_request' &&
      needs.triage.outputs.docs_only != 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.shard.outputs.count }}
      selected: ${{ steps.shard.outputs.selected }}
      shards: ${{ steps.shard.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 选择器要 merge-base（这次改动相对目标分支的名字集合）。
          fetch-depth: 0
          filter: blob:none

      - name: Set up Go
        # 选择器要 `go list` 的 import 图（二进制风险面），不是白跑一次工具链。
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 自测分片逻辑（分片错了 = 漏跑，先钉住它）
        run: node --test scripts/e2e/shard.test.mjs

      - name: 选择本次要跑的套件（并打印跳过清单）
        run: |
          set -euo pipefail
          node scripts/e2e/affected.mjs --base "origin/${{ github.base_ref }}" > plan.txt
          cat plan.txt
          node scripts/e2e/affected.mjs --json --base "origin/${{ github.base_ref }}" > plan.json

      - name: 分片（纯函数：同一份 selected 永远切出同一份分片）
        id: shard
        run: node scripts/e2e/shard.mjs --from-plan plan.json --shards 4 --github-output

  e2e-shard:
    name: e2e（affected · 分片 ${{ matrix.shard.id }}）
    needs: [e2e-plan]
    if: needs.e2e-plan.result == 'success' && needs.e2e-plan.outputs.count != '0'
    strategy:
      # 一片红了也要看其它片的结果：总判定要有完整证据才能回答「到底缺什么」。
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Chrome 并发 4 在 4 vCPU runner 上会把浏览器打崩（PR #428：「browser has been closed」）。
      E2E_CONCURRENCY: "2"
      # 等待上界而不是断言：runner 比开发机慢 2–3 倍（页面/导航/case 三级）。
      F3_DEFAULT_TIMEOUT_MS: "15000"
      F3_NAV_TIMEOUT_MS: "20000"
      F3_CASE_BUDGET_MS: "150000"
      SHARD_ID: ${{ matrix.shard.id }}
      SHARD_SUITES: ${{ join(matrix.shard.suites, ' ') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS deps
        run: npm ci --no-audit --no-fund

      # 找不到 Chrome 就当场红：不许因为没有浏览器而静默跳过前端套件（最贵的假绿形态）。
      - name: 预检：Chrome 与 python3（缺了就红，不静默跳过）
        run: |
          set -euo pipefail
          for bin in /usr/bin/google-chrome python3; do
            command -v "$bin" >/dev/null || { echo "❌ 缺少 $bin：e2e 不能在没有浏览器的情况下跑（不做静默降级）"; exit 1; }
          done
          /usr/bin/google-chrome --version

      # 没有 key 时 api_contract 的 VAPID 断言会被 `if (env)` 静默跳过 ⇒ 生成一对。
      - name: VAPID 密钥（避免「没有 key 就静默少一条断言」）
        run: |
          set -euo pipefail
          eval "$(go run ./scripts/genkeys.go | grep '^ANOTIFY_VAPID_')"
          {
            echo "ANOTIFY_VAPID_PUBLIC_KEY=$ANOTIFY_VAPID_PUBLIC_KEY"
            echo "ANOTIFY_VAPID_PRIVATE_KEY=$ANOTIFY_VAPID_PRIVATE_KEY"
          } >> "$GITHUB_ENV"

      - name: 跑本分片的 e2e 套件
        # 失败不直接判红：交给总判定按「已知环境性失败清单」裁决。
        continue-on-error: true
        run: |
          set -euo pipefail
          # 空清单绝不退化成全量（run_all.sh 不带套件名 = 29 套全跑），宁可直接红。
          [ -n "${SHARD_SUITES// /}" ] || { echo "❌ 本分片的套件清单为空"; exit 1; }
          ./scripts/e2e/run_all.sh --parallel $SHARD_SUITES

      # 分片凭据必须在跑完之后写：parallel_runner 启动时会清空 results 目录。
      - name: 落分片凭据（本片本该跑哪些套件）
        if: always()
        run: node scripts/e2e/shard.mjs --write-shard-info --id "$SHARD_ID" --suites "$SHARD_SUITES" --out .e2e-bin/results

      # 失败时把证据留下来：没有逐 case 的 full.log，环境问题只能靠猜。
      - name: 上传本分片的结果（总是上传：判定与复核都靠它）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard.id }}
          path: .e2e-bin/results
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传截图证据（f3 现场）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-shard-${{ matrix.shard.id }}
          path: scripts/e2e/fixtures/f3/screenshots
          retention-days: 7
          if-no-files-found: ignore

  # 总判定：唯一的裁决口。分组 job 崩溃/失败时**必须跑到**这里并判红，不许被 needs 跳过。
  e2e-affected:
    name: e2e（affected）
    needs: [e2e-plan, e2e-shard]
    if: always() && (needs.e2e-plan.result == 'success' || needs.e2e-plan.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 0 个 artifact 时 download 会报错；不中断，让下面的判定逐条说出缺了哪些套件。
      - name: 下载分片结果
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-shard-*
          path: .e2e-bin/sharded

      # 真门禁：容忍范围只在 scripts/e2e/known-env-failures.json（棘轮只许变小）。
      - name: 总判定（清单内容忍，清单外拦；分片缺一片也拦；理由也写进 job summary）
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### e2e（affected）总判定"
            echo ""
            echo "- 计划分片 job：${{ needs.e2e-plan.result }}"
            echo "- 分片 job：${{ needs.e2e-shard.result }}"
          } >> "$summary"
          if [ "${{ needs.e2e-plan.result }}" != "success" ]; then
            echo "::error::e2e 计划分片 job 是 ${{ needs.e2e-plan.result }}：没有可信的套件清单 ⇒ 判红（fail-closed）"
            echo "- ❌ 计划分片 job 不是 success：没有可信的套件清单 ⇒ 判红（fail-closed）" >> "$summary"
            exit 1
          fi
          count="${{ needs.e2e-plan.outputs.count }}"
          if [ "$count" = "0" ]; then
            echo "ℹ️ 本次改动没有被任何 e2e 套件覆盖（计划里已有跳过原因）⇒ 不跑"
            echo "- ℹ️ 本次改动没有被任何 e2e 套件覆盖 ⇒ 不跑" >> "$summary"
            exit 0
          fi
          selected="${{ needs.e2e-plan.outputs.selected }}"
          merge_rc=0
          node scripts/e2e/shard.mjs --merge --from .e2e-bin/sharded --out .e2e-bin/results --expect "$selected" 2>&1 | tee merge.log || merge_rc=1
          rc=0
          node scripts/e2e/ci-e2e-verdict.mjs \
            --results .e2e-bin/results \
            --known scripts/e2e/known-env-failures.json \
            --selected "$selected" 2>&1 | tee verdict.log || rc=${PIPESTATUS[0]}
          # 判定器只读 results，「哪一片崩了」它看不见：分片 job 的结论要单独拦一次，
          # 否则「results 恰好齐了但有一个 job 失败」会被判绿。
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::e2e 分片 job 有失败（${{ needs.e2e-shard.result }}）⇒ 判红"
            rc=1
          fi
          if [ "$merge_rc" != "0" ]; then rc=1; fi
          {
            echo ""
            echo "**分片汇总（期望 / 拿到 / 缺哪些）**"
            echo '```'
            cat merge.log || true
            echo '```'
            echo "**判定器输出**（exit $rc）"
            echo '```'
            tail -n 80 verdict.log || true
            echo '```'
          } >> "$summary"
          exit $rc
  # ── main push：轻量回归（不跑 e2e；全量留给 nightly）───────────────
  regression:
    name: regression（main push：make ci）
    # PR 走 quick 那个 job（同一个 make ci，多了 triage 门槛）；
    # push 到此分支即 main，跑同一条门禁但不跑 e2e —— 全量 e2e 的唯一固定出口是 nightly。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: .bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - run: npm ci --no-audit --no-fund

      - name: main 轻量回归
        run: make ci

  # ── 全量：nightly / workflow_dispatch / PR label `full-ci` ────────
  full-e2e:
    name: full（make ci + 全量 e2e）
    env:
      E2E_CONCURRENCY: "2"
      # runner 比开发机慢 2–3 倍（实测 source-actions/interact-dialogs 在本地 3–5s 通过、
      # 在 runner 上撞 4.5s 默认等待）。这些都是**等待上界**，不是断言：
      #   F3_DEFAULT_TIMEOUT_MS → 页面元素/动作的默认等待
      #   F3_NAV_TIMEOUT_MS     → 导航默认等待
      #   F3_CASE_BUDGET_MS     → 单 case 外层预算（超预算仍判红）
      F3_DEFAULT_TIMEOUT_MS: "15000"
      F3_NAV_TIMEOUT_MS: "20000"
      F3_CASE_BUDGET_MS: "150000"   # 同 e2e-affected：runner 上 4 路 Chrome 会把浏览器打崩
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: .bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - run: npm ci --no-audit --no-fund

      - name: 预检：Chrome 与 python3
        run: |
          set -euo pipefail
          for bin in /usr/bin/google-chrome python3; do
            command -v "$bin" >/dev/null || { echo "❌ 缺少 $bin"; exit 1; }
          done

      - name: VAPID 密钥
        run: |
          set -euo pipefail
          eval "$(go run ./scripts/genkeys.go | grep '^ANOTIFY_VAPID_')"
          {
            echo "ANOTIFY_VAPID_PUBLIC_KEY=$ANOTIFY_VAPID_PUBLIC_KEY"
            echo "ANOTIFY_VAPID_PRIVATE_KEY=$ANOTIFY_VAPID_PRIVATE_KEY"
          } >> "$GITHUB_ENV"

      - name: 快门禁
        run: make ci

      # 全量 e2e：**不经过 affected 选择器**。这条是「选择器漏了」的兜底网，
      # 也是「没有全量跑的地方就不许上线」的那条纪律。
      - name: 全量 e2e
        run: make e2e
