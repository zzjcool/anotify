# PR / main 门禁：gofmt、vet、build、单元测试。
# 与本地 `make ci` 同一条命令。不跑 make e2e / make integration
# （那些需要浏览器或已经启动的服务）。
# 合并前的全量端到端仍是 make e2e，不在这个 workflow 里。
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # make fe（check-classes/check-css/check-i18n-keys/check-contrast/sitegen/hash）
      # 绝大多数只用 Node 标准库；唯一例外是 check-wire-fields.mjs（要解析 api/*.yaml）。
      # 少了下面这一步，它会 ERR_MODULE_NOT_FOUND，而挂在 make fe 上 ⇒ 每条 PR 的
      # `make ci` 在 make fe 处整条红（2026-09~11 一直如此：CI 门禁实际无人看）。
      # 只装这一个纯 JS 小包：不写 lock、不引入 playwright 等大件。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # staticcheck 装在 .bin/（make tools）。缓存它：`go install pkg@version` 每次都要向
      # honnef.co 做 go-get 解析，网络抖一下就把「工具没装上」伪装成「代码有问题」。
      - name: Cache Go static tools
        uses: actions/cache@v4
        with:
          path: .bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install guard-only JS dep
        run: npm install --no-save --no-audit --no-fund yaml@2

      - name: PR gate
        run: make ci
