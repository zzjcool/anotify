name: release

# 发版：把 **节点二进制 anode** 挂到 GitHub Release 上，供 `scripts/install-anode.sh` 下载。
#
# 为什么只发节点（#334，v4）：
#   · 中枢（server）用户要么用 GHCR 镜像，要么自己 `go build`，没有"一条命令装上"
#     的需求；而节点是要贴到别人机器上的，必须有个能下的二进制。
#   · 资产名必须**完全**是 `anode_<os>_<arch>` —— install-anode.sh 默认拼
#     `releases/download/<version>/anode_linux_<arch>`，带别的后缀就 404。
#     v4 只发 linux（install-anode.sh 明确要求 Linux；macOS 用户自己 go build）。
#   · 校验和文件固定 `<asset>.sha256`（sha256sum 的两空格格式）。
#
# 触发：
#   · push tag `v*`   → 构建 + 发 release
#   · workflow_dispatch → 只构建（验证链路），不发 release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 同一个 tag 重复推 / 补跑时，后来的覆盖前面的，别让两个 job 抢同一个 release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-anode:
    name: anode ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 是硬要求：install-anode.sh 下发的就是单个静态二进制，
      # 依赖 libc 的构建在别的发行版上会直接起不来（表现是 glibc 版本不匹配）。
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="anode_${{ matrix.os }}_${{ matrix.arch }}"
          # 版本注入（与 Makefile 的 ANODE_LDFLAGS 同源）：
          #   main.version = <release>+<commit>（与中枢 internal/version.String() 同一个串，
          #   中枢拿它当升级目标版本，节点在 hello 里上报同一个值）；
          #   main.commit  = git short sha。
          version="$(git describe --tags --always --dirty)"
          commit="$(git rev-parse --short HEAD)"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${version}+${commit} -X main.commit=${commit}" \
            -o "$out" ./cmd/anode

          # 冒烟：--version 必须是单行 JSON 且带版本字段（install-anode.sh 靠它核对）；
          # -h 必须能列出三个子命令。只对本机架构跑：交叉编译出来的二进制跑不了。
          if [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            ./"$out" --version
            ./"$out" --version | grep -F '"version":"'"$version" >/dev/null
            ./"$out" -h | head -1
          fi

          # 校验和：install 脚本会下这个文件做完整性校验。
          sha256sum "$out" > "$out.sha256"
          cat "$out.sha256"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: anode-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            anode_${{ matrix.os }}_${{ matrix.arch }}
            anode_${{ matrix.os }}_${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build-anode
    # 只有 tag 才发 release；手动触发的运行只验证构建（产物在 Actions 面板里下）。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 发之前再核一遍：资产名 / 数量不对就不许发（发出去就改不掉了）。
      - name: verify assets
        run: |
          set -euo pipefail
          cd dist
          expect="anode_linux_amd64 anode_linux_arm64"
          for a in $expect; do
            [ -f "$a" ] || { echo "缺少资产：$a"; exit 1; }
            [ -f "$a.sha256" ] || { echo "缺少校验和：$a.sha256"; exit 1; }
            sha256sum -c "$a.sha256"
          done
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装（节点 / anode）

            节点 token 在中枢「节点」页签发（明文只返回一次）。手动装：

            ```bash
            curl -fsSL https://raw.githubusercontent.com/zzjcool/anotify/main/scripts/install-anode.sh \
              | sh -s -- --version ${{ github.ref_name }} --name node-a --server wss://你的中枢域名 \
                        --token-file /root/anode.token
            ```

            `install-anode.sh` 只做下载 + sha256 + `--version` 校验，落盘/服务单元由
            `anode install` 负责（不做 sudo、不自动注册节点）。

            资产说明：`anode_<os>_<arch>`（静态二进制）+ `.sha256` 校验和（与 install-anode.sh 拼的 URL 一致）。中枢（server）
            走容器镜像 `ghcr.io/zzjcool/anotify`，不在这里发。
