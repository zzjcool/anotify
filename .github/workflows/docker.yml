# 构建 Docker 镜像并推送 GHCR
# 触发：推 main（latest + sha tag）、打 v* tag（版本 tag）、手动 dispatch
# 密钥：无需额外配置，使用内置 GITHUB_TOKEN（需仓库 Settings → Actions →
#   General → Workflow permissions 勾选 "Read and write permissions"，
#   或在 job 里加 permissions: packages: write，本文件已显式声明）。
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository = zzjcool/anotify（大写会被 GHCR 归一为小写，这里显式转小写）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # git tag v1.2.3 → 1.2.3 和 latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # main 分支 → sha-<短hash> 和 latest
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 内置缓存后端
          cache-from: type=gha
          cache-to: type=gha,mode=max
