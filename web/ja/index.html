    function normalize(n, i) {
      const payload = n.Payload
        ? safeParse(n.Payload)
        : n.payload
          ? safeParse(n.payload)
          : n;
      return {
        id: n.id || n.ID || "n" + i,
        seq: n.seq != null ? n.seq : n.Seq,
        status: n.status || n.Status || "info",
        title:
          n.title || n.Title || t("common.placeholder.no_title", "（无标题）"),
        body: n.body || n.Body || "",
        link: n.link || n.Link || payload.link || "",
        agent: payload.agentId || payload.agent || "agent",
        project: payload.cwd || payload.project || "—",
        duration: payload.durationMs
          ? Math.round(payload.durationMs / 1000)
          : payload.duration || 0,
        model: payload.model || "—",
        sessionId: payload.sessionId || "—",
        deviceTags: n.deviceTags || n.DeviceTags || [],
        priority: n.priority || n.Priority || "normal",
        ttlSeconds: n.ttlSeconds || n.TTLSeconds || 0,
        time: timeAgo(n.created_at || n.createdAt || n.CreatedAt || n.time),
        isToday: (() => {
          const ts = n.created_at || n.createdAt || n.CreatedAt;
          if (!ts) return false;
          const d = new Date(ts);
          if (Number.isNaN(d.getTime())) return false;
          const now = new Date();
          return d.toDateString() === now.toDateString();
        })(),
        delivered:
          n.delivered != null
            ? n.delivered
            : n.delivered_count != null
              ? n.delivered_count
              : 0,
        total:
          n.total != null
            ? n.total
            : n.device_count != null
              ? n.device_count
              : 0,
      };
    }
    function safeParse(s) {
      try {
        return typeof s === "string" ? JSON.parse(s) : s;
      } catch {
        return {};
      }
    }
    
    function byNewest(a, b) {
      const sa = a.seq != null ? a.seq : -1;
      const sb = b.seq != null ? b.seq : -1;
      if (sa !== sb) return sb - sa;
      return a.id < b.id ? 1 : a.id > b.id ? -1 : 0;
    }

    const STATUS_META = {
      success: {
        dot: "dot-success",
        badge: "status-success",
        labelKey: "common.status.success",

      },

        labelKey: "common.status.warning",
        fallback: "警告",
      },
    };

    let NOTIFICATIONS = [];
    let usingDemo = false;
    let STATS = null; 

    async function load() {
      let items = null;
      let connected = false;
      try {
        const data = await api("/v1/notifications?limit=50");
        
        if (data && Array.isArray(data.notifications)) {
          items = data.notifications;
          connected = true;
        } else if (Array.isArray(data)) {
          items = data;
          connected = true;
        }
      } catch (e) {
        connected = false; 
      }
      usingDemo = !connected;
      NOTIFICATIONS = (connected ? items : DEMO_NOTIFICATIONS)
        .map(normalize)
        .sort(byNewest);
      
      try {
        STATS = await api("/v1/stats");
      } catch {
        STATS = null;
      }
      document
        .getElementById("demo-badge")
        .classList.toggle("hidden", !usingDemo);
      renderKpis();
      renderNotifs(currentFilter);
      renderSummary();
      renderHeatmap();
    }

     
    function renderKpis() {
      
      let total, rate, today, devices;
      if (STATS && !usingDemo) {
        total = STATS.total ?? 0;
        today = STATS.today ?? 0;
        devices = STATS.deviceCount ?? 0;
        const dt = STATS.deliveryTotal ?? 0;
        rate =
          dt > 0 ? Math.round(((STATS.delivered ?? 0) / dt) * 1000) / 10 : 100;
      } else {
        total = NOTIFICATIONS.length;
        const ok = NOTIFICATIONS.filter(
          (n) => n.delivered >= (n.total || 1),
        ).length;
        rate = total ? Math.round((ok / total) * 1000) / 10 : 100;
        today = NOTIFICATIONS.filter((n) => n.isToday).length;
        devices = Math.max(...NOTIFICATIONS.map((n) => n.total || 0), 0);
      }
      document.getElementById("kpi-total").textContent = total.toLocaleString();
      document.getElementById("kpi-total-trend").textContent = usingDemo
        ? t("index.kpi.trend_demo", "示例")
        : t("index.kpi.trend_live", "实时");
      
      const rateEl = document.getElementById("kpi-rate");
      rateEl.replaceChildren(
        document.createTextNode(rate),
        el("span", { class: "text-2xl text-zinc-500", text: "%" }),
      );
      document.getElementById("kpi-rate-sub").textContent = t(
        "index.kpi.devices_sub",
        "{n} 台设备 · 端到端加密",
      ).replace("{n}", devices);
      document.getElementById("kpi-today").textContent = today;
      document.getElementById("kpi-devices").textContent = devices || "0";
      document.getElementById("kpi-devices-sub").textContent = t(
        "index.kpi.devices_sub2",
        "推送订阅 + 长连接",
      );
    }

    function renderSummary() {
      const h = new Date().getHours();
      let partKey, partFallback;
      if (h < 6) {
        partKey = "index.greeting.late_night";
        partFallback = "夜深了";
      } else if (h < 12) {
        partKey = "index.greeting.morning";
        partFallback = "早上好";
      } else if (h < 18) {
        partKey = "index.greeting.afternoon";
        partFallback = "下午好";
      } else {
        partKey = "index.greeting.evening";
        partFallback = "晚上好";
      }
      document.getElementById("greeting").textContent = t(
        "index.greeting.with_name",
        "{greeting}，{name}",
      )
        .replace("{greeting}", t(partKey, partFallback))
        .replace("{name}", username);
      const okCnt = NOTIFICATIONS.filter((n) => n.status === "success").length;
      document.getElementById("summary-line").textContent = t(
        "index.recent_summary",
        "最近收录 {total} 条通知，其中 {ok} 条成功。",
      )
        .replace("{total}", NOTIFICATIONS.length)
        .replace("{ok}", okCnt);
    }

     
    let currentFilter = "all";
    function renderNotifs(filter) {
      currentFilter = filter;
      const list = document.getElementById("notif-list");
      const rows = NOTIFICATIONS.filter(
        (n) => filter === "all" || n.status === filter,
      );
      if (rows.length === 0) {
        list.replaceChildren(
          el("div", {
            class: "px-6 py-10 text-center text-sm text-zinc-500",
            text: t("index.notif.empty", "暂无该状态的通知"),
          }),
        );
      } else {
        list.replaceChildren(
          ...rows.map((n) => {
            const meta = STATUS_META[n.status] || STATUS_META.info;
            return el(
              "button",
              {
                class:
                  "notif-row flex w-full items-center gap-4 px-6 py-4 text-left",
                onclick: () => openDetail(n.id),
              },
              el("span", { class: `dot ${meta.dot}` }),
              el(
                "div",
                { class: "min-w-0 flex-1" },
                el(
                  "div",
                  { class: "flex flex-wrap items-center gap-2" },
                  el("span", {
                    class: "truncate text-sm font-medium text-white",
                    text: n.title,
                  }),
                  el("span", {
                    class: `status-badge ${meta.badge}`,
                    text: t(meta.labelKey, meta.fallback),
                  }),
                ),
                el(
                  "div",
                  {
                    class:
                      "mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs text-zinc-500",
                  },
                  el("span", { class: "mono", text: n.agent }),
                  el("span", { class: "text-zinc-700", text: "·" }),
                  el("span", { class: "truncate", text: n.project }),
                  el("span", { class: "text-zinc-700", text: "·" }),
                  el("span", { text: n.duration + "s" }),
                ),
              ),
              el(
                "div",
                { class: "flex shrink-0 flex-col items-end gap-1" },
                el("span", {
                  class: "text-xs text-zinc-500",
                  text: n.time,
                }),
                el("span", {
                  class: "text-[10px] text-zinc-600",
                  text: t("index.notif.delivered", "{d}/{t} 设备已送达")
                    .replace("{d}", n.delivered)
                    .replace("{t}", n.total),
                }),
              ),
            );
          }),
        );
      }
      document.getElementById("notif-count").textContent = t(
        "index.notif.count",
        "显示 {n} 条",
      ).replace("{n}", rows.length);
    }

    document.getElementById("filter-tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-tab");
      if (!btn) return;
      document
        .querySelectorAll("#filter-tabs .filter-tab")
        .forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      renderNotifs(btn.dataset.filter);
    });
    document.getElementById("refresh-btn").addEventListener("click", load);

     
    let tnSending = false;
    const tnToggle = document.getElementById("tn-toggle");
    const tnForm = document.getElementById("tn-form");
    const tnSend = document.getElementById("tn-send");
    const tnCancel = document.getElementById("tn-cancel");
    const tnStatusMsg = document.getElementById("tn-status-msg");

    function tnSetStatus(msg, isError) {
      tnStatusMsg.textContent = msg || "";
      tnStatusMsg.className =
        "text-xs " + (isError ? "text-red-400" : "text-zinc-400");
    }

    tnToggle.addEventListener("click", () => {
      
      if (usingDemo) {
        tnSetStatus(t("index.test_notify.demo_disabled", "后端未连接，无法发送测试通知"), true);
        return;
      }
      tnForm.classList.toggle("hidden");
      if (!tnForm.classList.contains("hidden")) {
        const titleInput = document.getElementById("tn-title");
        if (!titleInput.value) titleInput.value = t("index.test_notify.title_placeholder", "测试通知");
        titleInput.focus();
      }
    });

    tnCancel.addEventListener("click", () => {
      tnForm.classList.add("hidden");
      tnSetStatus("");
    });

    tnSend.addEventListener("click", async () => {
      if (tnSending) return;
      tnSending = true;
      const originalText = tnSend.textContent;
      tnSend.textContent = t("index.test_notify.sending", "发送中…");
      tnSend.disabled = true;
      tnSetStatus("");
      const body = {
        title: document.getElementById("tn-title").value.trim(),
        body: document.getElementById("tn-body").value,
        status: document.getElementById("tn-status").value,
        priority: document.getElementById("tn-priority").value,
      };
      const tagsRaw = document.getElementById("tn-tags").value.trim();
      if (tagsRaw) {
        body.deviceTags = tagsRaw.split(",").map((s) => s.trim()).filter(Boolean);
      }
      try {
        const resp = await api("/v1/test-notify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (resp && resp.matched > 0) {
          tnSetStatus(
            t("index.test_notify.success", "已发送，命中 {n} 台设备").replace("{n}", resp.matched),
            false,
          );
        } else {
          tnSetStatus(t("index.test_notify.no_device", "已发送，但当前没有匹配的接收设备"), false);
        }
        
        await load();
      } catch (e) {
        const msg = (e && e.message) || String(e);
        tnSetStatus(t("index.test_notify.failed", "发送失败：{msg}").replace("{msg}", msg), true);
      } finally {
        tnSending = false;
        tnSend.textContent = originalText;
        tnSend.disabled = false;
      }
    });

     
    
    function syncMsgParam(id) {
      const p = new URLSearchParams(location.search);
      if (id) p.set("msg", id);
      else p.delete("msg");
      const s = p.toString();
      history.replaceState(null, "", location.pathname + (s ? "?" + s : ""));
    }
    
    function priorityLabel(p) {
      const map = {
        high: { key: "common.priority.high", fb: "高" },
        normal: { key: "common.priority.normal", fb: "普通" },
        low: { key: "common.priority.low", fb: "低" },
      };
      const m = map[p];
      return m ? t(m.key, m.fb) : p || "—";
    }
    function fmtTTL(sec) {
      if (!sec || sec <= 0) return "—";
      if (sec % 86400 === 0)
        return t("common.ttl.day", "{n} 天").replace("{n}", sec / 86400);
      if (sec % 3600 === 0)
        return t("common.ttl.hour", "{n} 小时").replace("{n}", sec / 3600);
      if (sec % 60 === 0)
        return t("common.ttl.minute", "{n} 分钟").replace("{n}", sec / 60);
      return t("common.ttl.second", "{n} 秒").replace("{n}", sec);
    }
    function openDetail(id) {
      const n = NOTIFICATIONS.find((x) => x.id === id);
      if (!n) return;
      syncMsgParam(id);
      const meta = STATUS_META[n.status] || STATUS_META.info;
      document.getElementById("detail-head").replaceChildren(
        el("span", { class: `dot ${meta.dot}` }),
        el(
          "div",
          {},
          el("div", {
            class: "text-base font-medium text-white",
            text: n.title,
          }),
          el("div", {
            class: "text-xs text-zinc-500",
            text: `${n.project} · ${n.time}`,
          }),
        ),
      );
      const tags = Array.isArray(n.deviceTags) ? n.deviceTags : [];
      const fields = [
        [t("common.field.msg_id", "消息 ID"), n.id],
        [t("common.field.agent", "Agent"), n.agent],
        [t("common.field.session", "会话"), n.sessionId],
        [t("common.field.model", "模型"), n.model],
        [t("common.field.duration", "耗时"), n.duration + "s"],
        [
          t("common.field.status", "状态"),
          `${t(meta.labelKey, meta.fallback)}（${n.status}）`,
        ],
        [t("common.field.priority", "优先级"), priorityLabel(n.priority)],
        [
          t("common.field.device_tags", "路由标签"),
          tags.length
            ? tags.join("、")
            : t("common.placeholder.broadcast", "（广播）"),
        ],
        [t("common.field.ttl", "TTL"), fmtTTL(n.ttlSeconds)],
        [t("common.field.created_at", "创建时间"), n.time],
      ];
      const grid = el(
        "div",
        { class: "grid grid-cols-2 gap-3" },
        ...fields.map(([k, v]) =>
          el(
            "div",
            {
              class:
                "rounded-lg bg-white/[0.03] px-3 py-2.5 ring-1 ring-white/[0.06]",
            },
            el("div", {
              class: "text-[10px] uppercase tracking-wide text-zinc-500",
              text: k,
            }),
            el("div", {
              class: "mono mt-0.5 text-[12px] text-zinc-200",
              text: String(v),
            }),
          ),
        ),
      );
      const children = [
        el("p", {
          class: "text-sm leading-relaxed text-zinc-300",
          text: n.body || t("common.placeholder.no_body", "（无正文）"),
        }),
        grid,
      ];
      if (n.link) {
        children.push(
          el(
            "a",
            {
              href: n.link,
              class:
                "btn-primary flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium",
            },
            t("index.detail.open_session", "打开 Agent 会话"),
          ),
        );
      }
      
      children.push(
        el(
          "a",
          {
            href: "message.html?id=" + encodeURIComponent(n.id),
            class:
              "flex items-center justify-center gap-1.5 rounded-xl px-4 py-2 text-xs text-zinc-400 ring-1 ring-white/10 transition-colors hover:bg-white/5 hover:text-white",
          },
          t("index.detail.view_full", "查看完整页面（全部字段 + 投递记录）→"),
        ),
      );
      document.getElementById("detail-body").replaceChildren(...children);
      document
        .getElementById("detail-modal")
        .classList.replace("hidden", "flex");
      document.body.style.overflow = "hidden";
    }
    function closeDetail() {
      const modal = document.getElementById("detail-modal");
      if (modal.classList.contains("hidden")) return; 
      modal.classList.replace("flex", "hidden");
      document.body.style.overflow = "";
      syncMsgParam(null);
    }
    document
      .getElementById("detail-close")
      .addEventListener("click", closeDetail);
    document
      .getElementById("detail-overlay")
      .addEventListener("click", closeDetail);
    window.addEventListener(
      "keydown",
      (e) => e.key === "Escape" && closeDetail(),
    );

     
    document
      .querySelectorAll(".copy-btn")
      .forEach((b) =>
        b.addEventListener("click", () => copyText(b, b.dataset.copy)),
      );

     
    function renderHeatmap() {
      const hm = document.getElementById("hm");
      if (!hm) return;
      hm.replaceChildren(); 
      const LEVELS = [
        "var(--surface-2)",
        "var(--accent-1)",
        "var(--accent-2)",
        "var(--accent-3)",
        "var(--accent-4)",
      ];
      const WEEK_LABELS = [
        t("index.heatmap.week.sun", "日"),
        t("index.heatmap.week.mon", "一"),
        t("index.heatmap.week.tue", "二"),
        t("index.heatmap.week.wed", "三"),
        t("index.heatmap.week.thu", "四"),
        t("index.heatmap.week.fri", "五"),
        t("index.heatmap.week.sat", "六"),
      ];
      const WEEKS = 53;
      
      const countByDay = new Map();
      if (STATS && Array.isArray(STATS.daily)) {
        for (const d of STATS.daily) countByDay.set(d.day, d.count);
      }
      function dayKey(date) {
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const dd = String(date.getDate()).padStart(2, "0");
        return `${date.getFullYear()}-${m}-${dd}`;
      }
      function dayCount(date) {
        
        return countByDay.get(dayKey(date)) || 0;
      }
      function levelOf(c) {
        if (!c) return 0;
        if (c < 5) return 1;
        if (c < 10) return 2;
        if (c < 18) return 3;
        return 4;
      }
      const tip = el("div", { class: "hm-tip" });
      document.body.append(tip);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const dow = (today.getDay() + 6) % 7;
      const endMonday = new Date(today);
      endMonday.setDate(today.getDate() - dow);
      const startMonday = new Date(endMonday);
      startMonday.setDate(endMonday.getDate() - (WEEKS - 1) * 7);
      const DAY_LABELS = {
        0: t("index.heatmap.week.mon", "一"),
        2: t("index.heatmap.week.wed", "三"),
        4: t("index.heatmap.week.fri", "五"),
      };
      const frag = document.createDocumentFragment();
      for (let d = 0; d < 7; d++) {
        const s = document.createElement("span");
        s.className = "hm-day";
        s.style.gridRow = d + 2;
        s.textContent = DAY_LABELS[d] || "";
        frag.append(s);
      }
      let prevMonth = -1;
      for (let w = 0; w < WEEKS; w++) {
        const monday = new Date(startMonday);
        monday.setDate(startMonday.getDate() + w * 7);
        const m = monday.getMonth();
        if (m !== prevMonth) {
          const label = document.createElement("span");
          label.className = "hm-month";
          label.style.gridColumn = w + 2;
          label.textContent = t("index.heatmap.month", "{n}月").replace(
            "{n}",
            m + 1,
          );
          frag.append(label);
          prevMonth = m;
        }
        for (let d = 0; d < 7; d++) {
          const date = new Date(monday);
          date.setDate(monday.getDate() + d);
          const future = date > today;
          const count = future ? 0 : dayCount(date);
          const cell = document.createElement("span");
          cell.className = "hm-cell";
          cell.style.gridColumn = w + 2;
          cell.style.gridRow = d + 2;
          if (future) {
            cell.dataset.future = "1";
          } else {
            cell.style.background = LEVELS[levelOf(count)];
            if (date.getTime() === today.getTime())
              cell.classList.add("hm-today");
            cell.addEventListener("mouseenter", () => {
              const t1 = document.createElement("div");
              t1.className = "font-medium text-white";
              t1.textContent =
                count > 0
                  ? t("index.heatmap.tip.count", "{n} 条通知").replace(
                      "{n}",
                      count,
                    )
                  : t("index.heatmap.tip.none", "无通知");
              const t2 = document.createElement("div");
              t2.className = "text-zinc-500";
              t2.textContent = t("index.heatmap.tip.date", "{m}月{d}日 周{w}")
                .replace("{m}", date.getMonth() + 1)
                .replace("{d}", date.getDate())
                .replace("{w}", WEEK_LABELS[date.getDay()]);
              tip.replaceChildren(t1, t2);
              const rect = cell.getBoundingClientRect();
              tip.style.left = rect.left + rect.width / 2 + "px";
              tip.style.top = rect.top + "px";
              tip.style.opacity = "1";
            });
            cell.addEventListener(
              "mouseleave",
              () => (tip.style.opacity = "0"),
            );
          }
          frag.append(cell);
        }
      }
      hm.append(frag);
    }

     
    
    
    async function openMsgFromQuery() {
      const msgId = qs.get("msg");
      if (!msgId) return;
      let n = NOTIFICATIONS.find((x) => x.id === msgId);
      if (!n && !usingDemo) {
        try {
          const data = await api("/v1/notifications?limit=500");
          const items = Array.isArray(data) ? data : data.notifications;
          if (Array.isArray(items)) {
            NOTIFICATIONS = items.map(normalize).sort(byNewest);
            renderNotifs(currentFilter);
            renderSummary();
          }
        } catch {
           
        }
        n = NOTIFICATIONS.find((x) => x.id === msgId);
      }
      if (n) openDetail(n.id);
    }

     
    load().then(openMsgFromQuery);
  })();
</script>
