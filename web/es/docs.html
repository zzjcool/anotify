<script>
  function copyBlock(btn) {
    const body = btn.closest(".code-block").querySelector(".code-body");
    navigator.clipboard.writeText(body.innerText).then(() => {
      const orig = btn.textContent;
      btn.textContent = "已复制 ✓";
      setTimeout(() => (btn.textContent = orig), 1500);
    });
  }

  
  Anotify.mountLayout({
    active: "api",
    title: "接入文档",
    subtitle: "Agent 上报 · Web Push · WebSocket",

          \x3C!-- ===== 接入 Agent ===== -->
          <section id="agent" class="doc-anchor reveal visible">
            <h2 class="font-display text-3xl text-white">接入 Agent</h2>
            <p class="mt-4 text-[15px] leading-relaxed text-zinc-400">
              Anotify 的核心场景：<b class="text-zinc-200">Agent 完成任务后，把通知自动送到你的所有设备</b>。
              接入只需两步——创建一个上报 Key，然后在任务结束时发一个 POST 请求。
            </p>

            <div class="mt-6 grid gap-4 md:grid-cols-2">
              <div class="card p-5">
                <div class="flex items-center gap-2.5">
                  <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-indigo-400/10 text-sm text-indigo-300">1</span>
                  <b class="text-sm text-white">创建上报 Key</b>
                </div>
                <p class="mt-2.5 text-[13px] leading-relaxed text-zinc-500">
                  到 <a href="keys.html" class="text-indigo-300 underline decoration-indigo-400/30 underline-offset-2 hover:text-indigo-200">API Keys</a> 页新建一个
                  <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">notify:send</code> 权限的 Key（前缀
                  <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">ant_live_</code>），立即保存。
                </p>
              </div>
              <div class="card p-5">
                <div class="flex items-center gap-2.5">
                  <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-indigo-400/10 text-sm text-indigo-300">2</span>
                  <b class="text-sm text-white">任务结束时上报</b>
                </div>
                <p class="mt-2.5 text-[13px] leading-relaxed text-zinc-500">
                  在 Agent 结束事件（如 pi 的
                  <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">agent_settled</code>）或脚本末尾，
                  携带 Key <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">POST /v1/notify</code>。
                </p>
              </div>
            </div>

            <div class="code-block mt-6">
              <div class="code-head"><span>最小接入 · 一行 curl 让通知送到所有设备</span><button class="copy-btn" onclick="copyBlock(this)">复制</button></div>
              <div class="code-body">curl -X POST https://你的域名/v1/notify \\
  -H <span class="tk-str">"Authorization: Bearer ant_live_9f3a2c8e…"</span> \\
  -H <span class="tk-str">"Content-Type: application/json"</span> \\
  -d <span class="tk-str">'{"title":"部署完成","status":"success","body":"已发布到 prod"}'</span></div>
            </div>

    │                        │                        │                        │

    │                        │ ④ 按标签/级别过滤设备     │                        │
    │                        │──────── ⑤ 加密推送 ────▶│── ⑥ APNs/FCM 下发 ────▶│

                    <tr class="hover:bg-white/[0.02]"><td class="px-5 py-2.5"><span class="method m-get">GET</span></td><td class="px-2 py-2.5 mono text-zinc-300">/v1/notifications</td><td class="px-5 py-2.5 text-zinc-500">通知历史列表</td></tr>

                    <tr class="hover:bg-white/[0.02]"><td class="px-5 py-2.5"><span class="method m-post">POST</span></td><td class="px-2 py-2.5 mono text-zinc-300">/v1/auth/register · login</td><td class="px-5 py-2.5 text-zinc-500">Passkey 注册 / 登录</td></tr>
                    <tr class="hover:bg-white/[0.02]"><td class="px-5 py-2.5"><span class="method m-get">GET</span></td><td class="px-2 py-2.5 mono text-zinc-300">/v1/vapid-public-key</td><td class="px-5 py-2.5 text-zinc-500">VAPID 公钥（订阅用）</td></tr>

          \x3C!-- ===== 认证方式 ===== -->
          <section id="auth" class="doc-anchor mt-16 reveal visible">
            <h2 class="font-display text-2xl text-white">认证方式</h2>

                  <li>· scope：<code class="mono text-[12px] text-blue-300">notify:send</code> 上报 · <code class="mono text-[12px] text-emerald-300">notify:receive</code> 接收 · <code class="mono text-[12px] text-amber-300">devices:read</code> 只读</li>

                  <li>· httpOnly Cookie，多端会话独立、可单独吊销</li>

            </div>
            <p class="mt-3 text-[14px] leading-relaxed text-zinc-400">
              Agent 在任务结束后调用本接口上报一条通知。服务端校验 API Key，定位所属用户，
              把通知<b class="text-zinc-200">端到端加密</b>推送到该用户所有「已启用且级别/标签匹配」的设备。
            </p>

            <div class="card mt-5 overflow-hidden">

              <table class="param-table">
                <tbody>
                  <tr>
                    <td><span class="param-name">title</span><span class="req">必填</span><div class="param-type mt-1">string ≤ 120</div></td>
                    <td class="param-desc">通知标题，如 <code>"部署完成"</code>，作为系统通知主标题。</td>

                  <tr>
                    <td><span class="param-name">status</span><span class="req">必填</span><div class="param-type mt-1">enum</div></td>

                  </tr>
                  <tr>
                    <td><span class="param-name">body</span><span class="opt">可选</span><div class="param-type mt-1">string ≤ 500</div></td>
                    <td class="param-desc">通知正文，补充说明。</td>
                  </tr>
                  <tr>
                    <td><span class="param-name">deviceTags</span><span class="opt">可选</span><div class="param-type mt-1">string[]</div></td>

                  </tr>
                  <tr>
                    <td><span class="param-name">link</span><span class="opt">可选</span><div class="param-type mt-1">string (uri)</div></td>

                  </tr>

            <div class="card mt-5 p-5">
              <div class="text-xs font-medium text-zinc-500">投递规则（标签路由 + 级别过滤）</div>

          \x3C!-- ===== Web Push 订阅 ===== -->
          <section id="webpush" class="doc-anchor mt-16 reveal visible">
            <h2 class="font-display text-2xl text-white">Web Push 订阅（浏览器接收）</h2>
            <p class="mt-3 text-[14px] leading-relaxed text-zinc-400">
              浏览器端通过 Service Worker + PushManager 订阅，后端用 VAPID 签名推送。
              <b class="text-zinc-200">即使页面关闭也能收到</b>。iOS 需先「添加到主屏幕」以 standalone 运行（iOS 16.4+）。
            </p>

            <ol class="mt-5 space-y-3 border-l border-white/10 pl-5 text-[13px] text-zinc-400">
              <li><b class="text-zinc-200">① 取 VAPID 公钥</b> · <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">GET /v1/vapid-public-key</code></li>
              <li><b class="text-zinc-200">② 注册 Service Worker</b> · <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">navigator.serviceWorker.register('/sw.js')</code></li>
              <li><b class="text-zinc-200">③ 请求权限并订阅</b> · <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">pushManager.subscribe(&#123; applicationServerKey &#125;)</code></li>
              <li><b class="text-zinc-200">④ 上报订阅</b> · 把 endpoint + keys <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">POST /v1/devices</code></li>
            </ol>

            <div class="code-block mt-5">
              <div class="code-head"><span>前端订阅 · 核心代码</span><button class="copy-btn" onclick="copyBlock(this)">复制</button></div>
              <div class="code-body"><span class="tk-comment">// 1. 注册 SW + 取 VAPID 公钥</span>
<span class="tk-key">const</span> reg = <span class="tk-key">await</span> navigator.serviceWorker.register(<span class="tk-str">"/sw.js"</span>);
<span class="tk-key">const</span> { publicKey } = <span class="tk-key">await</span> fetch(<span class="tk-str">"/v1/vapid-public-key"</span>).then(r =&gt; r.json());

<span class="tk-comment">// 2. 订阅（需用户已授权通知权限）</span>
<span class="tk-key">const</span> sub = <span class="tk-key">await</span> reg.pushManager.subscribe({
  userVisibleOnly: <span class="tk-num">true</span>,
  applicationServerKey: urlBase64ToUint8Array(publicKey),
});

<span class="tk-comment">// 3. 上报后端（会话 Cookie 鉴权）</span>
<span class="tk-key">await</span> fetch(<span class="tk-str">"/v1/devices"</span>, {
  method: <span class="tk-str">"POST"</span>,
  headers: { <span class="tk-str">"Content-Type"</span>: <span class="tk-str">"application/json"</span> },
  body: JSON.stringify({
    endpoint: sub.endpoint,
    keys: sub.toJSON().keys,   <span class="tk-comment">// { p256dh, auth }</span>
    platform: <span class="tk-str">"ios"</span>,      <span class="tk-comment">// ios|mac|win|android|other</span>
    userAgent: navigator.userAgent,
  }),
});</div>
            </div>

            <div class="mt-5 grid gap-3 md:grid-cols-3 text-xs">
              <div class="rounded-lg border border-amber-400/20 bg-amber-400/[0.06] p-3">
                <b class="text-amber-300 block">⚠️ iOS 前提</b>
                <span class="text-amber-200/70">必须先「添加到主屏幕」standalone 运行，否则 Safari 不提供 Notification / Push API。</span>
              </div>
              <div class="rounded-lg border border-emerald-400/20 bg-emerald-400/[0.06] p-3">
                <b class="text-emerald-300 block">✅ Android 更省事</b>
                <span class="text-emerald-200/70">Chrome/Edge 普通标签页即可订阅，走 FCM，无需添加到主屏幕。</span>
              </div>
              <div class="rounded-lg border border-white/10 bg-white/[0.02] p-3">
                <b class="text-zinc-300 block">🔒 端到端加密</b>
                <span class="text-zinc-500">载荷用订阅的 p256dh/auth 密钥加密，推送服务无法读取内容。</span>
              </div>
            </div>
          </section>

          \x3C!-- ===== WebSocket 接收 ===== -->
          <section id="stream" class="doc-anchor mt-16 reveal visible">
            <div class="flex items-center gap-3">
              <span class="method m-ws">WS</span>
              <code class="mono text-lg text-white">/v1/stream</code>
              <span class="rounded-full px-2.5 py-0.5 text-[10px] font-semibold" style="background: var(--success-soft); color: var(--success)">notify:receive</span>
              <span class="rounded-full px-2.5 py-0.5 text-[10px] font-semibold" style="background: var(--accent-soft); color: var(--accent)">第二条接收通道</span>
            </div>
            <p class="mt-3 text-[14px] leading-relaxed text-zinc-400">
              除浏览器推送外，任意设备 / 插件可用
              <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">notify:receive</code> 权限的 Key 建立
              WebSocket 长连接实时接收。适合做桌面插件、CLI 守护进程、智能家居桥接，与浏览器推送并行。
            </p>

            <div class="code-block mt-5">
              <div class="code-head"><span>建立连接</span><button class="copy-btn" onclick="copyBlock(this)">复制</button></div>
              <div class="code-body">GET wss://你的域名/v1/stream
<span class="tk-key">Authorization:</span> Bearer ant_recv_9f3a…   <span class="tk-comment"># 需 notify:receive 权限</span>
<span class="tk-key">Last-Event-Id:</span> evt_01J8X3A1          <span class="tk-comment"># 可选，断线续传</span></div>
            </div>

            <div class="mt-5 grid gap-4 lg:grid-cols-2">
              <div class="code-block">
                <div class="code-head"><span>服务端 → 客户端</span><button class="copy-btn" onclick="copyBlock(this)">复制</button></div>
                <div class="code-body"><span class="tk-comment">// 连接成功后第一条</span>
<span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"hello"</span><span class="tk-punct">,</span> <span class="tk-key">"conn_id"</span><span class="tk-punct">:</span> <span class="tk-str">"c_9f2"</span><span class="tk-punct">,</span>
  <span class="tk-key">"heartbeat_sec"</span><span class="tk-punct">:</span> <span class="tk-num">30</span><span class="tk-punct">,</span> <span class="tk-key">"resume_token"</span><span class="tk-punct">:</span> <span class="tk-str">"evt_01J8X2"</span> <span class="tk-punct">}</span>

<span class="tk-comment">// 收到新通知</span>
<span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"notification"</span><span class="tk-punct">,</span> <span class="tk-key">"event_id"</span><span class="tk-punct">:</span> <span class="tk-str">"evt_01J8X3A1"</span><span class="tk-punct">,</span>
  <span class="tk-key">"title"</span><span class="tk-punct">:</span> <span class="tk-str">"部署完成"</span><span class="tk-punct">,</span> <span class="tk-key">"status"</span><span class="tk-punct">:</span> <span class="tk-str">"success"</span><span class="tk-punct">,</span>
  <span class="tk-key">"body"</span><span class="tk-punct">:</span> <span class="tk-str">"已发布到 prod"</span><span class="tk-punct">,</span> <span class="tk-key">"deviceTags"</span><span class="tk-punct">:</span> <span class="tk-punct">[</span><span class="tk-str">"工作"</span><span class="tk-punct">]</span> <span class="tk-punct">}</span>

<span class="tk-comment">// 断线补漏结束 / 心跳 / 错误</span>
<span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"replay_end"</span> <span class="tk-punct">}</span>  <span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"pong"</span> <span class="tk-punct">}</span>  <span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"error"</span><span class="tk-punct">,</span> <span class="tk-key">"code"</span><span class="tk-punct">:</span> <span class="tk-str">"resume_expired"</span> <span class="tk-punct">}</span></div>
              </div>
              <div class="code-block">
                <div class="code-head"><span>客户端 → 服务端</span><button class="copy-btn" onclick="copyBlock(this)">复制</button></div>
                <div class="code-body"><span class="tk-comment">// 订阅 / 退订标签（空 = 全订阅）</span>
<span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"subscribe"</span><span class="tk-punct">,</span> <span class="tk-key">"tags"</span><span class="tk-punct">:</span> <span class="tk-punct">[</span><span class="tk-str">"ops"</span><span class="tk-punct">,</span> <span class="tk-str">"builds"</span><span class="tk-punct">]</span> <span class="tk-punct">}</span>
<span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"unsubscribe"</span><span class="tk-punct">,</span> <span class="tk-key">"tags"</span><span class="tk-punct">:</span> <span class="tk-punct">[</span><span class="tk-str">"ops"</span><span class="tk-punct">]</span> <span class="tk-punct">}</span>

<span class="tk-comment">// 确认已处理（at-least-once）</span>
<span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"ack"</span><span class="tk-punct">,</span> <span class="tk-key">"event_ids"</span><span class="tk-punct">:</span> <span class="tk-punct">[</span><span class="tk-str">"evt_01J8X3A1"</span><span class="tk-punct">]</span> <span class="tk-punct">}</span>

<span class="tk-comment">// 心跳（每 heartbeat_sec 一次，2 次未收则断连）</span>
<span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"ping"</span> <span class="tk-punct">}</span>

<span class="tk-comment">// 断线重连后用 resume 帧续传（替代 Last-Event-Id 头）</span>
<span class="tk-punct">{</span> <span class="tk-key">"type"</span><span class="tk-punct">:</span> <span class="tk-str">"resume"</span><span class="tk-punct">,</span> <span class="tk-key">"resume_token"</span><span class="tk-punct">:</span> <span class="tk-str">"evt_01J8X2"</span> <span class="tk-punct">}</span></div>
              </div>
            </div>

            <div class="card mt-5 p-5">
              <div class="text-xs font-medium text-zinc-500">重连与续传</div>
              <p class="mt-2 text-[13px] leading-relaxed text-zinc-400">
                断线后重连时携带 <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">Last-Event-Id</code> 头（或首帧发
                <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">resume</code>），服务端会重放该位置之后
                24h 内未确认的通知（回放窗口），随后进入实时流。超出保留窗口则返回
                <code class="mono rounded bg-white/5 px-1.5 py-0.5 text-[12px] text-zinc-300">resume_expired</code> 错误，客户端应拉取全量历史。
              </p>
            </div>
          </section>
      `;

  
  const tocLinks = Array.from(document.querySelectorAll(".toc-link"));
  const sections = tocLinks
    .map((a) => document.querySelector(a.getAttribute("href")))
    .filter(Boolean);
  const spy = new IntersectionObserver(
    (entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          tocLinks.forEach((a) => {
            const on = a.getAttribute("href") === "#" + e.target.id;
            a.style.color = on ? "var(--text)" : "";
            a.style.background = on ? "rgba(139,139,253,0.1)" : "";
          });
        }
      });
    },
    { rootMargin: "-20% 0px -70% 0px" },
  );
  sections.forEach((s) => spy.observe(s));
</script>
