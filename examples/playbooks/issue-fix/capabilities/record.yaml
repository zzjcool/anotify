apiVersion: anotify/v1
kind: Capability

metadata:
  name: '{{values.project}}-record'
  displayName: '{{values.project}} 收尾'

spec:
  params:
    type: object
    required: [repo, issue]
    properties:
      repo:     { type: string }
      issue:    { type: integer }
      outcome:  { type: string }
      pr:       { type: string }
      findings: { type: string }
  next: []
  requires:
    commands: [gh]
  lifecycle:
    idempotent: true
    timeoutSec: 120
  run:
    entrypoint: run.sh
    files:
      run.sh: |
        #!/bin/sh
        set -eu

        repo=${ANOTIFY_PARAM_REPO:?}
        issue=${ANOTIFY_PARAM_ISSUE:?}
        outcome=${ANOTIFY_PARAM_OUTCOME:-unknown}
        pr=${ANOTIFY_PARAM_PR:-}
        findings=${ANOTIFY_PARAM_FINDINGS:-}
        art_dir=${ANOTIFY_ARTIFACT_DIR}
        mkdir -p "$art_dir"

        case "$outcome" in
          closed)   line="按自动判定关闭：不成立" ;;
          approved) line="修复完成，review 通过${pr:+：$pr}（未自动合并，等人看）" ;;
          escalate) line="三轮 review 仍未通过，需要人接手${pr:+：$pr}" ;;
          stuck)    line="执行体没能完成：$findings" ;;
          timeout)  line="因超时或无进展终止：$findings" ;;
          *)        line="流程结束：$outcome" ;;
        esac

        printf '{"repo":"%s","issue":%s,"outcome":"%s","pr":"%s","line":"%s"}\n' \
          "$repo" "$issue" "$outcome" "$pr" "$line" > "$art_dir/record.json"

        gh issue comment "$issue" --repo "$repo" --body "$line" || echo "写回 issue 失败（不改变结论）" >&2

        # review 不走 GitHub review，所以 CI 全绿不等于 review 通过。把结论钉在 PR 上，
        # 合并闸只读这个 marker：判过未通过就停（2026-11-27 有一次 CI 绿+review 判阻塞被自动合入）。
        if [ -n "$pr" ]; then
          num=${pr##*/}
          case "$outcome" in
            approved) marker='anotify:review-approved'; text='链上 review 通过' ;;
            escalate) marker='anotify:review-rejected'; text='链上 review 三轮未通过，需人接手' ;;
            stuck)    marker='anotify:review-rejected'; text='执行体未完成，review 未发生' ;;
            *)        marker=''; text='' ;;
          esac
          if [ -n "$marker" ]; then
            gh pr comment "$num" --repo "$repo" --body "<!-- $marker --> $text" \
              || echo "写回 PR 失败（不改变结论）" >&2
          fi
        fi

        echo "record: $outcome — $line"

