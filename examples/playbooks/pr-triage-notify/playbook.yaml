# pr-triage-notify · 入口清单：安装要哪些参数、包由哪些文件组成（流程图见 README）
apiVersion: anotify/v1
kind: Playbook

metadata:
  name: pr-triage-notify
  displayName: PR 判定 → 告警链
  version: 1
  description: |
    webhook 事件 → 改动量判定 → 高危走告警、常规走留证。
    装 N 次就是 N 套互不影响的链：能力名与源名全部由 values.project 决定。

spec:
  # spec.values 就是一份 JSON Schema，同时承担三件事：校验输入、提供默认值、生成前端表单。
  values:
    type: object
    additionalProperties: false
    required: [project, alertUrl]   # 这两个没有默认值，install 时必须给
    properties:
      project:
        type: string
        # 这个值会被拼进能力名与源名，所以先在这里收紧：能力名要匹配
        # ^[a-z0-9][a-z0-9._-]{0,62}$，源名只要求非空白且不等于 route。
        pattern: '^[a-z0-9][a-z0-9-]{0,20}$'
        description: 项目 slug，例如 checkout / payments / a
      env:
        type: string
        enum: [dev, staging, prod]
        default: staging            # 省略时由安装期补上（回执的 values 里能看到）
        description: 环境标签，会进告警正文
      alertUrl:
        type: string
        pattern: '^https://'
        description: 告警接收端点（page 能力 POST 到这里）；例如 https://alerts.example.com/hook
      threshold:
        type: integer
        minimum: 1
        default: 200
        description: 改动行数 ≥ 这个值算高危；装包时被写成脚本里的字面量

  # 相对包根的路径（不是内联文档）。包内每个 .yaml 都必须被这里列到，否则创建被拒。
  capabilities:
    - capabilities/triage.yaml
    - capabilities/page.yaml
    - capabilities/audit.yaml
  sources:
    - sources/push.yaml
