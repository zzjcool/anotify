apiVersion: anotify/v1
kind: Capability

metadata:
  name: '{{values.project}}-issue-gate'
  displayName: '{{values.project}} issue 待裁决'

spec:
  params:
    type: object
    required: [repo, issue]
    properties:
      repo:   { type: string }
      issue:  { type: integer }
      title:  { type: string }
      reason: { type: string }
      note:   { type: string }
  next: []
  requires:
    commands: [curl, printf]
  lifecycle:
    idempotent: true
    timeoutSec: 45
  run:
    entrypoint: run.sh
    files:
      run.sh: |
        #!/bin/sh
        set -eu

        repo=${ANOTIFY_PARAM_REPO:?}
        issue=${ANOTIFY_PARAM_ISSUE:?}
        title=${ANOTIFY_PARAM_TITLE:-}
        reason=${ANOTIFY_PARAM_REASON:-needs_human}
        note=${ANOTIFY_PARAM_NOTE:-}
        notify_url='{{values.notifyUrl}}'

        mkdir -p "${ANOTIFY_ARTIFACT_DIR}"
        art_dir=${ANOTIFY_ARTIFACT_DIR}

        gate=$(printf '{
          "kind": "issue-gate",
          "repo": "%s",
          "issue": %s,
          "title": "%s",
          "reason": "%s",
          "note": "%s",
          "ask": [
            "这个 issue 的口径按哪种？（同一件事有多种合理做法时，必须由人选定）",
            "会不会删东西 / 对外承诺？（是则先确认范围）",
            "要不要动别人的分支、共享环境或线上数据？（是则先确认）"
          ],
          "next": "人在 issue 上回答后，再手动触发一次"
        }' "${repo}" "${issue}" "${title}" "${reason}" "${note}")

        printf '%s\n' "${gate}" > "${art_dir}/gate.json"
        echo "gate: ${repo}#${issue} 等待裁决（${reason}）—— 未动手"

        if [ -n "${notify_url}" ]; then
          code=$(printf '%s' "${gate}" \
            | curl -sS -m 15 -o /dev/null -w '%{http_code}' \
                -X POST -H 'content-type: application/json' --data-binary @- "${notify_url}" || echo 000)
          echo "gate: 通知 HTTP ${code}"
        fi
