# W3-C · worker-trace 新增 locale key（合并前由 centurion 抄进 web-src/locales/*.yaml）
#
# 为什么需要：trace 页的两个空态要从「一张写着说明的卡」升级成 ui.css 的 .empty
# 结构（icon + 标题 + 说明 + 动作），而现有 trace.* 里只有说明句（trace.no_id /
# trace.empty），没有可当标题的短句。只加两个短标题，说明句继续复用原 key。
zh-CN:
  trace:
    no_id_title: 缺少 traceId
    empty_title: 没有任务
en:
  trace:
    no_id_title: Missing traceId
    empty_title: No tasks
ja:
  trace:
    no_id_title: traceId がありません
    empty_title: タスクがありません
es:
  trace:
    no_id_title: Falta traceId
    empty_title: No hay tareas
