# W3-C · worker-msg 新增 locale key（四语言齐全，请 centurion 合并进
# web-src/locales/{zh-CN,en,ja,es}.yaml 的 message.* 命名空间）
#
# 为什么要新 key（其余文案全部复用已有 key：message.* / common.field.* / common.*）：
#   message.not_found_hint  —— 任务不存在的空态**说明**。已有的 message.error.not_found
#                              （"消息不存在或已被清理"）现在当页标题用（e2e 硬锚点：
#                              deeplink.mjs 断言 #msg-title 含「不存在」），空态里再重复
#                              一遍是同一句话说两遍，所以另要一句说明。
#                              这句刻意包含「任务不存在」：deeplink.mjs 还有一条断言
#                              `txt.includes("任务不存在")`，而 message.error.not_found
#                              的 zh 值是「消息不存在…」（消息时代的老文案），
#                              所以这条断言过去只能靠别的文本偶然命中。这里让页面
#                              正面把这个结论说出来（同时补上「可能属于别的命名空间」
#                              这个真实成因），比改断言更合适。
#   message.missing_id_hint —— 深链缺 ?id= 时的空态说明（原实现只有一句错误文本，
#                              用户不知道正确的 URL 长什么样）。
#   message.back_events     —— 上面两个空态的**动作**（.empty 要求 icon+标题+说明+动作），
#                              回事件流（任务是从事件流建出来的）。trace.back 是 trace 页
#                              专用文案，不共用。
zh-CN:
  message:
    not_found_hint: 任务不存在——可能已被清理，或不属于当前命名空间。
    missing_id_hint: 深链需要带上任务 id，例如 message.html?id=tsk_xxx。
    back_events: 返回事件中心
en:
  message:
    not_found_hint: This task does not exist — it may have been cleaned up, or it belongs to another namespace.
    missing_id_hint: Deep links must carry a task id, for example message.html?id=tsk_xxx.
    back_events: Back to events
ja:
  message:
    not_found_hint: このタスクは存在しません。削除されたか、別のネームスペースに属している可能性があります。
    missing_id_hint: ディープリンクにはタスク id が必要です（例：message.html?id=tsk_xxx）。
    back_events: イベント一覧に戻る
es:
  message:
    not_found_hint: Esta tarea no existe; puede que se haya eliminado o que pertenezca a otro espacio de nombres.
    missing_id_hint: Los enlaces directos deben incluir el id de la tarea, por ejemplo message.html?id=tsk_xxx.
    back_events: Volver a eventos
